name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Montar o site
        run: |
          mkdir -p _site
          tar --exclude .git --exclude _site --exclude .github -cf - . | tar -C _site -xf -
          test -f _site/.nojekyll
          test -f _site/index.html
          test -f _site/sw.js
          test -f _site/manifest.webmanifest
          test -f _site/audios/01_Ofensiva_BIZUs.mp3

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
