r, rede plana sem segmentação, protocolos inseguros.<\/p>\n<table class=\"tb \"><thead><tr><th>Referência<\/th><th>Pontos de prova<\/th><\/tr><\/thead><tbody><tr><td><b>ISA/IEC 62443<\/b> (série)<\/td><td>Partes em 4 grupos: <b>1 Geral<\/b> (conceitos, terminologia) · <b>2 Políticas e procedimentos<\/b> (2-1 programa de segurança do proprietário do ativo; 2-3 gestão de patches; 2-4 prestadores de serviço) · <b>3 Sistema<\/b> (<b>3-2 avaliação de risco, zonas e conduítes<\/b>; <b>3-3 requisitos de segurança do sistema e níveis de segurança<\/b>) · <b>4 Componente<\/b> (<b>4-1 ciclo de desenvolvimento seguro<\/b> do fabricante; 4-2 requisitos técnicos de componentes)<\/td><\/tr><tr><td><b>Zonas e conduítes<\/b><\/td><td>Zona = agrupamento de ativos com mesmos requisitos de segurança; conduíte = canal de comunicação entre zonas (onde se aplicam controles)<\/td><\/tr><tr><td><b>Security Levels (SL)<\/b><\/td><td>SL 0 sem requisito · <b>SL1<\/b> violação casual/acidental · <b>SL2<\/b> intencional com meios simples, poucos recursos · <b>SL3<\/b> intencional sofisticada, recursos moderados, conhecimento de ICS · <b>SL4<\/b> sofisticada com recursos extensos (Estado-nação). Tipos: SL-T (alvo), SL-C (capacidade), SL-A (alcançado)<\/td><\/tr><tr><td><b>7 Requisitos Fundamentais (FR)<\/b><\/td><td>FR1 Identificação e autenticação · FR2 Controle de uso · FR3 Integridade do sistema · FR4 Confidencialidade dos dados · FR5 Fluxo de dados restrito · FR6 Resposta oportuna a eventos · FR7 Disponibilidade de recursos<\/td><\/tr><tr><td><b>NIST SP 800-82<\/b><\/td><td>Guia de segurança de ICS; a <b>Rev. 3 (set/2023)<\/b> passou a se chamar <i>Guide to Operational Technology (OT) Security<\/i>, ampliando de ICS para OT; aplica o RMF e o CSF ao ambiente OT, arquitetura com segmentação e defesa em profundidade<\/td><\/tr><tr><td><b>ICS Advisory Project<\/b><\/td><td>Projeto <b>open source<\/b> que converte os <b>alertas ICS da CISA<\/b> (ICS advisories) em dados estruturados (CSV) e <b>dashboards<\/b> para análise de vulnerabilidades por fabricante, produto e setor de infraestrutura crítica<\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — 62443<\/div><div class=\"boxb\"><b>1-Geral, 2-Política (dono do ativo), 3-Sistema (integrador), 4-Componente (fabricante)<\/b>. <b>3-2 = zonas/conduítes e risco<\/b>; <b>3-3 = requisitos do sistema/SL<\/b>; <b>4-1 = SDL do fabricante<\/b>. FR: “<b>I<\/b>dentifica, <b>U<\/b>sa, <b>I<\/b>ntegra, <b>C<\/b>onfidencia, <b>R<\/b>estringe, <b>R<\/b>esponde, <b>D<\/b>isponibiliza”.<\/div><\/div>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO<\/div><div class=\"boxb\">Em OT, “aplicar patch imediatamente em produção” ou “priorizar confidencialidade” são alternativas erradas típicas. Varredura ativa agressiva (nmap) em CLPs pode derrubá-los — prefira monitoração passiva.<\/div><\/div>\n"},{"id":"df10","mod":"Defensiva","modTitle":"Módulo 2 — Segurança Defensiva","title":"2.10 Forense digital e OSINT","prio":"Média","html":"\n<p><b>Evidência digital<\/b>: frágil, volátil, facilmente alterável, copiável sem perda → exige <b>integridade comprovada (hash)<\/b> e <b>cadeia de custódia<\/b> (CPP arts. 158-A a 158-F, incluídos pela Lei 13.964/2019: reconhecimento, isolamento, fixação, coleta, acondicionamento, transporte, recebimento, processamento, armazenamento e descarte).<\/p>\n<table class=\"tb \"><thead><tr><th>Processo (NIST SP 800-86)<\/th><th>O que se faz<\/th><\/tr><\/thead><tbody><tr><td>1. <b>Coleta<\/b><\/td><td>Identificar, rotular, registrar e adquirir dados preservando a integridade (imagem bit a bit, write blocker, hash)<\/td><\/tr><tr><td>2. <b>Exame<\/b><\/td><td>Processar grandes volumes extraindo o relevante (filtros, carving, descompressão)<\/td><\/tr><tr><td>3. <b>Análise<\/b><\/td><td>Correlacionar e interpretar para responder às perguntas (linha do tempo, quem/quando/como)<\/td><\/tr><tr><td>4. <b>Relatório<\/b><\/td><td>Documentar ações, ferramentas, achados e conclusões<\/td><\/tr><\/tbody><\/table>\n<p><b>Ordem de volatilidade<\/b> (RFC 3227) — colete do mais volátil ao menos: registradores/cache → tabela de roteamento, cache ARP, tabela de processos, estatísticas do kernel, <b>memória RAM<\/b> → arquivos temporários → <b>disco<\/b> → logs remotos/monitoração → configuração física/topologia → mídias de arquivo (backup). Por isso, <b>máquina ligada: não desligue antes de capturar a RAM<\/b> (dump com ferramentas como FTK Imager/WinPmem; análise com <b>Volatility<\/b>).<\/p>\n<p><b>Dispositivos de armazenamento<\/b>: imagem forense <b>bit a bit<\/b> (dd, dcfldd, FTK Imager, Guymager; formatos raw/dd e E01) com <b>bloqueador de escrita<\/b>; calcular <b>hash<\/b> (MD5/SHA-1/SHA-256) do original e da cópia; trabalhar <b>sempre na cópia<\/b>. Recuperar dados de <b>espaço não alocado<\/b> e <b>slack space<\/b>; <b>file carving<\/b> por assinaturas/“magic numbers” (ex.: JPEG FF D8 FF; PDF %PDF); <b>MAC times<\/b> (Modified, Accessed, Changed/Created) para linha do tempo. Ferramentas: Autopsy/The Sleuth Kit, FTK, EnCase, Foremost/Scalpel, ExifTool (metadados).<\/p>\n<p><b>E-mail<\/b>: analisar o <b>cabeçalho completo<\/b>: campos <code>Received<\/code> lidos <b>de baixo para cima<\/b> (o mais baixo é o primeiro servidor/origem), Return-Path, Message-ID, <code>Authentication-Results<\/code> (SPF, DKIM, DMARC), X-Originating-IP. “From” é facilmente forjável. <b>Sites<\/b>: logs do servidor web (access/error), WHOIS/RDAP, histórico de DNS, certificados (Certificate Transparency), Wayback Machine, código-fonte/metadados.<\/p>\n<p><b>OSINT<\/b> (inteligência de fontes abertas): ciclo de inteligência (planejamento → coleta → processamento → análise → disseminação). Fontes/ferramentas: buscadores com <b>Google dorks<\/b> (<code>site:<\/code>, <code>filetype:<\/code>, <code>inurl:<\/code>, <code>intitle:<\/code>), <b>Shodan<\/b>/Censys (dispositivos expostos), WHOIS, theHarvester, Maltego, amass, Recon-ng, SpiderFoot, redes sociais, metadados de documentos (FOCA/ExifTool). Coleta passiva (não toca o alvo) × ativa.<\/p>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU<\/div><div class=\"boxb\"><b>C-E-A-R<\/b> (Coleta, Exame, Análise, Relatório). <b>Do mais volátil para o menos: “RAM antes do disco”<\/b>. <b>Hash antes e depois<\/b> = integridade. <b>Received: leia de baixo para cima<\/b>. Write blocker = só leitura.<\/div><\/div>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO<\/div><div class=\"boxb\">“Para preservar a evidência, desligue imediatamente o computador” — em geral <b>errado<\/b> (perde RAM; exceto, por exemplo, ransomware cifrando ativamente, conforme procedimento). “A análise deve ser feita na mídia original” — errado. Hash <b>não<\/b> serve para recuperar dados, só para provar integridade.<\/div><\/div>\n"},{"id":"cp1","mod":"Compliance","modTitle":"Módulo 3 — Compliance","title":"3.1a ISO/IEC 27001:2022 e 27002:2022","prio":"Alta","html":"\n<p><b>27001<\/b> = <b>requisitos<\/b> do SGSI (“deve/shall”, <b>certificável<\/b>). <b>27002<\/b> = <b>diretrizes/código de prática<\/b> dos controles (“convém/should”, não certificável). Estrutura harmonizada (Anexo SL): cláusulas <b>4 Contexto · 5 Liderança · 6 Planejamento · 7 Apoio · 8 Operação · 9 Avaliação de desempenho · 10 Melhoria<\/b> (PDCA: 4–6 Plan, 7–8 Do, 9 Check, 10 Act). Itens-chave: 4.3 escopo; 5.2 política; 6.1.2 avaliação de riscos; 6.1.3 tratamento de riscos e <b>Declaração de Aplicabilidade (SoA)<\/b>; 6.2 objetivos; 7.5 informação documentada; 9.2 auditoria interna; 9.3 análise crítica pela direção; 10.2 não conformidade e ação corretiva.<\/p>\n<table class=\"tb \"><thead><tr><th>Tema do Anexo A / seção da 27002:2022<\/th><th>Nº de controles<\/th><th>Numeração<\/th><th>Exemplos<\/th><\/tr><\/thead><tbody><tr><td><b>Organizacionais<\/b><\/td><td><b>37<\/b><\/td><td>5.1 – 5.37<\/td><td>5.1 políticas, 5.7 inteligência de ameaças*, 5.15 controle de acesso, 5.23 nuvem*, 5.24–5.28 incidentes, 5.30 prontidão de TIC para continuidade*, 5.34 privacidade e PII<\/td><\/tr><tr><td><b>Pessoas<\/b><\/td><td><b>8<\/b><\/td><td>6.1 – 6.8<\/td><td>6.1 seleção, 6.3 conscientização e treinamento, 6.4 processo disciplinar, 6.7 trabalho remoto, 6.8 relato de eventos<\/td><\/tr><tr><td><b>Físicos<\/b><\/td><td><b>14<\/b><\/td><td>7.1 – 7.14<\/td><td>7.1 perímetros, 7.4 monitoramento de segurança física*, 7.7 mesa limpa e tela limpa, 7.14 descarte seguro<\/td><\/tr><tr><td><b>Tecnológicos<\/b><\/td><td><b>34<\/b><\/td><td>8.1 – 8.34<\/td><td>8.5 autenticação segura, 8.9 gestão de configuração*, 8.10 exclusão de informação*, 8.11 mascaramento de dados*, 8.12 prevenção de vazamento (DLP)*, 8.16 atividades de monitoramento*, 8.23 filtragem web*, 8.24 criptografia, 8.28 codificação segura*<\/td><\/tr><tr><td><b>Total<\/b><\/td><td><b>93<\/b><\/td><td><\/td><td>* = os <b>11 controles novos<\/b> de 2022<\/td><\/tr><\/tbody><\/table>\n<p><b>Atributos<\/b> (novidade da 27002:2022, 5 tipos): <b>Tipo de controle<\/b> (preventivo, detectivo, corretivo) · <b>Propriedades de SI<\/b> (confidencialidade, integridade, disponibilidade) · <b>Conceitos de segurança cibernética<\/b> (identificar, proteger, detectar, responder, recuperar) · <b>Capacidades operacionais<\/b> (ex.: gestão de ativos, gestão de identidade e acesso) · <b>Domínios de segurança<\/b> (governança e ecossistema, proteção, defesa, resiliência). Versão 2013: 114 controles em 14 domínios (A.5–A.18).<\/p>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — ISO 27001:2022 do Allan<\/div><div class=\"boxb\"><b>93 controles, 4 temas: Organizacionais 37 · Pessoas 8 · Físicos 14 · Tecnológicos 34<\/b> → “<b>37-8-14-34<\/b>”, numerados 5, 6, 7, 8. <b>11 novos<\/b>: “<b>Inteligência, Nuvem, Prontidão, Monitoramento físico, Configuração, Exclusão, Mascaramento, DLP, Monitoramento, Filtro web, Código seguro<\/b>”. <b>27001 = DEVE (certifica) · 27002 = CONVÉM (orienta)<\/b>.<\/div><\/div>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO<\/div><div class=\"boxb\">(1) A organização <b>pode excluir<\/b> controles do Anexo A, desde que justifique na SoA. (2) O Anexo A <b>não<\/b> é exaustivo — podem ser adicionados controles. (3) Questões ainda citam a 2013 (14 domínios/114 controles): leia o ano. (4) Quem aprova a política e garante recursos é a <b>alta direção<\/b> (cláusula 5).<\/div><\/div>\n"},{"id":"cp2","mod":"Compliance","modTitle":"Módulo 3 — Compliance","title":"3.1b ISO/IEC 27005:2023 (riscos) e 27035-1:2023 (incidentes)","prio":"Média","html":"\n<p><b>27005<\/b> = diretrizes para <b>gestão de riscos de SI<\/b> (apoia os requisitos 6.1/8.2/8.3 da 27001), alinhada à <b>ISO 31000<\/b>. Processo: <b>estabelecimento do contexto<\/b> (critérios de risco e de aceitação) → <b>processo de avaliação de riscos<\/b> = <b>identificação + análise + avaliação<\/b> → <b>tratamento<\/b> → <b>aceitação<\/b>, com <b>comunicação e consulta<\/b> e <b>monitoramento e análise crítica<\/b> contínuos (e registro). Processo <b>iterativo<\/b>.<\/p>\n<table class=\"tb \"><thead><tr><th>Conceito<\/th><th>Ponto de prova<\/th><\/tr><\/thead><tbody><tr><td>Identificação de riscos<\/td><td>Duas abordagens: <b>baseada em eventos<\/b> (cenários estratégicos, fontes de risco) e <b>baseada em ativos<\/b> (ativos, ameaças, vulnerabilidades)<\/td><\/tr><tr><td>Análise de riscos<\/td><td>Determina o <b>nível de risco<\/b> (consequência × probabilidade); <b>qualitativa<\/b>, <b>quantitativa<\/b> ou semiquantitativa; pode ser de alto nível e depois detalhada para riscos críticos<\/td><\/tr><tr><td>Avaliação de riscos (evaluation)<\/td><td><b>Compara<\/b> o nível de risco com os critérios para <b>priorizar<\/b> o tratamento<\/td><\/tr><tr><td>Tratamento<\/td><td>Opções clássicas: <b>modificar/mitigar<\/b> (controles), <b>reter/aceitar<\/b>, <b>evitar<\/b> (eliminar a atividade), <b>compartilhar/transferir<\/b> (seguro, terceirização)<\/td><\/tr><tr><td>Risco residual<\/td><td>O que sobra após o tratamento; precisa ser <b>aceito<\/b> formalmente pelos proprietários do risco<\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — Avaliação ≠ análise<\/div><div class=\"boxb\"><b>Processo de avaliação de riscos (assessment) = I-A-A<\/b>: <b>I<\/b>dentificar, <b>A<\/b>nalisar (nível), <b>A<\/b>valiar (comparar com critério). Tratamentos = “<b>MERC<\/b>”: <b>M<\/b>itigar, <b>E<\/b>vitar, <b>R<\/b>eter, <b>C<\/b>ompartilhar.<\/div><\/div>\n<p><b>27035-1:2023<\/b> — <b>gestão de incidentes de SI: princípios e processo<\/b>. <b>Evento<\/b> de SI = ocorrência que indica possível violação ou falha de controle; <b>incidente<\/b> = um ou mais eventos <b>indesejados ou inesperados<\/b> com probabilidade significativa de comprometer operações/ameaçar a SI. Equipe: <b>ISIRT<\/b>. Fases:<\/p>\n<table class=\"tb \"><thead><tr><th>Fase<\/th><th>Atividades<\/th><\/tr><\/thead><tbody><tr><td>1. <b>Planejar e preparar<\/b><\/td><td>Política, plano, equipe (ISIRT), ferramentas, treinamento, exercícios<\/td><\/tr><tr><td>2. <b>Detectar e reportar<\/b><\/td><td>Monitorar, detectar e relatar eventos<\/td><\/tr><tr><td>3. <b>Avaliar e decidir<\/b><\/td><td>Triagem: o evento é incidente? Classificação e priorização<\/td><\/tr><tr><td>4. <b>Responder<\/b><\/td><td>Contenção, erradicação, recuperação, análise forense, comunicação, escalonamento<\/td><\/tr><tr><td>5. <b>Aprender lições<\/b><\/td><td>Lições aprendidas, melhoria de controles e do processo<\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — 27035<\/div><div class=\"boxb\">“<b>Pla-De-Ava-Res-Apre<\/b>”: <b>Pla<\/b>nejar, <b>De<\/b>tectar, <b>Ava<\/b>liar, <b>Res<\/b>ponder, <b>Apre<\/b>nder. Compare: NIST SP 800-61 = Preparação; Detecção e Análise; Contenção, Erradicação e Recuperação; Pós-incidente.<\/div><\/div>\n"},{"id":"cp3","mod":"Compliance","modTitle":"Módulo 3 — Compliance","title":"3.1c ISO 22301:2020 e ISO 22313:2020 (continuidade de negócios)","prio":"Média","html":"\n<p><b>22301<\/b> = <b>requisitos<\/b> do <b>SGCN<\/b> (sistema de gestão de continuidade de negócios) — certificável, cláusulas 4–10. <b>22313<\/b> = <b>orientações<\/b> (guidance) para usar a 22301 — não certificável. (Mesma lógica 27001/27002.)<\/p>\n<table class=\"tb \"><thead><tr><th>Cláusula 8 da 22301 (Operação)<\/th><th>Conteúdo<\/th><\/tr><\/thead><tbody><tr><td>8.2<\/td><td><b>Análise de impacto nos negócios (BIA)<\/b> e <b>avaliação de riscos<\/b><\/td><\/tr><tr><td>8.3<\/td><td><b>Estratégias e soluções<\/b> de continuidade de negócios<\/td><\/tr><tr><td>8.4<\/td><td><b>Planos e procedimentos<\/b> de continuidade (estrutura de resposta, alertas e comunicação, planos de CN, recuperação)<\/td><\/tr><tr><td>8.5<\/td><td><b>Programa de exercícios<\/b> (testes)<\/td><\/tr><tr><td>8.6<\/td><td>Avaliação da documentação e das capacidades de continuidade<\/td><\/tr><\/tbody><\/table>\n<table class=\"tb \"><thead><tr><th>Termo<\/th><th>Definição<\/th><\/tr><\/thead><tbody><tr><td><b>BIA<\/b><\/td><td>Analisa o impacto ao longo do tempo da interrupção de atividades → define prioridades e prazos<\/td><\/tr><tr><td><b>MTPD / PMTI<\/b><\/td><td>Período máximo tolerável de interrupção — depois dele, o impacto se torna inaceitável<\/td><\/tr><tr><td><b>RTO<\/b><\/td><td>Tempo objetivo de recuperação — prazo para retomar a atividade (<b>RTO &lt; MTPD<\/b>)<\/td><\/tr><tr><td><b>RPO<\/b><\/td><td>Ponto objetivo de recuperação — <b>quantidade máxima de dados que se aceita perder<\/b> (medida em tempo)<\/td><\/tr><tr><td><b>MBCO<\/b><\/td><td>Nível mínimo aceitável de produtos/serviços durante a interrupção<\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU<\/div><div class=\"boxb\"><b>RPO = Perda de dados (olha para trás)<\/b> · <b>RTO = Tempo para voltar (olha para frente)<\/b>. BIA vem <b>antes<\/b> das estratégias. 22301 = DEVE; 22313 = COMO FAZER.<\/div><\/div>\n"},{"id":"cp4","mod":"Compliance","modTitle":"Módulo 3 — Compliance","title":"3.1d Privacidade: ISO/IEC 29100:2024, 29134:2024 e 27701:2019","prio":"Alta","html":"\n<p><b>29100<\/b> = <b>estrutura de privacidade<\/b> (framework de alto nível) para proteção de DP/PII em sistemas de TIC: terminologia, atores, considerações e princípios. Atores: <b>titular de DP<\/b> (PII principal), <b>controlador de DP<\/b>, <b>operador de DP<\/b> (PII processor) e <b>terceiro<\/b>. <b>11 princípios<\/b>:<\/p>\n<table class=\"tb \"><thead><tr><th>#<\/th><th>Princípio de privacidade (29100)<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Consentimento e escolha<\/td><\/tr><tr><td>2<\/td><td>Legitimidade e especificação de propósito<\/td><\/tr><tr><td>3<\/td><td>Limitação de coleta<\/td><\/tr><tr><td>4<\/td><td>Minimização de dados<\/td><\/tr><tr><td>5<\/td><td>Limitação de uso, retenção e divulgação<\/td><\/tr><tr><td>6<\/td><td>Precisão e qualidade<\/td><\/tr><tr><td>7<\/td><td>Abertura, transparência e notificação<\/td><\/tr><tr><td>8<\/td><td>Participação individual e acesso<\/td><\/tr><tr><td>9<\/td><td>Responsabilização (accountability)<\/td><\/tr><tr><td>10<\/td><td>Segurança da informação<\/td><\/tr><tr><td>11<\/td><td>Conformidade com a privacidade (privacy compliance)<\/td><\/tr><\/tbody><\/table>\n<p><b>29134<\/b> = diretrizes para <b>avaliação de impacto à privacidade (PIA)<\/b> — equivale ao <b>RIPD<\/b> da LGPD. Processo: <b>preparação<\/b> (determinar a necessidade, equipe, plano, recursos, partes interessadas) → <b>realização<\/b> (identificar fluxos de informação, implicações para o titular, requisitos de salvaguarda, avaliar e tratar riscos à privacidade) → <b>relatório de PIA<\/b> → <b>acompanhamento<\/b> (publicar, implementar plano de tratamento, revisar quando houver mudanças). A PIA deve começar cedo (privacy by design) e ser revista.<\/p>\n<p><b>27701:2019<\/b> = <b>extensão<\/b> da 27001 e 27002 para <b>gestão da privacidade da informação<\/b> (<b>SGPI<\/b>/PIMS). Requisitos adicionais às cláusulas da 27001 e orientações adicionais à 27002, mais controles específicos: <b>Anexo A<\/b> — controles para <b>controladores<\/b>; <b>Anexo B<\/b> — para <b>operadores<\/b>; anexos de mapeamento com a 29100 (C), o GDPR (D), a 27018 e a 29151 (E). (Obs.: a ISO publicou depois uma 27701 independente, mas o edital cobra a <b>2019, corrigida em 2020<\/b>.)<\/p>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU<\/div><div class=\"boxb\"><b>29100 = princípios (o “porquê”) · 29134 = PIA/RIPD (o “avaliar impacto”) · 27701 = SGPI (o “gerenciar”, extensão da 27001/27002; Anexo A = controlador, B = operador)<\/b>.<\/div><\/div>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO<\/div><div class=\"boxb\">“A 27701 é uma norma autônoma que dispensa a 27001” — falso para a versão 2019 (é extensão). “Minimização” (29100) ≈ “necessidade” (LGPD).<\/div><\/div>\n"},{"id":"cp5","mod":"Compliance","modTitle":"Módulo 3 — Compliance","title":"3.2 Frameworks: NIST CSF 2.0 e CIS Controls v8.1","prio":"Alta","html":"\n<p><b>NIST CSF 2.0<\/b> (fev/2024): escopo ampliado para <b>todas as organizações<\/b> (não só infraestrutura crítica). Componentes: <b>Núcleo (Core)<\/b> = Funções → Categorias → Subcategorias (6 funções, <b>22 categorias, 106 subcategorias<\/b>), <b>Perfis organizacionais<\/b> (Atual e Alvo — análise de lacunas) e <b>Camadas (Tiers)<\/b> de rigor da governança/gestão de risco: <b>1 Parcial, 2 Informada por riscos, 3 Repetível, 4 Adaptativa<\/b>. Recursos online: exemplos de implementação, referências informativas, guias de início rápido. <b>Govern<\/b> fica no centro da roda e orienta as outras cinco.<\/p>\n<table class=\"tb \"><thead><tr><th>Função<\/th><th>Sigla<\/th><th>Categorias (22 no total)<\/th><\/tr><\/thead><tbody><tr><td><b>Govern<\/b> (GOVERNAR) — <b>nova<\/b><\/td><td>GV<\/td><td>GV.OC Contexto organizacional · GV.RM Estratégia de gestão de riscos · GV.RR Papéis, responsabilidades e autoridades · GV.PO Política · GV.OV Supervisão · GV.SC Gestão de riscos da cadeia de suprimentos<\/td><\/tr><tr><td><b>Identify<\/b> (IDENTIFICAR)<\/td><td>ID<\/td><td>ID.AM Gestão de ativos · ID.RA Avaliação de riscos · ID.IM Melhoria<\/td><\/tr><tr><td><b>Protect<\/b> (PROTEGER)<\/td><td>PR<\/td><td>PR.AA Gestão de identidade, autenticação e controle de acesso · PR.AT Conscientização e treinamento · PR.DS Segurança de dados · PR.PS Segurança de plataforma · PR.IR Resiliência da infraestrutura tecnológica<\/td><\/tr><tr><td><b>Detect<\/b> (DETECTAR)<\/td><td>DE<\/td><td>DE.CM Monitoramento contínuo · DE.AE Análise de eventos adversos<\/td><\/tr><tr><td><b>Respond<\/b> (RESPONDER)<\/td><td>RS<\/td><td>RS.MA Gestão de incidentes · RS.AN Análise de incidentes · RS.CO Comunicação e relato · RS.MI Mitigação<\/td><\/tr><tr><td><b>Recover<\/b> (RECUPERAR)<\/td><td>RC<\/td><td>RC.RP Execução do plano de recuperação · RC.CO Comunicação da recuperação<\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — NIST CSF 2.0 do Allan<\/div><div class=\"boxb\"><b>GIP-DRR<\/b> = <b>G<\/b>overn, <b>I<\/b>dentify, <b>P<\/b>rotect, <b>D<\/b>etect, <b>R<\/b>espond, <b>R<\/b>ecover. <b>Govern é a nova<\/b> (e a cadeia de suprimentos — GV.SC — foi para dentro dela). Tiers <b>não<\/b> são níveis de maturidade obrigatórios: “<b>P-I-R-A<\/b>” = Parcial, Informada, Repetível, Adaptativa.<\/div><\/div>\n<p><b>CIS Critical Security Controls v8.1<\/b> (2024): <b>18 controles<\/b> e <b>153 salvaguardas<\/b>, priorizados em <b>Implementation Groups<\/b>: <b>IG1<\/b> = “higiene cibernética essencial” (o mínimo para toda empresa; subconjunto de salvaguardas), <b>IG2<\/b> = IG1 + salvaguardas para empresas com mais complexidade/dados sensíveis, <b>IG3<\/b> = todas as salvaguardas (alvos de ataques sofisticados). A v8.1 alinhou-se ao CSF 2.0 incluindo a função de segurança <b>Govern<\/b> nas salvaguardas e revisou classes de ativos e glossário.<\/p>\n<table class=\"tb \"><thead><tr><th>#<\/th><th>CIS Control v8.1<\/th><th>#<\/th><th>CIS Control v8.1<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Inventário e controle de <b>ativos<\/b> corporativos<\/td><td>10<\/td><td>Defesas contra <b>malware<\/b><\/td><\/tr><tr><td>2<\/td><td>Inventário e controle de ativos de <b>software<\/b><\/td><td>11<\/td><td><b>Recuperação<\/b> de dados<\/td><\/tr><tr><td>3<\/td><td><b>Proteção de dados<\/b><\/td><td>12<\/td><td>Gestão da <b>infraestrutura de rede<\/b><\/td><\/tr><tr><td>4<\/td><td><b>Configuração segura<\/b> de ativos e software<\/td><td>13<\/td><td><b>Monitoramento e defesa<\/b> da rede<\/td><\/tr><tr><td>5<\/td><td>Gestão de <b>contas<\/b><\/td><td>14<\/td><td><b>Conscientização<\/b> e treinamento<\/td><\/tr><tr><td>6<\/td><td>Gestão do <b>controle de acesso<\/b><\/td><td>15<\/td><td>Gestão de <b>provedores de serviço<\/b><\/td><\/tr><tr><td>7<\/td><td>Gestão contínua de <b>vulnerabilidades<\/b><\/td><td>16<\/td><td>Segurança de <b>software aplicativo<\/b><\/td><\/tr><tr><td>8<\/td><td>Gestão de <b>logs de auditoria<\/b><\/td><td>17<\/td><td>Gestão de <b>resposta a incidentes<\/b><\/td><\/tr><tr><td>9<\/td><td>Proteções de <b>e-mail e navegador<\/b><\/td><td>18<\/td><td><b>Testes de invasão<\/b> (pentest)<\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — CIS<\/div><div class=\"boxb\">Os <b>dois primeiros são inventário<\/b> (hardware, depois software) — “não dá para proteger o que você não conhece”. <b>14 = treinamento<\/b>, <b>17 = resposta a incidentes<\/b>, <b>18 = pentest<\/b> (último). IG1 ⊂ IG2 ⊂ IG3.<\/div><\/div>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO<\/div><div class=\"boxb\">CIS <b>Controls<\/b> (o quê priorizar) ≠ CIS <b>Benchmarks<\/b> (como configurar cada sistema). No CSF 2.0, “Identify” não contém mais a governança — ela foi para “Govern”.<\/div><\/div>\n"},{"id":"cp6","mod":"Compliance","modTitle":"Módulo 3 — Compliance","title":"3.3a Marco Civil da Internet (Lei 12.965/2014)","prio":"Média","html":"\n<table class=\"tb \"><thead><tr><th>Tema<\/th><th>Regra (artigo)<\/th><\/tr><\/thead><tbody><tr><td>Fundamentos/princípios<\/td><td>Liberdade de expressão, <b>privacidade<\/b>, <b>proteção de dados pessoais<\/b>, <b>neutralidade de rede<\/b>, estabilidade e segurança da rede (arts. 2º e 3º)<\/td><\/tr><tr><td>Direitos do usuário<\/td><td>Inviolabilidade da intimidade; <b>inviolabilidade e sigilo do fluxo e das comunicações armazenadas, salvo ordem judicial<\/b>; não fornecimento de dados a terceiros sem consentimento livre, expresso e informado (art. 7º)<\/td><\/tr><tr><td><b>Neutralidade<\/b><\/td><td>Tratar de forma isonômica quaisquer pacotes, sem distinção por conteúdo, origem, destino, serviço, terminal ou aplicação; discriminação só por requisitos técnicos indispensáveis e priorização de serviços de emergência (art. 9º)<\/td><\/tr><tr><td>Guarda de registros — <b>provedor de conexão<\/b><\/td><td><b>Registros de conexão por 1 ano<\/b>, sob sigilo, em ambiente controlado (art. 13). <b>Vedado<\/b> guardar registros de acesso a aplicações (art. 14)<\/td><\/tr><tr><td>Guarda de registros — <b>provedor de aplicação<\/b><\/td><td>PJ que exerce a atividade de forma organizada, profissional e com fins econômicos: <b>registros de acesso a aplicações por 6 meses<\/b> (art. 15)<\/td><\/tr><tr><td>Prazo maior<\/td><td>Autoridade policial, administrativa ou MP pode requerer cautelarmente guarda por prazo superior; tem <b>60 dias<\/b> para pedir a ordem judicial (arts. 13 §2º e 15 §2º)<\/td><\/tr><tr><td>Disponibilização<\/td><td>Registros e conteúdo: só por <b>ordem judicial<\/b> (art. 10 §1º e art. 22). <b>Dados cadastrais<\/b> (qualificação pessoal, filiação, endereço): autoridades administrativas com competência legal podem requisitar (art. 10 §3º)<\/td><\/tr><tr><td>Responsabilidade civil<\/td><td>Provedor de <b>conexão não<\/b> responde por conteúdo de terceiros (art. 18). Provedor de <b>aplicação<\/b>: pela letra da lei, só após <b>descumprir ordem judicial específica<\/b> de remoção (art. 19) — exceção: <b>nudez/atos sexuais privados<\/b> sem autorização → basta <b>notificação do participante<\/b> (art. 21)<\/td><\/tr><tr><td>Aplicação territorial<\/td><td>Lei brasileira se ao menos um ato de coleta, armazenamento, guarda ou tratamento ocorrer no Brasil (art. 11)<\/td><\/tr><tr><td>Sanções (art. 12)<\/td><td>Advertência; multa de até <b>10% do faturamento do grupo econômico no Brasil<\/b>; suspensão temporária; proibição das atividades<\/td><\/tr><\/tbody><\/table>\n<div class=\"box atn\"><div class=\"boxh\">ATENÇÃO — STF e o art. 19<\/div><div class=\"boxb\">Em <b>junho de 2025<\/b> (Temas 987 e 533 — RE 1.037.396 e RE 1.057.258), o STF declarou o art. 19 <b>parcialmente inconstitucional<\/b>: em regra, provedores de aplicação podem ser responsabilizados após <b>notificação extrajudicial<\/b> quando não removem conteúdo ilícito, mantendo-se a exigência de <b>ordem judicial para crimes contra a honra<\/b>. Fonte: notícia do STF (noticias.stf.jus.br). Em prova, a Cesgranrio costuma cobrar a <b>letra da lei<\/b>; se o enunciado citar a tese do STF, aplique-a.<\/div><\/div>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU<\/div><div class=\"boxb\"><b>Conexão = 1 ano (conexão, só ela)<\/b> · <b>Aplicação = 6 meses<\/b> · “<b>C1 A6<\/b>”. Conexão <b>não<\/b> pode guardar registro de aplicação. Conteúdo e registros = <b>juiz<\/b>; dados cadastrais = autoridade administrativa.<\/div><\/div>\n"},{"id":"cp7","mod":"Compliance","modTitle":"Módulo 3 — Compliance","title":"3.3b LGPD (Lei 13.709/2018)","prio":"Alta","html":"\n<table class=\"tb \"><thead><tr><th>Agente / figura<\/th><th>Quem é<\/th><\/tr><\/thead><tbody><tr><td><b>Titular<\/b><\/td><td>Pessoa natural a quem os dados se referem<\/td><\/tr><tr><td><b>Controlador<\/b><\/td><td>Pessoa natural ou jurídica, de direito público ou privado, a quem competem as <b>decisões<\/b> sobre o tratamento<\/td><\/tr><tr><td><b>Operador<\/b><\/td><td>Quem realiza o tratamento <b>em nome do controlador<\/b><\/td><\/tr><tr><td><b>Encarregado (DPO)<\/b><\/td><td>Pessoa indicada pelo controlador e operador para atuar como <b>canal de comunicação<\/b> entre controlador, titulares e ANPD (art. 5º VIII; art. 41)<\/td><\/tr><tr><td><b>Agentes de tratamento<\/b><\/td><td><b>Controlador e operador<\/b> (o encarregado não é agente de tratamento)<\/td><\/tr><tr><td><b>ANPD<\/b><\/td><td>Autoridade nacional: fiscaliza, regulamenta e aplica sanções<\/td><\/tr><\/tbody><\/table>\n<table class=\"tb \"><thead><tr><th>Conceito<\/th><th>Ponto de prova<\/th><\/tr><\/thead><tbody><tr><td>Dado pessoal sensível<\/td><td>Origem racial ou étnica, convicção religiosa, opinião política, filiação a sindicato ou a organização de caráter religioso, filosófico ou político, saúde ou vida sexual, genético ou biométrico (art. 5º II)<\/td><\/tr><tr><td>Anonimizado × pseudonimizado<\/td><td>Anonimizado (irreversível com meios razoáveis) <b>não é dado pessoal<\/b> (art. 12); pseudonimizado <b>continua<\/b> sendo (há chave para reverter)<\/td><\/tr><tr><td><b>Princípios (art. 6º)<\/b><\/td><td><b>Boa-fé<\/b> + finalidade, adequação, necessidade, livre acesso, qualidade dos dados, transparência, segurança, prevenção, não discriminação, responsabilização e prestação de contas<\/td><\/tr><tr><td><b>Bases legais (art. 7º)<\/b> — 10<\/td><td>Consentimento · obrigação legal/regulatória · administração pública (políticas públicas) · estudos por órgão de pesquisa · execução de contrato · exercício regular de direitos em processo · proteção da vida · tutela da saúde · <b>legítimo interesse<\/b> · proteção do crédito<\/td><\/tr><tr><td>Dados sensíveis (art. 11)<\/td><td>Sem consentimento só nas hipóteses legais; <b>não<\/b> admite legítimo interesse nem proteção do crédito; inclui garantia da <b>prevenção à fraude<\/b> e segurança do titular em identificação/autenticação<\/td><\/tr><tr><td>Crianças e adolescentes (art. 14)<\/td><td>Melhor interesse; dados de crianças com consentimento específico e em destaque de pelo menos um dos pais/responsável<\/td><\/tr><tr><td>Não se aplica (art. 4º)<\/td><td>Pessoa natural para fins particulares e não econômicos; fins exclusivamente jornalísticos, artísticos ou acadêmicos; <b>segurança pública, defesa nacional, segurança do Estado, investigação e repressão de infrações penais<\/b><\/td><\/tr><tr><td>Direitos do titular (art. 18)<\/td><td>Confirmação, acesso, correção, anonimização/bloqueio/eliminação, portabilidade, informação sobre compartilhamento, revogação do consentimento etc.<\/td><\/tr><tr><td>Registro e RIPD<\/td><td>Controlador e operador mantêm <b>registro das operações<\/b> (art. 37); a ANPD pode exigir do <b>controlador<\/b> o <b>Relatório de Impacto à Proteção de Dados<\/b> (art. 38)<\/td><\/tr><tr><td>Incidente (art. 48)<\/td><td>Controlador comunica à <b>ANPD e ao titular<\/b> incidente que possa acarretar risco ou dano relevante; a <b>Resolução CD/ANPD nº 15/2024<\/b> fixou prazo de <b>3 dias úteis<\/b><\/td><\/tr><tr><td>Responsabilidade (art. 42)<\/td><td>Operador responde <b>solidariamente<\/b> quando descumprir a LGPD ou as instruções lícitas do controlador<\/td><\/tr><tr><td><b>Sanções (art. 52)<\/b><\/td><td>Advertência; <b>multa simples de até 2% do faturamento<\/b> no Brasil, limitada a <b>R$ 50 milhões por infração<\/b>; multa diária; publicização; bloqueio; eliminação; suspensão parcial do banco de dados ou da atividade (até 6 meses, prorrogável); proibição parcial ou total<\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — LGPD do Allan<\/div><div class=\"boxb\"><b>Controlador DECIDE · Operador EXECUTA · Encarregado/DPO faz a PONTE<\/b> (titular ↔ controlador ↔ ANPD). Princípios: “<b>FAN LIQUE TRANSPARENTE SEGURO PREVINE NÃO DISCRIMINA E RESPONDE<\/b>” (Finalidade, Adequação, Necessidade, Livre acesso, Qualidade, Transparência, Segurança, Prevenção, Não discriminação, Responsabilização). Multa: <b>2% limitado a R$ 50 mi por infração<\/b>.<\/div><\/div>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO<\/div><div class=\"boxb\">(1) Consentimento é <b>só uma<\/b> das 10 bases — não é obrigatório sempre. (2) Legítimo interesse <b>não<\/b> serve para dado sensível. (3) Encarregado <b>não<\/b> é agente de tratamento. (4) A LGPD se aplica a dados em meio <b>físico e digital<\/b>, a entes públicos e privados. (5) Multa de 2% é do faturamento <b>no Brasil<\/b> do último exercício, por infração, até R$ 50 mi.<\/div><\/div>\n"},{"id":"cp8","mod":"Compliance","modTitle":"Módulo 3 — Compliance","title":"3.3c Resolução Anatel nº 740/2020 (segurança cibernética em telecom)","prio":"Média","html":"\n<p>Aprova o <b>Regulamento de Segurança Cibernética Aplicada ao Setor de Telecomunicações<\/b> (vigência em 04/01/2021; adequação em até <b>180 dias<\/b>). Objetivo: condutas e procedimentos para segurança nas redes e serviços de telecom, incluindo a <b>segurança cibernética<\/b> e a <b>proteção das infraestruturas críticas de telecomunicações<\/b>.<\/p>\n<table class=\"tb \"><thead><tr><th>Tema<\/th><th>Regra<\/th><\/tr><\/thead><tbody><tr><td>Abrangência (art. 2º)<\/td><td>Prestadoras de serviços de telecom de <b>interesse coletivo<\/b>, <b>ressalvadas as de Pequeno Porte<\/b>; o Conselho Diretor pode incluir ou dispensar. <b>Princípios e diretrizes<\/b> valem para <b>todas<\/b>, mesmo dispensadas<\/td><\/tr><tr><td>Princípios (art. 4º) — 9<\/td><td>Autenticidade, confidencialidade, disponibilidade, <b>diversidade<\/b>, integridade, <b>interoperabilidade<\/b>, <b>prioridade<\/b>, <b>responsabilidade<\/b> e <b>transparência<\/b><\/td><\/tr><tr><td>Diretrizes (art. 5º)<\/td><td>Adotar normas e boas práticas; disseminar cultura; identificar, proteger, diagnosticar, responder e recuperar; cooperação; respeitar direitos (proteção de dados, privacidade); incentivar <b>security by design<\/b> e <b>privacy by design<\/b><\/td><\/tr><tr><td>Obrigações (arts. 6º–11)<\/td><td><b>Política de Segurança Cibernética<\/b>; usar equipamentos de <b>fornecedores com política de segurança e auditoria independente periódica<\/b>; <b>alterar a configuração padrão de autenticação<\/b> de equipamentos em comodato (ex.: roteador do cliente); <b>notificar incidentes relevantes<\/b>; <b>ciclos de avaliação de vulnerabilidades<\/b> (por entidade independente); enviar informações sobre <b>infraestruturas críticas<\/b><\/td><\/tr><tr><td>Política (arts. 12–16)<\/td><td>Aprovada pelo <b>conselho de administração<\/b> ou órgão colegiado equivalente; <b>diretor responsável<\/b> designado; extrato não sensível <b>publicado na internet<\/b>; relatório de acompanhamento à Anatel <b>anualmente<\/b> ou quando solicitado; conteúdo mínimo inclui plano de resposta a incidentes e avaliação de dependência de fornecedores<\/td><\/tr><tr><td>Incidentes (art. 17)<\/td><td>Notificar à Anatel os <b>incidentes relevantes<\/b> que afetem substancialmente a segurança das redes e dos dados dos usuários, com <b>análise de causa, impacto e ações de mitigação<\/b>; compartilhamento entre prestadoras de forma sigilosa e não discriminatória, facultado o anonimato<\/td><\/tr><tr><td><b>GT-Ciber<\/b> (art. 24)<\/td><td>Grupo Técnico de Segurança Cibernética e Gestão de Riscos de Infraestruturas Críticas, coordenado por <b>Superintendente<\/b> designado; participação das prestadoras com <b>Poder de Mercado Significativo<\/b>; define forma e procedimento das obrigações<\/td><\/tr><tr><td>Sanções (art. 25)<\/td><td>Lei Geral de Telecomunicações (Lei 9.472/1997) e Regulamento de Sanções da Anatel<\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU<\/div><div class=\"boxb\">Princípios além da CIDA: “<b>DIPRT<\/b>” — <b>D<\/b>iversidade, <b>I<\/b>nteroperabilidade, <b>P<\/b>rioridade, <b>R<\/b>esponsabilidade, <b>T<\/b>ransparência. Obrigações: “<b>Política, Fornecedor auditado, Senha padrão trocada, Incidente notificado, Vulnerabilidade avaliada, Infra crítica informada<\/b>”.<\/div><\/div>\n<div class=\"box atn\"><div class=\"boxh\">ATENÇÃO<\/div><div class=\"boxb\">Texto consultado: versão original publicada (DOU 24/12/2020). O edital diz “e suas alterações” — confira no site da Anatel se houve alterações posteriores antes da prova.<\/div><\/div>\n"},{"id":"pt1","mod":"Português","modTitle":"Módulo 4 — Português e Inglês","title":"Português — estratégia e compreensão de textos","prio":"Alta","html":"\n<p>Estrutura cobrada: 10 questões, em geral a partir de 1 ou 2 textos (crônica, artigo de opinião ou reportagem), misturando <b>compreensão<\/b> e <b>gramática aplicada ao texto<\/b>. Em levantamento do TecConcursos com 4.166 questões de Português da Cesgranrio, <b>Interpretação<\/b> lidera (33%), seguida de Morfologia (14%), Semântica (9%), Ortografia, Concordância e Regência (6% cada) e Pontuação (5%) — ver “Fontes”.<\/p>\n<ul class=\"\"><li><b>Leia o enunciado antes do texto<\/b> e marque palavras de comando: “de acordo com o texto”, “infere-se”, “o autor defende”, “a expressão X tem sentido de”.<\/li><li><b>Interpretação<\/b> (o que está no texto) × <b>inferência<\/b> (o que se conclui com segurança a partir dele). Extrapolação = errado.<\/li><li>Desconfie de alternativas com <b>generalizações<\/b> (sempre, nunca, todos, exclusivamente) e com informação <b>verdadeira no mundo<\/b>, mas <b>ausente no texto<\/b>.<\/li><li>Questões de <b>reescrita<\/b>: a nova frase deve manter <b>sentido e correção<\/b> — teste concordância, regência, crase e pontuação.<\/li><\/ul>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU<\/div><div class=\"boxb\">Cesgranrio adora a pergunta “o trecho X <b>refere-se<\/b> a…” (coesão referencial) e “a palavra X <b>pode ser substituída, sem alteração de sentido<\/b>, por…”. Volte ao parágrafo e troque a palavra na frase original.<\/div><\/div>\n"},{"id":"pt2","mod":"Português","modTitle":"Módulo 4 — Português e Inglês","title":"Português — coesão, conectivos, coordenação e subordinação","prio":"Alta","html":"\n<table class=\"tb \"><thead><tr><th>Relação<\/th><th>Conectivos típicos<\/th><th>Exemplo<\/th><\/tr><\/thead><tbody><tr><td><b>Adição<\/b><\/td><td>e, nem, não só… mas também, além disso<\/td><td>Além disso, o ataque persistiu.<\/td><\/tr><tr><td><b>Adversidade (oposição)<\/b><\/td><td>mas, porém, contudo, todavia, entretanto, no entanto<\/td><td>O sistema é antigo, porém estável.<\/td><\/tr><tr><td><b>Concessão<\/b><\/td><td>embora, conquanto, ainda que, mesmo que, apesar de (que), se bem que<\/td><td><b>Embora<\/b> seja antigo, o sistema é estável. (verbo no <b>subjuntivo<\/b>)<\/td><\/tr><tr><td><b>Conclusão<\/b><\/td><td>logo, portanto, por isso, assim, pois (<b>posposto<\/b> ao verbo)<\/td><td>Houve falha; deve, <b>pois<\/b>, ser revisto.<\/td><\/tr><tr><td><b>Explicação<\/b><\/td><td>porque, que, pois (<b>anteposto<\/b> ao verbo)<\/td><td>Revise, <b>pois<\/b> há falhas.<\/td><\/tr><tr><td><b>Causa<\/b><\/td><td>porque, já que, visto que, uma vez que, como (no início)<\/td><td><b>Como<\/b> o link caiu, a VPN parou.<\/td><\/tr><tr><td><b>Condição<\/b><\/td><td>se, caso, desde que, contanto que, a menos que<\/td><td><b>Caso<\/b> haja alerta, isole o host.<\/td><\/tr><tr><td><b>Finalidade<\/b><\/td><td>para que, a fim de que<\/td><td>Treinou <b>para que<\/b> não errasse.<\/td><\/tr><tr><td><b>Consequência<\/b><\/td><td>tão… que, tanto… que, de modo que<\/td><td>Era <b>tão<\/b> grave <b>que<\/b> pararam.<\/td><\/tr><tr><td><b>Proporção<\/b><\/td><td>à medida que, à proporção que, quanto mais… mais<\/td><td><b>À medida que<\/b> crescia, piorava.<\/td><\/tr><tr><td><b>Tempo<\/b><\/td><td>quando, enquanto, assim que, logo que<\/td><td><\/td><\/tr><tr><td><b>Conformidade<\/b><\/td><td>conforme, segundo, consoante, como<\/td><td><b>Conforme<\/b> o edital…<\/td><\/tr><\/tbody><\/table>\n<p><b>Coordenadas<\/b> (independentes sintaticamente): aditivas, adversativas, alternativas, conclusivas, explicativas. <b>Subordinadas<\/b>: <b>substantivas<\/b> (exercem função de substantivo: “É preciso <i>que estudes<\/i>”), <b>adjetivas<\/b> (introduzidas por pronome relativo — <b>restritiva<\/b> sem vírgula restringe; <b>explicativa<\/b> com vírgulas generaliza) e <b>adverbiais<\/b> (causa, concessão, condição, conformidade, comparação, consequência, finalidade, proporção, tempo).<\/p>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — Concessão × adversidade<\/div><div class=\"boxb\"><b>Embora<\/b> (concessão, subjuntivo) ≈ <b>mas<\/b> (adversidade, indicativo) com a ordem invertida: “<b>Embora<\/b> estude, erra” = “Estuda, <b>mas<\/b> erra”. Na reescrita, ao trocar “mas” por “embora”, <b>mude o verbo para o subjuntivo<\/b>.<\/div><\/div>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO<\/div><div class=\"boxb\">Adjetiva restritiva × explicativa: “Os analistas <b>que estudaram<\/b> passaram” (só alguns) × “Os analistas, <b>que estudaram<\/b>, passaram” (todos). Retirar/inserir vírgulas <b>muda o sentido<\/b>.<\/div><\/div>\n"},{"id":"pt3","mod":"Português","modTitle":"Módulo 4 — Português e Inglês","title":"Português — crase, regência, concordância e colocação pronominal","prio":"Alta","html":"\n<h4>Crase (a + a)<\/h4>\n<table class=\"tb \"><thead><tr><th>Use crase<\/th><th>Não use crase<\/th><\/tr><\/thead><tbody><tr><td>Termo regente exige <b>a<\/b> + palavra feminina admite <b>a<\/b>: “Refiro-me <b>à<\/b> norma.”<\/td><td>Antes de <b>masculino<\/b>: “a pé”, “a prazo” (salvo “à moda de”: “bife à milanesa”)<\/td><\/tr><tr><td><b>Horas<\/b> determinadas: “às 13h”, “das 8h às 12h”<\/td><td>Antes de <b>verbo<\/b>: “começou a estudar”<\/td><\/tr><tr><td>Locuções femininas: <b>à<\/b> medida que, <b>às<\/b> vezes, <b>à<\/b> noite, <b>à<\/b> custa de<\/td><td>Antes de pronomes que não aceitam artigo: “a ela”, “a Vossa Senhoria”, “a esta”, “a quem”<\/td><\/tr><tr><td>“Àquele/àquela/àquilo” quando o regente pede “a”<\/td><td>Entre palavras repetidas: “cara a cara”, “gota a gota”<\/td><\/tr><tr><td>Cidades/países com artigo: “Vou <b>à<\/b> Bahia” (volto <b>da<\/b> Bahia)<\/td><td>“Vou <b>a<\/b> Manaus” (volto <b>de<\/b> Manaus) — “a” no singular antes de plural: “a empresas”<\/td><\/tr><tr><td><b>Facultativa<\/b>: antes de pronome possessivo feminino singular (“à/a sua equipe”), nome próprio feminino (“à/a Maria”) e após “até” (“até à/a porta”)<\/td><td>Antes de “uma” (artigo indefinido): “a uma reunião” (exceto horas: “à uma hora”)<\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — Crase (o do Allan)<\/div><div class=\"boxb\"><b>Troque por masculino<\/b>: se virar “<b>ao<\/b>”, tem crase (“fui à escola” → “fui ao colégio”). <b>Cidade: “vou a, volto da, crase há; vou a, volto de, crase pra quê?”<\/b>. Nunca antes de verbo, masculino ou pronome pessoal.<\/div><\/div>\n<h4>Regência — os campeões<\/h4>\n<table class=\"tb \"><thead><tr><th>Verbo/nome<\/th><th>Regência de prova<\/th><\/tr><\/thead><tbody><tr><td>Assistir<\/td><td>= ver: assistir <b>a<\/b> (assisti ao jogo) · = ajudar: VTD (assistiu o paciente) · = caber: assistir <b>a<\/b> (o direito que assiste ao réu)<\/td><\/tr><tr><td>Visar<\/td><td>= almejar: visar <b>a<\/b> (visa ao cargo) · = mirar/dar visto: VTD<\/td><\/tr><tr><td>Aspirar<\/td><td>= desejar: aspirar <b>a<\/b> · = inspirar ar: VTD<\/td><\/tr><tr><td>Obedecer / desobedecer<\/td><td>VTI com <b>a<\/b>: obedecer <b>ao<\/b> edital<\/td><\/tr><tr><td>Preferir<\/td><td>Preferir <b>algo a<\/b> algo (nunca “mais… do que”)<\/td><\/tr><tr><td>Implicar<\/td><td>= acarretar: <b>VTD<\/b> (a falha implica riscos — sem “em”, pela norma)<\/td><\/tr><tr><td>Chegar / ir<\/td><td>Chegar <b>a<\/b> (não “em”): chegou ao local<\/td><\/tr><tr><td>Esquecer / lembrar<\/td><td>Esquecer algo · esquecer-<b>se de<\/b> algo<\/td><\/tr><tr><td>Proceder<\/td><td>= realizar: proceder <b>a<\/b> (procedeu à análise)<\/td><\/tr><tr><td>Pagar / perdoar<\/td><td>Algo (coisa) VTD; <b>a<\/b> alguém (pessoa) VTI<\/td><\/tr><\/tbody><\/table>\n<h4>Concordância — pontos que mais derrubam<\/h4>\n<ul class=\"\"><li><b>Haver<\/b> = existir/tempo decorrido: <b>impessoal<\/b> (singular): “<b>Houve<\/b> falhas”, “<b>Deve haver<\/b> erros” (o auxiliar também fica no singular). <b>Existir<\/b> concorda: “Existem falhas”.<\/li><li><b>Fazer<\/b> (tempo): impessoal: “<b>Faz<\/b> dois anos”.<\/li><li><b>Voz passiva sintética<\/b>: “<b>Vendem-se<\/b> casas” (casas = sujeito). <b>Índice de indeterminação<\/b> (VTI/VI): “<b>Precisa-se de<\/b> analistas” (singular).<\/li><li>Sujeito posposto: “<b>Surgiram<\/b>, no relatório, novas evidências”.<\/li><li>“A maioria dos / grande parte de + plural”: verbo no singular ou plural (ambos aceitos).<\/li><li><b>Mesmo, anexo, obrigado, incluso, quite<\/b>: concordam (“As cópias seguem <b>anexas<\/b>”); <b>menos<\/b> e <b>alerta<\/b> são invariáveis; “meio” advérbio (= um pouco) não varia (“meio cansada”).<\/li><li>“É necessário/proibido/bom” sem artigo fica invariável: “É proibido entrada”; com artigo concorda: “É proibida a entrada”.<\/li><\/ul>\n<h4>Colocação pronominal (átonos: me, te, se, o, a, lhe, nos, vos)<\/h4>\n<ul class=\"\"><li><b>Próclise obrigatória<\/b> com atrativos: palavras negativas (não, nunca), pronomes relativos/indefinidos, conjunções subordinativas, advérbios sem vírgula: “Não <b>se<\/b> esqueça”, “que <b>me<\/b> disse”.<\/li><li><b>Não se inicia frase com pronome átono<\/b> (norma-padrão): “Disseram-<b>me<\/b>”, não “Me disseram”.<\/li><li><b>Mesóclise<\/b> só com futuro do presente/pretérito sem atrativo: “Far-<b>se<\/b>-á”, “Dir-<b>lhe<\/b>-ia”.<\/li><li><b>Ênclise<\/b> é a regra geral sem atrativos, com imperativo afirmativo e gerúndio: “Faça-o”, “Considerando-<b>se<\/b>”.<\/li><li>Nunca ênclise com particípio: “Tinha <b>se<\/b> esquecido” / “Tinha-<b>se<\/b> esquecido” (nunca “esquecido-se”).<\/li><\/ul>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO<\/div><div class=\"boxb\">“Haviam muitos candidatos” = <b>errado<\/b>. “Fazem dois anos” = errado. “Aluga-se salas” = errado (alugam-se). “Assisti o filme” = errado na norma-padrão. “Não esqueça-se” = errado (próclise com “não”).<\/div><\/div>\n"},{"id":"pt4","mod":"Português","modTitle":"Módulo 4 — Português e Inglês","title":"Português — pontuação, ortografia, verbos, classes e significação","prio":"Média","html":"\n<h4>Vírgula — regras que resolvem 90%<\/h4>\n<ul class=\"\"><li><b>Nunca<\/b> separe <b>sujeito e verbo<\/b>, nem <b>verbo e complemento<\/b> (salvo intercalação entre duas vírgulas).<\/li><li>Use para isolar <b>adjunto adverbial deslocado<\/b> (facultativa se curto), <b>aposto<\/b> explicativo, <b>vocativo<\/b>, <b>orações adjetivas explicativas<\/b>, <b>orações adverbiais antepostas<\/b> e expressões explicativas (isto é, ou seja, por exemplo).<\/li><li>Antes de “mas, porém, contudo”; conjunções adversativas/conclusivas deslocadas ficam entre vírgulas (“O teste, <b>porém<\/b>, falhou”).<\/li><li>“E” com sujeitos diferentes pode ter vírgula: “O analista revisou o log, <b>e<\/b> o gestor aprovou o plano”.<\/li><li>Ponto e vírgula separa itens longos ou orações coordenadas extensas; dois-pontos anunciam enumeração, explicação ou citação; travessões/parênteses intercalam.<\/li><\/ul>\n<h4>Ortografia — clássicos<\/h4>\n<table class=\"tb \"><thead><tr><th>Par<\/th><th>Uso<\/th><\/tr><\/thead><tbody><tr><td>por que / por quê / porque / porquê<\/td><td>Pergunta (início/meio) “Por que…?”; fim de frase “…por quê?”; resposta/explicação “porque”; substantivo “o porquê”<\/td><\/tr><tr><td>mal / mau<\/td><td>mal ↔ bem (advérbio); mau ↔ bom (adjetivo)<\/td><\/tr><tr><td>há / a<\/td><td>Há = tempo passado (“há dois anos”); a = futuro/distância (“daqui a dois anos”)<\/td><\/tr><tr><td>onde / aonde<\/td><td>Onde = lugar fixo (estar); aonde = movimento (ir a)<\/td><\/tr><tr><td>senão / se não<\/td><td>Senão = caso contrário/exceto; se não = caso não<\/td><\/tr><tr><td>afim / a fim de<\/td><td>Afim = semelhante; a fim de = finalidade<\/td><\/tr><tr><td>acerca de / há cerca de / a cerca de<\/td><td>Sobre / faz aproximadamente / a aproximadamente (distância)<\/td><\/tr><tr><td>mas / mais<\/td><td>Oposição / intensidade<\/td><\/tr><\/tbody><\/table>\n<h4>Tempos e modos verbais<\/h4>\n<ul class=\"\"><li><b>Indicativo<\/b> = certeza; <b>subjuntivo<\/b> = hipótese/desejo (que eu faça, se eu fizesse, quando eu fizer); <b>imperativo<\/b> = ordem.<\/li><li><b>Futuro do pretérito<\/b> (faria) = hipótese condicionada ou <b>atenuação/polidez<\/b>; em notícias, indica fato <b>não confirmado<\/b> (“o ataque <b>teria<\/b> partido de…”).<\/li><li><b>Pretérito imperfeito<\/b> (fazia) = ação contínua/habitual no passado; <b>perfeito<\/b> (fez) = ação concluída; <b>mais-que-perfeito<\/b> (fizera/tinha feito) = passado anterior a outro passado.<\/li><li>Correlação: “Se <b>houvesse<\/b> backup, <b>teríamos<\/b> recuperado” · “Quando <b>houver<\/b> alerta, <b>isolaremos<\/b>”.<\/li><li>Verbos derivados: intervir (como vir) → “ele <b>interveio<\/b>”; ver → “se ele <b>vir<\/b>” (futuro do subjuntivo), propor → “se ele <b>propuser<\/b>”, manter → “se ele <b>mantiver<\/b>”.<\/li><\/ul>\n<h4>Classes de palavras e significação<\/h4>\n<ul class=\"\"><li>“<b>Que<\/b>” pode ser pronome relativo (= o qual), conjunção integrante (introduz oração substantiva), conjunção explicativa/consecutiva, pronome interrogativo/advérbio de intensidade.<\/li><li>“<b>Se<\/b>” pode ser pronome apassivador, índice de indeterminação, reflexivo, conjunção condicional ou integrante.<\/li><li>Sinônimos <b>no contexto<\/b>: a banca pergunta o sentido da palavra <b>naquela frase<\/b> (polissemia). Denotação (literal) × conotação (figurado).<\/li><li>Parônimos: <b>descrição<\/b>/discrição, <b>ratificar<\/b> (confirmar)/retificar (corrigir), <b>eminente<\/b>/iminente, <b>infligir<\/b> (aplicar pena)/infringir (violar), <b>tráfego<\/b>/tráfico, <b>flagrante<\/b>/fragrante, <b>despensa<\/b>/dispensa.<\/li><\/ul>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU<\/div><div class=\"boxb\"><b>Ratificar = Reafirmar; Retificar = Reto/corrigir<\/b>. <b>Iminente = Imediato (vai acontecer); Eminente = Elevado<\/b>. <b>Infringir = Infração<\/b>.<\/div><\/div>\n"},{"id":"en1","mod":"Inglês","modTitle":"Módulo 4 — Português e Inglês","title":"Inglês — estratégia, conectores e armadilhas","prio":"Alta","html":"\n<p>10 questões, geralmente sobre 1–2 textos autênticos de imprensa/tecnologia (temas atuais: IA, cibersegurança, energia, ESG). No levantamento do TecConcursos com 1.346 questões de Inglês da Cesgranrio, <b>74% são de interpretação<\/b>; referência pronominal e reescrita/substituição somam ~18% — ver “Fontes”. Enunciados e alternativas costumam vir <b>em inglês<\/b>.<\/p>\n<ul class=\"\"><li><b>Ordem de ataque<\/b>: leia as perguntas → skimming (ideia geral: título, 1ª frase de cada parágrafo) → scanning (volte ao parágrafo da pergunta) → elimine alternativas.<\/li><li>Perguntas típicas: <i>main purpose<\/i> (propósito do texto), <i>according to the text<\/i>, <i>the word X in line Y refers to<\/i>, <i>can be replaced by<\/i>, <i>it can be inferred<\/i>, <i>the author's attitude<\/i>.<\/li><li><b>Referência<\/b>: <i>it, they, this, these, which, whose<\/i> → procure o substantivo <b>anterior<\/b> que concorda em número e faz sentido.<\/li><li><b>Extremos<\/b>: desconfie de <b>every, always, never, all, only, completely, guarantee, eliminate<\/b> — textos de cibersegurança são cautelosos (<i>may, can, could, likely, help reduce<\/i>).<\/li><\/ul>\n<table class=\"tb \"><thead><tr><th>Conector<\/th><th>Relação<\/th><th>Equivale a<\/th><\/tr><\/thead><tbody><tr><td><b>Although / Though / Even though<\/b><\/td><td><b>Concessão<\/b> (embora)<\/td><td>Despite / In spite of (+ substantivo/-ing)<\/td><\/tr><tr><td><b>However / Nevertheless / Yet / Still<\/b><\/td><td>Contraste (porém, contudo)<\/td><td>But<\/td><\/tr><tr><td><b>Whereas / While<\/b><\/td><td>Contraste entre dois fatos (enquanto)<\/td><td>On the other hand<\/td><\/tr><tr><td><b>Therefore / Thus / Hence / Consequently / As a result<\/b><\/td><td><b>Conclusão/consequência<\/b> (portanto)<\/td><td>So<\/td><\/tr><tr><td><b>Moreover / Furthermore / In addition / Besides<\/b><\/td><td>Adição (além disso)<\/td><td>Also<\/td><\/tr><tr><td><b>Because / Since / As / Due to (+ subst.)<\/b><\/td><td>Causa<\/td><td>Owing to<\/td><\/tr><tr><td><b>Unless<\/b><\/td><td>Condição negativa (a menos que)<\/td><td>If… not<\/td><\/tr><tr><td><b>In order to / So that<\/b><\/td><td>Finalidade<\/td><td>To<\/td><\/tr><tr><td><b>Instead of / Rather than<\/b><\/td><td>Substituição (em vez de)<\/td><td><\/td><\/tr><tr><td><b>Such as / For instance / e.g.<\/b><\/td><td>Exemplo<\/td><td><\/td><\/tr><\/tbody><\/table>\n<table class=\"tb \"><thead><tr><th>Falso cognato<\/th><th>Significa<\/th><th>Não significa<\/th><\/tr><\/thead><tbody><tr><td>actually<\/td><td>na verdade<\/td><td>atualmente (= currently)<\/td><\/tr><tr><td>eventually<\/td><td>finalmente, por fim<\/td><td>eventualmente<\/td><\/tr><tr><td>pretend<\/td><td>fingir<\/td><td>pretender (= intend)<\/td><\/tr><tr><td>assume<\/td><td>supor<\/td><td>assumir um cargo<\/td><\/tr><tr><td>sensible<\/td><td>sensato<\/td><td>sensível (= sensitive)<\/td><\/tr><tr><td>support<\/td><td>apoiar<\/td><td>suportar (= stand)<\/td><\/tr><tr><td>realize<\/td><td>perceber<\/td><td>realizar (= carry out)<\/td><\/tr><tr><td>exquisite<\/td><td>requintado<\/td><td>esquisito<\/td><\/tr><tr><td>data<\/td><td>dados<\/td><td>data (= date)<\/td><\/tr><tr><td>library<\/td><td>biblioteca<\/td><td>livraria (= bookstore)<\/td><\/tr><tr><td>attend<\/td><td>frequentar/comparecer<\/td><td>atender<\/td><\/tr><tr><td>push<\/td><td>empurrar<\/td><td>puxar (= pull)<\/td><\/tr><tr><td>policy<\/td><td>política (regra)<\/td><td>polícia (= police)<\/td><\/tr><tr><td>breach<\/td><td>violação (data breach)<\/td><td>brecha física<\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — Inglês do Allan<\/div><div class=\"boxb\"><b>“X is not a silver bullet”<\/b> = X <b>não é solução mágica/única<\/b> (ajuda, mas não resolve sozinho) — gabarito costuma ser algo como “should be combined with other measures”. <b>Desconfie de every/always/never<\/b>. <b>Although = concessão<\/b> (embora). <b>Therefore = conclusão<\/b> (portanto). <b>Whereas<\/b> = contraste. <b>Unless<\/b> = a menos que.<\/div><\/div>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO<\/div><div class=\"boxb\">Modais: <b>must<\/b> (obrigação/forte certeza), <b>should<\/b> (recomendação), <b>may/might<\/b> (possibilidade), <b>can<\/b> (capacidade/possibilidade), <b>could<\/b> (possibilidade menor/passado), <b>would<\/b> (hipótese). Trocar “may” por “must” muda o sentido — alternativa errada clássica. Phrasal verbs: <i>carry out<\/i> (realizar), <i>set up<\/i> (configurar), <i>shut down<\/i> (desligar), <i>roll out<\/i> (implantar), <i>phase out<\/i> (descontinuar), <i>look into<\/i> (investigar), <i>rule out<\/i> (descartar).<\/div><\/div>\n"},{"id":"en2","mod":"Inglês","modTitle":"Módulo 4 — Português e Inglês","title":"Glossário de inglês técnico de segurança","prio":"Alta","html":"<table class=\"tb small\"><thead><tr><th>Termo<\/th><th>Tradução<\/th><th>Termo<\/th><th>Tradução<\/th><\/tr><\/thead><tbody><tr><td><b>attack surface<\/b><\/td><td>superfície de ataque<\/td><td><b>rogue<\/b><\/td><td>não autorizado/falso<\/td><\/tr><tr><td><b>asset<\/b><\/td><td>ativo<\/td><td><b>safeguard<\/b><\/td><td>salvaguarda<\/td><\/tr><tr><td><b>awareness<\/b><\/td><td>conscientização<\/td><td><b>sandbox<\/b><\/td><td>ambiente isolado<\/td><\/tr><tr><td><b>backdoor<\/b><\/td><td>porta dos fundos<\/td><td><b>shortcoming<\/b><\/td><td>deficiência<\/td><\/tr><tr><td><b>baseline<\/b><\/td><td>linha de base<\/td><td><b>silver bullet<\/b><\/td><td>solução mágica<\/td><\/tr><tr><td><b>breach<\/b><\/td><td>violação/vazamento<\/td><td><b>spoof<\/b><\/td><td>falsificar<\/td><\/tr><tr><td><b>brute force<\/b><\/td><td>força bruta<\/td><td><b>stakeholder<\/b><\/td><td>parte interessada<\/td><\/tr><tr><td><b>business continuity<\/b><\/td><td>continuidade de negócios<\/td><td><b>supply chain<\/b><\/td><td>cadeia de suprimentos<\/td><\/tr><tr><td><b>compliance<\/b><\/td><td>conformidade<\/td><td><b>tamper<\/b><\/td><td>adulterar<\/td><\/tr><tr><td><b>countermeasure<\/b><\/td><td>contramedida<\/td><td><b>threat actor<\/b><\/td><td>agente de ameaça<\/td><\/tr><tr><td><b>credential stuffing<\/b><\/td><td>reuso de credenciais vazadas<\/td><td><b>threat hunting<\/b><\/td><td>caça a ameaças<\/td><\/tr><tr><td><b>data at rest / in transit<\/b><\/td><td>dados em repouso / em trânsito<\/td><td><b>thwart<\/b><\/td><td>frustrar/impedir<\/td><\/tr><tr><td><b>deploy / deployment<\/b><\/td><td>implantar / implantação<\/td><td><b>trade-off<\/b><\/td><td>compromisso/escolha com custo<\/td><\/tr><tr><td><b>downtime<\/b><\/td><td>tempo de inatividade<\/td><td><b>unauthorized<\/b><\/td><td>não autorizado<\/td><\/tr><tr><td><b>eavesdropping<\/b><\/td><td>escuta clandestina<\/td><td><b>upgrade<\/b><\/td><td>atualizar (versão)<\/td><\/tr><tr><td><b>enforce<\/b><\/td><td>fazer cumprir/aplicar<\/td><td><b>vulnerability disclosure<\/b><\/td><td>divulgação de vulnerabilidade<\/td><\/tr><tr><td><b>exploit (n./v.)<\/b><\/td><td>código de exploração / explorar<\/td><td><b>weakness<\/b><\/td><td>fraqueza<\/td><\/tr><tr><td><b>flaw<\/b><\/td><td>falha<\/td><td><b>wipe<\/b><\/td><td>apagar completamente<\/td><\/tr><tr><td><b>foothold<\/b><\/td><td>ponto de apoio (acesso inicial)<\/td><td><b>zero-day<\/b><\/td><td>dia zero (falha sem correção)<\/td><\/tr><tr><td><b>forensics<\/b><\/td><td>perícia/forense<\/td><td><b>whereas<\/b><\/td><td>ao passo que<\/td><\/tr><tr><td><b>gap<\/b><\/td><td>lacuna<\/td><td><b>hence<\/b><\/td><td>daí/portanto<\/td><\/tr><tr><td><b>hardening<\/b><\/td><td>endurecimento (configuração segura)<\/td><td><b>albeit<\/b><\/td><td>embora<\/td><\/tr><tr><td><b>harvest<\/b><\/td><td>coletar (ex.: credenciais)<\/td><td><b>unless<\/b><\/td><td>a menos que<\/td><\/tr><tr><td><b>incident response<\/b><\/td><td>resposta a incidentes<\/td><td><b>likewise<\/b><\/td><td>da mesma forma<\/td><\/tr><tr><td><b>insider threat<\/b><\/td><td>ameaça interna<\/td><td><b>so far<\/b><\/td><td>até agora<\/td><\/tr><tr><td><b>lateral movement<\/b><\/td><td>movimento lateral<\/td><td><b>to rely on<\/b><\/td><td>depender de/confiar em<\/td><\/tr><tr><td><b>leak<\/b><\/td><td>vazamento<\/td><td><b>to carry out<\/b><\/td><td>realizar<\/td><\/tr><tr><td><b>likelihood<\/b><\/td><td>probabilidade<\/td><td><b>to roll out<\/b><\/td><td>implantar<\/td><\/tr><tr><td><b>mitigate<\/b><\/td><td>mitigar<\/td><td><b>to shut down<\/b><\/td><td>desligar<\/td><\/tr><tr><td><b>outage<\/b><\/td><td>interrupção/queda<\/td><td><b>to phase out<\/b><\/td><td>descontinuar gradualmente<\/td><\/tr><tr><td><b>patch<\/b><\/td><td>correção<\/td><td><b>to rule out<\/b><\/td><td>descartar<\/td><\/tr><tr><td><b>payload<\/b><\/td><td>carga útil<\/td><td><b>to look into<\/b><\/td><td>investigar<\/td><\/tr><tr><td><b>phishing lure<\/b><\/td><td>isca de phishing<\/td><td><b>to set up<\/b><\/td><td>configurar<\/td><\/tr><tr><td><b>privilege escalation<\/b><\/td><td>escalação de privilégio<\/td><td><b>to take over<\/b><\/td><td>assumir controle<\/td><\/tr><tr><td><b>ransom<\/b><\/td><td>resgate<\/td><td><b>to break into<\/b><\/td><td>invadir<\/td><\/tr><tr><td><b>remediation<\/b><\/td><td>correção/saneamento<\/td><td><b>to keep up with<\/b><\/td><td>acompanhar<\/td><\/tr><\/tbody><\/table>"},{"id":"le1","mod":"Inglês","modTitle":"Leitura em Inglês (textos reais)","title":"Text 1 — MFA resistente a phishing","prio":"Alta","html":"<div class=\"texto\"><p class=\"tt\">Text 1 — MFA resistente a phishing (texto real)<\/p><p>MFA is a security control that requires a user to present a combination of two or more different authenticators (something you know, something you have, or something you are) to verify their identity for login. MFA makes it more difficult for cyber threat actors to gain access to networks and information systems if passwords or personal identification numbers (PINs) are compromised through phishing attacks or other means. With MFA enabled, if one factor, such as a password, becomes compromised, unauthorized users will be unable to access the account if they cannot also provide the second factor. This additional layer ultimately stops some of the common malicious cyber techniques, such as password spraying.<\/p><p>CISA has consistently urged organizations to implement MFA for all users and for all services, including email, file sharing, and financial account access. However, not all forms of MFA are equally secure. Some forms are vulnerable to phishing, &quot;push bombing&quot; attacks, exploitation of Signaling System 7 (SS7) protocol vulnerabilities, and/or SIM Swap attacks. These attacks, if successful, may allow a threat actor to gain access to MFA authentication credentials or bypass MFA.<\/p><p>While any form of MFA is better than no MFA and will reduce an organization&#x27;s attack surface, phishing-resistant MFA is the gold standard and organizations should make migrating to it a high priority effort. CISA strongly urges all organizations to implement phishing-resistant MFA as part of applying Zero Trust principles.<\/p><p class=\"small\">Fonte: CISA — Implementing Phishing-Resistant MFA (fact sheet, Oct 2022) — <a href=\"https://www.cisa.gov/sites/default/files/publications/fact-sheet-implementing-phishing-resistant-mfa-508c.pdf\" target=\"_blank\" rel=\"noopener\">https://www.cisa.gov/sites/default/files/publications/fact-sheet-implementing-phishing-resistant-mfa-508c.pdf<\/a><\/p><\/div><h4>Vocabulário<\/h4><table class=\"tb\"><thead><tr><th>Termo<\/th><th>Tradução<\/th><\/tr><\/thead><tbody><tr><td><b>MFA<\/b><\/td><td>autenticação multifator<\/td><\/tr><tr><td><b>authenticator<\/b><\/td><td>autenticador<\/td><\/tr><tr><td><b>compromised<\/b><\/td><td>comprometido<\/td><\/tr><tr><td><b>password spraying<\/b><\/td><td>spray de senhas<\/td><\/tr><tr><td><b>push bombing<\/b><\/td><td>bombardeio de push<\/td><\/tr><tr><td><b>SIM Swap<\/b><\/td><td>troca fraudulenta de chip<\/td><\/tr><tr><td><b>phishing-resistant<\/b><\/td><td>resistente a phishing<\/td><\/tr><tr><td><b>gold standard<\/b><\/td><td>padrão ouro<\/td><\/tr><tr><td><b>attack surface<\/b><\/td><td>superfície de ataque<\/td><\/tr><\/tbody><\/table><div class=\"box bizu\"><div class=\"boxh\">Conectivos do texto<\/div><div class=\"boxb\">However, if, such as, While<\/div><\/div>","fonte":"CISA — Implementing Phishing-Resistant MFA (fact sheet, Oct 2022)","url":"https://www.cisa.gov/sites/default/files/publications/fact-sheet-implementing-phishing-resistant-mfa-508c.pdf"},{"id":"le2","mod":"Inglês","modTitle":"Leitura em Inglês (textos reais)","title":"Text 2 — Zero Trust — abstract","prio":"Alta","html":"<div class=\"texto\"><p class=\"tt\">Text 2 — Zero Trust — abstract (texto real)<\/p><p>Zero trust (ZT) is the term for an evolving set of cybersecurity paradigms that move defenses from static, network-based perimeters to focus on users, assets, and resources. A zero trust architecture (ZTA) uses zero trust principles to plan industrial and enterprise infrastructure and workflows. Zero trust assumes there is no implicit trust granted to assets or user accounts based solely on their physical or network location (i.e., local area networks versus the internet) or based on asset ownership (enterprise or personally owned). Authentication and authorization (both subject and device) are discrete functions performed before a session to an enterprise resource is established. Zero trust is a response to enterprise network trends that include remote users, bring your own device (BYOD), and cloud-based assets that are not located within an enterprise-owned network boundary. Zero trust focuses on protecting resources (assets, services, workflows, network accounts, etc.), not network segments, as the network location is no longer seen as the prime component to the security posture of the resource. This document contains an abstract definition of zero trust architecture (ZTA) and gives general deployment models and use cases where zero trust could improve an enterprise&#x27;s overall information technology security posture.<\/p><p class=\"small\">Fonte: NIST SP 800-207 — Zero Trust Architecture (Aug 2020), Abstract — <a href=\"https://doi.org/10.6028/NIST.SP.800-207\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.6028/NIST.SP.800-207<\/a><\/p><\/div><h4>Vocabulário<\/h4><table class=\"tb\"><thead><tr><th>Termo<\/th><th>Tradução<\/th><\/tr><\/thead><tbody><tr><td><b>perimeter<\/b><\/td><td>perímetro<\/td><\/tr><tr><td><b>implicit trust<\/b><\/td><td>confiança implícita<\/td><\/tr><tr><td><b>asset ownership<\/b><\/td><td>propriedade do ativo<\/td><\/tr><tr><td><b>authentication<\/b><\/td><td>autenticação<\/td><\/tr><tr><td><b>authorization<\/b><\/td><td>autorização<\/td><\/tr><tr><td><b>discrete<\/b><\/td><td>distinto/separado<\/td><\/tr><tr><td><b>BYOD<\/b><\/td><td>traga seu próprio dispositivo<\/td><\/tr><tr><td><b>security posture<\/b><\/td><td>postura de segurança<\/td><\/tr><\/tbody><\/table><div class=\"box bizu\"><div class=\"boxh\">Conectivos do texto<\/div><div class=\"boxb\">based solely on, i.e., before, as<\/div><\/div>","fonte":"NIST SP 800-207 — Zero Trust Architecture (Aug 2020), Abstract","url":"https://doi.org/10.6028/NIST.SP.800-207"},{"id":"le3","mod":"Inglês","modTitle":"Leitura em Inglês (textos reais)","title":"Text 3 — ENISA Threat Landscape — ameaças principais","prio":"Alta","html":"<div class=\"texto\"><p class=\"tt\">Text 3 — ENISA Threat Landscape — ameaças principais (texto real)<\/p><p>In its eleventh edition, the ENISA Threat Landscape (ETL) report offers a broad overview of the cybersecurity threat landscape. Over time, the ETL has served as a crucial tool for comprehending the present state of cybersecurity within the European Union (EU), furnishing insights into trends and patterns. Throughout the latter part of 2022 and the initial half of 2023, there was a notable escalation in cybersecurity attacks, setting new benchmarks in both the variety and number of incidents, as well as their consequences. The phenomenon of hacktivism has seen steady expansion, marked by the emergence of numerous new groups. Concurrently, it was observed that a rise of ransomware groups took place, with the first half of 2023 witnessing an unprecedented surge in ransomware incidents, a trend that shows no signs of abating.<\/p><p>According to the findings detailed in this report, the ENISA Threat Landscape 2023 report highlights eight prime threat groups. Ransomware is defined as a type of attack where threat actors take control of a target&#x27;s assets and demand a ransom in exchange for the return of the asset&#x27;s availability. This action-agnostic definition is needed to cover the changing ransomware threat landscape, the prevalence of multiple extortion techniques and the various goals, other than solely financial gains, of the perpetrators. Social engineering encompasses a broad range of activities that attempt to exploit human error or human behaviour with the objective of gaining access to information or services. Although the lures and tricks used may abuse technology, they rely on a human element to be successful.<\/p><p class=\"small\">Fonte: ENISA Threat Landscape 2023 (Oct 2023), §1 Threat Landscape Overview / Prime Threats — <a href=\"https://www.enisa.europa.eu/publications/enisa-threat-landscape-2023\" target=\"_blank\" rel=\"noopener\">https://www.enisa.europa.eu/publications/enisa-threat-landscape-2023<\/a><\/p><\/div><h4>Vocabulário<\/h4><table class=\"tb\"><thead><tr><th>Termo<\/th><th>Tradução<\/th><\/tr><\/thead><tbody><tr><td><b>threat landscape<\/b><\/td><td>panorama de ameaças<\/td><\/tr><tr><td><b>escalation<\/b><\/td><td>escalada/aumento<\/td><\/tr><tr><td><b>hacktivism<\/b><\/td><td>hacktivismo<\/td><\/tr><tr><td><b>surge<\/b><\/td><td>surto/disparada<\/td><\/tr><tr><td><b>abating<\/b><\/td><td>diminuindo<\/td><\/tr><tr><td><b>ransom<\/b><\/td><td>resgate<\/td><\/tr><tr><td><b>extortion<\/b><\/td><td>extorsão<\/td><\/tr><tr><td><b>perpetrators<\/b><\/td><td>autores/perpetradores<\/td><\/tr><tr><td><b>lures<\/b><\/td><td>iscas<\/td><\/tr><\/tbody><\/table><div class=\"box bizu\"><div class=\"boxh\">Conectivos do texto<\/div><div class=\"boxb\">as well as, Concurrently, Although, other than<\/div><\/div>","fonte":"ENISA Threat Landscape 2023 (Oct 2023), §1 Threat Landscape Overview / Prime Threats","url":"https://www.enisa.europa.eu/publications/enisa-threat-landscape-2023"},{"id":"le4","mod":"Inglês","modTitle":"Leitura em Inglês (textos reais)","title":"Text 4 — Resposta a incidentes (NIST SP 800-61r3)","prio":"Alta","html":"<div class=\"texto\"><p class=\"tt\">Text 4 — Resposta a incidentes (NIST SP 800-61r3) (texto real)<\/p><p>Incident response is a critical part of cybersecurity risk management and should be integrated across organizational operations. All six NIST Cybersecurity Framework (CSF) 2.0 Functions play vital roles in incident response:\n• Govern, Identify, and Protect help organizations prevent some incidents, prepare to handle incidents that do occur, reduce the impact of those incidents, and improve incident response and cybersecurity risk management practices based on lessons learned from those incidents.\n• Detect, Respond, and Recover help organizations discover, manage, prioritize, contain, eradicate, and recover from cybersecurity incidents, as well as perform incident reporting, notification, and other incident-related communications.<\/p><p>Many individuals, teams, and third parties hold a wide variety of roles and responsibilities across all of the Functions that support an organization&#x27;s incident response. Organizations have no direct control over the tactics and techniques used by their adversaries, nor are they certain about the timing of a future incident other than knowing that another incident is inevitable. However, organizations can use an incident response life cycle framework or model that best suits them to develop strong cybersecurity risk management practices that reduce their risks to acceptable levels.<\/p><p>Organizations should use the incident response life cycle framework or model that suits them best. Regardless of the model used, every organization should take incident response into consideration throughout their cybersecurity risk management activities.<\/p><p class=\"small\">Fonte: NIST SP 800-61r3 — Incident Response Recommendations (Apr 2025), Executive Summary — <a href=\"https://doi.org/10.6028/NIST.SP.800-61r3\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.6028/NIST.SP.800-61r3<\/a><\/p><\/div><h4>Vocabulário<\/h4><table class=\"tb\"><thead><tr><th>Termo<\/th><th>Tradução<\/th><\/tr><\/thead><tbody><tr><td><b>incident response<\/b><\/td><td>resposta a incidentes<\/td><\/tr><tr><td><b>lessons learned<\/b><\/td><td>lições aprendidas<\/td><\/tr><tr><td><b>contain / eradicate<\/b><\/td><td>conter / erradicar<\/td><\/tr><tr><td><b>adversaries<\/b><\/td><td>adversários<\/td><\/tr><tr><td><b>inevitable<\/b><\/td><td>inevitável<\/td><\/tr><tr><td><b>life cycle<\/b><\/td><td>ciclo de vida<\/td><\/tr><tr><td><b>acceptable levels<\/b><\/td><td>níveis aceitáveis<\/td><\/tr><\/tbody><\/table><div class=\"box bizu\"><div class=\"boxh\">Conectivos do texto<\/div><div class=\"boxb\">based on, as well as, However, Regardless of<\/div><\/div>","fonte":"NIST SP 800-61r3 — Incident Response Recommendations (Apr 2025), Executive Summary","url":"https://doi.org/10.6028/NIST.SP.800-61r3"},{"id":"le5","mod":"Inglês","modTitle":"Leitura em Inglês (textos reais)","title":"Text 5 — NIST CSF 2.0","prio":"Alta","html":"<div class=\"texto\"><p class=\"tt\">Text 5 — NIST CSF 2.0 (texto real)<\/p><p>The Cybersecurity Framework (CSF) 2.0 is designed to help organizations of all sizes and sectors — including industry, government, academia, and nonprofit — to manage and reduce their cybersecurity risks. It is useful regardless of the maturity level and technical sophistication of an organization&#x27;s cybersecurity programs. Nevertheless, the CSF does not embrace a one-size-fits-all approach. Each organization has both common and unique risks, as well as varying risk appetites and tolerances, specific missions, and objectives to achieve those missions. By necessity, the way organizations implement the CSF will vary.<\/p><p>Ideally, the CSF will be used to address cybersecurity risks alongside other risks of the enterprise, including those that are financial, privacy, supply chain, reputational, technological, or physical in nature.<\/p><p>The CSF describes desired outcomes that are intended to be understood by a broad audience, including executives, managers, and practitioners, regardless of their cybersecurity expertise. Because these outcomes are sector-, country-, and technology-neutral, they provide an organization with the flexibility needed to address their unique risks, technologies, and mission considerations. Building on previous versions, CSF 2.0 contains new features that highlight the importance of governance and supply chains.<\/p><p class=\"small\">Fonte: NIST CSWP 29 — The NIST Cybersecurity Framework (CSF) 2.0 (Feb 2024), Preface — <a href=\"https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf\" target=\"_blank\" rel=\"noopener\">https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf<\/a><\/p><\/div><h4>Vocabulário<\/h4><table class=\"tb\"><thead><tr><th>Termo<\/th><th>Tradução<\/th><\/tr><\/thead><tbody><tr><td><b>regardless of<\/b><\/td><td>independentemente de<\/td><\/tr><tr><td><b>maturity level<\/b><\/td><td>nível de maturidade<\/td><\/tr><tr><td><b>one-size-fits-all<\/b><\/td><td>tamanho único<\/td><\/tr><tr><td><b>risk appetite<\/b><\/td><td>apetite a risco<\/td><\/tr><tr><td><b>alongside<\/b><\/td><td>juntamente com<\/td><\/tr><tr><td><b>supply chain<\/b><\/td><td>cadeia de suprimentos<\/td><\/tr><tr><td><b>outcomes<\/b><\/td><td>resultados desejados<\/td><\/tr><tr><td><b>governance<\/b><\/td><td>governança<\/td><\/tr><\/tbody><\/table><div class=\"box bizu\"><div class=\"boxh\">Conectivos do texto<\/div><div class=\"boxb\">Nevertheless, as well as, Because, Ideally<\/div><\/div>","fonte":"NIST CSWP 29 — The NIST Cybersecurity Framework (CSF) 2.0 (Feb 2024), Preface","url":"https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf"},{"id":"le6","mod":"Inglês","modTitle":"Leitura em Inglês (textos reais)","title":"Text 6 — OWASP — Broken Access Control","prio":"Alta","html":"<div class=\"texto\"><p class=\"tt\">Text 6 — OWASP — Broken Access Control (texto real)<\/p><p>Access control enforces policy such that users cannot act outside of their intended permissions. Failures typically lead to unauthorized information disclosure, modification, or destruction of all data or performing a business function outside the user&#x27;s limits. Common access control vulnerabilities include:<\/p><p>Violation of the principle of least privilege or deny by default, where access should only be granted for particular capabilities, roles, or users, but is available to anyone. Bypassing access control checks by modifying the URL (parameter tampering or force browsing), internal application state, or the HTML page, or by using an attack tool modifying API requests. Permitting viewing or editing someone else&#x27;s account, by providing its unique identifier (insecure direct object references). Accessing API with missing access controls for POST, PUT and DELETE. Elevation of privilege. Acting as a user without being logged in or acting as an admin when logged in as a user. Metadata manipulation, such as replaying or tampering with a JSON Web Token (JWT) access control token, or a cookie or hidden field manipulated to elevate privileges. CORS misconfiguration allows API access from unauthorized or untrusted origins. Force browsing to authenticated pages as an unauthenticated user or to privileged pages as a standard user.<\/p><p>Access control is only effective in trusted server-side code or server-less API, where the attacker cannot modify the access control check or metadata. Except for public resources, deny by default.<\/p><p class=\"small\">Fonte: OWASP Top 10:2021 — A01 Broken Access Control — <a href=\"https://owasp.org/Top10/A01_2021-Broken_Access_Control/\" target=\"_blank\" rel=\"noopener\">https://owasp.org/Top10/A01_2021-Broken_Access_Control/<\/a><\/p><\/div><h4>Vocabulário<\/h4><table class=\"tb\"><thead><tr><th>Termo<\/th><th>Tradução<\/th><\/tr><\/thead><tbody><tr><td><b>least privilege<\/b><\/td><td>menor privilégio<\/td><\/tr><tr><td><b>deny by default<\/b><\/td><td>nega por padrão<\/td><\/tr><tr><td><b>parameter tampering<\/b><\/td><td>adulteração de parâmetro<\/td><\/tr><tr><td><b>IDOR<\/b><\/td><td>referência insegura a objeto<\/td><\/tr><tr><td><b>elevation of privilege<\/b><\/td><td>elevação de privilégio<\/td><\/tr><tr><td><b>tampering<\/b><\/td><td>adulteração<\/td><\/tr><tr><td><b>CORS<\/b><\/td><td>compartilhamento entre origens<\/td><\/tr><tr><td><b>server-side<\/b><\/td><td>lado do servidor<\/td><\/tr><\/tbody><\/table><div class=\"box bizu\"><div class=\"boxh\">Conectivos do texto<\/div><div class=\"boxb\">such that, or, where, Except for<\/div><\/div>","fonte":"OWASP Top 10:2021 — A01 Broken Access Control","url":"https://owasp.org/Top10/A01_2021-Broken_Access_Control/"},{"id":"le7","mod":"Inglês","modTitle":"Leitura em Inglês (textos reais)","title":"Text 7 — OWASP — Injection","prio":"Alta","html":"<div class=\"texto\"><p class=\"tt\">Text 7 — OWASP — Injection (texto real)<\/p><p>An application is vulnerable to attack when: user-supplied data is not validated, filtered, or sanitized by the application; dynamic queries or non-parameterized calls without context-aware escaping are used directly in the interpreter; hostile data is used within object-relational mapping (ORM) search parameters to extract additional, sensitive records; or hostile data is directly used or concatenated. The SQL or command contains the structure and malicious data in dynamic queries, commands, or stored procedures.<\/p><p>Some of the more common injections are SQL, NoSQL, OS command, Object Relational Mapping (ORM), LDAP, and Expression Language (EL) or Object Graph Navigation Library (OGNL) injection. The concept is identical among all interpreters. Source code review is the best method of detecting if applications are vulnerable to injections. Automated testing of all parameters, headers, URL, cookies, JSON, SOAP, and XML data inputs is strongly encouraged. Organizations can include static (SAST), dynamic (DAST), and interactive (IAST) application security testing tools into the CI/CD pipeline to identify introduced injection flaws before production deployment.<\/p><p>Preventing injection requires keeping data separate from commands and queries. The preferred option is to use a safe API, which avoids using the interpreter entirely, provides a parameterized interface, or migrates to Object Relational Mapping Tools (ORMs). Use positive server-side input validation. This is not a complete defense as many applications require special characters.<\/p><p class=\"small\">Fonte: OWASP Top 10:2021 — A03 Injection — <a href=\"https://owasp.org/Top10/A03_2021-Injection/\" target=\"_blank\" rel=\"noopener\">https://owasp.org/Top10/A03_2021-Injection/<\/a><\/p><\/div><h4>Vocabulário<\/h4><table class=\"tb\"><thead><tr><th>Termo<\/th><th>Tradução<\/th><\/tr><\/thead><tbody><tr><td><b>sanitized<\/b><\/td><td>sanitizado<\/td><\/tr><tr><td><b>parameterized<\/b><\/td><td>parametrizado<\/td><\/tr><tr><td><b>hostile data<\/b><\/td><td>dados hostis<\/td><\/tr><tr><td><b>concatenated<\/b><\/td><td>concatenado<\/td><\/tr><tr><td><b>interpreter<\/b><\/td><td>interpretador<\/td><\/tr><tr><td><b>SAST/DAST/IAST<\/b><\/td><td>testes estático/dinâmico/interativo<\/td><\/tr><tr><td><b>CI/CD pipeline<\/b><\/td><td>pipeline CI/CD<\/td><\/tr><tr><td><b>positive validation<\/b><\/td><td>valida
