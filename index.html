function lastAns(id){ const a = S.answers[id]; return a && a.length ? a[a.length-1] : null; }
function modStats(){
  const st = {}; MODS.forEach(m => st[m] = {ok:0, n:0});
  for(const id in S.answers){ const q = Q[id]; if(!q || !st[q.mod]) continue; S.answers[id].forEach(a => { st[q.mod].n++; if(a.ok) st[q.mod].ok++; }); }
  return st;
}
function topicStats(){ const st = {}; for(const id in S.answers){ const q = Q[id]; if(!q || !q.topic || !TOP[q.topic]) continue; const s = st[q.topic] = st[q.topic] || {ok:0,n:0}; S.answers[id].forEach(a => { s.n++; if(a.ok) s.ok++; }); } return st; }
function streak(){ let k = dk(), n = 0; if(!S.days[k]) k = addDays(k, -1); while(S.days[k]){ n++; k = addDays(k, -1); } return n; }
function scoreSim(sim, ans){
  const r = {area:{}, ok:0}; Object.keys(D.areas).forEach(a => r.area[a] = {ok:0, n:0});
  sim.questions.forEach(q => { const A = r.area[q.area]; A.n++; if(ans[q.n] === q.ans){ A.ok++; r.ok++; } });
  r.ger = r.area.PT.ok + r.area.EN.ok; r.esp = r.area.OF.ok + r.area.DF.ok + r.area.CP.ok;
  const e = D.meta.eliminacao; r.elim = [];
  if(r.esp < e.especificosMin) r.elim.push(`Específicos ${r.esp} < ${e.especificosMin}`);
  if(r.ger < e.geraisMin) r.elim.push(`Gerais ${r.ger} < ${e.geraisMin}`);
  if(r.area.PT.ok < e.ptMin) r.elim.push('zero em Português');
  if(r.area.EN.ok < e.enMin) r.elim.push('zero em Inglês');
  r.total = r.esp + r.ger; r.blank = sim.questions.filter(q => !ans[q.n]).length; return r;
}

/* ---------- caderno de erros ---------- */
function addError(id){
  const e = S.errors[id];
  if(!e) S.errors[id] = {added:dk(), reason:'', stage:0, due:addDays(dk(), 1), wrongs:1, done:false};
  else Object.assign(e, {stage:0, due:addDays(dk(), 1), wrongs:(e.wrongs||1)+1, done:false, last:dk()});
}
function reviewOk(id){ const e = S.errors[id]; if(!e || e.done || e.due > dk()) return false; e.stage++; e.last = dk(); if(e.stage >= STAGES.length){ e.done = true; e.due = null; } else e.due = addDays(dk(), STAGES[e.stage]); return true; }
function dueErrors(){ const t = dk(); return Object.keys(S.errors).filter(id => Q[id] && !S.errors[id].done && S.errors[id].due <= t); }
/* erros das rodadas diárias (planilha) — sem enunciado, só registro + BIZU */
let RODS = [];
function rodSt(r){ return (S.rod = S.rod || {})[r.id] || {stage:0, due:addDays(r.date, 1), done:false}; }
function dueRod(){ const t = dk(); return RODS.filter(r => !r.ok && !rodSt(r).done && rodSt(r).due <= t); }
function rodOk(r){ const e = Object.assign({}, rodSt(r)); e.stage++; e.last = dk(); if(e.stage >= STAGES.length){ e.done = true; e.due = null; } else e.due = addDays(dk(), STAGES[e.stage]); S.rod[r.id] = e; activity(); save(); }
function recordAnswer(q, choice, ctx){
  const ok = choice === q.ans; (S.answers[q.id] = S.answers[q.id] || []).push({t:Date.now(), c:choice, ok, ctx});
  let msg = '';
  if(!ok){ addError(q.id); msg = 'Entrou no caderno de erros · revisar amanhã'; }
  else if(reviewOk(q.id)) msg = S.errors[q.id].done ? 'Erro dominado: saiu da fila de revisão 🎉' : `Revisão ok · próxima em ${STAGES[S.errors[q.id].stage]} dias`;
  if(typeof editalOnAnswer === 'function') editalOnAnswer(q, ok);
  activity(); save(); return {ok, msg};
}

function corteFonte(){
  const st = {};
  MODS.forEach(m => st[m] = {ok:0, n:0});
  const base = modStats();
  MODS.forEach(m => { st[m].ok = base[m].ok; st[m].n = base[m].n; });
  const map = {pt:'Português', en:'Inglês', of:'Ofensiva', df:'Defensiva', cp:'Compliance'};
  EDITAL_ITENS.forEach(it => {
    const mod = map[it.id.split('-')[0]];
    if(!mod || !st[mod]) return;
    const e = editalRead(it.id);
    let appN = 0, appOk = 0;
    (it.quiz || []).forEach(topic => {
      for(const id in S.answers){
        const q = Q[id];
        if(!q || q.topic !== topic) continue;
        (S.answers[id] || []).forEach(a => { appN++; if(a.ok) appOk++; });
      }
    });
    const extraN = Math.max(0, e.q - appN);
    const extraOk = Math.max(0, Math.min(extraN, e.ok - appOk));
    st[mod].n += extraN; st[mod].ok += extraOk;
  });
  return st;
}
function corteAlvo(){
  const d = corteFonte();
  const sum = names => names.reduce((a, m) => ({ok:a.ok + d[m].ok, n:a.n + d[m].n}), {ok:0, n:0});
  const child = names => {
    const known = names.filter(m => d[m].n > 0).sort((a, b) => pct(d[a].ok, d[a].n) - pct(d[b].ok, d[b].n));
    return known[0] || names[0];
  };
  const items = MODS.map(m => ({key:m, label:m, train:m, kind:'matéria', ok:d[m].ok, n:d[m].n})).concat([
    {key:'Específicos', label:'Específicos', train:child(ESP), kind:'bloco', ok:sum(ESP).ok, n:sum(ESP).n},

const NEW_PER_DAY = 20;
const cs = id => S.cards[id];
function dueCards(){ const now = Date.now(), due = D.flashcards.filter(c => cs(c.id) && cs(c.id).due <= now), left = Math.max(0, NEW_PER_DAY - (S.newToday[dk()] || 0));
  return due.concat(D.flashcards.filter(c => !cs(c.id)).slice(0, left)); }
function nextIv(p, g){ if(g === 1) return p.reps === 0 ? 1 : Math.max(p.iv + 1, Math.round(p.iv * 1.2)); return p.reps === 0 ? 3 : p.reps === 1 ? 7 : Math.round(Math.max(p.iv, 1) * p.ef); }
function schedule(c, g){
  const prev = cs(c.id), st = prev ? Object.assign({}, prev) : {ef:2.5, iv:0, reps:0, lapses:0};
  if(!prev) S.newToday[dk()] = (S.newToday[dk()] || 0) + 1;
  if(g === 0){ st.reps = 0; st.iv = 0; st.lapses++; st.ef = Math.max(1.3, st.ef - 0.2); st.due = Date.now() + 60000; }
  else { st.iv = nextIv(st, g); st.ef = g === 1 ? Math.max(1.3, st.ef - 0.15) : Math.min(3, st.ef + 0.1); st.reps++; st.due = parseDk(addDays(dk(), st.iv)).getTime() + 4 * 3600e3; }
  st.last = Date.now(); S.cards[c.id] = st; activity(); save();
}
function preview(c, g){ if(g === 0) return '1 min'; const iv = nextIv(cs(c.id) || {ef:2.5, iv:0, reps:0}, g); return iv + (iv === 1 ? ' dia' : ' dias'); }

/* Plano dia a dia: 03/11/2026 até a prova de 06/12/2026.
   Minutos cabem nas horas do dia (3h útil / 5h fim de semana, editável).
   O checkbox "feito" fica em S.plano e entra na união da sincronização. */
function pParse(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); }
function pISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function pAdd(k, n){ const d = pParse(k); d.setDate(d.getDate()+n); return pISO(d); }
function pFmt(k){ const d = pParse(k); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }
function pWe(k){ const d = pParse(k).getDay(); return d === 0 || d === 6; }
function pWd(k){ return ['dom','seg','ter','qua','qui','sex','sáb'][pParse(k).getDay()]; }
function pMonday(k){ const d = pParse(k).getDay(); return pAdd(k, d === 0 ? -6 : 1 - d); }
function pRange(a, b){ const o = []; for(let k = a; k <= b; k = pAdd(k, 1)) o.push(k); return o; }
function planoHoras(){
  const h = (typeof S !== 'undefined' && S.planoH) || {};
  let sem = Number(h.sem), fim = Number(h.fim);
  if(!(sem >= 1 && sem <= 12)) sem = 3;
  if(!(fim >= 1 && fim <= 12)) fim = 5;
  return {sem:sem, fim:fim, t:h.t || 0};
}
function planoBudget(date, horas){
  if(date >= '2026-12-06') return 0;
  if(date === '2026-12-01') return Math.min(120, Math.round(horas.sem * 60));
  if(date === '2026-12-05') return Math.min(150, Math.round(horas.fim * 60 * 0.5));
  return Math.round((pWe(date) ? horas.fim : horas.sem) * 60);
}
function planoFit(blocks, budget, locks){
  locks = locks || {};
  let locked = 0;
  blocks.forEach(b => { if(locks[b.id]) locked += locks[b.id]; });
  const flexB = blocks.filter(b => !locks[b.id]);
  const flex = Math.max(0, budget - locked);
  const w = flexB.reduce((s, b) => s + (b.w || 1), 0) || 1;
  let acc = 0;
  flexB.forEach((b, i) => {
    if(i === flexB.length - 1) b.min = Math.max(15, flex - acc);
    else { b.min = Math.max(15, Math.round(flex * (b.w || 1) / w)); acc += b.min; }
  });
  blocks.forEach(b => { if(locks[b.id]) b.min = locks[b.id]; });
  if(flexB.length && flexB.reduce((s, b) => s + b.min, 0) + locked !== budget && budget > 0){
    const drift = budget - (blocks.reduce((s, b) => s + b.min, 0));
    flexB[flexB.length - 1].min = Math.max(15, flexB[flexB.length - 1].min + drift);
  }
}

function planoReprogramar(horas, moves, done, today){
  const base = buildPlano(horas, moves || {ids:{}});
  const blocks = [];
  base.forEach(d => d.blocks.forEach(b => blocks.push(b)));
  const late = blocks.filter(b => b.tipo !== 'marco' && !done[b.id] && b.date < today);
  const lateIds = {};
  late.forEach(b => { lateIds[b.id] = 1; });
  const count = {};
  blocks.forEach(b => { if(!lateIds[b.id]) count[b.date] = (count[b.date] || 0) + 1; });
  const ids = Object.assign({}, (moves && moves.ids) || {});
  Object.keys(lateIds).forEach(k => { delete ids[k]; });
  let day = today < '2026-11-03' ? '2026-11-03' : (today > '2026-12-05' ? '2026-12-05' : today);
  late.forEach(b => {
    while(day < '2026-12-05' && (count[day] || 0) >= 4) day = pAdd(day, 1);
    ids[b.id] = day;
    count[day] = (count[day] || 0) + 1;
  });
  return {t:Date.now(), ids:ids, n:late.length};
}

}

function teoriaDoBloco(b){
  const T = teoriaCatalogo(); if(!T || !b) return null;
  const id = b.id || '';
  if(id === 'df2a' || id === 'df2c' || id === 'p2-df2a') return T.df2a;
  if(id === 'df2b' || id === 'df2d' || id === 'p2-df2b') return T.df2b;
  if(id === 'cp5a' || id === 'p3-cp5') return T.cp5cis;
  if(id === 'cp5b') return T.cp5nist;
  const title = b.title || '';
  if(title.indexOf('Português') === 0 || id.indexOf('pt-') === 0){
    if(/Interpreta/.test(title)) return T['pt-interp'];
    if(/Concord/.test(title)) return T['pt-conc'];
    if(/Regênc/.test(title)) return T['pt-reg'];
    if(/Crase/.test(title)) return T['pt-crase'];
    if(/Pontua/.test(title)) return T['pt-pont'];
  }
  if((b.topic || '').indexOf('le') === 0) return T['en-leit'];
  if(b.topic === 'en2' || /conect|conjun/i.test(title)) return T['en-gram'];
  if(b.topic === 'en1') return /conect|conjun/i.test(title) ? T['en-gram'] : T['en-leit'];
  return b.topic && T[b.topic] || null;
}

    ['Sincronização entre dispositivos', 'O mesmo progresso na conta e neste aparelho.']
  ];
  if(next === 'login'){
    setTitle('Entrar', 'Ênfase 7');
    $('#main').innerHTML = `<div class="land" id="land"><p class="eyebrow">Ênfase 7</p><h1>Entrar</h1>
      <p class="lead">Use o e-mail e a senha da sua conta para abrir o plano, o edital e as questões.</p>
      <form id="syncForm" class="card" action="javascript:void(0)">
        <label class="lb" for="sync-email">E-mail</label><input id="sync-email" name="email" type="email" autocomplete="email" inputmode="email" required>
        <label class="lb" for="sync-pass">Senha</label><input id="sync-pass" name="password" type="password" autocomplete="current-password" minlength="6" required>
        <div id="syncMsg" class="alert info" style="display:none"></div>
        <button class="btn p land-go" id="sync-in" type="button">Entrar</button>
        <button class="btn land-go" id="sync-up" type="button">Criar conta</button>
        <p class="small mut">Ao criar a conta, chega um e-mail de confirmação. Depois de confirmar o e-mail, é só voltar ao app e entrar. O link pode abrir esta mesma página; se ele não entrar sozinho, use o e-mail e a senha aqui.</p>
        <button class="btn sm" id="landBack" type="button">Voltar</button>
      </form></div>`;
    if(Sync.message) showSyncMsg(Sync.message, Sync.kind);
    $('#landBack').onclick = () => showLanding('home');
    $('#sync-in').onclick = () => withSyncBusy(async () => {
      const creds = readCreds(); if(!creds) return;
      showSyncMsg('', 'info');
      const client = await ensureClient();
      const {data, error} = await client.auth.signInWithPassword(creds);
      if(error) throw error;
      if(!data.session || !data.user){ showSyncMsg('Falta confirmar o e-mail. Depois de confirmar, é só voltar ao app e entrar.', 'warn'); return; }
      Sync.user = data.user; Sync.email = data.user.email || creds.email;
      toast('Entrou. O progresso local e o da conta foram unidos.');
      await enterApp();
    });
    $('#sync-up').onclick = () => withSyncBusy(async () => {
      const creds = readCreds(); if(!creds) return;
      const client = await ensureClient();
      const {data, error} = await client.auth.signUp({email:creds.email, password:creds.password, options:{emailRedirectTo:redirectTo()}});
      if(error) throw error;
      if(data && data.session && data.user){
        Sync.user = data.user; Sync.email = data.user.email || creds.email;
        toast('Conta criada. Você já entrou.');
        await enterApp();
        return;
      }
      Sync.message = 'Conta criada. Enviamos um e-mail de confirmação. Depois de confirmar o e-mail, é só voltar ao app e entrar.';
      Sync.kind = 'ok';
      showSyncMsg(Sync.message, 'ok');
    });
    return;
  }
  if(next === 'conteudo'){
    setTitle('Ênfase 7', 'Material');
    $('#main').innerHTML = `<div class="land" id="land"><h1>Ênfase 7</h1><div class="card alert warn">Não foi possível carregar o material agora. Confira a conexão e tente de novo.</div>
      <button class="btn p land-go" id="landRetry" type="button">Tentar de novo</button>
      <button class="btn land-go" id="landOut" type="button">Sair</button></div>`;
    $('#landRetry').onclick = () => enterApp();
    $('#landOut').onclick = () => signOutAccount();
    return;
  }
  setTitle('Ênfase 7', 'Preparação');
  $('#main').innerHTML = `<div class="land" id="land">
    <p class="eyebrow">Estudo</p>
    <h1>Ênfase 7</h1>
    <p class="lead">Sua preparação para a Transpetro 2026 – Ênfase 7 Segurança Cibernética</p>
    <div class="land-count"><b>${num}</b><span>${unit}<small>06/12/2026</small></span></div>
    <div class="land-feats">${feats.map(([t, s]) => `<div><b>${esc(t)}</b><span>${esc(s)}</span></div>`).join('')}</div>
    <button class="btn p land-go" id="landIn" type="button">Entrar</button>
  </div>`;
  $('#landIn').onclick = () => showLanding('login');
}
async function bootGate(){
  document.body.classList.add('gated');
  const tb = $('#themeBtn');
  if(tb) tb.onclick = () => theme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  theme();
  try {
    const client = await ensureClient();
    const {data, error} = await client.auth.getSession();
    if(error) throw error;
    const user = data && data.session && data.session.user;
    if(user){
      Sync.user = user;
      Sync.email = user.email || '';
      await enterApp();
      return;
    }
  } catch(e){ Sync.lastErr = humanSync(e); }
  showLanding('home');
}
function bootSync(){
  try {
    Storage.useAdapter({
      push(k){ if(k === SKEY && Sync.user && !suspend) schedulePush(); },
      async pull(){
        if(!Sync.user) return null;
        await ensureClient();
        const {data, error} = await syncClient.from('transpetro_progress').select('data, updated_at').eq('user_id', Sync.user.id).maybeSingle();
        if(error) throw error;
        const remote = data && unwrapRemote(data.data);
        return remote ? {progresso:remote, updated_at:data.updated_at} : null;
      }
    });
    window.addEventListener('online', () => { onWake(); });
    window.addEventListener('offline', () => { setSyncStatus('offline'); if((location.hash || '').indexOf('sincronizar') >= 0) render(); });
    window.addEventListener('focus', () => { onWake(); });
    document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') onWake(); if(document.visibilityState === 'hidden' && dirty) flushSync(); });
    window.addEventListener('pagehide', () => { if(dirty) flushSync(); });
    setSyncStatus(navigator.onLine ? 'local' : 'offline');
  } catch(e){ Sync.lastErr = humanSync(e); setSyncStatus('erro'); }
  bootGate();
}
bootSync();

})();</script>
