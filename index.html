<style>:root{--bg:#f4f6f9;--card:#fff;--fg:#1b2430;--mut:#64748b;--line:#e3e8ef;--pri:#0b6e8a;--pri2:#0e8fb3;--pri-bg:#e6f4f8;--ok:#15803d;--ok-bg:#e8f7ee;--bad:#c2410c;--bad-bg:#fdeee6;--warn:#b45309;--warn-bg:#fff6e5;--biz:#e8862a;--biz-bg:#fff4e6;--peg:#b91c1c;--peg-bg:#fdecec;--sh:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.05);--r:14px;--nav:64px}

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}

aside.side{display:none}
@media(min-width:1000px){body{padding-bottom:0}nav.bot{display:none}
 aside.side{display:block;position:fixed;top:0;bottom:0;left:0;width:230px;background:var(--card);border-right:1px solid var(--line);padding:16px 10px;overflow:auto}
 aside.side .brand{font-weight:800;padding:4px 10px 14px;font-size:15px}aside.side .brand small{display:block;color:var(--mut);font-weight:500;font-size:11px}

 aside.side a svg{width:18px;height:18px;color:var(--mut)}aside.side a.on{background:var(--pri-bg);color:var(--pri);font-weight:600}aside.side a.on svg{color:var(--pri)}
 header.top,main{margin-left:230px}header.top .ttl small{display:inline;margin-left:8px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}.card h3 .r{float:right;font-weight:500;font-size:12px;color:var(--mut)}
h2.pg{font-size:20px;margin:4px 0 12px}
.grid{display:grid;gap:12px}@media(min-width:700px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}}

.mut{color:var(--mut)}.small{font-size:12.5px}.c{text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 14px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--fg);min-height:42px}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}[data-theme=dark] .btn.p{color:#04141a}
.btn.w{width:100%}.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}.btn:disabled{opacity:.5;cursor:default}
.btn.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}.btn.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}.btn.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.sp{justify-content:space-between}.row>.f1{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;user-select:none}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}[data-theme=dark] .chip.on{color:#04141a}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--pri-bg);color:var(--pri);font-weight:600;margin-right:4px}
.tag.alta{background:var(--bad-bg);color:var(--bad)}.tag.media{background:var(--warn-bg);color:var(--warn)}.tag.gray{background:var(--line);color:var(--mut)}
select,input[type=search],input[type=text],input[type=email],input[type=password],textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:120px;font-family:ui-monospace,monospace;font-size:12px}
label.lb{font-size:12px;color:var(--mut);display:block;margin:8px 0 4px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.chart .it{margin:10px 0}.chart .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.chart .bar{height:14px}.chart .cut{position:absolute;top:-3px;bottom:-3px;left:50%;width:2px;background:var(--fg);opacity:.5}
.alert{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}.alert.ok{background:var(--ok-bg);color:var(--ok)}.alert.bad{background:var(--bad-bg);color:var(--bad)}.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.info{background:var(--pri-bg);color:var(--pri)}
.heat{display:flex;gap:4px;margin-top:8px}.heat i{flex:1;height:22px;border-radius:5px;background:var(--line)}.heat i.on{background:var(--ok)}.heat i.today{outline:2px solid var(--pri);outline-offset:1px}

.qmeta{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;align-items:center}
.stem{font-size:15.5px;margin:6px 0 12px}

.alts button .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.alts button.sel{border-color:var(--pri);background:var(--pri-bg)}.alts button.sel .l{background:var(--pri);color:#fff;border-color:var(--pri)}
.alts button.right{border-color:var(--ok);background:var(--ok-bg)}.alts button.right .l{background:var(--ok);border-color:var(--ok);color:#fff}
.alts button.wrong{border-color:var(--bad);background:var(--bad-bg)}.alts button.wrong .l{background:var(--bad);border-color:var(--bad);color:#fff}

.fb{margin-top:12px}.res{font-weight:800;font-size:16px;margin-bottom:6px}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.com{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14.5px}
.passage{border:1px dashed var(--line);border-radius:12px;padding:4px 12px;margin-bottom:10px;background:var(--bg)}.passage summary{cursor:pointer;font-weight:600;padding:6px 0;color:var(--pri)}

.qnav{display:flex;gap:8px;margin-top:12px}.qnav .btn{flex:1}

.bizuhot{animation:pop .35s ease}@keyframes pop{0%{transform:scale(.97);opacity:.4}100%{transform:none;opacity:1}}
.content{font-size:15px;overflow-wrap:anywhere}.content table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;font-size:13px;margin:10px 0}

.content ul,.content ol{padding-left:20px}.texto p{margin:.4em 0}

.li{display:flex;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg);cursor:pointer}.li:last-child{border-bottom:0}
.li .f1{flex:1;min-width:0}.li .t{font-weight:600}.li .s{font-size:12.5px;color:var(--mut)}
.li input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri);flex:none}
.li.today{background:var(--pri-bg);border-radius:10px;padding-left:8px;padding-right:8px}.li.done .t{text-decoration:line-through;color:var(--mut)}
.li.rev .t{color:var(--warn)}.li.key .t{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:700px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--fg);box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px;min-height:92px}
.tile svg{width:24px;height:24px;color:var(--pri)}.tile b{font-size:14px}.tile span{font-size:12px;color:var(--mut)}
.stat{display:flex;gap:10px}.stat>div{flex:1;background:var(--bg);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:11.5px;color:var(--mut)}

.sheet{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}@media(min-width:700px){.sheet{grid-template-columns:repeat(10,1fr)}}

.sheet button.flag{box-shadow:inset 0 -3px 0 var(--warn)}.sheet button.right{background:var(--ok-bg);border-color:var(--ok)}.sheet button.wrong{background:var(--bad-bg);border-color:var(--bad)}
.sheet .sep{grid-column:1/-1;font-size:11.5px;color:var(--mut);font-weight:600;margin-top:4px}
table.sc{width:100%;border-collapse:collapse;font-size:14px}table.sc td,table.sc th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}table.sc td.n{text-align:right;font-variant-numeric:tabular-nums}
.big-timer{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}

.fc{min-height:220px;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:19px;padding:24px 16px}.fc .a{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);color:var(--pri);font-size:17px;font-weight:600}

.dots i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:3px}.dots i.on{background:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 16px);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;z-index:99;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw}
@media(min-width:1000px){.toast{bottom:24px}}
.audio audio{width:100%;margin-top:8px}.miss{font-size:12px;color:var(--mut);margin-top:4px}
mark{background:#fde68a;color:#111;border-radius:3px;padding:0 2px}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
details.sc>summary{cursor:pointer;font-weight:600;padding:4px 0}
mark{background:#fde68a;color:inherit;border-radius:3px;padding:0 1px}[data-theme=dark] mark{background:#854d0e}
.texto{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}.texto .tt{font-weight:700;margin-top:0}
textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
a.chip{text-decoration:none}a.chip:not(.on){color:inherit}#fb{scroll-margin-top:72px}
#syncBtn .dot{width:9px;height:9px;border-radius:50%;background:var(--mut);display:block}

<script id="data" type="application/json">{"meta":{"titulo":"Transpetro 2026 · Ênfase 7","subtitulo":"Análise de Sistemas — Segurança Cibernética e da Informação","candidato":"Allan Oliveira","banca":"Cesgranrio","prova":"2026-12-06","duracaoMin":270,"versao":"2026-10-29","rotulo":"Questão inédita no estilo Cesgranrio","estrutura":{"total":70,"PT":10,"EN":10,"especificos":50},"eliminacao":{"especificosMin":25,"geraisMin":10,"ptMin":1,"enMin":1},"nota":"Eliminação: Específicos < 25, Gerais < 10, ou zero em PT ou em EN. Ranqueamento: Específicos; nota final = Específicos + Gerais."},"areas":{"PT":{"mod":"Português","nome":"Língua Portuguesa"},"EN":{"mod":"Inglês","nome":"Língua Inglesa"},"OF":{"mod":"Ofensiva","nome":"Específicos – Ofensiva"},"DF":{"mod":"Defensiva","nome":"Específicos – Defensiva"},"CP":{"mod":"Compliance","nome":"Específicos – Compliance"}},"blocos":[{"id":"ger","nome":"Conhecimentos Gerais","areas":["PT","EN"],"max":20,"min":10},{"id":"esp","nome":"Conhecimentos Específicos","areas":["OF","DF","CP"],"max":50,"min":25}],"topics":[{"id":"of1","mod":"Ofensiva","modTitle":"Módulo 1 — Segurança Ofensiva","title":"1.1–1.3 Conceitos, ataques passivos e ativos","prio":"Média","html":"\n<p><b>Vulnerabilidade<\/b> = fraqueza (de ativo ou controle) que pode ser explorada. <b>Ameaça<\/b> = causa potencial de um incidente indesejado (agente + intenção/possibilidade). <b>Ataque<\/b> = tentativa intencional de explorar a vulnerabilidade. <b>Risco<\/b> = probabilidade × impacto de a ameaça explorar a vulnerabilidade. <b>Exploit<\/b> = código/técnica que materializa o ataque.<\/p>\n<table class=\"tb \"><thead><tr><th>Classe (X.800 / Stallings)<\/th><th>Tipo<\/th><th>O que acontece<\/th><th>Afeta<\/th><th>Como se combate<\/th><\/tr><\/thead><tbody><tr><td><b>Passivo<\/b> (não altera nada)<\/td><td>Escuta passiva / liberação do conteúdo (<i>eavesdropping<\/i>)<\/td><td>Atacante só lê o tráfego<\/td><td>Confidencialidade<\/td><td><b>Prevenir<\/b> com cifragem<\/td><\/tr><tr><td><\/td><td><b>Inferência<\/b> / análise de tráfego<\/td><td>Deduz informação por padrões (quem fala com quem, volume, horário) mesmo com tráfego cifrado<\/td><td>Confidencialidade<\/td><td>Preenchimento de tráfego (<i>padding<\/i>), mix<\/td><\/tr><tr><td><b>Ativo<\/b> (altera/injeta)<\/td><td><b>Disfarce<\/b> (<i>masquerade<\/i>)<\/td><td>Uma entidade finge ser outra<\/td><td>Autenticidade<\/td><td>Autenticação forte<\/td><\/tr><tr><td><\/td><td><b>Repetição<\/b> (<i>replay<\/i>)<\/td><td>Captura uma mensagem válida e a retransmite depois<\/td><td>Autenticidade/integridade<\/td><td>Nonce, timestamp, número de sequência<\/td><\/tr><tr><td><\/td><td><b>Escuta ativa<\/b> / modificação de mensagens<\/td><td>Intercepta e altera/atrasa/reordena<\/td><td>Integridade<\/td><td>Hash/MAC/assinatura<\/td><\/tr><tr><td><\/td><td><b>Negação de serviço<\/b> (DoS/DDoS)<\/td><td>Esgota banda ou recursos<\/td><td>Disponibilidade<\/td><td>Filtragem, rate limit, CDN/anti-DDoS<\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — Passivo × Ativo<\/div><div class=\"boxb\"><b>Passivo = Prevenir<\/b> (é difícil <i>detectar<\/i> quem só escuta). <b>Ativo = Detectar e recuperar<\/b> (difícil <i>prevenir<\/i> 100%). Mnemônico dos ativos: <b>DRMN<\/b> — <b>D<\/b>isfarce, <b>R<\/b>epetição, <b>M<\/b>odificação, <b>N<\/b>egação de serviço.<\/div><\/div>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO<\/div><div class=\"boxb\">Análise de tráfego funciona <b>mesmo com criptografia<\/b> — a banca adora afirmar que cifrar resolve a inferência (falso). E <i>replay<\/i> não exige quebrar a cifra: o atacante reenvia o pacote cifrado como está.<\/div><\/div>\n"},{"id":"of2","mod":"Ofensiva","modTitle":"Módulo 1 — Segurança Ofensiva","title":"1.4 Etapas do ataque + varredura com nmap","prio":"Alta","html":"\n<p>O edital segue a metodologia clássica do livro <i>Hacking Exposed<\/i>. Ordem cobrada:<\/p>\n<table class=\"tb \"><thead><tr><th>#<\/th><th>Etapa<\/th><th>Objetivo<\/th><th>Exemplos/ferramentas<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td><b>Footprinting<\/b> (reconhecimento)<\/td><td>Perfil do alvo com fontes abertas: domínios, faixas IP, e-mails, pessoas<\/td><td>whois, DNS, theHarvester, amass, maltego, Google dorks<\/td><\/tr><tr><td>2<\/td><td><b>Varredura<\/b> (scanning)<\/td><td>Quais hosts estão vivos e quais portas/serviços respondem<\/td><td>ping sweep, nmap, masscan<\/td><\/tr><tr><td>3<\/td><td><b>Enumeração<\/b><\/td><td>Extrair informação <i>de dentro<\/i> dos serviços: contas, compartilhamentos, versões, banners<\/td><td>smbmap, enum4linux, SNMP, LDAP, nmap -sV/NSE<\/td><\/tr><tr><td>4<\/td><td><b>Ganho de acesso<\/b><\/td><td>Explorar a vulnerabilidade/credencial<\/td><td>metasploit, hydra, sqlmap<\/td><\/tr><tr><td>5<\/td><td><b>Escalação de privilégios<\/b><\/td><td>Usuário comum → admin/root/SYSTEM<\/td><td>exploits locais, SUID, mimikatz<\/td><\/tr><tr><td>6<\/td><td><b>Criação de porta dos fundos<\/b><\/td><td>Persistência para voltar depois<\/td><td>backdoor, rootkit, contas ocultas, tarefas agendadas<\/td><\/tr><tr><td>7<\/td><td><b>Encobrimento de rastros<\/b><\/td><td>Apagar logs/ocultar artefatos<\/td><td>limpar logs, rootkits, timestomp<\/td><\/tr><tr><td>8<\/td><td><b>Recusa (negação) de serviço<\/b><\/td><td>Se não conseguir acesso, derrubar o alvo<\/td><td>flood, amplificação<\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — Ordem das etapas<\/div><div class=\"boxb\"><b>“Fui Ver Eu Ganhar, Escalei, Pus Porta, Escondi e Recusei”<\/b> → Footprinting, Varredura, Enumeração, Ganho de acesso, Escalação, Porta dos fundos, Encobrimento, Recusa de serviço. <br><b>Varredura pergunta “O QUE está aberto?”<\/b>; <b>Enumeração pergunta “QUEM/QUAIS contas, shares e versões?”<\/b>.<\/div><\/div>\n<h4>Handshake TCP e tipos de varredura<\/h4>\n<p>3-way handshake: <code>SYN → SYN/ACK → ACK<\/code>. Porta fechada responde <code>RST<\/code>. No <b>SYN scan<\/b> o scanner responde <code>RST<\/code> ao SYN/ACK (meia conexão → não chega à aplicação, menos log). No <b>connect scan<\/b> a conexão é completada (aplicação registra).<\/p>\n<table class=\"tb \"><thead><tr><th>Opção<\/th><th>O que faz<\/th><th>Bizu<\/th><\/tr><\/thead><tbody><tr><td><code>-sS<\/code><\/td><td>SYN scan (half-open): envia SYN, recebe SYN/ACK e responde RST — não completa o handshake. Padrão quando executado como root.<\/td><td><b>S = Silencioso/Stealth<\/b><\/td><\/tr><tr><td><code>-sT<\/code><\/td><td>TCP connect: completa o 3-way handshake via chamada <i>connect()<\/i> do SO; padrão sem privilégio; mais ruidoso (fica em log).<\/td><td><b>T = Tagarela<\/b><\/td><\/tr><tr><td><code>-sU<\/code><\/td><td>Varredura UDP (lenta; porta fechada responde ICMP port unreachable).<\/td><td>U = UDP<\/td><\/tr><tr><td><code>-sV<\/code><\/td><td>Detecta <b>versão<\/b> do serviço (banner/probes).<\/td><td>V = Versão<\/td><\/tr><tr><td><code>-O<\/code><\/td><td>Detecta <b>sistema operacional<\/b> (fingerprint da pilha TCP/IP).<\/td><td>O = OS<\/td><\/tr><tr><td><code>-A<\/code><\/td><td>Agressivo: -O + -sV + scripts padrão + traceroute.<\/td><td>A = All<\/td><\/tr><tr><td><code>-sn<\/code><\/td><td>Só descoberta de hosts (ping sweep), <b>sem varrer portas<\/b> (antigo -sP).<\/td><td>n = no ports<\/td><\/tr><tr><td><code>-Pn<\/code><\/td><td>Pula a descoberta: trata todos os hosts como ativos (útil quando ICMP é bloqueado).<\/td><td>P-no ping<\/td><\/tr><tr><td><code>-p-<\/code> / <code>-p 22,80<\/code> / <code>-F<\/code><\/td><td>Todas as 65.535 portas / portas específicas / modo rápido (100 portas). Sem -p: top 1.000 portas.<\/td><td>-p- = todas<\/td><\/tr><tr><td><code>-sA<\/code><\/td><td>ACK scan: não diz se porta está aberta; mapeia regras de firewall (filtered × unfiltered).<\/td><td>A de ACK = mapear Firewall<\/td><\/tr><tr><td><code>-sN -sF -sX<\/code><\/td><td>Null, FIN e Xmas (FIN+PSH+URG): exploram RFC 793; porta fechada responde RST; aberta não responde (não funciona bem em Windows).<\/td><td>Xmas = árvore de Natal acesa<\/td><\/tr><tr><td><code>-T0<\/code>…<code>-T5<\/code><\/td><td>Temporização (paranoid → insane). T0/T1 evitam IDS; T4 é o comum em redes rápidas.<\/td><td><\/td><\/tr><tr><td><code>--script<\/code> / <code>-sC<\/code><\/td><td>NSE (Nmap Scripting Engine, scripts em Lua); -sC = scripts padrão.<\/td><td><\/td><\/tr><tr><td><code>-oN -oX -oG -oA<\/code><\/td><td>Saída normal, XML, grepável, todas.<\/td><td><\/td><\/tr><tr><td><code>-D<\/code> / <code>-S<\/code> / <code>-f<\/code><\/td><td>Iscas (decoys) / IP de origem forjado / fragmentação para evasão.<\/td><td><\/td><\/tr><\/tbody><\/table>\n<table class=\"tb \"><thead><tr><th>Estado nmap<\/th><th>Significado<\/th><\/tr><\/thead><tbody><tr><td>open<\/td><td>Aplicação aceitando conexões (SYN scan recebeu SYN/ACK)<\/td><\/tr><tr><td>closed<\/td><td>Porta acessível, sem serviço (recebeu RST)<\/td><\/tr><tr><td>filtered<\/td><td>Sem resposta ou ICMP unreachable: firewall filtrando<\/td><\/tr><tr><td>unfiltered<\/td><td>Acessível, mas não se sabe se aberta (resultado típico do ACK scan)<\/td><\/tr><tr><td>open|filtered<\/td><td>Não dá para distinguir (UDP, Null/FIN/Xmas)<\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — nmap do Allan<\/div><div class=\"boxb\"><b>-sS = SYN/Silencioso<\/b> · <b>-sT = TCP connect/Tagarela<\/b> · <b>-sV = Versão<\/b> · <b>-O = sistema Operacional<\/b> · <b>-sn = no ports<\/b> (só quem está vivo) · <b>-p- = todas as portas<\/b> · <b>-Pn = não pinga<\/b> · <b>-sU = UDP<\/b> · <b>-A = tudo<\/b>.<\/div><\/div>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO<\/div><div class=\"boxb\">(1) “-sS completa o handshake” — <b>falso<\/b>, quem completa é -sT. (2) “-sn varre as portas mais comuns” — <b>falso<\/b>. (3) “-O descobre a versão do Apache” — falso, versão de serviço é -sV. (4) Varredura é <b>ativa<\/b> (toca o alvo); footprinting com fontes abertas é <b>passivo<\/b>. (5) ACK scan não identifica porta aberta.<\/div><\/div>\n"},{"id":"of3","mod":"Ofensiva","modTitle":"Módulo 1 — Segurança Ofensiva","title":"1.5 Ataques aos protocolos de comunicação","prio":"Alta","html":"\n<table class=\"tb \"><thead><tr><th>Protocolo (porta)<\/th><th>Ataques típicos<\/th><th>Defesa-chave<\/th><\/tr><\/thead><tbody><tr><td><b>ARP<\/b> (camada 2, sem autenticação)<\/td><td><b>ARP spoofing/poisoning<\/b>: respostas ARP forjadas (gratuitous ARP) associam o IP do gateway ao MAC do atacante → MitM ou DoS<\/td><td><b>DAI<\/b> (Dynamic ARP Inspection) + <b>DHCP Snooping<\/b>, ARP estático em ativos críticos, arpwatch para detecção<\/td><\/tr><tr><td><b>IP<\/b><\/td><td>IP spoofing (forjar origem); ataques de fragmentação (Teardrop: fragmentos sobrepostos); source routing<\/td><td>Filtros anti-spoofing ingress/egress (BCP 38), descartar fragmentos inválidos<\/td><\/tr><tr><td><b>ICMP<\/b><\/td><td><b>Smurf<\/b> (echo para broadcast com origem forjada = vítima); Ping of Death (&gt;65.535 bytes); ICMP redirect; túnel ICMP; ping flood<\/td><td>Desabilitar broadcast direcionado, limitar ICMP, ignorar redirects<\/td><\/tr><tr><td><b>UDP<\/b><\/td><td>UDP flood; <b>Fraggle<\/b> (Smurf com UDP echo/chargen); <b>amplificação<\/b> (DNS, NTP <i>monlist<\/i>, SSDP, memcached) com origem forjada<\/td><td>Rate limit, desabilitar serviços abertos, BCP 38<\/td><\/tr><tr><td><b>TCP<\/b><\/td><td><b>SYN flood<\/b> (enche a fila de conexões semiabertas); sequestro de sessão (previsão de número de sequência); RST injection; LAND (origem = destino)<\/td><td><b>SYN cookies<\/b>, ISN aleatório, timeouts menores<\/td><\/tr><tr><td><b>DHCP<\/b> (UDP 67/68)<\/td><td><b>DHCP starvation<\/b> (esgota o pool com MACs falsos) + <b>rogue DHCP<\/b> (entrega gateway/DNS do atacante → MitM)<\/td><td><b>DHCP Snooping<\/b> (portas confiáveis), port security<\/td><\/tr><tr><td><b>SMTP<\/b> (25/587/465)<\/td><td>Open relay (spam), spoofing de remetente, enumeração com VRFY/EXPN<\/td><td>SPF, DKIM, DMARC, desabilitar relay aberto e VRFY<\/td><\/tr><tr><td><b>POP3<\/b> (110/995) e <b>IMAP<\/b> (143/993)<\/td><td>Credenciais em texto claro (sniffing), força bruta<\/td><td>POP3S/IMAPS (TLS), MFA, bloqueio por tentativas<\/td><\/tr><tr><td><b>HTTP<\/b> (80/443)<\/td><td>Sequestro de sessão (cookie), <b>SSL stripping<\/b> (rebaixa HTTPS→HTTP), HTTP flood, <b>Slowloris<\/b> (cabeçalhos lentos)<\/td><td><b>HSTS<\/b>, cookies Secure/HttpOnly, WAF, timeouts<\/td><\/tr><tr><td><b>FTP<\/b> (20/21)<\/td><td>Credenciais em claro, login anônimo, <b>FTP bounce<\/b> (comando PORT para varrer terceiros)<\/td><td>SFTP/FTPS, desabilitar anônimo e PORT para terceiros<\/td><\/tr><tr><td><b>SMB<\/b> (445; 139 NetBIOS)<\/td><td><b>EternalBlue<\/b> (MS17-010, SMBv1 → WannaCry), <b>SMB/NTLM relay<\/b>, null session (enumeração)<\/td><td>Desativar SMBv1, assinatura SMB obrigatória, patch, bloquear 445 na borda<\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — ARP spoofing (o do Allan)<\/div><div class=\"boxb\"><b>Mesma LAN · camada 2 · MitM<\/b>. O atacante diz “o IP do gateway sou eu (meu MAC)”. Defesa = <b>DAI + DHCP Snooping<\/b> (o DAI valida ARP contra a tabela de vínculos do DHCP Snooping). <b>Não confundir<\/b>: <b>DNS poisoning<\/b> falsifica o <i>nome→IP<\/i> (camada 7, pode ser remoto, defesa DNSSEC); <b>ARP<\/b> falsifica o <i>IP→MAC<\/i> (só local).<\/div><\/div>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — Portas que mais caem<\/div><div class=\"boxb\">FTP 20/21 · SSH 22 · Telnet 23 · SMTP 25 · DNS 53 · DHCP 67/68 · HTTP 80 · Kerberos 88 · POP3 110 · NTP 123 · IMAP 143 · SNMP 161/162 · LDAP 389 · HTTPS 443 · SMB 445 · SMTPS 465 · IKE 500 · Submission 587 · LDAPS 636 · IMAPS 993 · POP3S 995 · RADIUS 1812/1813 · RDP 3389 · NAT-T 4500 · Modbus 502.<\/div><\/div>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO<\/div><div class=\"boxb\">Sintoma típico da questão: “várias estações passaram a ter o <b>IP do roteador padrão associado a um MAC diferente<\/b>” → ARP spoofing (não é DNS, não é DHCP). Se o sintoma é “estações recebendo <b>gateway/DNS errados<\/b> ao ligar” → rogue DHCP. Se é “o switch passou a se comportar como hub” → <b>MAC flooding<\/b> (estouro da tabela CAM).<\/div><\/div>\n"},{"id":"of4","mod":"Ofensiva","modTitle":"Módulo 1 — Segurança Ofensiva","title":"1.6 Ataques à rede Wi-Fi","prio":"Média","html":"\n<table class=\"tb \"><thead><tr><th>Ataque<\/th><th>Definição de prova<\/th><th>Defesa<\/th><\/tr><\/thead><tbody><tr><td><b>Rogue Access Point<\/b><\/td><td>AP <b>não autorizado<\/b> ligado à rede corporativa (por funcionário ou invasor) — cria uma porta de entrada sem controle<\/td><td>WIPS/WIDS, 802.1X na porta do switch, inventário de APs<\/td><\/tr><tr><td><b>Evil Twin<\/b><\/td><td>AP falso que <b>imita o SSID<\/b> legítimo (gêmeo do mal), geralmente com sinal mais forte, para atrair clientes e fazer MitM/capturar credenciais (portal falso)<\/td><td>802.1X/EAP-TLS com validação do certificado do servidor, WIPS, VPN<\/td><\/tr><tr><td><b>SSID Tracking<\/b><\/td><td>Rastreamento de dispositivos/pessoas pelas <i>probe requests<\/i> que anunciam as redes preferidas (SSIDs) e o MAC<\/td><td>Randomização de MAC, não “lembrar” redes, não transmitir SSIDs ocultos<\/td><\/tr><tr><td><b>Jamming<\/b><\/td><td>Interferência de RF que satura o canal — DoS na <b>camada física<\/b><\/td><td>Detecção de espectro, troca de canal/banda, localização da fonte<\/td><\/tr><tr><td><b>Disassociation / Deauthentication<\/b><\/td><td>Quadros de gerenciamento 802.11 <b>forjados<\/b> (não autenticados) que desconectam clientes — DoS ou para forçar reconexão e capturar o <b>4-way handshake<\/b> WPA2<\/td><td><b>802.11w (PMF)<\/b> — obrigatório no WPA3<\/td><\/tr><\/tbody><\/table>\n<p><b>Cadeia clássica de quebra WPA2-PSK:<\/b> <code>airmon-ng<\/code> (modo monitor) → <code>airodump-ng<\/code> (captura) → <code>aireplay-ng --deauth<\/code> (força reconexão) → captura do handshake → <code>aircrack-ng<\/code>/<code>hashcat<\/code> (dicionário offline). WEP cai por fraquezas do RC4/IV de 24 bits. <b>WPA3-SAE<\/b> (Dragonfly) resiste a dicionário offline e traz PMF obrigatório.<\/p>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — Wi-Fi em uma linha<\/div><div class=\"boxb\"><b>Rogue = intruso plugado na rede<\/b> · <b>Evil Twin = clone do SSID<\/b> · <b>Tracking = te segue pelo probe<\/b> · <b>Jamming = barulho de RF<\/b> · <b>Deauth = quadro forjado que derruba<\/b> (PMF/802.11w resolve).<\/div><\/div>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO<\/div><div class=\"boxb\">Rogue AP × Evil Twin: o rogue está <b>conectado à rede interna<\/b> (ameaça à empresa); o evil twin <b>imita<\/b> uma rede para enganar <b>clientes<\/b>. Jamming não é ataque de protocolo, é físico (RF).<\/div><\/div>\n"},{"id":"of5","mod":"Ofensiva","modTitle":"Módulo 1 — Segurança Ofensiva","title":"1.7 Man-in-the-Middle: sniffing e spoofing","prio":"Alta","html":"\n<p><b>Sniffing<\/b> = capturar tráfego (placa em modo promíscuo/monitor). Em <b>hub<\/b> todo mundo vê tudo; em <b>switch<\/b> o atacante precisa de um truque: ARP spoofing, MAC flooding (estoura a tabela CAM → switch inunda como hub), port mirroring/SPAN indevido, rogue DHCP. <b>Spoofing<\/b> = falsificar identidade: ARP, IP, MAC, DNS, e-mail, ID de chamada.<\/p>\n<table class=\"tb \"><thead><tr><th>Técnica MitM<\/th><th>Camada<\/th><th>Ferramentas<\/th><th>Defesa<\/th><\/tr><\/thead><tbody><tr><td>ARP poisoning<\/td><td>2 (enlace, só LAN)<\/td><td>ettercap, arpspoof, bettercap<\/td><td>DAI + DHCP Snooping, arpwatch (detecção)<\/td><\/tr><tr><td>MAC flooding<\/td><td>2<\/td><td>macof<\/td><td>Port security (limite de MACs por porta)<\/td><\/tr><tr><td>DHCP rogue<\/td><td>7/2<\/td><td>Yersinia, scripts<\/td><td>DHCP Snooping<\/td><\/tr><tr><td>DNS spoofing / cache poisoning<\/td><td>7<\/td><td>ettercap dns_spoof, ataque Kaminsky<\/td><td>DNSSEC, randomizar porta/ID de transação<\/td><\/tr><tr><td>SSL stripping<\/td><td>7<\/td><td>sslstrip, bettercap<\/td><td>HSTS (preload)<\/td><\/tr><tr><td>Evil twin<\/td><td>Wi-Fi<\/td><td>airgeddon, hostapd<\/td><td>EAP-TLS, WIPS<\/td><\/tr><tr><td>Session hijacking<\/td><td>4/7<\/td><td>Burp, ferramentas de cookie<\/td><td>TLS, cookies Secure/HttpOnly/SameSite, regenerar ID<\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU<\/div><div class=\"boxb\"><b>Sniffing = ouvir<\/b> (passivo) · <b>Spoofing = fingir<\/b> (ativo) · <b>MitM = ficar no meio<\/b> (precisa de spoofing para chegar lá numa rede comutada). Ferramenta defensiva da lista do edital: <b>arpwatch<\/b> (detecta mudança de par IP↔MAC).<\/div><\/div>\n"},{"id":"of6","mod":"Ofensiva","modTitle":"Módulo 1 — Segurança Ofensiva","title":"1.8 Engenharia social: ciclo de ataque e técnicas","prio":"Média","html":"\n<p><b>Ciclo do ataque<\/b> (modelo de Kevin Mitnick, usado na literatura): <b>1) Pesquisa<\/b> (coleta de informações sobre o alvo) → <b>2) Desenvolvimento de relacionamento/confiança<\/b> (rapport) → <b>3) Exploração da confiança<\/b> (pedido, ação da vítima) → <b>4) Utilização da informação<\/b> (atinge o objetivo e, se preciso, recomeça o ciclo).<\/p>\n<table class=\"tb \"><thead><tr><th>Técnica<\/th><th>Definição curta<\/th><\/tr><\/thead><tbody><tr><td>Phishing<\/td><td>Mensagem em massa que imita entidade confiável para obter dados/cliques<\/td><\/tr><tr><td>Spear phishing / Whaling<\/td><td>Phishing direcionado a pessoa/grupo específico / a altos executivos (“baleias”)<\/td><\/tr><tr><td>Vishing / Smishing<\/td><td>Phishing por voz (telefone) / por SMS<\/td><\/tr><tr><td>Pretexting<\/td><td>Cria um cenário inventado (pretexto) — ex.: “sou do suporte de TI”<\/td><\/tr><tr><td>Baiting<\/td><td>Isca: pendrive infectado deixado no estacionamento, download “grátis”<\/td><\/tr><tr><td>Quid pro quo<\/td><td>Oferece um benefício/serviço em troca da informação<\/td><\/tr><tr><td>Tailgating / Piggybacking<\/td><td>Entrar em área física seguindo alguém autorizado (sem / com consentimento)<\/td><\/tr><tr><td>Shoulder surfing / Dumpster diving<\/td><td>Olhar por cima do ombro / vasculhar o lixo<\/td><\/tr><tr><td>Watering hole<\/td><td>Compromete site frequentado pelo grupo-alvo<\/td><\/tr><tr><td>Pharming<\/td><td>Redireciona para site falso via DNS/hosts — vítima digita a URL certa<\/td><\/tr><tr><td>BEC (Business E-mail Compromise)<\/td><td>Fraude com e-mail de executivo/fornecedor para pagamento indevido<\/td><\/tr><\/tbody><\/table>\n<p>Gatilhos psicológicos (Cialdini): <b>autoridade, urgência/escassez, reciprocidade, compromisso/coerência, prova social, afinidade<\/b>. Defesa principal: <b>conscientização e treinamento<\/b> (ATT&amp;CK M1017; CIS Control 14), além de MFA e processos de verificação (call-back).<\/p>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — Ciclo<\/div><div class=\"boxb\"><b>P-R-E-U<\/b>: <b>P<\/b>esquisa → <b>R<\/b>elacionamento → <b>E<\/b>xploração → <b>U<\/b>tilização.<\/div><\/div>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO<\/div><div class=\"boxb\">Pharming ≠ phishing: no pharming a vítima digita o endereço <b>correto<\/b> e mesmo assim cai no site falso (DNS/hosts adulterado). Whaling é spear phishing contra a alta direção.<\/div><\/div>\n"},{"id":"of7","mod":"Ofensiva","modTitle":"Módulo 1 — Segurança Ofensiva","title":"1.9 Código malicioso (malware)","prio":"Média","html":"\n<table class=\"tb \"><thead><tr><th>Malware<\/th><th>Como age / característica decisiva<\/th><\/tr><\/thead><tbody><tr><td><b>Vírus<\/b><\/td><td>Insere cópias de si em outros arquivos/programas; <b>depende da execução do hospedeiro<\/b><\/td><\/tr><tr><td><b>Worm<\/b><\/td><td>Propaga-se <b>sozinho<\/b> pela rede explorando vulnerabilidades; não precisa de hospedeiro; consome recursos<\/td><\/tr><tr><td><b>Trojan Horse<\/b><\/td><td>Programa que faz o que promete <b>e<\/b> algo malicioso oculto; não se replica<\/td><\/tr><tr><td><b>Backdoor<\/b><\/td><td>Garante o <b>retorno<\/b> do invasor sem passar pelos métodos normais de autenticação<\/td><\/tr><tr><td><b>Keylogger<\/b><\/td><td>Captura as <b>teclas<\/b> digitadas (spyware)<\/td><\/tr><tr><td><b>Screenlogger<\/b><\/td><td>Captura a <b>tela<\/b>/região ao redor do clique — derrota teclados virtuais<\/td><\/tr><tr><td><b>Injector<\/b><\/td><td>Injeta código malicioso em <b>outro processo<\/b>/arquivo legítimo (ex.: DLL injection)<\/td><\/tr><tr><td><b>Downloader<\/b><\/td><td>Baixa e instala outros malwares (estágio inicial)<\/td><\/tr><tr><td><b>Flooder<\/b><\/td><td>Gera grande volume de tráfego/mensagens para DoS ou spam<\/td><\/tr><tr><td><b>Rootkit<\/b><\/td><td>Conjunto de ferramentas para <b>esconder<\/b> a presença do invasor e manter acesso (modo usuário, kernel, bootkit)<\/td><\/tr><tr><td><b>Bot<\/b> / <b>Botnet<\/b><\/td><td>Máquina “zumbi” controlada remotamente via C&amp;C / rede de bots (DDoS, spam, mineração)<\/td><\/tr><tr><td><b>Exploit<\/b><\/td><td>Código que <b>explora uma vulnerabilidade<\/b> específica<\/td><\/tr><tr><td><b>Spyware<\/b><\/td><td>Monitora e envia informações (keylogger, screenlogger, adware são subtipos)<\/td><\/tr><tr><td><b>Ransomware<\/b><\/td><td>Cifra dados (crypto) ou bloqueia o equipamento (locker) e exige resgate; dupla extorsão = também vaza<\/td><\/tr><tr><td><b>Cryptojacking<\/b><\/td><td>Usa CPU/GPU da vítima para <b>minerar criptomoedas<\/b> sem autorização (sintoma: lentidão/aquecimento)<\/td><\/tr><tr><td><b>Formjacking<\/b><\/td><td>JavaScript malicioso injetado em <b>formulários de pagamento<\/b> de sites para roubar cartões (skimming digital, ex.: Magecart)<\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — Vírus × Worm × Trojan<\/div><div class=\"boxb\"><b>Vírus<\/b> precisa de <b>hospedeiro + execução<\/b>; <b>Worm<\/b> <b>anda sozinho<\/b> pela rede; <b>Trojan<\/b> é <b>presente de grego<\/b> (não se replica). <b>Keylogger = teclado<\/b>, <b>Screenlogger = tela<\/b> (por isso teclado virtual não salva).<\/div><\/div>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO<\/div><div class=\"boxb\">Rootkit <b>não<\/b> é, por definição, para obter acesso — é para <b>esconder e manter<\/b>. Formjacking ataca o <b>site<\/b> (lado do e-commerce), não o computador do cliente. Cryptojacking não cifra arquivos (quem cifra é ransomware).<\/div><\/div>\n"},{"id":"of8","mod":"Ofensiva","modTitle":"Módulo 1 — Segurança Ofensiva","title":"1.10 MITRE ATT&CK","prio":"Alta","html":"\n<p>Base de conhecimento <b>gratuita<\/b> de comportamento adversário observado no mundo real. Estrutura <b>TTP<\/b>: <b>Tática<\/b> = <i>por quê<\/i> (objetivo, colunas da matriz, ID TA####) · <b>Técnica<\/b> = <i>como<\/i> (T####; subtécnica T####.###) · <b>Procedimento<\/b> = implementação concreta por um grupo/software (exemplos de procedimento) · <b>Mitigação<\/b> = M#### (ex.: M1032 MFA, M1026 Privileged Account Management, M1017 User Training, M1051 Update Software, M1043 Credential Access Protection). Também cataloga <b>Groups<\/b> (G####), <b>Software<\/b> (S####), <b>Data sources/Detections<\/b>.<\/p>\n<p><b>Matrizes:<\/b> <b>Enterprise<\/b> (Windows, macOS, Linux, nuvem, rede, contêineres, entre outras plataformas; a antiga matriz PRE foi incorporada como as táticas Reconnaissance + Resource Development), <b>Mobile<\/b> (Android, iOS) e <b>ICS<\/b>. A Enterprise tem <b>14 táticas<\/b>:<\/p>\n<table class=\"tb \"><thead><tr><th>ID<\/th><th>Tática (Enterprise)<\/th><th>Pergunta do adversário<\/th><th>Técnicas-exemplo<\/th><\/tr><\/thead><tbody><tr><td>TA0043<\/td><td>Reconnaissance<\/td><td>Que informações posso coletar?<\/td><td>T1595 Active Scanning, T1593 Search Open Websites/Domains<\/td><\/tr><tr><td>TA0042<\/td><td>Resource Development<\/td><td>Que recursos preciso montar?<\/td><td>T1583 Acquire Infrastructure, T1588 Obtain Capabilities<\/td><\/tr><tr><td>TA0001<\/td><td>Initial Access<\/td><td>Como entro?<\/td><td><b>T1566 Phishing<\/b>, T1190 Exploit Public-Facing Application, T1078 Valid Accounts<\/td><\/tr><tr><td>TA0002<\/td><td>Execution<\/td><td>Como rodo meu código?<\/td><td>T1059 Command and Scripting Interpreter (PowerShell .001)<\/td><\/tr><tr><td>TA0003<\/td><td>Persistence<\/td><td>Como fico?<\/td><td>T1053 Scheduled Task/Job, T1547 Boot or Logon Autostart (Run keys), T1136 Create Account<\/td><\/tr><tr><td>TA0004<\/td><td>Privilege Escalation<\/td><td>Como viro admin?<\/td><td>T1068 Exploitation for Privilege Escalation, T1548 Abuse Elevation Control (bypass UAC)<\/td><\/tr><tr><td>TA0005<\/td><td>Defense Evasion<\/td><td>Como não sou visto?<\/td><td>T1070 Indicator Removal (limpar logs), T1027 Obfuscated Files<\/td><\/tr><tr><td>TA0006<\/td><td><b>Credential Access<\/b><\/td><td>Como pego senhas?<\/td><td><b>T1003 OS Credential Dumping (.001 LSASS Memory)<\/b>, T1110 Brute Force, T1558 Kerberos Tickets (.003 Kerberoasting), T1056 Input Capture (keylogging)<\/td><\/tr><tr><td>TA0007<\/td><td>Discovery<\/td><td>O que existe aqui dentro?<\/td><td>T1046 Network Service Discovery, T1087 Account Discovery<\/td><\/tr><tr><td>TA0008<\/td><td>Lateral Movement<\/td><td>Como pulo para outra máquina?<\/td><td>T1021 Remote Services (RDP, SMB), T1550 Use Alternate Auth Material (.002 Pass the Hash)<\/td><\/tr><tr><td>TA0009<\/td><td>Collection<\/td><td>Que dados junto?<\/td><td>T1005 Data from Local System, T1113 Screen Capture<\/td><\/tr><tr><td>TA0011<\/td><td>Command and Control<\/td><td>Como converso com o malware?<\/td><td>T1071 Application Layer Protocol, T1572 Protocol Tunneling<\/td><\/tr><tr><td>TA0010<\/td><td>Exfiltration<\/td><td>Como levo os dados?<\/td><td>T1041 Exfiltration Over C2 Channel, T1567 Over Web Service<\/td><\/tr><tr><td>TA0040<\/td><td>Impact<\/td><td>Como causo dano?<\/td><td><b>T1486 Data Encrypted for Impact<\/b> (ransomware), T1490 Inhibit System Recovery, T1498 Network DoS<\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — ATT&CK do Allan<\/div><div class=\"boxb\"><b>Pegou senha, hash ou ticket = Credential Access (TA0006)<\/b>. <b>Dump da memória do LSASS (mimikatz) = T1003.001<\/b>. <b>Usar<\/b> o hash para entrar em outra máquina (pass-the-hash) = <b>Lateral Movement<\/b> (T1550.002 — também listada em Defense Evasion). Phishing = Initial Access; tarefa agendada/chave Run = Persistence; cifrar arquivos para resgate = Impact (T1486); apagar logs = Defense Evasion (T1070).<br><b>Ordem das 14:<\/b> “<b>Re<\/b>cebi <b>Re<\/b>cursos, <b>In<\/b>vadi, <b>Ex<\/b>ecutei, <b>Pe<\/b>rsisti, <b>Pri<\/b>vilegiei, <b>De<\/b>sviei, <b>Cre<\/b>denciei, <b>Des<\/b>cobri, <b>La<\/b>teralizei, <b>Co<\/b>letei, <b>C2<\/b>, <b>Ex<\/b>filtrei, <b>Im<\/b>pactei”.<\/div><\/div>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO<\/div><div class=\"boxb\">(1) ATT&CK <b>não<\/b> é modelo sequencial obrigatório como a Cyber Kill Chain — táticas não precisam ocorrer em ordem. (2) Tática ≠ técnica: “Credential Access” é tática; “OS Credential Dumping” é técnica. (3) Uma técnica pode pertencer a mais de uma tática. (4) ATT&CK descreve <b>comportamento do adversário<\/b> (pós-comprometimento e pré), CAPEC descreve <b>padrões de ataque<\/b> a aplicações/sistemas, CWE descreve <b>fraquezas<\/b>.<\/div><\/div>\n"},{"id":"of9","mod":"Ofensiva","modTitle":"Módulo 1 — Segurança Ofensiva","title":"1.11 MITRE CAPEC","prio":"Média","html":"\n<p><b>CAPEC<\/b> = <i>Common Attack Pattern Enumeration and Classification<\/i> (MITRE): catálogo de <b>padrões de ataque<\/b> — descrições de como adversários exploram fraquezas conhecidas (ex.: CAPEC-66 SQL Injection, CAPEC-63 Cross-Site Scripting, CAPEC-112 Brute Force). Cada padrão traz pré-requisitos, habilidades necessárias, consequências, mitigações e as <b>CWEs relacionadas<\/b>. Níveis de abstração: <b>Meta<\/b> → <b>Standard<\/b> → <b>Detailed<\/b> attack patterns.<\/p>\n<table class=\"tb \"><thead><tr><th>Visão (view)<\/th><th>Organização<\/th><\/tr><\/thead><tbody><tr><td><b>Mecanismos de Ataque<\/b> (Mechanisms of Attack)<\/td><td>9 categorias pelas <b>técnicas<\/b> usadas: Engage in Deceptive Interactions · Abuse Existing Functionality · Manipulate Data Structures · Manipulate System Resources · Inject Unexpected Items · Employ Probabilistic Techniques · Manipulate Timing and State · Collect and Analyze Information · Subvert Access Control<\/td><\/tr><tr><td><b>Domínios de Ataque<\/b> (Domains of Attack)<\/td><td>6 domínios pelo <b>alvo/área<\/b>: Software · Hardware · Communications · Supply Chain · Social Engineering · Physical Security<\/td><\/tr><\/tbody><\/table>\n<table class=\"tb \"><thead><tr><th>Catálogo<\/th><th>Responde<\/th><th>Exemplo<\/th><\/tr><\/thead><tbody><tr><td><b>CVE<\/b><\/td><td>QUAL vulnerabilidade específica em QUAL produto/versão<\/td><td>CVE-2017-0144 (EternalBlue)<\/td><\/tr><tr><td><b>CWE<\/b><\/td><td>QUE TIPO de fraqueza de software/hardware<\/td><td>CWE-89 SQL Injection, CWE-79 XSS<\/td><\/tr><tr><td><b>CAPEC<\/b><\/td><td>COMO o atacante explora (padrão de ataque)<\/td><td>CAPEC-66 SQL Injection<\/td><\/tr><tr><td><b>ATT&amp;CK<\/b><\/td><td>O QUE o adversário faz na intrusão (TTP)<\/td><td>T1003 OS Credential Dumping<\/td><\/tr><tr><td><b>CVSS<\/b><\/td><td>QUÃO grave (nota 0–10)<\/td><td>9.8 Critical<\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU<\/div><div class=\"boxb\"><b>CVE = Vulnerabilidade Específica<\/b> · <b>CWE = Weakness (tipo)<\/b> · <b>CAPEC = Padrão de ATAQUE<\/b> · <b>ATT&CK = comportamento do adversário<\/b>. Mecanismos = “COMO ataca”; Domínios = “ONDE ataca”.<\/div><\/div>\n"},{"id":"of10","mod":"Ofensiva","modTitle":"Módulo 1 — Segurança Ofensiva","title":"1.12 Ferramentas de hacking (as 24 do edital)","prio":"Alta","html":"\n<table class=\"tb \"><thead><tr><th>Ferramenta<\/th><th>Categoria<\/th><th>Para que serve (o que a banca pergunta)<\/th><\/tr><\/thead><tbody><tr><td><b>amass<\/b><\/td><td>Recon/OSINT<\/td><td>Enumeração de <b>subdomínios<\/b> e mapeamento da superfície de ataque (OWASP Amass), via DNS, certificados, APIs<\/td><\/tr><tr><td><b>theHarvester<\/b><\/td><td>Recon/OSINT<\/td><td>Coleta <b>e-mails<\/b>, nomes, subdomínios, hosts e IPs em fontes públicas (buscadores, PGP, Shodan)<\/td><\/tr><tr><td><b>maltego<\/b><\/td><td>OSINT gráfico<\/td><td>Análise de <b>vínculos<\/b> (link analysis) com “transforms”: grafos entre pessoas, domínios, e-mails, IPs<\/td><\/tr><tr><td><b>nmap<\/b><\/td><td>Varredura<\/td><td>Descoberta de hosts, portas, serviços (-sV), SO (-O), scripts NSE<\/td><\/tr><tr><td><b>masscan<\/b><\/td><td>Varredura<\/td><td>Scanner de portas <b>assíncrono e ultrarrápido<\/b> (escala de internet; <code>--rate<\/code>); sintaxe parecida com o nmap, menos detalhe<\/td><\/tr><tr><td><b>netcat<\/b> (nc)<\/td><td>Rede “canivete suíço”<\/td><td>Lê/escreve em conexões TCP/UDP: banner grabbing, transferência de arquivos, port scan simples, <b>bind/reverse shell<\/b> (<code>nc -lvnp 4444<\/code>)<\/td><\/tr><tr><td><b>wireshark<\/b><\/td><td>Sniffer/analisador<\/td><td>Captura e <b>análise de protocolos<\/b> com interface gráfica; filtros de exibição (<code>ip.addr==<\/code>, <code>tcp.port==<\/code>, <code>http<\/code>); tshark = CLI<\/td><\/tr><tr><td><b>ettercap<\/b><\/td><td>MitM<\/td><td>Ataques <b>MitM em LAN<\/b>: ARP poisoning, sniffing, filtros de conteúdo, plugin dns_spoof<\/td><\/tr><tr><td><b>arpwatch<\/b><\/td><td><b>Defesa<\/b>/monitoração<\/td><td>Monitora pares <b>IP↔MAC<\/b> e alerta mudanças (“flip flop”) — detecta ARP spoofing<\/td><\/tr><tr><td><b>aircrack-ng<\/b><\/td><td>Wi-Fi<\/td><td>Suíte de auditoria 802.11: airmon-ng, airodump-ng (captura), aireplay-ng (injeção/deauth), aircrack-ng (quebra WEP/WPA-PSK)<\/td><\/tr><tr><td><b>airgeddon<\/b><\/td><td>Wi-Fi<\/td><td>Script (bash) multiuso que automatiza auditorias Wi-Fi: <b>evil twin<\/b> com portal cativo, DoS, captura de handshake, WPS<\/td><\/tr><tr><td><b>hydra<\/b><\/td><td>Senhas <b>online<\/b><\/td><td>Força bruta/dicionário <b>contra serviços de login em rede<\/b> (SSH, FTP, RDP, HTTP-POST, SMB…)<\/td><\/tr><tr><td><b>john the ripper<\/b><\/td><td>Senhas <b>offline<\/b><\/td><td>Quebra de <b>hashes<\/b> offline (modos single, wordlist, incremental); <code>unshadow<\/code>; uso forte de CPU<\/td><\/tr><tr><td><b>hashcat<\/b><\/td><td>Senhas <b>offline<\/b><\/td><td>Quebra de hashes acelerada por <b>GPU<\/b>; <code>-m<\/code> tipo de hash, <code>-a 0<\/code> dicionário, <code>-a 3<\/code> máscara/força bruta<\/td><\/tr><tr><td><b>mimikatz<\/b><\/td><td>Pós-exploração Windows<\/td><td>Extrai credenciais da memória (<b>LSASS<\/b>): <code>sekurlsa::logonpasswords<\/code>; pass-the-hash, pass-the-ticket, <b>golden ticket<\/b>, DCSync<\/td><\/tr><tr><td><b>metasploit-framework<\/b><\/td><td>Exploração<\/td><td>Framework de <b>exploits<\/b>: módulos exploit, payload, auxiliary, post, encoder; <b>meterpreter<\/b>; msfconsole; msfvenom (gera payloads)<\/td><\/tr><tr><td><b>veil<\/b><\/td><td>Evasão<\/td><td>Gera payloads (ex.: compatíveis com Metasploit) <b>ofuscados para evadir antivírus<\/b><\/td><\/tr><tr><td><b>set<\/b> (Social-Engineer Toolkit)<\/td><td>Engenharia social<\/td><td>Campanhas de <b>phishing<\/b>, clonagem de sites para <b>credential harvesting<\/b>, mídia infectada<\/td><\/tr><tr><td><b>beef-xss<\/b><\/td><td>Exploração de navegador<\/td><td>Browser Exploitation Framework: “fisga” o navegador via <b>XSS<\/b> (hook.js) e executa módulos nele<\/td><\/tr><tr><td><b>burpsuite<\/b><\/td><td>Web (proxy)<\/td><td><b>Proxy interceptador<\/b> HTTP/S: Proxy, Repeater, Intruder (fuzzing/força bruta), Scanner (Pro), Decoder, Comparer, Sequencer (aleatoriedade de tokens)<\/td><\/tr><tr><td><b>sqlmap<\/b><\/td><td>Web (SQLi)<\/td><td>Automatiza detecção e exploração de <b>SQL injection<\/b>: <code>--dbs<\/code>, <code>--tables<\/code>, <code>-D -T --dump<\/code>, <code>--os-shell<\/code><\/td><\/tr><tr><td><b>smbmap<\/b><\/td><td>Enumeração SMB<\/td><td>Lista <b>compartilhamentos SMB<\/b> e permissões (leitura/escrita) num domínio; busca/baixa arquivos<\/td><\/tr><tr><td><b>ghidra<\/b><\/td><td>Engenharia reversa<\/td><td>Framework de <b>engenharia reversa<\/b> da NSA: disassembler e <b>decompilador<\/b> (análise de malware/binários)<\/td><\/tr><tr><td><b>steghide<\/b><\/td><td>Esteganografia<\/td><td>Oculta/extrai dados <b>dentro de imagens e áudio<\/b> (JPEG, BMP, WAV, AU) com senha: <code>embed<\/code>/<code>extract<\/code><\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — Agrupe por fase<\/div><div class=\"boxb\"><b>Recon:<\/b> amass, theHarvester, maltego · <b>Scan:<\/b> nmap, masscan · <b>Enum:<\/b> smbmap · <b>Sniff/MitM:<\/b> wireshark, ettercap (e arpwatch para <b>detectar<\/b>) · <b>Wi-Fi:<\/b> aircrack-ng, airgeddon · <b>Senhas:<\/b> hydra (<b>online<\/b>), john e hashcat (<b>offline<\/b>; hashcat = GPU) · <b>Exploração:<\/b> metasploit, sqlmap, beef-xss, burp · <b>Pós/credenciais:<\/b> mimikatz · <b>Evasão:<\/b> veil · <b>Eng. social:<\/b> set · <b>Reversa:<\/b> ghidra · <b>Esconder dados:<\/b> steghide · <b>Tudo-em-um de rede:<\/b> netcat.<\/div><\/div>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO<\/div><div class=\"boxb\">(1) <b>hydra × john/hashcat<\/b>: hydra ataca o <b>serviço ao vivo<\/b> (online); john/hashcat quebram <b>hash já obtido<\/b> (offline). (2) <b>arpwatch é defensivo<\/b>. (3) <b>steghide<\/b> não cifra o disco: esconde dados <b>dentro de mídia<\/b>. (4) <b>masscan<\/b> é mais rápido que o nmap, mas não faz detecção de versão/SO no mesmo nível. (5) <b>ghidra<\/b> não é scanner de vulnerabilidades. (6) <b>beef<\/b> depende de XSS para “fisgar” o navegador.<\/div><\/div>\n"},{"id":"df1","mod":"Defensiva","modTitle":"Módulo 2 — Segurança Defensiva","title":"2.1 Defesa em profundidade e perímetro (firewalls, IDS, IPS, VPN)","prio":"Alta","html":"\n<p><b>Defesa em profundidade<\/b> = camadas de controles independentes (físico, perímetro, rede interna, host, aplicação, dados, pessoas/políticas): se uma falha, a próxima segura. O <b>perímetro<\/b> separa redes de confiança diferentes (internet / DMZ / interna).<\/p>\n<table class=\"tb \"><thead><tr><th>Tipo<\/th><th>Camada OSI<\/th><th>Decide com base em<\/th><th>Prós / contras<\/th><\/tr><\/thead><tbody><tr><td><b>Filtro de pacotes<\/b> (estático, stateless)<\/td><td>3 e 4<\/td><td>Cada pacote <b>isoladamente<\/b>: IP origem/destino, protocolo, portas, flags (ACL)<\/td><td>Rápido e barato / não entende sessão; precisa abrir portas altas de retorno; vulnerável a spoofing e fragmentação<\/td><\/tr><tr><td><b>Firewall de estado<\/b> (stateful inspection)<\/td><td>3 e 4 (+ estado)<\/td><td>Pacote <b>+ tabela de estados<\/b> das conexões; libera automaticamente o retorno de conexões estabelecidas<\/td><td>Mais seguro que o estático / não inspeciona conteúdo da aplicação<\/td><\/tr><tr><td><b>Firewall proxy<\/b> (gateway de aplicação)<\/td><td>7<\/td><td><b>Conteúdo<\/b> do protocolo de aplicação; o proxy <b>termina<\/b> a conexão do cliente e abre outra até o servidor (não há conexão direta)<\/td><td>Inspeção profunda, autenticação de usuário, logs ricos / mais lento; um proxy por protocolo<\/td><\/tr><tr><td>Gateway de circuito (SOCKS)<\/td><td>5<\/td><td>Valida o handshake/sessão e retransmite sem inspecionar conteúdo<\/td><td>—<\/td><\/tr><tr><td>NGFW / WAF<\/td><td>3–7<\/td><td>NGFW: estado + aplicação + IPS + identidade; WAF: protege aplicações web (SQLi, XSS)<\/td><td>—<\/td><\/tr><\/tbody><\/table>\n<table class=\"tb \"><thead><tr><th><\/th><th><b>IDS<\/b> (detecção)<\/th><th><b>IPS<\/b> (prevenção)<\/th><\/tr><\/thead><tbody><tr><td>Posição<\/td><td>Fora do fluxo (out-of-band): cópia via SPAN/TAP<\/td><td><b>Em linha<\/b> (inline), no caminho do tráfego<\/td><\/tr><tr><td>Reação<\/td><td><b>Passiva<\/b>: gera alerta/log<\/td><td><b>Ativa<\/b>: descarta pacote, reseta sessão, bloqueia IP<\/td><\/tr><tr><td>Risco de falha<\/td><td>Falso negativo deixa passar<\/td><td>Falso <b>positivo bloqueia tráfego legítimo<\/b>; pode virar gargalo/ponto único<\/td><\/tr><tr><td>Tipos<\/td><td>NIDS (rede, ex.: Snort, Suricata, Zeek) · HIDS (host, ex.: OSSEC/Wazuh)<\/td><td>NIPS · HIPS<\/td><\/tr><tr><td>Métodos<\/td><td><b>Assinatura<\/b> (misuse): conhece o ataque, baixo FP, não pega zero-day · <b>Anomalia<\/b> (comportamento/estatística): pega o novo, mais falsos positivos · Análise de protocolo (stateful)<\/td><td>idem<\/td><\/tr><\/tbody><\/table>\n<p><b>VPN<\/b> = túnel cifrado sobre rede pública. Tipos: <b>site-to-site<\/b> (gateway↔gateway, normalmente IPsec modo túnel) e <b>acesso remoto<\/b> (cliente↔gateway: IPsec/IKEv2 ou <b>SSL/TLS VPN<\/b>, que pode ser clientless via navegador). Split tunneling = só o tráfego corporativo vai pelo túnel (risco: máquina ponte). Protocolos legados: PPTP (inseguro), L2TP (sem cifra própria → L2TP/IPsec). WireGuard = moderno (ChaCha20, Curve25519).<\/p>\n<p><b>DMZ<\/b> (rede de perímetro): hospeda serviços expostos (web, e-mail, DNS externo). Arquitetura <b>screened subnet<\/b> = DMZ entre dois firewalls (ou firewall de 3 pernas). <b>Bastion host<\/b> = host endurecido exposto. <b>Honeypot<\/b> = isca para detectar/estudar atacantes.<\/p>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU<\/div><div class=\"boxb\"><b>Filtro de pacotes = porteiro que só olha o crachá<\/b> (IP/porta). <b>Stateful = porteiro com caderno<\/b> (lembra quem entrou). <b>Proxy = recepcionista que leva o recado<\/b> (fala por você na camada 7). <b>IDS = alarme<\/b> (avisa) · <b>IPS = segurança armado<\/b> (bloqueia, inline). Assinatura = vacina conhecida; anomalia = febre (algo diferente do normal).<\/div><\/div>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO<\/div><div class=\"boxb\">(1) “IDS bloqueia o ataque” — <b>falso<\/b> (só se integrado a outro dispositivo). (2) “Filtro de pacotes analisa o conteúdo HTTP” — falso. (3) “IDS por assinatura detecta ataques de dia zero” — falso, isso é anomalia. (4) No proxy <b>não há conexão direta<\/b> cliente–servidor. (5) Falso positivo = alerta sem ataque; falso negativo = ataque sem alerta (o mais perigoso).<\/div><\/div>\n"},{"id":"df2","mod":"Defensiva","modTitle":"Módulo 2 — Segurança Defensiva","title":"2.2 Controle de acesso à rede (802.1X, EAP, RADIUS) e segurança em aplicações (OWASP, SAMM, CVE, CWE)","prio":"Alta","html":"\n<h4>IEEE 802.1X — NAC baseado em porta<\/h4>\n<table class=\"tb \"><thead><tr><th>Papel<\/th><th>Quem é<\/th><th>Fala com<\/th><\/tr><\/thead><tbody><tr><td><b>Suplicante<\/b><\/td><td>Dispositivo/usuário que quer acessar (cliente 802.1X)<\/td><td>Autenticador via <b>EAPOL<\/b> (EAP over LAN)<\/td><\/tr><tr><td><b>Autenticador<\/b><\/td><td><b>Switch ou AP<\/b> — controla a porta (só libera EAPOL até autenticar)<\/td><td>Servidor via <b>RADIUS<\/b> (EAP encapsulado)<\/td><\/tr><tr><td><b>Servidor de autenticação<\/b><\/td><td><b>RADIUS<\/b> (ex.: FreeRADIUS, NPS) — decide e pode atribuir VLAN<\/td><td>—<\/td><\/tr><\/tbody><\/table>\n<table class=\"tb \"><thead><tr><th>Método EAP<\/th><th>Autenticação<\/th><th>Observação<\/th><\/tr><\/thead><tbody><tr><td><b>EAP-TLS<\/b><\/td><td>Certificado no <b>servidor e no cliente<\/b> (mútua)<\/td><td>Mais seguro; exige PKI para clientes<\/td><\/tr><tr><td><b>PEAP<\/b> (ex.: PEAPv0/EAP-MSCHAPv2)<\/td><td>Certificado só no servidor; senha dentro do túnel TLS<\/td><td>Comum em Windows/AD<\/td><\/tr><tr><td><b>EAP-TTLS<\/b><\/td><td>Certificado no servidor; túnel com métodos internos variados (PAP, CHAP...)<\/td><td><\/td><\/tr><tr><td>EAP-FAST<\/td><td>Túnel com PAC (Cisco), sem certificado obrigatório<\/td><td><\/td><\/tr><tr><td>EAP-MD5<\/td><td>Desafio/hash, <b>sem autenticação mútua<\/b> e sem chaves dinâmicas<\/td><td>Inseguro, não usar em Wi-Fi<\/td><\/tr><\/tbody><\/table>\n<p><b>RADIUS<\/b>: AAA (Autenticação, Autorização, Accounting), <b>UDP 1812<\/b> (auth) e <b>1813<\/b> (accounting) — antigas 1645/1646; cifra <b>apenas a senha<\/b> no Access-Request; mensagens Access-Request/Accept/Reject/Challenge. <b>TACACS+<\/b> (Cisco): <b>TCP 49<\/b>, cifra o pacote inteiro e <b>separa<\/b> A, A e A (preferido para administrar equipamentos). Diameter = sucessor do RADIUS (TCP/SCTP).<\/p>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — 802.1X do Allan<\/div><div class=\"boxb\"><b>Porta do switch + login = 802.1X<\/b>. Trio: <b>Suplicante → Autenticador → RADIUS<\/b>, falando <b>EAP<\/b> (EAPOL no primeiro trecho, EAP dentro do RADIUS no segundo). O switch <b>não decide<\/b>, só repassa: quem decide é o RADIUS. EAP-TLS = certificado dos dois lados.<\/div><\/div>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO<\/div><div class=\"boxb\">(1) O autenticador é o <b>switch/AP<\/b>, não o servidor. (2) 802.1X é controle de acesso <b>em camada 2<\/b> (antes de o cliente ganhar IP na rede). (3) RADIUS usa <b>UDP<\/b>; TACACS+ usa TCP. (4) RADIUS não cifra o pacote todo. (5) EAP é um <b>framework<\/b> de autenticação, não um algoritmo de cifra.<\/div><\/div>\n<h4>OWASP Top 10<\/h4>\n<table class=\"tb \"><thead><tr><th>#<\/th><th>OWASP Top 10 <b>2021<\/b><\/th><th>OWASP Top 10 <b>2025<\/b> (publicado em 06/11/2025)<\/th><\/tr><\/thead><tbody><tr><td>A01<\/td><td><b>Broken Access Control<\/b> (inclui IDOR, path traversal, CSRF)<\/td><td>Broken Access Control (absorveu SSRF)<\/td><\/tr><tr><td>A02<\/td><td><b>Cryptographic Failures<\/b> (ex-Sensitive Data Exposure)<\/td><td>Security Misconfiguration<\/td><\/tr><tr><td>A03<\/td><td><b>Injection<\/b> (SQLi, comando, LDAP — <b>inclui XSS<\/b>)<\/td><td>Software Supply Chain Failures (nova; amplia “componentes vulneráveis”)<\/td><\/tr><tr><td>A04<\/td><td>Insecure Design (nova em 2021)<\/td><td>Cryptographic Failures<\/td><\/tr><tr><td>A05<\/td><td>Security Misconfiguration (inclui XXE)<\/td><td>Injection<\/td><\/tr><tr><td>A06<\/td><td>Vulnerable and Outdated Components<\/td><td>Insecure Design<\/td><\/tr><tr><td>A07<\/td><td>Identification and Authentication Failures<\/td><td>Authentication Failures<\/td><\/tr><tr><td>A08<\/td><td>Software and Data Integrity Failures (inclui desserialização insegura)<\/td><td>Software or Data Integrity Failures<\/td><\/tr><tr><td>A09<\/td><td>Security Logging and Monitoring Failures<\/td><td>Security Logging and Alerting Failures<\/td><\/tr><tr><td>A10<\/td><td>Server-Side Request Forgery (SSRF)<\/td><td>Mishandling of Exceptional Conditions (nova)<\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — OWASP 2021 (o do Allan)<\/div><div class=\"boxb\"><b>A01 Broken Access Control · A02 Cryptographic Failures · A03 Injection<\/b> → “<b>A<\/b>cesso, <b>C<\/b>ripto, <b>I<\/b>njeção” = <b>ACI<\/b>. XSS está <b>dentro de Injection<\/b> desde 2021. SSRF era A10 em 2021. Em <b>2025<\/b>: A01 continua Broken Access Control; <b>A02 vira Security Misconfiguration<\/b>; A03 = Supply Chain. Leia o ano no enunciado!<\/div><\/div>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO<\/div><div class=\"boxb\">O edital diz só “OWASP Top 10”: se a questão não citar o ano, procure a resposta que vale para as duas versões (ex.: Broken Access Control = A01 em ambas). IDOR (acessar /conta?id=124 de outro usuário) é <b>Broken Access Control<\/b>, não Injection.<\/div><\/div>\n<p><b>XSS<\/b> (CWE-79): <b>refletido<\/b> (payload volta na resposta, via link), <b>armazenado<\/b> (persistente no servidor) e <b>baseado em DOM<\/b> (a injeção ocorre no <b>lado do cliente<\/b>, pelo JavaScript da página). Defesas: codificação de saída por contexto, validação de entrada, CSP, HttpOnly. <b>SQLi<\/b> (CWE-89): defesa principal = <b>consultas parametrizadas/prepared statements<\/b>. <b>CSRF<\/b>: tokens anti-CSRF, SameSite. <b>SSRF<\/b>: lista de permissão de destinos.<\/p>\n<h4>OWASP SAMM (Software Assurance Maturity Model) v2<\/h4>\n<p>Modelo aberto para <b>avaliar e melhorar a maturidade<\/b> do programa de software seguro: <b>5 funções de negócio × 3 práticas = 15 práticas<\/b>; cada prática tem <b>2 fluxos (streams)<\/b> e <b>3 níveis de maturidade<\/b> (1 a 3; nível 0 = ausência implícita).<\/p>\n<table class=\"tb \"><thead><tr><th>Função de negócio (SAMM v2)<\/th><th>3 práticas de segurança<\/th><\/tr><\/thead><tbody><tr><td><b>Governance<\/b><\/td><td>Strategy &amp; Metrics · Policy &amp; Compliance · Education &amp; Guidance<\/td><\/tr><tr><td><b>Design<\/b><\/td><td>Threat Assessment · Security Requirements · Security Architecture<\/td><\/tr><tr><td><b>Implementation<\/b><\/td><td>Secure Build · Secure Deployment · Defect Management<\/td><\/tr><tr><td><b>Verification<\/b><\/td><td>Architecture Assessment · Requirements-driven Testing · Security Testing<\/td><\/tr><tr><td><b>Operations<\/b><\/td><td>Incident Management · Environment Management · Operational Management<\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — SAMM<\/div><div class=\"boxb\"><b>“GoDe ImVeOp”<\/b> → <b>Go<\/b>vernance, <b>De<\/b>sign, <b>Im<\/b>plementation, <b>Ve<\/b>rification, <b>Op<\/b>erations. 5 × 3 × 2 streams × 3 níveis.<\/div><\/div>\n<p><b>CVE<\/b> (MITRE/programa CVE; identificador <code>CVE-AAAA-NNNNN<\/code>, atribuído por CNAs) identifica <b>uma vulnerabilidade específica<\/b>; o <b>NVD<\/b> (NIST) enriquece com CVSS e CPE. <b>CVSS<\/b> v3.x: 0 None; 0,1–3,9 Low; 4,0–6,9 Medium; 7,0–8,9 High; 9,0–10 Critical. <b>CWE<\/b> classifica <b>tipos de fraqueza<\/b>; o <b>CWE Top 25<\/b> lista as mais perigosas (no Top 25 de 2024, CWE-79 XSS ficou em 1º, seguido de CWE-787 out-of-bounds write e CWE-89 SQLi).<\/p>\n"},{"id":"df3","mod":"Defensiva","modTitle":"Módulo 2 — Segurança Defensiva","title":"2.3 Propriedades da segurança da informação","prio":"Média","html":"\n<table class=\"tb \"><thead><tr><th>Propriedade<\/th><th>Definição de prova<\/th><th>Mecanismo típico<\/th><\/tr><\/thead><tbody><tr><td><b>Confidencialidade<\/b><\/td><td>Informação não disponível/revelada a quem não é autorizado<\/td><td>Cifragem, controle de acesso<\/td><\/tr><tr><td><b>Integridade<\/b><\/td><td>Informação não modificada/destruída de forma não autorizada ou acidental<\/td><td>Hash, MAC, assinatura<\/td><\/tr><tr><td><b>Disponibilidade<\/b><\/td><td>Acessível e utilizável sob demanda por quem é autorizado<\/td><td>Redundância, backup, anti-DDoS<\/td><\/tr><tr><td><b>Autenticidade<\/b><\/td><td>Garante a <b>origem/autoria<\/b> (quem produziu, expediu, modificou)<\/td><td>Assinatura, MAC, autenticação<\/td><\/tr><tr><td><b>Irretratabilidade<\/b> (não repúdio)<\/td><td>Autor <b>não pode negar<\/b> a autoria<\/td><td><b>Assinatura digital<\/b> (chave privada exclusiva) + carimbo do tempo<\/td><\/tr><tr><td><b>Autorização de acesso<\/b><\/td><td>Define o que o sujeito autenticado <b>pode fazer<\/b><\/td><td>ACL, RBAC, menor privilégio<\/td><\/tr><\/tbody><\/table>\n<p>Sequência <b>IAAA<\/b>: Identificação (quem diz ser) → <b>Autenticação<\/b> (prova) → <b>Autorização<\/b> (o que pode) → Auditoria/Accounting (o que fez). Modelos de controle de acesso: <b>DAC<\/b> (dono decide), <b>MAC<\/b> (rótulos/níveis definidos pelo sistema), <b>RBAC<\/b> (papéis), <b>ABAC<\/b> (atributos).<\/p>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU<\/div><div class=\"boxb\"><b>CIDA + Não-repúdio<\/b>. <b>MAC (código) dá integridade + autenticidade, mas NÃO não repúdio<\/b> (a chave é compartilhada — qualquer um dos dois poderia ter gerado). Só a <b>assinatura digital<\/b> dá não repúdio.<\/div><\/div>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO<\/div><div class=\"boxb\">Autenticação ≠ autorização (questão clássica). E “autenticidade” é sobre <b>origem<\/b>, “integridade” é sobre <b>conteúdo<\/b>.<\/div><\/div>\n"},{"id":"df4","mod":"Defensiva","modTitle":"Módulo 2 — Segurança Defensiva","title":"2.4 Mecanismos de segurança: hash, cifragem, assinatura, envelope, certificado, MFA, carimbo do tempo, redundância","prio":"Alta","html":"\n<table class=\"tb \"><thead><tr><th>Família<\/th><th>Algoritmos<\/th><th>Para quê<\/th><\/tr><\/thead><tbody><tr><td><b>Simétrica<\/b> (1 chave secreta, rápida)<\/td><td><b>AES<\/b> (bloco 128 bits; chaves 128/192/256), <b>3DES<\/b> (legado), <b>ChaCha20<\/b> (fluxo), Blowfish/Twofish, RC4 (fluxo, quebrado), DES (56 bits, quebrado)<\/td><td>Cifrar volumes de dados<\/td><\/tr><tr><td><b>Assimétrica<\/b> (par pública/privada, lenta)<\/td><td><b>RSA<\/b> (fatoração), <b>ECC<\/b> (curvas elípticas — chaves menores, mesma segurança), <b>Diffie-Hellman<\/b> (só <b>troca de chaves<\/b>), <b>DSA/ECDSA<\/b> (só <b>assinatura<\/b>), ElGamal<\/td><td>Troca de chaves, assinatura, envelope<\/td><\/tr><tr><td><b>Hash<\/b> (sem chave, unidirecional)<\/td><td>MD5 (128 bits, quebrado), SHA-1 (160, colisões), <b>SHA-256<\/b> (256 bits = 64 hex), SHA-512, SHA-3<\/td><td>Integridade, resumo para assinatura<\/td><\/tr><tr><td><b>MAC<\/b><\/td><td>HMAC, CMAC, GMAC; AEAD: AES-GCM, ChaCha20-Poly1305<\/td><td>Integridade + autenticidade<\/td><\/tr><tr><td><b>Senhas<\/b><\/td><td>bcrypt, scrypt, Argon2, PBKDF2 (lentos + <b>salt<\/b>)<\/td><td>Armazenar senhas (salt anula rainbow tables)<\/td><\/tr><\/tbody><\/table>\n<table class=\"tb \"><thead><tr><th>Modo (NIST SP 800-38A)<\/th><th>Como funciona<\/th><th>Bizu<\/th><\/tr><\/thead><tbody><tr><td>ECB<\/td><td>Cada bloco cifrado independentemente<\/td><td>Blocos iguais → cifrados iguais (vaza padrão: “pinguim”)<\/td><\/tr><tr><td><b>CBC<\/b><\/td><td>Bloco de texto claro XOR <b>bloco cifrado anterior<\/b>; o 1º usa <b>IV<\/b><\/td><td>Encadeado; erro propaga; não paraleliza cifragem<\/td><\/tr><tr><td>CFB / OFB<\/td><td>Transformam a cifra de bloco em cifra de fluxo (realimentação do cifrado / da saída)<\/td><td><\/td><\/tr><tr><td>CTR<\/td><td>Cifra um contador e faz XOR com o texto; paralelizável<\/td><td>Base do GCM<\/td><\/tr><tr><td>GCM<\/td><td>CTR + autenticação (GMAC) → AEAD<\/td><td>Usado no TLS 1.3<\/td><\/tr><\/tbody><\/table>\n<p><b>RSA<\/b>: escolhe primos p, q; n = p·q; φ(n)=(p−1)(q−1); e coprimo de φ(n); d = e<sup>−1<\/sup> mod φ(n). Chave pública (e, n), privada (d, n). <b>Cifrar: C = M<sup>e<\/sup> mod n · Decifrar: M = C<sup>d<\/sup> mod n<\/b>. Assinar = usar a <b>privada<\/b> do emissor; verificar = pública do emissor.<\/p>\n<table class=\"tb \"><thead><tr><th>Mecanismo<\/th><th>Como funciona<\/th><th>Garante<\/th><\/tr><\/thead><tbody><tr><td><b>Resumo de mensagem<\/b> (hash)<\/td><td>h = H(M), tamanho fixo, unidirecional, resistente a colisão<\/td><td>Integridade (sozinho não autentica)<\/td><\/tr><tr><td><b>Assinatura digital<\/b><\/td><td>Hash da mensagem cifrado com a <b>chave privada do remetente<\/b>; verificação com a pública dele<\/td><td>Integridade + autenticidade + <b>não repúdio<\/b> (<b>não<\/b> confidencialidade)<\/td><\/tr><tr><td><b>Envelope digital<\/b><\/td><td>Mensagem cifrada com <b>chave simétrica de sessão<\/b>; essa chave é cifrada com a <b>chave pública do destinatário<\/b><\/td><td>Confidencialidade com desempenho (híbrido)<\/td><\/tr><tr><td><b>Certificado digital<\/b> (X.509 v3)<\/td><td>Documento assinado por uma <b>AC<\/b> que vincula uma <b>chave pública<\/b> a um titular; campos: versão, nº de série, algoritmo, emissor, validade, titular, chave pública, extensões<\/td><td>Confiança na chave pública; revogação via <b>LCR/CRL<\/b> ou <b>OCSP<\/b><\/td><\/tr><tr><td><b>MFA<\/b><\/td><td>Fatores de <b>categorias diferentes<\/b>: algo que você <b>sabe<\/b> (senha), <b>tem<\/b> (token, celular, smartcard), <b>é<\/b> (biometria) [+ onde está/comportamento]<\/td><td>Autenticação forte<\/td><\/tr><tr><td><b>Carimbo do tempo<\/b><\/td><td>Emitido por <b>ACT<\/b>: assina o hash do documento + data/hora confiável (RFC 3161)<\/td><td>Prova de <b>existência<\/b> em um momento; reforça não repúdio e validade de longo prazo<\/td><\/tr><\/tbody><\/table>\n<table class=\"tb \"><thead><tr><th>Redundância / tolerância a falhas<\/th><th>Detalhe<\/th><\/tr><\/thead><tbody><tr><td>RAID 0<\/td><td>Striping, <b>sem redundância<\/b> (só desempenho); mín. 2 discos<\/td><\/tr><tr><td><b>RAID 1<\/b><\/td><td><b>Espelhamento<\/b>; mín. 2 discos; tolera perda de 1<\/td><\/tr><tr><td>RAID 5<\/td><td>Striping com <b>paridade distribuída<\/b>; mín. 3; tolera 1 disco<\/td><\/tr><tr><td>RAID 6<\/td><td>Dupla paridade; mín. 4; tolera 2<\/td><\/tr><tr><td>RAID 10 (1+0)<\/td><td>Espelhos em stripe; mín. 4; desempenho + redundância<\/td><\/tr><tr><td>Cluster / failover<\/td><td>Ativo-ativo (todos atendem, balanceamento) ou ativo-passivo (standby assume)<\/td><\/tr><tr><td>Sites de contingência<\/td><td><b>Hot<\/b> (pronto, minutos) · <b>Warm<\/b> (parcial) · <b>Cold<\/b> (só espaço/infra)<\/td><\/tr><tr><td>Backup<\/td><td>Completo · <b>Incremental<\/b> (desde o último backup de qualquer tipo; restauração = completo + todos os incrementais) · <b>Diferencial<\/b> (desde o último completo; restauração = completo + último diferencial)<\/td><\/tr><tr><td>Métricas<\/td><td><b>RPO<\/b> = quanto de dado posso perder (tempo até o último backup) · <b>RTO<\/b> = em quanto tempo preciso voltar · MTBF/MTTR<\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — Cripto do Allan<\/div><div class=\"boxb\"><b>Simétricos: AES, 3DES, ChaCha20<\/b> (e DES, RC4, Blowfish). <b>Assimétricos: RSA, ECC, DH, DSA<\/b>. <b>Hash não é cifra<\/b> (não tem chave nem volta). <b>Assina com a MINHA privada; cifro para você com a SUA pública<\/b>. SHA-256 = 64 caracteres hex; MD5 = 32 hex; SHA-1 = 40 hex.<\/div><\/div>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO<\/div><div class=\"boxb\">(1) Diffie-Hellman <b>não cifra<\/b> mensagens nem assina — só acorda chave (e sem autenticação é vulnerável a MitM). (2) Assinatura digital <b>não<\/b> dá sigilo. (3) Dois fatores da mesma categoria (senha + PIN) <b>não<\/b> é MFA. (4) RAID não é backup. (5) Incremental = backup rápido / restauração lenta; diferencial = o inverso.<\/div><\/div>\n"},{"id":"df5","mod":"Defensiva","modTitle":"Módulo 2 — Segurança Defensiva","title":"2.5 ICP-Brasil","prio":"Média","html":"\n<p>Instituída pela <b>MP 2.200-2/2001<\/b> (validade jurídica de documentos eletrônicos). Modelo <b>hierárquico de raiz única<\/b>.<\/p>\n<table class=\"tb \"><thead><tr><th>Entidade<\/th><th>Papel<\/th><\/tr><\/thead><tbody><tr><td><b>Comitê Gestor (CG ICP-Brasil)<\/b><\/td><td>Autoridade gestora de <b>políticas<\/b>: aprova normas, critérios de credenciamento (vinculado à Casa Civil)<\/td><\/tr><tr><td><b>AC Raiz<\/b> = <b>ITI<\/b> (Instituto Nacional de Tecnologia da Informação, autarquia federal)<\/td><td>Primeira autoridade da cadeia; executa as políticas; emite, expede, distribui, revoga e gerencia certificados <b>das ACs de nível imediatamente subsequente<\/b>; credencia e fiscaliza. <b>É vedado emitir certificado para usuário final<\/b><\/td><\/tr><tr><td><b>AC<\/b> (Autoridade Certificadora)<\/td><td>Emite, renova, revoga certificados e publica a <b>LCR<\/b>; pode ser de 1º ou 2º nível<\/td><\/tr><tr><td><b>AR<\/b> (Autoridade de Registro)<\/td><td>Interface com o usuário: <b>identificação/validação<\/b> do titular e encaminhamento da solicitação à AC (não emite certificado)<\/td><\/tr><tr><td><b>ACT<\/b> (Autoridade de Carimbo do Tempo)<\/td><td>Emite <b>carimbos do tempo<\/b> com fonte confiável de tempo (rastreável à Hora Legal Brasileira)<\/td><\/tr><tr><td>PSS / PSBio<\/td><td>Prestadores de Serviço de Suporte (infraestrutura) / biometria<\/td><\/tr><\/tbody><\/table>\n<p><b>Tipos de certificado<\/b>: <b>A<\/b> = assinatura (A1: chaves geradas e guardadas em <b>software<\/b>; A3/A4: em <b>hardware criptográfico<\/b> — token/smartcard/HSM) · <b>S<\/b> = sigilo (cifragem) · <b>T<\/b> = carimbo do tempo (equipamentos de ACT). Normas da ICP: documentos <b>DOC-ICP<\/b> (ex.: DOC-ICP-04 requisitos das políticas de certificado); padrões de assinatura <b>CAdES, XAdES, PAdES<\/b>; certificados no padrão <b>X.509 v3<\/b>. A <b>Lei 14.063/2020<\/b> classifica as assinaturas eletrônicas em <b>simples, avançada e qualificada<\/b> — a <b>qualificada<\/b> é a que usa certificado ICP-Brasil.<\/p>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU<\/div><div class=\"boxb\"><b>CG = Cérebro (políticas) · ITI = AC Raiz (só certifica ACs) · AC = cartório que emite · AR = balcão que confere documento · ACT = relógio oficial<\/b>. “AR não emite”, “Raiz não emite para usuário final”.<\/div><\/div>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO<\/div><div class=\"boxb\">A AC Raiz <b>não<\/b> é o Comitê Gestor. A AR <b>não<\/b> assina certificados. Certificado A1 não fica em token.<\/div><\/div>\n"},{"id":"df6","mod":"Defensiva","modTitle":"Módulo 2 — Segurança Defensiva","title":"2.6 Comunicação segura: SSL, TLS e IPsec","prio":"Alta","html":"\n<h4>SSL/TLS<\/h4>\n<p>Fornece canal seguro entre duas partes: <b>servidor sempre autenticado<\/b> (certificado), <b>cliente opcionalmente<\/b> (mTLS). SSL 2.0/3.0 <b>proibidos<\/b> (SSLv3 → ataque <b>POODLE<\/b>, RFC 7568); TLS 1.0/1.1 descontinuados (RFC 8996). Subprotocolos: Handshake, Record, Alert, ChangeCipherSpec.<\/p>\n<table class=\"tb \"><thead><tr><th><\/th><th>TLS 1.2<\/th><th>TLS 1.3 (RFC 8446)<\/th><\/tr><\/thead><tbody><tr><td>Handshake<\/td><td>2-RTT: ClientHello → <b>ServerHello<\/b>, Certificate, ServerKeyExchange, ServerHelloDone → ClientKeyExchange, ChangeCipherSpec, Finished<\/td><td><b>1-RTT<\/b> (e <b>0-RTT<\/b> na retomada, com risco de replay)<\/td><\/tr><tr><td>Troca de chaves<\/td><td>RSA estático ou (EC)DHE<\/td><td><b>Só (EC)DHE<\/b> → <b>sigilo perfeito (PFS) obrigatório<\/b><\/td><\/tr><tr><td>Cifras<\/td><td>CBC, RC4, GCM...<\/td><td><b>Só AEAD<\/b>: AES-GCM, AES-CCM, ChaCha20-Poly1305<\/td><\/tr><tr><td>Removido em 1.3<\/td><td>—<\/td><td>RSA key exchange, CBC, RC4, MD5/SHA-1, compressão, renegociação<\/td><\/tr><\/tbody><\/table>\n<p>Resposta do servidor ao ClientHello aceitável = <b>ServerHello<\/b> (se não puder negociar → alerta <i>handshake_failure<\/i>; no 1.3 pode pedir HelloRetryRequest).<\/p>\n<h4>IPsec (camada 3)<\/h4>\n<table class=\"tb \"><thead><tr><th><\/th><th><b>AH<\/b> (Authentication Header, protocolo IP 51)<\/th><th><b>ESP<\/b> (Encapsulating Security Payload, protocolo IP 50)<\/th><\/tr><\/thead><tbody><tr><td>Confidencialidade<\/td><td><b>Não<\/b><\/td><td><b>Sim<\/b><\/td><\/tr><tr><td>Integridade + autenticação de origem + anti-replay<\/td><td>Sim (inclui campos imutáveis do <b>cabeçalho IP<\/b>)<\/td><td>Sim (do payload ESP)<\/td><\/tr><tr><td>NAT<\/td><td><b>Incompatível<\/b> (NAT altera IP autenticado)<\/td><td>Funciona com NAT-T (UDP 4500)<\/td><\/tr><\/tbody><\/table>\n<p><b>Modo transporte<\/b>: protege só o payload (host↔host). <b>Modo túnel<\/b>: encapsula o pacote IP inteiro com novo cabeçalho (gateway↔gateway, VPN). <b>IKE<\/b> (v1/v2, <b>UDP 500<\/b>) negocia as <b>SAs<\/b> (Security Associations — <b>unidirecionais<\/b>, identificadas pelo <b>SPI<\/b>); bases SPD (políticas) e SAD (SAs). ICV do AH com <b>HMAC-SHA1-96<\/b> = HMAC-SHA1 (160 bits) <b>truncado para 96 bits<\/b>.<\/p>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU<\/div><div class=\"boxb\"><b>AH = Autentica, não esconde<\/b>; <b>ESP = Esconde (e também autentica)<\/b>. <b>Túnel = pacote inteiro dentro de outro<\/b> (VPN entre sites). <b>IKE = UDP 500<\/b> negocia; <b>SA é mão única<\/b> (precisa de duas para ida e volta). TLS 1.3 = 1-RTT, só AEAD, só (EC)DHE.<\/div><\/div>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO<\/div><div class=\"boxb\">“No TLS, o cliente é sempre autenticado” — falso. “AH provê confidencialidade” — falso. “TLS 1.3 aceita troca de chaves RSA” — falso. “SSLv3 é seguro se usado com AES” — falso (protocolo descontinuado).<\/div><\/div>\n"},{"id":"df7","mod":"Defensiva","modTitle":"Módulo 2 — Segurança Defensiva","title":"2.7 Segurança no endpoint: antimalware e firewall pessoal","prio":"Média","html":"\n<table class=\"tb \"><thead><tr><th>Técnica de detecção<\/th><th>Como funciona<\/th><th>Ponto fraco<\/th><\/tr><\/thead><tbody><tr><td><b>Assinatura<\/b><\/td><td>Compara com base de padrões (hash, sequência de bytes)<\/td><td>Não detecta malware novo/polimórfico<\/td><\/tr><tr><td><b>Heurística<\/b><\/td><td>Regras/pontuação de características suspeitas no código<\/td><td>Falsos positivos<\/td><\/tr><tr><td><b>Comportamental<\/b><\/td><td>Observa ações em execução (cifrar muitos arquivos, injetar em processos)<\/td><td>Detecta depois de começar<\/td><\/tr><tr><td><b>Sandbox<\/b><\/td><td>Executa em ambiente isolado antes de liberar<\/td><td>Malware que detecta VM/atrasa execução<\/td><\/tr><tr><td>EDR / XDR<\/td><td>Telemetria contínua do endpoint, detecção, investigação e resposta (isolar host); XDR correlaciona várias fontes<\/td><td>—<\/td><\/tr><\/tbody><\/table>\n<p><b>Firewall pessoal<\/b> (host-based): filtra tráfego <b>de/para aquele host<\/b>, por aplicação, porta e perfil de rede. <b>Windows Defender Firewall<\/b>: perfis <b>Domínio, Privado e Público<\/b>; por padrão <b>bloqueia conexões de entrada<\/b> não permitidas e <b>permite as de saída<\/b>; regras por programa/porta/serviço; gerenciável por GPO. Linux: iptables/nftables, ufw, firewalld.<\/p>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU<\/div><div class=\"boxb\">Firewall pessoal protege <b>o próprio host<\/b> (inclusive contra ameaça de dentro da LAN); firewall de rede protege o <b>segmento<\/b>. Defesa em profundidade = os dois.<\/div><\/div>\n"},{"id":"df8","mod":"Defensiva","modTitle":"Módulo 2 — Segurança Defensiva","title":"2.8 Segurança em sistemas operacionais: CIS Benchmarks, Linux e Windows","prio":"Média","html":"\n<p><b>CIS Benchmarks<\/b>: guias de <b>configuração segura (hardening)<\/b> desenvolvidos por <b>consenso<\/b> da comunidade, para SOs, nuvem, bancos, navegadores etc. Perfis: <b>Level 1<\/b> (básico, prático, baixo impacto na operação) e <b>Level 2<\/b> (defesa em profundidade, ambientes de alta segurança, pode reduzir funcionalidade); alguns têm perfil STIG. Verificação automatizada com <b>CIS-CAT<\/b>; imagens prontas “CIS Hardened Images”. Benchmarks ≠ CIS Controls (os Controls são a lista priorizada de 18 controles — ver 3.2).<\/p>\n<table class=\"tb \"><thead><tr><th>Linux<\/th><th>Ponto de prova<\/th><\/tr><\/thead><tbody><tr><td>Permissões <code>rwx<\/code><\/td><td>r=4, w=2, x=1 · <code>chmod 750 arq<\/code> = dono rwx, grupo r-x, outros ---<\/td><\/tr><tr><td><b>SUID<\/b> (4xxx)<\/td><td>Executa com o UID do <b>dono<\/b> (ex.: /usr/bin/passwd) — alvo de escalação<\/td><\/tr><tr><td><b>SGID<\/b> (2xxx)<\/td><td>Executa com o grupo do arquivo; em diretório, novos arquivos herdam o grupo<\/td><\/tr><tr><td><b>Sticky bit<\/b> (1xxx)<\/td><td>Em diretório (ex.: /tmp, 1777): só o dono apaga seu arquivo<\/td><\/tr><tr><td><b>umask<\/b><\/td><td>Retira permissões do padrão: umask 022 → arquivos 644, diretórios 755<\/td><\/tr><tr><td><b>inode<\/b><\/td><td>Estrutura (ext2/3/4) que guarda os <b>metadados<\/b>: tipo, permissões, UID, GID, tamanho, timestamps, ponteiros para blocos — <b>não guarda o nome<\/b> (o nome fica na entrada de diretório)<\/td><\/tr><tr><td>/etc/passwd × /etc/shadow<\/td><td>passwd é legível por todos; <b>shadow<\/b> guarda hashes (acesso só root)<\/td><\/tr><tr><td>sudo, PAM, SELinux/AppArmor<\/td><td>Menor privilégio; <b>MAC<\/b> (controle de acesso mandatório) além do DAC<\/td><\/tr><tr><td>chattr +i<\/td><td>Arquivo imutável (nem root altera sem remover o atributo)<\/td><\/tr><\/tbody><\/table>\n<table class=\"tb \"><thead><tr><th>Windows<\/th><th>Ponto de prova<\/th><\/tr><\/thead><tbody><tr><td>UAC<\/td><td>Executa com token padrão até elevação explícita<\/td><\/tr><tr><td><b>BitLocker<\/b><\/td><td>Cifra o <b>volume inteiro<\/b> (com TPM) — protege dados de notebook perdido/roubado em viagem<\/td><\/tr><tr><td>EFS<\/td><td>Cifra <b>arquivos/pastas<\/b> individuais por usuário (NTFS)<\/td><\/tr><tr><td>Credential Guard / LSA Protection<\/td><td>Isola segredos do LSASS (contra mimikatz)<\/td><\/tr><tr><td>AppLocker / WDAC<\/td><td>Lista de permissão de aplicativos<\/td><\/tr><tr><td>GPO, LAPS<\/td><td>Políticas centralizadas; senha de admin local única e rotativa<\/td><\/tr><tr><td>Eventos de segurança<\/td><td><b>4624<\/b> logon OK · <b>4625<\/b> logon falho · 4672 privilégios especiais · 4688 processo criado · 4720 conta criada · <b>1102<\/b> log de auditoria apagado<\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU<\/div><div class=\"boxb\"><b>4-2-1 = r-w-x<\/b>; <b>SUID-SGID-Sticky = 4-2-1<\/b> no dígito extra. <b>inode tem tudo, menos o nome<\/b>. <b>BitLocker = disco; EFS = arquivo<\/b>.<\/div><\/div>\n"},{"id":"df9","mod":"Defensiva","modTitle":"Módulo 2 — Segurança Defensiva","title":"2.9 Segurança em sistemas de controle e automação industrial (ICS/OT)","prio":"Média","html":"\n<p><b>Componentes<\/b>: CLP/PLC (controlador lógico programável), RTU (unidade terminal remota), IHM/HMI, <b>SCADA<\/b> (supervisão e aquisição de dados, geograficamente distribuído — dutos!), DCS (controle distribuído, planta), historiador, estação de engenharia, SIS (sistema instrumentado de segurança). <b>Prioridade em OT: Disponibilidade e segurança física (safety) &gt; Integridade &gt; Confidencialidade<\/b> (inverte a tríade de TI). Protocolos legados <b>sem autenticação/cifra<\/b>: <b>Modbus<\/b> (TCP 502), DNP3, Profinet, EtherNet/IP; OPC UA tem segurança nativa. Modelo de referência <b>Purdue<\/b>: nível 0 (processo), 1 (controle — CLP), 2 (supervisão — SCADA/IHM), 3 (operações — MES/historiador), <b>3.5 DMZ industrial<\/b>, 4–5 (corporativo/internet).<\/p>\n<p><b>Ameaças históricas<\/b>: <b>Stuxnet<\/b> (2010, worm contra CLPs Siemens de centrífugas iranianas), BlackEnergy e Industroyer/CrashOverride (rede elétrica da Ucrânia 2015/2016), <b>Triton/Trisis<\/b> (2017, mirou o SIS), ransomware no ambiente de TI que paralisa OT (ex.: Colonial Pipeline, 2021 — oleoduto). Vulnerabilidades típicas: senhas padrão, sistemas sem patch (SO legado), acesso remoto de fornecedo
