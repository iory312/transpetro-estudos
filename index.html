ção positiva (allowlist)<\/td><\/tr><\/tbody><\/table><div class=\"box bizu\"><div class=\"boxh\">Conectivos do texto<\/div><div class=\"boxb\">when, or, as, before<\/div><\/div>","fonte":"OWASP Top 10:2021 — A03 Injection","url":"https://owasp.org/Top10/A03_2021-Injection/"},{"id":"le8","mod":"Inglês","modTitle":"Leitura em Inglês (textos reais)","title":"Text 8 — Ransomware — visão geral (CISA)","prio":"Alta","html":"<div class=\"texto\"><p class=\"tt\">Text 8 — Ransomware — visão geral (CISA) (texto real)<\/p><p>Ransomware is a form of malware designed to encrypt files on a device, rendering any files and the systems that rely on them unusable. Malicious actors then demand ransom in exchange for decryption. In recent years, ransomware incidents have become increasingly prevalent among the Nation&#x27;s state, local, tribal, and territorial (SLTT) government entities and critical infrastructure organizations. Ransomware incidents can severely impact business processes and leave organizations without the data they need to operate and deliver mission-critical services. Malicious actors have adjusted their ransomware tactics over time to include pressuring victims for payment by threatening to release stolen data if they refuse to pay and publicly naming and shaming victims as secondary forms of extortion. The monetary value of ransom demands has also increased. Ransomware incidents have become more destructive: malicious actors engage in lateral movement to target critical data and propagate ransomware across entire networks. These actors also increasingly use tactics, such as deleting system backups, that make restoration and recovery more difficult or infeasible for impacted organizations.<\/p><p class=\"small\">Fonte: CISA / MS-ISAC — Ransomware Guide (Sep 2020), Overview — <a href=\"https://www.cisa.gov/sites/default/files/publications/CISA_MS-ISAC_Ransomware%20Guide_S508C.pdf\" target=\"_blank\" rel=\"noopener\">https://www.cisa.gov/sites/default/files/publications/CISA_MS-ISAC_Ransomware%20Guide_S508C.pdf<\/a><\/p><\/div><h4>Vocabulário<\/h4><table class=\"tb\"><thead><tr><th>Termo<\/th><th>Tradução<\/th><\/tr><\/thead><tbody><tr><td><b>encrypt<\/b><\/td><td>cifrar<\/td><\/tr><tr><td><b>ransom<\/b><\/td><td>resgate<\/td><\/tr><tr><td><b>prevalent<\/b><\/td><td>prevalente<\/td><\/tr><tr><td><b>mission-critical<\/b><\/td><td>crítico para a missão<\/td><\/tr><tr><td><b>extortion<\/b><\/td><td>extorsão<\/td><\/tr><tr><td><b>propagate<\/b><\/td><td>propagar<\/td><\/tr><tr><td><b>backups<\/b><\/td><td>cópias de segurança<\/td><\/tr><tr><td><b>restoration<\/b><\/td><td>restauração<\/td><\/tr><tr><td><b>infeasible<\/b><\/td><td>inviável<\/td><\/tr><\/tbody><\/table><div class=\"box bizu\"><div class=\"boxh\">Conectivos do texto<\/div><div class=\"boxb\">then, if, such as, also<\/div><\/div>","fonte":"CISA / MS-ISAC — Ransomware Guide (Sep 2020), Overview","url":"https://www.cisa.gov/sites/default/files/publications/CISA_MS-ISAC_Ransomware%20Guide_S508C.pdf"},{"id":"le9","mod":"Inglês","modTitle":"Leitura em Inglês (textos reais)","title":"Text 9 — Ransomware — vetores (RDP, phishing, SMB)","prio":"Alta","html":"<div class=\"texto\"><p class=\"tt\">Text 9 — Ransomware — vetores (RDP, phishing, SMB) (texto real)<\/p><p>Conduct regular vulnerability scanning to identify and address vulnerabilities, especially those on internet-facing devices, to limit the attack surface. Regularly patch and update software and OSs to the latest available versions. Prioritize timely patching of internet-facing servers—as well as software processing internet data, such as web browsers, browser plugins, and document readers—for known vulnerabilities. Ensure devices are properly configured and that security features are enabled. For example, disable ports and protocols that are not being used for a business purpose (e.g., Remote Desktop Protocol [RDP] – Transmission Control Protocol [TCP] Port 3389). Employ best practices for use of RDP and other remote desktop services. Threat actors often gain initial access to a network through exposed and poorly secured remote services, and later propagate ransomware. Audit the network for systems using RDP, close unused RDP ports, enforce account lockouts after a specified number of attempts, apply multi-factor authentication (MFA), and log RDP login attempts. Disable or block Server Message Block (SMB) protocol outbound and remove or disable outdated versions of SMB. Threat actors use SMB to propagate malware across organizations. Implement a cybersecurity user awareness and training program that includes guidance on how to identify and report suspicious activity (e.g., phishing) or incidents. To lower the chance of spoofed or modified emails from valid domains, implement Domain-based Message Authentication, Reporting and Conformance (DMARC) policy and verification.<\/p><p class=\"small\">Fonte: CISA / MS-ISAC — Ransomware Guide (Sep 2020), Prevention Best Practices — <a href=\"https://www.cisa.gov/sites/default/files/publications/CISA_MS-ISAC_Ransomware%20Guide_S508C.pdf\" target=\"_blank\" rel=\"noopener\">https://www.cisa.gov/sites/default/files/publications/CISA_MS-ISAC_Ransomware%20Guide_S508C.pdf<\/a><\/p><\/div><h4>Vocabulário<\/h4><table class=\"tb\"><thead><tr><th>Termo<\/th><th>Tradução<\/th><\/tr><\/thead><tbody><tr><td><b>internet-facing<\/b><\/td><td>exposto à internet<\/td><\/tr><tr><td><b>patch<\/b><\/td><td>corrigir/aplicar patch<\/td><\/tr><tr><td><b>RDP<\/b><\/td><td>área de trabalho remota<\/td><\/tr><tr><td><b>account lockouts<\/b><\/td><td>bloqueio de conta<\/td><\/tr><tr><td><b>SMB<\/b><\/td><td>Server Message Block<\/td><\/tr><tr><td><b>outbound<\/b><\/td><td>de saída<\/td><\/tr><tr><td><b>spoofed<\/b><\/td><td>falsificado<\/td><\/tr><tr><td><b>DMARC<\/b><\/td><td>autenticação de e-mail baseada em domínio<\/td><\/tr><\/tbody><\/table><div class=\"box bizu\"><div class=\"boxh\">Conectivos do texto<\/div><div class=\"boxb\">especially, as well as, For example, later<\/div><\/div>","fonte":"CISA / MS-ISAC — Ransomware Guide (Sep 2020), Prevention Best Practices","url":"https://www.cisa.gov/sites/default/files/publications/CISA_MS-ISAC_Ransomware%20Guide_S508C.pdf"},{"id":"le10","mod":"Inglês","modTitle":"Leitura em Inglês (textos reais)","title":"Text 10 — ICS / OT — práticas CISA","prio":"Alta","html":"<div class=\"texto\"><p class=\"tt\">Text 10 — ICS / OT — práticas CISA (texto real)<\/p><p>Industrial Control Systems (ICS) are important to supporting US critical infrastructure and maintaining national security. ICS owners and operators face threats from a variety of adversaries whose intentions include gathering intelligence and disrupting National Critical Functions. As ICS owners and operators adopt new technologies to improve operational efficiencies, they should be aware of the additional cybersecurity risk of connecting operational technology (OT) to enterprise information technology (IT) systems and Internet of Things (IoT) devices. Among the risks are: expanding ICS cyberattack surface, which may lead to an increase in security events; eliminating ICS network segmentation from traditional business IT systems or internet devices, resulting in greater access to critical systems; increasing susceptibility to IT commodity malware and ransomware, which can lead to a potential disruption of physical processes.<\/p><p>CISA assessments highlighted prevalent IT and OT weaknesses including boundary protection, principle of least functionality, identification and authentication, physical access control, and account management. Recommended practices include checking, prioritizing, testing, and implementing ICS security patches; backing up system data and configurations; implementing a risk-based defense-in-depth approach to securing ICS hosts and networks; utilizing segmentation of networks where possible; and configuring firewalls to control traffic between the ICS network and corporate IT network.<\/p><p class=\"small\">Fonte: CISA — Recommended Cybersecurity Practices for Industrial Control Systems — <a href=\"https://www.cisa.gov/sites/default/files/publications/Cybersecurity_Best_Practices_for_Industrial_Control_Systems.pdf\" target=\"_blank\" rel=\"noopener\">https://www.cisa.gov/sites/default/files/publications/Cybersecurity_Best_Practices_for_Industrial_Control_Systems.pdf<\/a><\/p><\/div><h4>Vocabulário<\/h4><table class=\"tb\"><thead><tr><th>Termo<\/th><th>Tradução<\/th><\/tr><\/thead><tbody><tr><td><b>ICS<\/b><\/td><td>sistemas de controle industrial<\/td><\/tr><tr><td><b>OT<\/b><\/td><td>tecnologia operacional<\/td><\/tr><tr><td><b>segmentation<\/b><\/td><td>segmentação<\/td><\/tr><tr><td><b>commodity malware<\/b><\/td><td>malware comum de TI<\/td><\/tr><tr><td><b>physical processes<\/b><\/td><td>processos físicos<\/td><\/tr><tr><td><b>defense-in-depth<\/b><\/td><td>defesa em profundidade<\/td><\/tr><tr><td><b>least functionality<\/b><\/td><td>menor funcionalidade<\/td><\/tr><tr><td><b>boundary protection<\/b><\/td><td>proteção de fronteira<\/td><\/tr><\/tbody><\/table><div class=\"box bizu\"><div class=\"boxh\">Conectivos do texto<\/div><div class=\"boxb\">As, Among, which, where possible<\/div><\/div>","fonte":"CISA — Recommended Cybersecurity Practices for Industrial Control Systems","url":"https://www.cisa.gov/sites/default/files/publications/Cybersecurity_Best_Practices_for_Industrial_Control_Systems.pdf"},{"id":"le11","mod":"Inglês","modTitle":"Leitura em Inglês (textos reais)","title":"Text 11 — Phishing e engenharia social (CISA)","prio":"Alta","html":"<div class=\"texto\"><p class=\"tt\">Text 11 — Phishing e engenharia social (CISA) (texto real)<\/p><p>In a social engineering attack, an attacker uses human interaction (social skills) to obtain or compromise information about an organization or its computer systems. An attacker may seem unassuming and respectable, possibly claiming to be a new employee, repair person, or researcher and even offering credentials to support that identity. However, by asking questions, he or she may be able to piece together enough information to infiltrate an organization&#x27;s network.<\/p><p>Phishing is a form of social engineering. Phishing attacks use email or malicious websites to solicit personal information by posing as a trustworthy organization. For example, an attacker may send email seemingly from a reputable credit card company or financial institution that requests account information, often suggesting that there is a problem. When users respond with the requested information, attackers can use it to gain access to the accounts.<\/p><p>Vishing is the social engineering approach that leverages voice communication. Smishing is a form of social engineering that exploits SMS, or text, messages. Text messages can contain links to webpages, email addresses or phone numbers that when clicked may automatically open a browser window or email message or dial a number. Common indicators of phishing attempts include a suspicious sender&#x27;s address, generic greetings, spoofed hyperlinks and websites, poor spelling and layout, and suspicious attachments. Enforce multifactor authentication (MFA). Do not provide personal information unless you are certain of a person&#x27;s authority to have the information.<\/p><p class=\"small\">Fonte: CISA — Avoiding Social Engineering and Phishing Attacks (Feb 2021) — <a href=\"https://www.cisa.gov/news-events/news/avoiding-social-engineering-and-phishing-attacks\" target=\"_blank\" rel=\"noopener\">https://www.cisa.gov/news-events/news/avoiding-social-engineering-and-phishing-attacks<\/a><\/p><\/div><h4>Vocabulário<\/h4><table class=\"tb\"><thead><tr><th>Termo<\/th><th>Tradução<\/th><\/tr><\/thead><tbody><tr><td><b>social engineering<\/b><\/td><td>engenharia social<\/td><\/tr><tr><td><b>unassuming<\/b><\/td><td>discreto na aparência<\/td><\/tr><tr><td><b>solicit<\/b><\/td><td>solicitar<\/td><\/tr><tr><td><b>posing as<\/b><\/td><td>passando-se por<\/td><\/tr><tr><td><b>vishing<\/b><\/td><td>phishing por voz<\/td><\/tr><tr><td><b>smishing<\/b><\/td><td>phishing por SMS<\/td><\/tr><tr><td><b>spoofed<\/b><\/td><td>falsificado<\/td><\/tr><tr><td><b>generic greetings<\/b><\/td><td>saudações genéricas<\/td><\/tr><\/tbody><\/table><div class=\"box bizu\"><div class=\"boxh\">Conectivos do texto<\/div><div class=\"boxb\">However, For example, When, unless<\/div><\/div>","fonte":"CISA — Avoiding Social Engineering and Phishing Attacks (Feb 2021)","url":"https://www.cisa.gov/news-events/news/avoiding-social-engineering-and-phishing-attacks"},{"id":"le12","mod":"Inglês","modTitle":"Leitura em Inglês (textos reais)","title":"Text 12 — Gestão de patches / vulnerabilidades (NIST SP 800-40r4)","prio":"Alta","html":"<div class=\"texto\"><p class=\"tt\">Text 12 — Gestão de patches / vulnerabilidades (NIST SP 800-40r4) (texto real)<\/p><p>Software maintenance includes patching, which is the act of applying a change to installed software — such as firmware, operating systems, or applications — that corrects security or functionality problems or adds new capabilities. Enterprise patch management is the process of identifying, prioritizing, acquiring, installing, and verifying the installation of patches, updates, and upgrades throughout an organization. In today&#x27;s environments, patching has become more important, often rising to the level of mission criticality. As part of a zero trust approach to security, it is now recognized that the perimeter largely does not exist anymore, and most technologies are directly exposed to the internet, putting systems at significantly greater risk of compromise. This dynamic applies across IT, operational technology (OT), Internet of Things (IoT), mobile, cloud, virtual machine, container, or other types of assets. Zero trust architectures emphasize business asset-specific security over just protecting a network with assets on it, so patching is vital for reducing risk to those individual assets and determining the assets&#x27; trust status. Leadership should reconsider the priority of enterprise patch management: patching should be considered a standard cost of doing business and should be rigorously followed and tracked.<\/p><p class=\"small\">Fonte: NIST SP 800-40r4 — Guide to Enterprise Patch Management Planning (Apr 2022), Executive Summary — <a href=\"https://doi.org/10.6028/NIST.SP.800-40r4\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.6028/NIST.SP.800-40r4<\/a><\/p><\/div><h4>Vocabulário<\/h4><table class=\"tb\"><thead><tr><th>Termo<\/th><th>Tradução<\/th><\/tr><\/thead><tbody><tr><td><b>patching<\/b><\/td><td>aplicação de correções<\/td><\/tr><tr><td><b>firmware<\/b><\/td><td>firmware<\/td><\/tr><tr><td><b>prioritizing<\/b><\/td><td>priorizando<\/td><\/tr><tr><td><b>mission criticality<\/b><\/td><td>criticidade para a missão<\/td><\/tr><tr><td><b>compromise<\/b><\/td><td>comprometimento<\/td><\/tr><tr><td><b>trust status<\/b><\/td><td>status de confiança<\/td><\/tr><tr><td><b>rigorously<\/b><\/td><td>rigorosamente<\/td><\/tr><\/tbody><\/table><div class=\"box bizu\"><div class=\"boxh\">Conectivos do texto<\/div><div class=\"boxb\">such as, As part of, so, over<\/div><\/div>","fonte":"NIST SP 800-40r4 — Guide to Enterprise Patch Management Planning (Apr 2022), Executive Summary","url":"https://doi.org/10.6028/NIST.SP.800-40r4"}],"bizus":[{"id":"b1","kind":"bizu","topic":"of1","mod":"Ofensiva","title":"BIZU — Passivo × Ativo","html":"<b>Passivo = Prevenir<\/b> (é difícil <i>detectar<\/i> quem só escuta). <b>Ativo = Detectar e recuperar<\/b> (difícil <i>prevenir<\/i> 100%). Mnemônico dos ativos: <b>DRMN<\/b> — <b>D<\/b>isfarce, <b>R<\/b>epetição, <b>M<\/b>odificação, <b>N<\/b>egação de serviço."},{"id":"b2","kind":"peg","topic":"of1","mod":"Ofensiva","title":"PEGADINHA DA CESGRANRIO","html":"Análise de tráfego funciona <b>mesmo com criptografia<\/b> — a banca adora afirmar que cifrar resolve a inferência (falso). E <i>replay<\/i> não exige quebrar a cifra: o atacante reenvia o pacote cifrado como está."},{"id":"b3","kind":"bizu","topic":"of2","mod":"Ofensiva","title":"BIZU — Ordem das etapas","html":"<b>“Fui Ver Eu Ganhar, Escalei, Pus Porta, Escondi e Recusei”<\/b> → Footprinting, Varredura, Enumeração, Ganho de acesso, Escalação, Porta dos fundos, Encobrimento, Recusa de serviço. <br/><b>Varredura pergunta “O QUE está aberto?”<\/b>; <b>Enumeração pergunta “QUEM/QUAIS contas, shares e versões?”<\/b>."},{"id":"b4","kind":"bizu","topic":"of2","mod":"Ofensiva","title":"BIZU — nmap do Allan","html":"<b>-sS = SYN/Silencioso<\/b> · <b>-sT = TCP connect/Tagarela<\/b> · <b>-sV = Versão<\/b> · <b>-O = sistema Operacional<\/b> · <b>-sn = no ports<\/b> (só quem está vivo) · <b>-p- = todas as portas<\/b> · <b>-Pn = não pinga<\/b> · <b>-sU = UDP<\/b> · <b>-A = tudo<\/b>."},{"id":"b5","kind":"peg","topic":"of2","mod":"Ofensiva","title":"PEGADINHA DA CESGRANRIO","html":"(1) “-sS completa o handshake” — <b>falso<\/b>, quem completa é -sT. (2) “-sn varre as portas mais comuns” — <b>falso<\/b>. (3) “-O descobre a versão do Apache” — falso, versão de serviço é -sV. (4) Varredura é <b>ativa<\/b> (toca o alvo); footprinting com fontes abertas é <b>passivo<\/b>. (5) ACK scan não identifica porta aberta."},{"id":"b6","kind":"bizu","topic":"of3","mod":"Ofensiva","title":"BIZU — ARP spoofing (o do Allan)","html":"<b>Mesma LAN · camada 2 · MitM<\/b>. O atacante diz “o IP do gateway sou eu (meu MAC)”. Defesa = <b>DAI + DHCP Snooping<\/b> (o DAI valida ARP contra a tabela de vínculos do DHCP Snooping). <b>Não confundir<\/b>: <b>DNS poisoning<\/b> falsifica o <i>nome→IP<\/i> (camada 7, pode ser remoto, defesa DNSSEC); <b>ARP<\/b> falsifica o <i>IP→MAC<\/i> (só local)."},{"id":"b7","kind":"bizu","topic":"of3","mod":"Ofensiva","title":"BIZU — Portas que mais caem","html":"FTP 20/21 · SSH 22 · Telnet 23 · SMTP 25 · DNS 53 · DHCP 67/68 · HTTP 80 · Kerberos 88 · POP3 110 · NTP 123 · IMAP 143 · SNMP 161/162 · LDAP 389 · HTTPS 443 · SMB 445 · SMTPS 465 · IKE 500 · Submission 587 · LDAPS 636 · IMAPS 993 · POP3S 995 · RADIUS 1812/1813 · RDP 3389 · NAT-T 4500 · Modbus 502."},{"id":"b8","kind":"peg","topic":"of3","mod":"Ofensiva","title":"PEGADINHA DA CESGRANRIO","html":"Sintoma típico da questão: “várias estações passaram a ter o <b>IP do roteador padrão associado a um MAC diferente<\/b>” → ARP spoofing (não é DNS, não é DHCP). Se o sintoma é “estações recebendo <b>gateway/DNS errados<\/b> ao ligar” → rogue DHCP. Se é “o switch passou a se comportar como hub” → <b>MAC flooding<\/b> (estouro da tabela CAM)."},{"id":"b9","kind":"bizu","topic":"of4","mod":"Ofensiva","title":"BIZU — Wi-Fi em uma linha","html":"<b>Rogue = intruso plugado na rede<\/b> · <b>Evil Twin = clone do SSID<\/b> · <b>Tracking = te segue pelo probe<\/b> · <b>Jamming = barulho de RF<\/b> · <b>Deauth = quadro forjado que derruba<\/b> (PMF/802.11w resolve)."},{"id":"b10","kind":"peg","topic":"of4","mod":"Ofensiva","title":"PEGADINHA DA CESGRANRIO","html":"Rogue AP × Evil Twin: o rogue está <b>conectado à rede interna<\/b> (ameaça à empresa); o evil twin <b>imita<\/b> uma rede para enganar <b>clientes<\/b>. Jamming não é ataque de protocolo, é físico (RF)."},{"id":"b11","kind":"bizu","topic":"of5","mod":"Ofensiva","title":"BIZU","html":"<b>Sniffing = ouvir<\/b> (passivo) · <b>Spoofing = fingir<\/b> (ativo) · <b>MitM = ficar no meio<\/b> (precisa de spoofing para chegar lá numa rede comutada). Ferramenta defensiva da lista do edital: <b>arpwatch<\/b> (detecta mudança de par IP↔MAC)."},{"id":"b12","kind":"bizu","topic":"of6","mod":"Ofensiva","title":"BIZU — Ciclo","html":"<b>P-R-E-U<\/b>: <b>P<\/b>esquisa → <b>R<\/b>elacionamento → <b>E<\/b>xploração → <b>U<\/b>tilização."},{"id":"b13","kind":"peg","topic":"of6","mod":"Ofensiva","title":"PEGADINHA DA CESGRANRIO","html":"Pharming ≠ phishing: no pharming a vítima digita o endereço <b>correto<\/b> e mesmo assim cai no site falso (DNS/hosts adulterado). Whaling é spear phishing contra a alta direção."},{"id":"b14","kind":"bizu","topic":"of7","mod":"Ofensiva","title":"BIZU — Vírus × Worm × Trojan","html":"<b>Vírus<\/b> precisa de <b>hospedeiro + execução<\/b>; <b>Worm<\/b> <b>anda sozinho<\/b> pela rede; <b>Trojan<\/b> é <b>presente de grego<\/b> (não se replica). <b>Keylogger = teclado<\/b>, <b>Screenlogger = tela<\/b> (por isso teclado virtual não salva)."},{"id":"b15","kind":"peg","topic":"of7","mod":"Ofensiva","title":"PEGADINHA DA CESGRANRIO","html":"Rootkit <b>não<\/b> é, por definição, para obter acesso — é para <b>esconder e manter<\/b>. Formjacking ataca o <b>site<\/b> (lado do e-commerce), não o computador do cliente. Cryptojacking não cifra arquivos (quem cifra é ransomware)."},{"id":"b16","kind":"bizu","topic":"of8","mod":"Ofensiva","title":"BIZU — ATT&CK do Allan","html":"<b>Pegou senha, hash ou ticket = Credential Access (TA0006)<\/b>. <b>Dump da memória do LSASS (mimikatz) = T1003.001<\/b>. <b>Usar<\/b> o hash para entrar em outra máquina (pass-the-hash) = <b>Lateral Movement<\/b> (T1550.002 — também listada em Defense Evasion). Phishing = Initial Access; tarefa agendada/chave Run = Persistence; cifrar arquivos para resgate = Impact (T1486); apagar logs = Defense Evasion (T1070).<br/><b>Ordem das 14:<\/b> “<b>Re<\/b>cebi <b>Re<\/b>cursos, <b>In<\/b>vadi, <b>Ex<\/b>ecutei, <b>Pe<\/b>rsisti, <b>Pri<\/b>vilegiei, <b>De<\/b>sviei, <b>Cre<\/b>denciei, <b>Des<\/b>cobri, <b>La<\/b>teralizei, <b>Co<\/b>letei, <b>C2<\/b>, <b>Ex<\/b>filtrei, <b>Im<\/b>pactei”."},{"id":"b17","kind":"peg","topic":"of8","mod":"Ofensiva","title":"PEGADINHA DA CESGRANRIO","html":"(1) ATT&amp;CK <b>não<\/b> é modelo sequencial obrigatório como a Cyber Kill Chain — táticas não precisam ocorrer em ordem. (2) Tática ≠ técnica: “Credential Access” é tática; “OS Credential Dumping” é técnica. (3) Uma técnica pode pertencer a mais de uma tática. (4) ATT&amp;CK descreve <b>comportamento do adversário<\/b> (pós-comprometimento e pré), CAPEC descreve <b>padrões de ataque<\/b> a aplicações/sistemas, CWE descreve <b>fraquezas<\/b>."},{"id":"b18","kind":"bizu","topic":"of9","mod":"Ofensiva","title":"BIZU","html":"<b>CVE = Vulnerabilidade Específica<\/b> · <b>CWE = Weakness (tipo)<\/b> · <b>CAPEC = Padrão de ATAQUE<\/b> · <b>ATT&amp;CK = comportamento do adversário<\/b>. Mecanismos = “COMO ataca”; Domínios = “ONDE ataca”."},{"id":"b19","kind":"bizu","topic":"of10","mod":"Ofensiva","title":"BIZU — Agrupe por fase","html":"<b>Recon:<\/b> amass, theHarvester, maltego · <b>Scan:<\/b> nmap, masscan · <b>Enum:<\/b> smbmap · <b>Sniff/MitM:<\/b> wireshark, ettercap (e arpwatch para <b>detectar<\/b>) · <b>Wi-Fi:<\/b> aircrack-ng, airgeddon · <b>Senhas:<\/b> hydra (<b>online<\/b>), john e hashcat (<b>offline<\/b>; hashcat = GPU) · <b>Exploração:<\/b> metasploit, sqlmap, beef-xss, burp · <b>Pós/credenciais:<\/b> mimikatz · <b>Evasão:<\/b> veil · <b>Eng. social:<\/b> set · <b>Reversa:<\/b> ghidra · <b>Esconder dados:<\/b> steghide · <b>Tudo-em-um de rede:<\/b> netcat."},{"id":"b20","kind":"peg","topic":"of10","mod":"Ofensiva","title":"PEGADINHA DA CESGRANRIO","html":"(1) <b>hydra × john/hashcat<\/b>: hydra ataca o <b>serviço ao vivo<\/b> (online); john/hashcat quebram <b>hash já obtido<\/b> (offline). (2) <b>arpwatch é defensivo<\/b>. (3) <b>steghide<\/b> não cifra o disco: esconde dados <b>dentro de mídia<\/b>. (4) <b>masscan<\/b> é mais rápido que o nmap, mas não faz detecção de versão/SO no mesmo nível. (5) <b>ghidra<\/b> não é scanner de vulnerabilidades. (6) <b>beef<\/b> depende de XSS para “fisgar” o navegador."},{"id":"b21","kind":"bizu","topic":"df1","mod":"Defensiva","title":"BIZU","html":"<b>Filtro de pacotes = porteiro que só olha o crachá<\/b> (IP/porta). <b>Stateful = porteiro com caderno<\/b> (lembra quem entrou). <b>Proxy = recepcionista que leva o recado<\/b> (fala por você na camada 7). <b>IDS = alarme<\/b> (avisa) · <b>IPS = segurança armado<\/b> (bloqueia, inline). Assinatura = vacina conhecida; anomalia = febre (algo diferente do normal)."},{"id":"b22","kind":"peg","topic":"df1","mod":"Defensiva","title":"PEGADINHA DA CESGRANRIO","html":"(1) “IDS bloqueia o ataque” — <b>falso<\/b> (só se integrado a outro dispositivo). (2) “Filtro de pacotes analisa o conteúdo HTTP” — falso. (3) “IDS por assinatura detecta ataques de dia zero” — falso, isso é anomalia. (4) No proxy <b>não há conexão direta<\/b> cliente–servidor. (5) Falso positivo = alerta sem ataque; falso negativo = ataque sem alerta (o mais perigoso)."},{"id":"b23","kind":"bizu","topic":"df2","mod":"Defensiva","title":"BIZU — 802.1X do Allan","html":"<b>Porta do switch + login = 802.1X<\/b>. Trio: <b>Suplicante → Autenticador → RADIUS<\/b>, falando <b>EAP<\/b> (EAPOL no primeiro trecho, EAP dentro do RADIUS no segundo). O switch <b>não decide<\/b>, só repassa: quem decide é o RADIUS. EAP-TLS = certificado dos dois lados."},{"id":"b24","kind":"peg","topic":"df2","mod":"Defensiva","title":"PEGADINHA DA CESGRANRIO","html":"(1) O autenticador é o <b>switch/AP<\/b>, não o servidor. (2) 802.1X é controle de acesso <b>em camada 2<\/b> (antes de o cliente ganhar IP na rede). (3) RADIUS usa <b>UDP<\/b>; TACACS+ usa TCP. (4) RADIUS não cifra o pacote todo. (5) EAP é um <b>framework<\/b> de autenticação, não um algoritmo de cifra."},{"id":"b25","kind":"bizu","topic":"df2","mod":"Defensiva","title":"BIZU — OWASP 2021 (o do Allan)","html":"<b>A01 Broken Access Control · A02 Cryptographic Failures · A03 Injection<\/b> → “<b>A<\/b>cesso, <b>C<\/b>ripto, <b>I<\/b>njeção” = <b>ACI<\/b>. XSS está <b>dentro de Injection<\/b> desde 2021. SSRF era A10 em 2021. Em <b>2025<\/b>: A01 continua Broken Access Control; <b>A02 vira Security Misconfiguration<\/b>; A03 = Supply Chain. Leia o ano no enunciado!"},{"id":"b26","kind":"peg","topic":"df2","mod":"Defensiva","title":"PEGADINHA DA CESGRANRIO","html":"O edital diz só “OWASP Top 10”: se a questão não citar o ano, procure a resposta que vale para as duas versões (ex.: Broken Access Control = A01 em ambas). IDOR (acessar /conta?id=124 de outro usuário) é <b>Broken Access Control<\/b>, não Injection."},{"id":"b27","kind":"bizu","topic":"df2","mod":"Defensiva","title":"BIZU — SAMM","html":"<b>“GoDe ImVeOp”<\/b> → <b>Go<\/b>vernance, <b>De<\/b>sign, <b>Im<\/b>plementation, <b>Ve<\/b>rification, <b>Op<\/b>erations. 5 × 3 × 2 streams × 3 níveis."},{"id":"b28","kind":"bizu","topic":"df3","mod":"Defensiva","title":"BIZU","html":"<b>CIDA + Não-repúdio<\/b>. <b>MAC (código) dá integridade + autenticidade, mas NÃO não repúdio<\/b> (a chave é compartilhada — qualquer um dos dois poderia ter gerado). Só a <b>assinatura digital<\/b> dá não repúdio."},{"id":"b29","kind":"peg","topic":"df3","mod":"Defensiva","title":"PEGADINHA DA CESGRANRIO","html":"Autenticação ≠ autorização (questão clássica). E “autenticidade” é sobre <b>origem<\/b>, “integridade” é sobre <b>conteúdo<\/b>."},{"id":"b30","kind":"bizu","topic":"df4","mod":"Defensiva","title":"BIZU — Cripto do Allan","html":"<b>Simétricos: AES, 3DES, ChaCha20<\/b> (e DES, RC4, Blowfish). <b>Assimétricos: RSA, ECC, DH, DSA<\/b>. <b>Hash não é cifra<\/b> (não tem chave nem volta). <b>Assina com a MINHA privada; cifro para você com a SUA pública<\/b>. SHA-256 = 64 caracteres hex; MD5 = 32 hex; SHA-1 = 40 hex."},{"id":"b31","kind":"peg","topic":"df4","mod":"Defensiva","title":"PEGADINHA DA CESGRANRIO","html":"(1) Diffie-Hellman <b>não cifra<\/b> mensagens nem assina — só acorda chave (e sem autenticação é vulnerável a MitM). (2) Assinatura digital <b>não<\/b> dá sigilo. (3) Dois fatores da mesma categoria (senha + PIN) <b>não<\/b> é MFA. (4) RAID não é backup. (5) Incremental = backup rápido / restauração lenta; diferencial = o inverso."},{"id":"b32","kind":"bizu","topic":"df5","mod":"Defensiva","title":"BIZU","html":"<b>CG = Cérebro (políticas) · ITI = AC Raiz (só certifica ACs) · AC = cartório que emite · AR = balcão que confere documento · ACT = relógio oficial<\/b>. “AR não emite”, “Raiz não emite para usuário final”."},{"id":"b33","kind":"peg","topic":"df5","mod":"Defensiva","title":"PEGADINHA DA CESGRANRIO","html":"A AC Raiz <b>não<\/b> é o Comitê Gestor. A AR <b>não<\/b> assina certificados. Certificado A1 não fica em token."},{"id":"b34","kind":"bizu","topic":"df6","mod":"Defensiva","title":"BIZU","html":"<b>AH = Autentica, não esconde<\/b>; <b>ESP = Esconde (e também autentica)<\/b>. <b>Túnel = pacote inteiro dentro de outro<\/b> (VPN entre sites). <b>IKE = UDP 500<\/b> negocia; <b>SA é mão única<\/b> (precisa de duas para ida e volta). TLS 1.3 = 1-RTT, só AEAD, só (EC)DHE."},{"id":"b35","kind":"peg","topic":"df6","mod":"Defensiva","title":"PEGADINHA DA CESGRANRIO","html":"“No TLS, o cliente é sempre autenticado” — falso. “AH provê confidencialidade” — falso. “TLS 1.3 aceita troca de chaves RSA” — falso. “SSLv3 é seguro se usado com AES” — falso (protocolo descontinuado)."},{"id":"b36","kind":"bizu","topic":"df7","mod":"Defensiva","title":"BIZU","html":"Firewall pessoal protege <b>o próprio host<\/b> (inclusive contra ameaça de dentro da LAN); firewall de rede protege o <b>segmento<\/b>. Defesa em profundidade = os dois."},{"id":"b37","kind":"bizu","topic":"df8","mod":"Defensiva","title":"BIZU","html":"<b>4-2-1 = r-w-x<\/b>; <b>SUID-SGID-Sticky = 4-2-1<\/b> no dígito extra. <b>inode tem tudo, menos o nome<\/b>. <b>BitLocker = disco; EFS = arquivo<\/b>."},{"id":"b38","kind":"bizu","topic":"df9","mod":"Defensiva","title":"BIZU — 62443","html":"<b>1-Geral, 2-Política (dono do ativo), 3-Sistema (integrador), 4-Componente (fabricante)<\/b>. <b>3-2 = zonas/conduítes e risco<\/b>; <b>3-3 = requisitos do sistema/SL<\/b>; <b>4-1 = SDL do fabricante<\/b>. FR: “<b>I<\/b>dentifica, <b>U<\/b>sa, <b>I<\/b>ntegra, <b>C<\/b>onfidencia, <b>R<\/b>estringe, <b>R<\/b>esponde, <b>D<\/b>isponibiliza”."},{"id":"b39","kind":"peg","topic":"df9","mod":"Defensiva","title":"PEGADINHA DA CESGRANRIO","html":"Em OT, “aplicar patch imediatamente em produção” ou “priorizar confidencialidade” são alternativas erradas típicas. Varredura ativa agressiva (nmap) em CLPs pode derrubá-los — prefira monitoração passiva."},{"id":"b40","kind":"bizu","topic":"df10","mod":"Defensiva","title":"BIZU","html":"<b>C-E-A-R<\/b> (Coleta, Exame, Análise, Relatório). <b>Do mais volátil para o menos: “RAM antes do disco”<\/b>. <b>Hash antes e depois<\/b> = integridade. <b>Received: leia de baixo para cima<\/b>. Write blocker = só leitura."},{"id":"b41","kind":"peg","topic":"df10","mod":"Defensiva","title":"PEGADINHA DA CESGRANRIO","html":"“Para preservar a evidência, desligue imediatamente o computador” — em geral <b>errado<\/b> (perde RAM; exceto, por exemplo, ransomware cifrando ativamente, conforme procedimento). “A análise deve ser feita na mídia original” — errado. Hash <b>não<\/b> serve para recuperar dados, só para provar integridade."},{"id":"b42","kind":"bizu","topic":"cp1","mod":"Compliance","title":"BIZU — ISO 27001:2022 do Allan","html":"<b>93 controles, 4 temas: Organizacionais 37 · Pessoas 8 · Físicos 14 · Tecnológicos 34<\/b> → “<b>37-8-14-34<\/b>”, numerados 5, 6, 7, 8. <b>11 novos<\/b>: “<b>Inteligência, Nuvem, Prontidão, Monitoramento físico, Configuração, Exclusão, Mascaramento, DLP, Monitoramento, Filtro web, Código seguro<\/b>”. <b>27001 = DEVE (certifica) · 27002 = CONVÉM (orienta)<\/b>."},{"id":"b43","kind":"peg","topic":"cp1","mod":"Compliance","title":"PEGADINHA DA CESGRANRIO","html":"(1) A organização <b>pode excluir<\/b> controles do Anexo A, desde que justifique na SoA. (2) O Anexo A <b>não<\/b> é exaustivo — podem ser adicionados controles. (3) Questões ainda citam a 2013 (14 domínios/114 controles): leia o ano. (4) Quem aprova a política e garante recursos é a <b>alta direção<\/b> (cláusula 5)."},{"id":"b44","kind":"bizu","topic":"cp2","mod":"Compliance","title":"BIZU — Avaliação ≠ análise","html":"<b>Processo de avaliação de riscos (assessment) = I-A-A<\/b>: <b>I<\/b>dentificar, <b>A<\/b>nalisar (nível), <b>A<\/b>valiar (comparar com critério). Tratamentos = “<b>MERC<\/b>”: <b>M<\/b>itigar, <b>E<\/b>vitar, <b>R<\/b>eter, <b>C<\/b>ompartilhar."},{"id":"b45","kind":"bizu","topic":"cp2","mod":"Compliance","title":"BIZU — 27035","html":"“<b>Pla-De-Ava-Res-Apre<\/b>”: <b>Pla<\/b>nejar, <b>De<\/b>tectar, <b>Ava<\/b>liar, <b>Res<\/b>ponder, <b>Apre<\/b>nder. Compare: NIST SP 800-61 = Preparação; Detecção e Análise; Contenção, Erradicação e Recuperação; Pós-incidente."},{"id":"b46","kind":"bizu","topic":"cp3","mod":"Compliance","title":"BIZU","html":"<b>RPO = Perda de dados (olha para trás)<\/b> · <b>RTO = Tempo para voltar (olha para frente)<\/b>. BIA vem <b>antes<\/b> das estratégias. 22301 = DEVE; 22313 = COMO FAZER."},{"id":"b47","kind":"bizu","topic":"cp4","mod":"Compliance","title":"BIZU","html":"<b>29100 = princípios (o “porquê”) · 29134 = PIA/RIPD (o “avaliar impacto”) · 27701 = SGPI (o “gerenciar”, extensão da 27001/27002; Anexo A = controlador, B = operador)<\/b>."},{"id":"b48","kind":"peg","topic":"cp4","mod":"Compliance","title":"PEGADINHA DA CESGRANRIO","html":"“A 27701 é uma norma autônoma que dispensa a 27001” — falso para a versão 2019 (é extensão). “Minimização” (29100) ≈ “necessidade” (LGPD)."},{"id":"b49","kind":"bizu","topic":"cp5","mod":"Compliance","title":"BIZU — NIST CSF 2.0 do Allan","html":"<b>GIP-DRR<\/b> = <b>G<\/b>overn, <b>I<\/b>dentify, <b>P<\/b>rotect, <b>D<\/b>etect, <b>R<\/b>espond, <b>R<\/b>ecover. <b>Govern é a nova<\/b> (e a cadeia de suprimentos — GV.SC — foi para dentro dela). Tiers <b>não<\/b> são níveis de maturidade obrigatórios: “<b>P-I-R-A<\/b>” = Parcial, Informada, Repetível, Adaptativa."},{"id":"b50","kind":"bizu","topic":"cp5","mod":"Compliance","title":"BIZU — CIS","html":"Os <b>dois primeiros são inventário<\/b> (hardware, depois software) — “não dá para proteger o que você não conhece”. <b>14 = treinamento<\/b>, <b>17 = resposta a incidentes<\/b>, <b>18 = pentest<\/b> (último). IG1 ⊂ IG2 ⊂ IG3."},{"id":"b51","kind":"peg","topic":"cp5","mod":"Compliance","title":"PEGADINHA DA CESGRANRIO","html":"CIS <b>Controls<\/b> (o quê priorizar) ≠ CIS <b>Benchmarks<\/b> (como configurar cada sistema). No CSF 2.0, “Identify” não contém mais a governança — ela foi para “Govern”."},{"id":"b52","kind":"atn","topic":"cp6","mod":"Compliance","title":"ATENÇÃO — STF e o art. 19","html":"Em <b>junho de 2025<\/b> (Temas 987 e 533 — RE 1.037.396 e RE 1.057.258), o STF declarou o art. 19 <b>parcialmente inconstitucional<\/b>: em regra, provedores de aplicação podem ser responsabilizados após <b>notificação extrajudicial<\/b> quando não removem conteúdo ilícito, mantendo-se a exigência de <b>ordem judicial para crimes contra a honra<\/b>. Fonte: notícia do STF (noticias.stf.jus.br). Em prova, a Cesgranrio costuma cobrar a <b>letra da lei<\/b>; se o enunciado citar a tese do STF, aplique-a."},{"id":"b53","kind":"bizu","topic":"cp6","mod":"Compliance","title":"BIZU","html":"<b>Conexão = 1 ano (conexão, só ela)<\/b> · <b>Aplicação = 6 meses<\/b> · “<b>C1 A6<\/b>”. Conexão <b>não<\/b> pode guardar registro de aplicação. Conteúdo e registros = <b>juiz<\/b>; dados cadastrais = autoridade administrativa."},{"id":"b54","kind":"bizu","topic":"cp7","mod":"Compliance","title":"BIZU — LGPD do Allan","html":"<b>Controlador DECIDE · Operador EXECUTA · Encarregado/DPO faz a PONTE<\/b> (titular ↔ controlador ↔ ANPD). Princípios: “<b>FAN LIQUE TRANSPARENTE SEGURO PREVINE NÃO DISCRIMINA E RESPONDE<\/b>” (Finalidade, Adequação, Necessidade, Livre acesso, Qualidade, Transparência, Segurança, Prevenção, Não discriminação, Responsabilização). Multa: <b>2% limitado a R$ 50 mi por infração<\/b>."},{"id":"b55","kind":"peg","topic":"cp7","mod":"Compliance","title":"PEGADINHA DA CESGRANRIO","html":"(1) Consentimento é <b>só uma<\/b> das 10 bases — não é obrigatório sempre. (2) Legítimo interesse <b>não<\/b> serve para dado sensível. (3) Encarregado <b>não<\/b> é agente de tratamento. (4) A LGPD se aplica a dados em meio <b>físico e digital<\/b>, a entes públicos e privados. (5) Multa de 2% é do faturamento <b>no Brasil<\/b> do último exercício, por infração, até R$ 50 mi."},{"id":"b56","kind":"bizu","topic":"cp8","mod":"Compliance","title":"BIZU","html":"Princípios além da CIDA: “<b>DIPRT<\/b>” — <b>D<\/b>iversidade, <b>I<\/b>nteroperabilidade, <b>P<\/b>rioridade, <b>R<\/b>esponsabilidade, <b>T<\/b>ransparência. Obrigações: “<b>Política, Fornecedor auditado, Senha padrão trocada, Incidente notificado, Vulnerabilidade avaliada, Infra crítica informada<\/b>”."},{"id":"b57","kind":"atn","topic":"cp8","mod":"Compliance","title":"ATENÇÃO","html":"Texto consultado: versão original publicada (DOU 24/12/2020). O edital diz “e suas alterações” — confira no site da Anatel se houve alterações posteriores antes da prova."},{"id":"b58","kind":"bizu","topic":"pt1","mod":"Português","title":"BIZU","html":"Cesgranrio adora a pergunta “o trecho X <b>refere-se<\/b> a…” (coesão referencial) e “a palavra X <b>pode ser substituída, sem alteração de sentido<\/b>, por…”. Volte ao parágrafo e troque a palavra na frase original."},{"id":"b59","kind":"bizu","topic":"pt2","mod":"Português","title":"BIZU — Concessão × adversidade","html":"<b>Embora<\/b> (concessão, subjuntivo) ≈ <b>mas<\/b> (adversidade, indicativo) com a ordem invertida: “<b>Embora<\/b> estude, erra” = “Estuda, <b>mas<\/b> erra”. Na reescrita, ao trocar “mas” por “embora”, <b>mude o verbo para o subjuntivo<\/b>."},{"id":"b60","kind":"peg","topic":"pt2","mod":"Português","title":"PEGADINHA DA CESGRANRIO","html":"Adjetiva restritiva × explicativa: “Os analistas <b>que estudaram<\/b> passaram” (só alguns) × “Os analistas, <b>que estudaram<\/b>, passaram” (todos). Retirar/inserir vírgulas <b>muda o sentido<\/b>."},{"id":"b61","kind":"bizu","topic":"pt3","mod":"Português","title":"BIZU — Crase (o do Allan)","html":"<b>Troque por masculino<\/b>: se virar “<b>ao<\/b>”, tem crase (“fui à escola” → “fui ao colégio”). <b>Cidade: “vou a, volto da, crase há; vou a, volto de, crase pra quê?”<\/b>. Nunca antes de verbo, masculino ou pronome pessoal."},{"id":"b62","kind":"peg","topic":"pt3","mod":"Português","title":"PEGADINHA DA CESGRANRIO","html":"“Haviam muitos candidatos” = <b>errado<\/b>. “Fazem dois anos” = errado. “Aluga-se salas” = errado (alugam-se). “Assisti o filme” = errado na norma-padrão. “Não esqueça-se” = errado (próclise com “não”)."},{"id":"b63","kind":"bizu","topic":"pt4","mod":"Português","title":"BIZU","html":"<b>Ratificar = Reafirmar; Retificar = Reto/corrigir<\/b>. <b>Iminente = Imediato (vai acontecer); Eminente = Elevado<\/b>. <b>Infringir = Infração<\/b>."},{"id":"b64","kind":"bizu","topic":"en1","mod":"Inglês","title":"BIZU — Inglês do Allan","html":"<b>“X is not a silver bullet”<\/b> = X <b>não é solução mágica/única<\/b> (ajuda, mas não resolve sozinho) — gabarito costuma ser algo como “should be combined with other measures”. <b>Desconfie de every/always/never<\/b>. <b>Although = concessão<\/b> (embora). <b>Therefore = conclusão<\/b> (portanto). <b>Whereas<\/b> = contraste. <b>Unless<\/b> = a menos que."},{"id":"b65","kind":"peg","topic":"en1","mod":"Inglês","title":"PEGADINHA DA CESGRANRIO","html":"Modais: <b>must<\/b> (obrigação/forte certeza), <b>should<\/b> (recomendação), <b>may/might<\/b> (possibilidade), <b>can<\/b> (capacidade/possibilidade), <b>could<\/b> (possibilidade menor/passado), <b>would<\/b> (hipótese). Trocar “may” por “must” muda o sentido — alternativa errada clássica. Phrasal verbs: <i>carry out<\/i> (realizar), <i>set up<\/i> (configurar), <i>shut down<\/i> (desligar), <i>roll out<\/i> (implantar), <i>phase out<\/i> (descontinuar), <i>look into<\/i> (investigar), <i>rule out<\/i> (descartar)."},{"id":"b66","kind":"dica","topic":"como","mod":"Geral","title":"DICA DE PROVA — Roteiro sugerido por tópico (25–40 min)","html":"1) Faça as questões de fixação sem consultar · 2) Corrija pelos links · 3) Leia o resumo só do que errou/chutou · 4) Copie o BIZU para seu caderno de erros · 5) Marque o tópico no checklist de revisão e siga o cronograma de revisões espaçadas (R1, R7, R14)."},{"id":"b67","kind":"atn","topic":"como","mod":"Geral","title":"ATENÇÃO — Questões","html":"<b>Todas as questões deste material são inéditas, autorais, no estilo Cesgranrio<\/b> — não são questões reais de prova. Dados de provas reais citados na análise vêm de fontes indicadas no capítulo “Fontes”."},{"id":"b68","kind":"bizu","topic":"raiox","mod":"Geral","title":"BIZU — Conta de sobrevivência","html":"<b>Específicos ≥ 25<\/b> · <b>Gerais ≥ 10<\/b> (PT + EN) · <b>PT ≥ 1 e EN ≥ 1<\/b>. Mas, para ser habilitado, você precisa ficar entre os primeiros em Específicos: na ampla concorrência da ênfase 7, <b>2 × (1 vaga + 5 CR) = 12 posições<\/b> (leitura do item 7.1.2 d com o Anexo I; a equiparação de gênero pode acrescentar habilitadas). Ou seja: <b>Específicos decide quem continua; Gerais desempata a ordem final<\/b>."},{"id":"b69","kind":"atn","topic":"raiox","mod":"Geral","title":"ATENÇÃO","html":"O edital não prevê desconto por resposta errada (cada questão vale 1 ponto) → <b>não deixe nenhuma em branco<\/b>. Questões não assinaladas, com dupla marcação ou rasura não são computadas (8.20.1)."},{"id":"b70","kind":"bizu","topic":"compara","mod":"Geral","title":"BIZU — Leitura estratégica","html":"Mesma banca, mesma estrutura, conteúdo <b>maior<\/b>. A prova de 2023 é o melhor modelo disponível do estilo — mas há ~10 tópicos novos (Wi-Fi, eng. social, CAPEC, 24 ferramentas, ICP-Brasil, forense/OSINT, CIS Benchmarks, SAMM, NIST CSF 2.0, CIS v8.1, 27035/22301/22313/27701) que <b>não têm histórico<\/b> nesta ênfase: estude o essencial de cada um. Com Gerais agora somando na nota final, PT e EN valem mais do que em 2023."},{"id":"b71","kind":"atn","topic":"maiscai","mod":"Geral","title":"ATENÇÃO — Limitação","html":"Não encontrei estatística por tópico <b>separada<\/b> para as provas de TI/segurança da Petrobras, Banco do Brasil, Caixa, BNDES, Banco da Amazônia ou IBGE; os números acima são o melhor dado verificável encontrado. Não foi possível baixar o caderno completo de 2023 em PDF (o site exigia verificação humana)."},{"id":"b72","kind":"peg","topic":"perfil","mod":"Geral","title":"PEGADINHA DA CESGRANRIO — As 10 pegadinhas mais comuns","html":"1) Trocar <b>autenticação × autorização<\/b>. 2) Atribuir <b>sigilo à assinatura digital<\/b>. 3) <b>AH com confidencialidade<\/b>. 4) <b>IDS que bloqueia<\/b>. 5) <b>-sS completa o handshake<\/b>. 6) Versão errada da norma (2013 × 2022). 7) “<b>Sempre/nunca/todos<\/b>” em alternativas. 8) <b>Controlador × operador<\/b>. 9) Prazos do Marco Civil invertidos (1 ano × 6 meses). 10) Em inglês, <b>may × must<\/b> e falsos cognatos (<i>actually, eventually<\/i>)."},{"id":"b73","kind":"dica","topic":"perfil","mod":"Geral","title":"DICA DE PROVA — Gestão do tempo (4h30 = 270 min)","html":"Sugestão: <b>Específicos primeiro<\/b> (~150 min, 3 min/questão) → <b>Inglês<\/b> (~40 min) → <b>Português<\/b> (~40 min) → <b>cartão-resposta<\/b> (20 min, sem pressa) → 20 min de folga para as marcadas. Duas passadas: na 1ª, responda o que sabe e marque o resto; na 2ª, elimine alternativas. Nunca deixe questão em branco."}],"passages":{"p1":"<div class=\"texto\"><p class=\"tt\">Texto I — autoral, elaborado para este material<\/p>\n<p>(1) Durante muito tempo, a proteção de uma empresa resumia-se a um muro alto e a um vigia atento. (2) Hoje, os muros continuam necessários, mas já não bastam: os invasores raramente pulam cercas, preferem bater à porta com um e-mail convincente. (3) Embora as ferramentas tenham evoluído, o elo mais frágil ainda é o comportamento humano, que nenhum firewall consegue corrigir sozinho.<\/p>\n<p>(4) Por isso, programas de conscientização deixaram de ser um item burocrático. (5) Quando bem conduzidos, transformam cada funcionário em um sensor: alguém que desconfia, pergunta e reporta. (6) Não se trata de espalhar medo, e sim de criar hábitos — verificar o remetente, recusar pedidos urgentes fora do padrão, comunicar o que parece estranho.<\/p><\/div>","p2":"<div class=\"texto\"><p class=\"tt\">Text I — original text written for this study guide<\/p>\n<p>(1) Pipeline operators have spent decades making their control systems reliable. (2) Security, however, was rarely part of the original design: many controllers still accept commands from anyone who can reach them on the network. (3) As these systems became connected to corporate networks and remote maintenance tools, the attack surface grew considerably.<\/p>\n<p>(4) Network segmentation is often presented as the answer. (5) It is certainly effective, but it is not a silver bullet. (6) Attackers who compromise a vendor's laptop may cross carefully designed zones without triggering a single alarm. (7) Therefore, experts recommend combining segmentation with continuous monitoring, strict control of remote access and regular exercises in which engineers and security analysts respond together.<\/p>\n<p>(8) Although new standards have raised awareness, budgets remain limited, and replacing a controller that works perfectly is a hard sell. (9) Operators thus tend to prioritize compensating controls that can be deployed without interrupting operations, which, in an industry where downtime is measured in lost barrels, is hardly surprising.<\/p><\/div>","p3":"<div class=\"texto\"><p class=\"tt\">Texto para as questões 1 a 10 — texto autoral, elaborado para este simulado<\/p>\n<p>(1) Há quem imagine que a segurança de uma empresa de energia se decide em salas refrigeradas, diante de telas cheias de gráficos. (2) Em parte, é verdade. (3) Mas boa parte das decisões que importam acontece longe dali: no técnico que aceita, ou não, conectar um pendrive desconhecido ao painel de uma estação de bombeamento; no gestor que aprova, ou não, a troca de um equipamento que “nunca deu problema”.<\/p>\n<p>(4) A tecnologia oferece instrumentos cada vez mais sofisticados, mas instrumentos não substituem critério. (5) Um alarme que dispara cem vezes por dia acaba ignorado, assim como uma regra que ninguém compreende acaba contornada. (6) Por isso, as organizações mais maduras investem tanto em pessoas quanto em ferramentas: explicam o porquê das regras, simplificam processos e tratam o erro relatado como informação valiosa, e não como motivo de punição.<\/p>\n<p>(7) Não se trata de ingenuidade. (8) Trata-se de reconhecer que, num ambiente em que o atacante precisa acertar uma única vez, a defesa depende de que milhares de pequenas escolhas sejam feitas corretamente todos os dias. (9) Se cada profissional souber a que riscos está exposto e a quem recorrer, a empresa terá construído algo que nenhum fornecedor consegue vender pronto: uma cultura de segurança.<\/p><\/div>","p4":"<div class=\"texto\"><p class=\"tt\">Text for questions 11 to 20 — original text written for this mock exam<\/p>\n<p>(1) For years, multifactor authentication (MFA) was promoted as the single most important step an organization could take to protect its accounts. (2) The advice was sound: stolen passwords alone became far less useful to criminals. (3) Attackers, however, adapted quickly.<\/p>\n<p>(4) Some now flood users with push notifications until a tired employee taps \"approve\" just to make them stop, a technique known as MFA fatigue. (5) Others set up convincing replicas of login pages that relay credentials and one-time codes to the real service in real time, capturing the session cookie that is issued afterwards. (6) In both cases, the second factor was technically present; it simply did not stop the intrusion.<\/p>\n<p>(7) None of this means that MFA should be abandoned. (8) On the contrary, accounts without it remain dramatically easier to compromise. (9) What has changed is the understanding that not all second factors offer the same level of protection. (10) Phishing-resistant methods, such as hardware security keys based on public-key cryptography, bind the authentication to the legitimate website, so a replica cannot reuse the response. (11) Number matching and limits on repeated push requests, meanwhile, make fatigue attacks considerably harder.<\/p>\n<p>(12) Security teams are therefore being urged to treat MFA as a baseline rather than a finish line. (13) Monitoring for unusual sign-ins, shortening session lifetimes and training users to report unexpected prompts should accompany any deployment, since no single control is likely to hold if it stands alone.<\/p><\/div>","p5":"<div class=\"texto\"><p class=\"tt\">Texto para as questões 1 a 10 — texto autoral, elaborado para este simulado<\/p>\n<p>(1) Em ambientes industriais, a tentação de “deixar para depois” a correção de uma falha conhecida é grande: a produção não pode parar, o turno já está atrasado e o procedimento de mudança parece burocrático. (2) Sucede, porém, que o atacante não aguarda a janela conveniente da equipe. (3) Ele explora exatamente o intervalo em que a organização adiou a correção.<\/p>\n<p>(4) Por isso, maturidade em segurança não se mede apenas pelo número de ferramentas instaladas, mas pela disciplina com que se trata o risco residual. (5) Equipes que documentam o que foi aceito, por quanto tempo e sob quais condições conseguem, no momento crítico, distinguir o incidente previsível da surpresa genuína. (6) As que não o fazem, descobrem tarde demais que o “depois” chegou primeiro.<\/p>\n<p>(7) Não se trata de transformar cada analista em obstáculo à operação. (8) Trata-se de reconhecer que a disponibilidade do processo e a proteção da informação são faces da mesma decisão — e que adiar a segunda, sem registro e sem prazo, é, na prática, optar por ela.<\/p><\/div>","p6":"<div class=\"texto\"><p class=\"tt\">Text for questions 11 to 20 — original text written for this mock exam<\/p>\n<p>(1) Patch management in operational technology is rarely a matter of clicking “update now”. (2) A controller that has run without incident for years may still contain a publicly documented flaw; applying the vendor fix, however, often requires a maintenance window that production supervisors resist. (3) Consequently, many operators rely on compensating controls — network segmentation, strict allow-lists, continuous monitoring — while the patch remains pending.<\/p>\n<p>(4) Compensating controls are not a substitute for remediation. (5) They buy time, reduce the blast radius of an exploit and give asset owners a defensible position before auditors and regulators. (6) Yet they also create a dangerous illusion: the longer a known vulnerability stays unpatched, the more the organization depends on the perfect functioning of every compensating layer. (7) When one of those layers fails, the deferred patch becomes the incident’s root cause.<\/p>\n<p>(8) Mature programmes therefore treat every accepted risk as temporary, with an owner, an expiry date and a trigger for reassessment. (9) Otherwise, “temporary” quietly becomes the new normal.<\/p><\/div>","p7":"<div class=\"texto\"><p class=\"tt\">Text 1 — MFA resistente a phishing (texto real)<\/p><p>MFA is a security control that requires a user to present a combination of two or more different authenticators (something you know, something you have, or something you are) to verify their identity for login. MFA makes it more difficult for cyber threat actors to gain access to networks and information systems if passwords or personal identification numbers (PINs) are compromised through phishing attacks or other means. With MFA enabled, if one factor, such as a password, becomes compromised, unauthorized users will be unable to access the account if they cannot also provide the second factor. This additional layer ultimately stops some of the common malicious cyber techniques, such as password spraying.<\/p><p>CISA has consistently urged organizations to implement MFA for all users and for all services, including email, file sharing, and financial account access. However, not all forms of MFA are equally secure. Some forms are vulnerable to phishing, &quot;push bombing&quot; attacks, exploitation of Signaling System 7 (SS7) protocol vulnerabilities, and/or SIM Swap attacks. These attacks, if successful, may allow a threat actor to gain access to MFA authentication credentials or bypass MFA.<\/p><p>While any form of MFA is better than no MFA and will reduce an organization&#x27;s attack surface, phishing-resistant MFA is the gold standard and organizations should make migrating to it a high priority effort. CISA strongly urges all organizations to implement phishing-resistant MFA as part of applying Zero Trust principles.<\/p><p class=\"small\">Fonte: CISA — Implementing Phishing-Resistant MFA (fact sheet, Oct 2022) — <a href=\"https://www.cisa.gov/sites/default/files/publications/fact-sheet-implementing-phishing-resistant-mfa-508c.pdf\" target=\"_blank\" rel=\"noopener\">https://www.cisa.gov/sites/default/files/publications/fact-sheet-implementing-phishing-resistant-mfa-508c.pdf<\/a><\/p><\/div>","p8":"<div class=\"texto\"><p class=\"tt\">Text 2 — Zero Trust — abstract (texto real)<\/p><p>Zero trust (ZT) is the term for an evolving set of cybersecurity paradigms that move defenses from static, network-based perimeters to focus on users, assets, and resources. A zero trust architecture (ZTA) uses zero trust principles to plan industrial and enterprise infrastructure and workflows. Zero trust assumes there is no implicit trust granted to assets or user accounts based solely on their physical or network location (i.e., local area networks versus the internet) or based on asset ownership (enterprise or personally owned). Authentication and authorization (both subject and device) are discrete functions performed before a session to an enterprise resource is established. Zero trust is a response to enterprise network trends that include remote users, bring your own device (BYOD), and cloud-based assets that are not located within an enterprise-owned network boundary. Zero trust focuses on protecting resources (assets, services, workflows, network accounts, etc.), not network segments, as the network location is no longer seen as the prime component to the security posture of the resource. This document contains an abstract definition of zero trust architecture (ZTA) and gives general deployment models and use cases where zero trust could improve an enterprise&#x27;s overall information technology security posture.<\/p><p class=\"small\">Fonte: NIST SP 800-207 — Zero Trust Architecture (Aug 2020), Abstract — <a href=\"https://doi.org/10.6028/NIST.SP.800-207\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.6028/NIST.SP.800-207<\/a><\/p><\/div>","p9":"<div class=\"texto\"><p class=\"tt\">Text 3 — ENISA Threat Landscape — ameaças principais (texto real)<\/p><p>In its eleventh edition, the ENISA Threat Landscape (ETL) report offers a broad overview of the cybersecurity threat landscape. Over time, the ETL has served as a crucial tool for comprehending the present state of cybersecurity within the European Union (EU), furnishing insights into trends and patterns. Throughout the latter part of 2022 and the initial half of 2023, there was a notable escalation in cybersecurity attacks, setting new benchmarks in both the variety and number of incidents, as well as their consequences. The phenomenon of hacktivism has seen steady expansion, marked by the emergence of numerous new groups. Concurrently, it was observed that a rise of ransomware groups took place, with the first half of 2023 witnessing an unprecedented surge in ransomware incidents, a trend that shows no signs of abating.<\/p><p>According to the findings detailed in this report, the ENISA Threat Landscape 2023 report highlights eight prime threat groups. Ransomware is defined as a type of attack where threat actors take control of a target&#x27;s assets and demand a ransom in exchange for the return of the asset&#x27;s availability. This action-agnostic definition is needed to cover the changing ransomware threat landscape, the prevalence of multiple extortion techniques and the various goals, other than solely financial gains, of the perpetrators. Social engineering encompasses a broad range of activities that attempt to exploit human error or human behaviour with the objective of gaining access to information or services. Although the lures and tricks used may abuse technology, they rely on a human element to be successful.<\/p><p class=\"small\">Fonte: ENISA Threat Landscape 2023 (Oct 2023), §1 Threat Landscape Overview / Prime Threats — <a href=\"https://www.enisa.europa.eu/publications/enisa-threat-landscape-2023\" target=\"_blank\" rel=\"noopener\">https://www.enisa.europa.eu/publications/enisa-threat-landscape-2023<\/a><\/p><\/div>","p10":"<div class=\"texto\"><p class=\"tt\">Text 4 — Resposta a incidentes (NIST SP 800-61r3) (texto real)<\/p><p>Incident response is a critical part of cybersecurity risk management and should be integrated across organizational operations. All six NIST Cybersecurity Framework (CSF) 2.0 Functions play vital roles in incident response:\n• Govern, Identify, and Protect help organizations prevent some incidents, prepare to handle incidents that do occur, reduce the impact of those incidents, and improve incident response and cybersecurity risk management practices based on lessons learned from those incidents.\n• Detect, Respond, and Recover help organizations discover, manage, prioritize, contain, eradicate, and recover from cybersecurity incidents, as well as perform incident reporting, notification, and other incident-related communications.<\/p><p>Many individuals, teams, and third parties hold a wide variety of roles and responsibilities across all of the Functions that support an organization&#x27;s incident response. Organizations have no direct control over the tactics and techniques used by their adversaries, nor are they certain about the timing of a future incident other than knowing that another incident is inevitable. However, organizations can use an incident response life cycle framework or model that best suits them to develop strong cybersecurity risk management practices that reduce their risks to acceptable levels.<\/p><p>Organizations should use the incident response life cycle framework or model that suits them best. Regardless of the model used, every organization should take incident response into consideration throughout their cybersecurity risk management activities.<\/p><p class=\"small\">Fonte: NIST SP 800-61r3 — Incident Response Recommendations (Apr 2025), Executive Summary — <a href=\"https://doi.org/10.6028/NIST.SP.800-61r3\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.6028/NIST.SP.800-61r3<\/a><\/p><\/div>","p11":"<div class=\"texto\"><p class=\"tt\">Text 5 — NIST CSF 2.0 (texto real)<\/p><p>The Cybersecurity Framework (CSF) 2.0 is designed to help organizations of all sizes and sectors — including industry, government, academia, and nonprofit — to manage and reduce their cybersecurity risks. It is useful regardless of the maturity level and technical sophistication of an organization&#x27;s cybersecurity programs. Nevertheless, the CSF does not embrace a one-size-fits-all approach. Each organization has both common and unique risks, as well as varying risk appetites and tolerances, specific missions, and objectives to achieve those missions. By necessity, the way organizations implement the CSF will vary.<\/p><p>Ideally, the CSF will be used to address cybersecurity risks alongside other risks of the enterprise, including those that are financial, privacy, supply chain, reputational, technological, or physical in nature.<\/p><p>The CSF describes desired outcomes that are intended to be understood by a broad audience, including executives, managers, and practitioners, regardless of their cybersecurity expertise. Because these outcomes are sector-, country-, and technology-neutral, they provide an organization with the flexibility needed to address their unique risks, technologies, and mission considerations. Building on previous versions, CSF 2.0 contains new features that highlight the importance of governance and supply chains.<\/p><p class=\"small\">Fonte: NIST CSWP 29 — The NIST Cybersecurity Framework (CSF) 2.0 (Feb 2024), Preface — <a href=\"https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf\" target=\"_blank\" rel=\"noopener\">https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf<\/a><\/p><\/div>","p12":"<div class=\"texto\"><p class=\"tt\">Text 6 — OWASP — Broken Access Control (texto real)<\/p><p>Access control enforces policy such that users cannot act outside of their intended permissions. Failures typically lead to unauthorized information disclosure, modification, or destruction of all data or performing a business function outside the user&#x27;s limits. Common access control vulnerabilities include:<\/p><p>Violation of the principle of least privilege or deny by default, where access should only be granted for particular capabilities, roles, or users, but is available to anyone. Bypassing access control checks by modifying the URL (parameter tampering or force browsing), internal application state, or the HTML page, or by using an attack tool modifying API requests. Permitting viewing or editing someone else&#x27;s account, by providing its unique identifier (insecure direct object references). Accessing API with missing access controls for POST, PUT and DELETE. Elevation of privilege. Acting as a user without being logged in or acting as an admin when logged in as a user. Metadata manipulation, such as replaying or tampering with a JSON Web Token (JWT) access control token, or a cookie or hidden field manipulated to elevate privileges. CORS misconfiguration allows API access from unauthorized or untrusted origins. Force browsing to authenticated pages as an unauthenticated user or to privileged pages as a standard user.<\/p><p>Access control is only effective in trusted server-side code or server-less API, where the attacker cannot modify the access control check or metadata. Except for public resources, deny by default.<\/p><p class=\"small\">Fonte: OWASP Top 10:2021 — A01 Broken Access Control — <a href=\"https://owasp.org/Top10/A01_2021-Broken_Access_Control/\" target=\"_blank\" rel=\"noopener\">https://owasp.org/Top10/A01_2021-Broken_Access_Control/<\/a><\/p><\/div>","p13":"<div class=\"texto\"><p class=\"tt\">Text 7 — OWASP — Injection (texto real)<\/p><p>An application is vulnerable to attack when: user-supplied data is not validated, filtered, or sanitized by the application; dynamic queries or non-parameterized calls without context-aware escaping are used directly in the interpreter; hostile data is used within object-relational mapping (ORM) search parameters to extract additional, sensitive records; or hostile data is directly used or concatenated. The SQL or command contains the structure and malicious data in dynamic queries, commands, or stored procedures.<\/p><p>Some of the more common injections are SQL, NoSQL, OS command, Object Relational Mapping (ORM), LDAP, and Expression Language (EL) or Object Graph Navigation Library (OGNL) injection. The concept is identical among all interpreters. Source code review is the best method of detecting if applications are vulnerable to injections. Automated testing of all parameters, headers, URL, cookies, JSON, SOAP, and XML data inputs is strongly encouraged. Organizations can include static (SAST), dynamic (DAST), and interactive (IAST) application security testing tools into the CI/CD pipeline to identify introduced injection flaws before production deployment.<\/p><p>Preventing injection requires keeping data separate from commands and queries. The preferred option is to use a safe API, which avoids using the interpreter entirely, provides a parameterized interface, or migrates to Object Relational Mapping Tools (ORMs). Use positive server-side input validation. This is not a complete defense as many applications require special characters.<\/p><p class=\"small\">Fonte: OWASP Top 10:2021 — A03 Injection — <a href=\"https://owasp.org/Top10/A03_2021-Injection/\" target=\"_blank\" rel=\"noopener\">https://owasp.org/Top10/A03_2021-Injection/<\/a><\/p><\/div>","p14":"<div class=\"texto\"><p class=\"tt\">Text 8 — Ransomware — visão geral (CISA) (texto real)<\/p><p>Ransomware is a form of malware designed to encrypt files on a device, rendering any files and the systems that rely on them unusable. Malicious actors then demand ransom in exchange for decryption. In recent years, ransomware incidents have become increasingly prevalent among the Nation&#x27;s state, local, tribal, and territorial (SLTT) government entities and critical infrastructure organizations. Ransomware incidents can severely impact business processes and leave organizations without the data they need to operate and deliver mission-critical services. Malicious actors have adjusted their ransomware tactics over time to include pressuring victims for payment by threatening to release stolen data if they refuse to pay and publicly naming and shaming victims as secondary forms of extortion. The monetary value of ransom demands has also increased. Ransomware incidents have become more destructive: malicious actors engage in lateral movement to target critical data and propagate ransomware across entire networks. These actors also increasingly use tactics, such as deleting system backups, that make restoration and recovery more difficult or infeasible for impacted organizations.<\/p><p class=\"small\">Fonte: CISA / MS-ISAC — Ransomware Guide (Sep 2020), Overview — <a href=\"https://www.cisa.gov/sites/default/files/publications/CISA_MS-ISAC_Ransomware%20Guide_S508C.pdf\" target=\"_blank\" rel=\"noopener\">https://www.cisa.gov/sites/default/files/publications/CISA_MS-ISAC_Ransomware%20Guide_S508C.pdf<\/a><\/p><\/div>","p15":"<div class=\"texto\"><p class=\"tt\">Text 9 — Ransomware — vetores (RDP, phishing, SMB) (texto real)<\/p><p>Conduct regular vulnerability scanning to identify and address vulnerabilities, especially those on internet-facing devices, to limit the attack surface. Regularly patch and update software and OSs to the latest available versions. Prioritize timely patching of internet-facing servers—as well as software processing internet data, such as web browsers, browser plugins, and document readers—for known vulnerabilities. Ensure devices are properly configured and that security features are enabled. For example, disable ports and protocols that are not being used for a business purpose (e.g., Remote Desktop Protocol [RDP] – Transmission Control Protocol [TCP] Port 3389). Employ best practices for use of RDP and other remote desktop services. Threat actors often gain initial access to a network through exposed and poorly secured remote services, and later propagate ransomware. Audit the network for systems using RDP, close unused RDP ports, enforce account lockouts after a specified number of attempts, apply multi-factor authentication (MFA), and log RDP login attempts. Disable or block Server Message Block (SMB) protocol outbound and remove or disable outdated versions of SMB. Threat actors use SMB to propagate malware across organizations. Implement a cybersecurity user awareness and training program that includes guidance on how to identify and report suspicious activity (e.g., phishing) or incidents. To lower the chance of spoofed or modified emails from valid domains, implement Domain-based Message Authentication, Reporting and Conformance (DMARC) policy and verification.<\/p><p class=\"small\">Fonte: CISA / MS-ISAC — Ransomware Guide (Sep 2020), Prevention Best Practices — <a href=\"https://www.cisa.gov/sites/default/files/publications/CISA_MS-ISAC_Ransomware%20Guide_S508C.pdf\" target=\"_blank\" rel=\"noopener\">https://www.cisa.gov/sites/default/files/publications/CISA_MS-ISAC_Ransomware%20Guide_S508C.pdf<\/a><\/p><\/div>","p16":"<div class=\"texto\"><p class=\"tt\">Text 10 — ICS / OT — práticas CISA (texto real)<\/p><p>Industrial Control Systems (ICS) are important to supporting US critical infrastructure and maintaining national security. ICS owners and operators face threats from a variety of adversaries whose intentions include gathering intelligence and disrupting National Critical Functions. As ICS owners and operators adopt new technologies to improve operational efficiencies, they should be aware of the additional cybersecurity risk of connecting operational technology (OT) to enterprise information technology (IT) systems and Internet of Things (IoT) devices. Among the risks are: expanding ICS cyberattack surface, which may lead to an increase in security events; eliminating ICS network segmentation from traditional business IT systems or internet devices, resulting in greater access to critical systems; increasing susceptibility to IT commodity malware and ransomware, which can lead to a potential disruption of physical processes.<\/p><p>CISA assessments highlighted prevalent IT and OT weaknesses including boundary protection, principle of least functionality, identification and authentication, physical access control, and account management. Recommended practices include checking, prioritizing, testing, and implementing ICS security patches; backing up system data and configurations; implementing a risk-based defense-in-depth approach to securing ICS hosts and networks; utilizing segmentation of networks where possible; and configuring firewalls to control traffic between the ICS network and corporate IT network.<\/p><p class=\"small\">Fonte: CISA — Recommended Cybersecurity Practices for Industrial Control Systems — <a href=\"https://www.cisa.gov/sites/default/files/publications/Cybersecurity_Best_Practices_for_Industrial_Control_Systems.pdf\" target=\"_blank\" rel=\"noopener\">https://www.cisa.gov/sites/default/files/publications/Cybersecurity_Best_Practices_for_Industrial_Control_Systems.pdf<\/a><\/p><\/div>","p17":"<div class=\"texto\"><p class=\"tt\">Text 11 — Phishing e engenharia social (CISA) (texto real)<\/p><p>In a social engineering attack, an attacker uses human interaction (social skills) to obtain or compromise information about an organization or its computer systems. An attacker may seem unassuming and respectable, possibly claiming to be a new employee, repair person, or researcher and even offering credentials to support that identity. However, by asking questions, he or she may be able to piece together enough information to infiltrate an organization&#x27;s network.<\/p><p>Phishing is a form of social engineering. Phishing attacks use email or malicious websites to solicit personal information by posing as a trustworthy organization. For example, an attacker may send email seemingly from a reputable credit card company or financial institution that requests account information, often suggesting that there is a problem. When users respond with the requested information, attackers can use it to gain access to the accounts.<\/p><p>Vishing is the social engineering approach that leverages voice communication. Smishing is a form of social engineering that exploits SMS, or text, messages. Text messages can contain links to webpages, email addresses or phone numbers that when clicked may automatically open a browser window or email message or dial a number. Common indicators of phishing attempts include a suspicious sender&#x27;s address, generic greetings, spoofed hyperlinks and websites, poor spelling and layout, and suspicious attachments. Enforce multifactor authentication (MFA). Do not provide personal information unless you are certain of a person&#x27;s authority to have the information.<\/p><p class=\"small\">Fonte: CISA — Avoiding Social Engineering and Phishing Attacks (Feb 2021) — <a href=\"https://www.cisa.gov/news-events/news/avoiding-social-engineering-and-phishing-attacks\" target=\"_blank\" rel=\"noopener\">https://www.cisa.gov/news-events/news/avoiding-social-engineering-and-phishing-attacks<\/a><\/p><\/div>","p18":"<div class=\"texto\"><p class=\"tt\">Text 12 — Gestão de patches / vulnerabilidades (NIST SP 800-40r4) (texto real)<\/p><p>Software maintenance includes patching, which is the act of applying a change to installed software — such as firmware, operating systems, or applications — that corrects security or functionality problems or adds new capabilities. Enterprise patch management is the process of identifying, prioritizing, acquiring, installing, and verifying the installation of patches, updates, and upgrades throughout an organization. In today&#x27;s environments, patching has become more important, often rising to the level of mission criticality. As part of a zero trust approach to security, it is now recognized that the perimeter largely does not exist anymore, and most technologies are directly exposed to the internet, putting systems at significantly greater risk of compromise. This dynamic applies across IT, operational technology (OT), Internet of Things (IoT), mobile, cloud, virtual machine, container, or other types of assets. Zero trust architectures emphasize business asset-specific security over just protecting a network with assets on it, so patching is vital for reducing risk to those individual assets and determining the assets&#x27; trust status. Leadership should reconsider the priority of enterprise patch management: patching should be considered a standard cost of doing business and should be rigorously followed and tracked.<\/p><p class=\"small\">Fonte: NIST SP 800-40r4 — Guide to Enterprise Patch Management Planning (Apr 2022), Executive Summary — <a href=\"https://doi.org/10.6028/NIST.SP.800-40r4\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.6028/NIST.SP.800-40r4<\/a><\/p><\/div>"},"questions":[{"id":"f1","n":1,"src":"fix","topic":"of1","mod":"Ofensiva","prio":"Média","stem":"Um atacante, posicionado em um enlace de uma rede corporativa, não consegue decifrar o conteúdo das sessões TLS, mas registra horários, volumes e pares de endereços IP que se comunicam, e com isso deduz quando ocorrem as transferências de fechamento contábil. Esse ataque é classificado como","passage":null,"alts":["ativo, do tipo disfarce (masquerade)","ativo, do tipo repetição (replay)","passivo, do tipo análise de tráfego (inferência)","passivo, do tipo modificação de mensagens","ativo, do tipo negação de serviço distribuída"],"ans":"C","com":"O atacante apenas observa metadados (quem, quando, quanto) sem alterar nada: ataque <b>passivo<\/b> de <b>análise de tráfego/inferência<\/b>. Modificação de mensagens é ataque ativo; disfarce, replay e DoS também são ativos."},{"id":"f2","n":2,"src":"fix","topic":"of1","mod":"Ofensiva","prio":"Média","stem":"Em um sistema de autenticação, um atacante captura a mensagem cifrada que contém as credenciais de um usuário legítimo e, horas depois, a reenvia ao servidor, obtendo acesso sem conhecer a senha. O controle mais adequado para impedir esse ataque é","passage":null,"alts":["incluir nonce ou carimbo de tempo na mensagem de autenticação, rejeitando mensagens já vistas ou antigas","aumentar o tamanho da chave simétrica de 128 para 256 bits","substituir o algoritmo de hash MD5 por SHA-256 no armazenamento de senhas","aplicar preenchimento de tráfego (traffic padding) no enlace","migrar a rede de hubs para switches gerenciáveis"],"ans":"A","com":"É um ataque de <b>repetição (replay)<\/b>: a mensagem é válida e é reenviada sem ser decifrada. Chave maior ou hash melhor não impedem o reenvio; a defesa é tornar cada mensagem única no tempo (<b>nonce/timestamp/sequência<\/b>). Traffic padding combate análise de tráfego."},{"id":"f3","n":3,"src":"fix","topic":"of2","mod":"Ofensiva","prio":"Alta","stem":"Um analista precisa identificar rapidamente quais hosts de uma sub-rede /24 estão ativos, sem realizar varredura de portas, para depois planejar o teste. O comando nmap adequado é","passage":null,"alts":["nmap -sS -p- 10.10.5.0/24","nmap -sV 10.10.5.0/24","nmap -O 10.10.5.0/24","nmap -sn 10.10.5.0/24","nmap -sT -F 10.10.5.0/24"],"ans":"D","com":"<code>-sn<\/code> faz apenas a descoberta de hosts (ping scan), <b>sem portas<\/b>. -sS -p- varre todas as portas; -sV detecta versão; -O detecta SO; -sT -F faz connect scan nas 100 portas mais comuns."},{"id":"f4","n":4,"src":"fix","topic":"of2","mod":"Ofensiva","prio":"Alta","stem":"Na varredura de portas TCP, a técnica conhecida como half-open caracteriza-se por","passage":null,"alts":["completar o three-way handshake por meio da chamada connect() do sistema operacional","enviar SYN e, ao receber SYN/ACK, responder com RST, sem completar o three-way handshake","enviar pacotes com os flags FIN, PSH e URG ligados simultaneamente","enviar segmentos ACK para mapear se as regras do firewall são stateful","enviar datagramas vazios e aguardar ICMP port unreachable"],"ans":"B","com":"Half-open = <b>SYN scan<\/b> (<code>-sS<\/code>): não conclui a conexão, por isso é mais discreto. connect() é o -sT; FIN+PSH+URG é Xmas; ACK scan mapeia firewall; datagrama vazio com ICMP unreachable é UDP scan."},{"id":"f5","n":5,"src":"fix","topic":"of2","mod":"Ofensiva","prio":"Alta","stem":"Um pentester executou <code>nmap -sV -O -p- 192.168.0.10<\/code>. Esse comando irá","passage":null,"alts":["varrer apenas as 1.000 portas mais comuns e identificar versões dos serviços","descobrir os hosts ativos sem varrer portas e identificar o sistema operacional","realizar varredura UDP em todas as portas e executar scripts NSE padrão","realizar varredura ACK para mapear regras de firewall e identificar o sistema operacional","varrer as 65.535 portas TCP, identificar versões dos serviços e tentar identificar o sistema operacional"],"ans":"E","com":"<code>-p-<\/code> = todas as portas (1–65535); <code>-sV<\/code> = versão; <code>-O<\/code> = sistema operacional. Sem -sU a varredura é TCP; scripts padrão seriam -sC/-A."},{"id":"f6","n":6,"src":"fix","topic":"of2","mod":"Ofensiva","prio":"Alta","stem":"Na metodologia de ataque, a etapa em que o atacante, após identificar as portas abertas, conecta-se a serviços como SMB, SNMP e LDAP para extrair nomes de usuários, grupos e compartilhamentos é denominada","passage":null,"alts":["footprinting","enumeração","varredura","escalação de privilégios","encobrimento de rastros"],"ans":"B","com":"<b>Enumeração<\/b> extrai informações de dentro dos serviços (contas, shares, versões). Varredura apenas descobre hosts/portas; footprinting é coleta prévia em fontes abertas."},{"id":"f7","n":7,"src":"fix","topic":"of3","mod":"Ofensiva","prio":"Alta","stem":"Um administrador verificou que, em diversas estações da mesma VLAN, a tabela ARP passou a associar o endereço IP do gateway padrão a um endereço MAC que pertence a um notebook não inventariado. O tráfego dessas estações continua chegando à internet, mas passa pelo notebook. Trata-se de","passage":null,"alts":["DNS cache poisoning, mitigável com DNSSEC no servidor recursivo","MAC flooding, mitigável com aumento da tabela CAM do switch","DHCP starvation, mitigável com a ampliação do escopo do servidor DHCP","ARP spoofing, mitigável com Dynamic ARP Inspection associado ao DHCP Snooping no switch","SYN flood, mitigável com SYN cookies no gateway"],"ans":"D","com":"IP do gateway → MAC do atacante, na mesma LAN, com tráfego repassado = <b>ARP spoofing (MitM)<\/b>. A defesa em switch é <b>DAI<\/b>, que confere os pacotes ARP com a base de vínculos do <b>DHCP Snooping<\/b>. DNS poisoning altera nome→IP; MAC flooding estoura a tabela CAM."},{"id":"f8","n":8,"src":"fix","topic":"of3","mod":"Ofensiva","prio":"Alta","stem":"Um atacante envia, a partir de diversos bots, pequenas requisições a servidores NTP públicos com o comando monlist, usando como endereço de origem o IP de um servidor-vítima. As respostas, muito maiores que as requisições, convergem para a vítima. Esse ataque é um(a)","passage":null,"alts":["DDoS por amplificação/reflexão baseado em UDP com IP spoofing","SYN flood com esgotamento da
