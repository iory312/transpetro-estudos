fila de conexões semiabertas","ataque Smurf baseado em ICMP echo request para broadcast","ataque Slowloris de exaustão de conexões HTTP","envenenamento de cache ARP com gratuitous ARP"],"ans":"A","com":"Requisição pequena + resposta grande + origem forjada = <b>amplificação/reflexão<\/b> (UDP, pois não há handshake). Smurf usa ICMP para broadcast; SYN flood é TCP; Slowloris é HTTP lento."},{"id":"f9","n":9,"src":"fix","topic":"of3","mod":"Ofensiva","prio":"Alta","stem":"Para mitigar ataques de SYN flood em um servidor web, sem descartar conexões legítimas, uma técnica que evita alocar recursos para a conexão antes da confirmação do cliente é o(a)","passage":null,"alts":["habilitação do HSTS","desativação do SMBv1","configuração de DHCP Snooping","uso de assinatura DKIM","uso de SYN cookies"],"ans":"E","com":"Com <b>SYN cookies<\/b>, o servidor codifica o estado no número de sequência do SYN/ACK e só aloca a conexão quando o ACK válido retorna. HSTS é contra SSL stripping; SMBv1 contra EternalBlue; DHCP Snooping contra rogue DHCP; DKIM contra spoofing de e-mail."},{"id":"f10","n":10,"src":"fix","topic":"of3","mod":"Ofensiva","prio":"Alta","stem":"Usuários digitam o endereço de um portal sem o prefixo https://. Um atacante em posição de MitM intercepta o primeiro acesso HTTP e mantém a vítima em HTTP enquanto ele próprio fala HTTPS com o servidor. O mecanismo que impede esse ataque após o primeiro acesso bem-sucedido, instruindo o navegador a usar apenas HTTPS para o domínio, é o","passage":null,"alts":["Content Security Policy (CSP)","cookie com atributo HttpOnly","HTTP Strict Transport Security (HSTS)","SPF publicado no DNS","OCSP stapling"],"ans":"C","com":"O ataque é <b>SSL stripping<\/b>. O cabeçalho <b>HSTS<\/b> (Strict-Transport-Security) faz o navegador converter automaticamente http→https para aquele domínio (a lista de <i>preload<\/i> protege até o primeiro acesso). CSP mitiga XSS; HttpOnly impede leitura do cookie por JavaScript."},{"id":"f11","n":11,"src":"fix","topic":"of4","mod":"Ofensiva","prio":"Média","stem":"Em um aeroporto, um atacante configura um ponto de acesso com o mesmo SSID da rede de visitantes de uma companhia aérea e com potência maior, apresentando um portal de login falso. Esse ataque é denominado","passage":null,"alts":["evil twin","rogue access point","SSID tracking","jamming","war driving"],"ans":"A","com":"Clonar o SSID para atrair clientes = <b>evil twin<\/b>. Rogue AP é um AP não autorizado conectado à rede corporativa; SSID tracking rastreia dispositivos; jamming é interferência de RF."},{"id":"f12","n":12,"src":"fix","topic":"of4","mod":"Ofensiva","prio":"Média","stem":"Um atacante envia, repetidamente, quadros de gerenciamento 802.11 forjados com o endereço do AP, desconectando os clientes de uma rede WPA2-PSK, para capturar o 4-way handshake na reconexão. O recurso que mitiga esse ataque é o(a)","passage":null,"alts":["ocultação do SSID no beacon","filtragem por endereço MAC no AP","redução da potência de transmissão do AP","uso de WEP com chave de 128 bits","Protected Management Frames (IEEE 802.11w)"],"ans":"E","com":"Ataque de <b>deauthentication/disassociation<\/b>. O <b>802.11w (PMF)<\/b> autentica quadros de gerenciamento. SSID oculto e filtro de MAC são facilmente contornados; WEP é inseguro."},{"id":"f13","n":13,"src":"fix","topic":"of5","mod":"Ofensiva","prio":"Alta","stem":"Em uma rede local comutada, um atacante envia milhares de quadros com endereços MAC de origem aleatórios para um switch, fazendo com que ele passe a encaminhar quadros para todas as portas, o que permite capturar tráfego de outros usuários. O ataque e a contramedida são, respectivamente,","passage":null,"alts":["ARP spoofing e DNSSEC","VLAN hopping e desativação do protocolo STP","MAC flooding e port security limitando o número de MACs por porta","DHCP starvation e HSTS","DNS spoofing e Dynamic ARP Inspection"],"ans":"C","com":"Estourar a tabela CAM = <b>MAC flooding<\/b>; o switch passa a inundar quadros (comporta-se como hub). <b>Port security<\/b> limita MACs aprendidos por porta."},{"id":"f14","n":14,"src":"fix","topic":"of6","mod":"Ofensiva","prio":"Média","stem":"Um funcionário recebe ligação de alguém que se apresenta como técnico do service desk, cita corretamente o nome do seu gestor e um chamado recente, e solicita o código de MFA que acabou de chegar ao celular “para concluir a manutenção”. A técnica predominante é o(a)","passage":null,"alts":["baiting","tailgating","pharming","pretexting realizado por vishing","watering hole"],"ans":"D","com":"Cenário inventado (“sou do suporte”) = <b>pretexting<\/b>, por telefone = <b>vishing<\/b>. Baiting usa isca física/digital; tailgating é físico; pharming redireciona DNS; watering hole compromete site visitado pelo alvo."},{"id":"f15","n":15,"src":"fix","topic":"of6","mod":"Ofensiva","prio":"Média","stem":"No ciclo de um ataque de engenharia social, a fase em que o atacante, depois de reunir informações sobre o alvo, procura estabelecer rapport e credibilidade com a vítima é a de","passage":null,"alts":["pesquisa","desenvolvimento de relacionamento","exploração da confiança","utilização da informação","encobrimento de rastros"],"ans":"B","com":"Ordem: pesquisa → <b>desenvolvimento de relacionamento<\/b> → exploração → utilização. Encobrimento de rastros é etapa do ataque técnico (1.4), não do ciclo de engenharia social."},{"id":"f16","n":16,"src":"fix","topic":"of7","mod":"Ofensiva","prio":"Média","stem":"Um banco implementou teclado virtual para a digitação de senhas no internet banking. Ainda assim, clientes tiveram senhas furtadas por um malware que armazenava imagens da região da tela ao redor do ponteiro do mouse a cada clique. Esse malware é um","passage":null,"alts":["keylogger","cryptojacker","flooder","screenlogger","rootkit"],"ans":"D","com":"Captura de tela em torno do clique = <b>screenlogger<\/b>, criado justamente para contornar teclados virtuais. Keylogger captura teclas."},{"id":"f17","n":17,"src":"fix","topic":"of7","mod":"Ofensiva","prio":"Média","stem":"Clientes de uma loja virtual tiveram dados de cartão de crédito furtados, embora seus computadores estivessem limpos. A perícia identificou um script JavaScript malicioso inserido na página de checkout, que enviava os dados digitados a um servidor externo. Trata-se de","passage":null,"alts":["cryptojacking","formjacking","ransomware","worm","backdoor"],"ans":"B","com":"Script injetado em formulário de pagamento = <b>formjacking<\/b> (skimming digital)."},{"id":"f18","n":18,"src":"fix","topic":"of7","mod":"Ofensiva","prio":"Média","stem":"Malware que se propaga automaticamente pela rede, explorando vulnerabilidades em serviços, sem depender de um arquivo hospedeiro nem da ação do usuário, é classificado como","passage":null,"alts":["vírus de macro","cavalo de Troia","spyware","downloader","worm"],"ans":"E","com":"<b>Worm<\/b> = autopropagação sem hospedeiro. Vírus precisa de hospedeiro e execução; Trojan não se replica."},{"id":"f19","n":19,"src":"fix","topic":"of8","mod":"Ofensiva","prio":"Alta","stem":"Durante a resposta a um incidente, constatou-se que o atacante executou o mimikatz em um servidor Windows para extrair, da memória do processo lsass.exe, hashes NTLM e tickets Kerberos de administradores. No MITRE ATT&CK, essa ação corresponde à tática","passage":null,"alts":["Credential Access, técnica OS Credential Dumping: LSASS Memory (T1003.001)","Lateral Movement, técnica Remote Services (T1021)","Collection, técnica Data from Local System (T1005)","Privilege Escalation, técnica Abuse Elevation Control Mechanism (T1548)","Discovery, técnica Account Discovery (T1087)"],"ans":"A","com":"Obter senha/hash/ticket = <b>Credential Access<\/b>; despejo da memória do LSASS = <b>T1003.001<\/b>. Lateral Movement seria <i>usar<\/i> esses hashes para acessar outra máquina."},{"id":"f20","n":20,"src":"fix","topic":"of8","mod":"Ofensiva","prio":"Alta","stem":"No MITRE ATT&CK, a criação de uma tarefa agendada que executa um script malicioso a cada inicialização do sistema, para que o adversário mantenha o acesso após reinicializações, é exemplo de técnica associada à tática","passage":null,"alts":["Initial Access","Exfiltration","Persistence","Reconnaissance","Impact"],"ans":"C","com":"Manter acesso após reboot/troca de senha = <b>Persistence<\/b> (T1053 Scheduled Task/Job; também pode servir a Execution e Privilege Escalation)."},{"id":"f21","n":21,"src":"fix","topic":"of8","mod":"Ofensiva","prio":"Alta","stem":"Considere as afirmações sobre o MITRE ATT&CK.<br>I – As táticas representam o objetivo do adversário, e as técnicas, o modo como esse objetivo é alcançado.<br>II – Os procedimentos descrevem implementações específicas de técnicas observadas em grupos ou softwares.<br>III – As táticas devem ocorrer obrigatoriamente na ordem em que aparecem na matriz, como na Cyber Kill Chain.<br>Está correto o que se afirma em","passage":null,"alts":["I, apenas","III, apenas","II e III, apenas","I, II e III","I e II, apenas"],"ans":"E","com":"I e II corretas (TTP: por quê / como / implementação concreta). III é falsa: ATT&CK não impõe sequência linear; o adversário pode pular ou repetir táticas."},{"id":"f22","n":22,"src":"fix","topic":"of9","mod":"Ofensiva","prio":"Média","stem":"O catálogo mantido pelo MITRE que descreve padrões de ataque, relacionando-os às fraquezas (CWE) que exploram e organizando-os, entre outras visões, por Mecanismos de Ataque e por Domínios de Ataque, é o","passage":null,"alts":["CVE","CVSS","CAPEC","NVD","OWASP SAMM"],"ans":"C","com":"<b>CAPEC<\/b> = padrões de ataque, com visões por Mecanismos e por Domínios. CVE identifica vulnerabilidades específicas; CVSS pontua gravidade; NVD é a base do NIST; SAMM é modelo de maturidade."},{"id":"f23","n":23,"src":"fix","topic":"of9","mod":"Ofensiva","prio":"Média","stem":"Na visão Domínios de Ataque do CAPEC, um ataque que compromete um componente de software antes de ele ser entregue ao cliente, por meio da infraestrutura de um fornecedor, é classificado no domínio","passage":null,"alts":["Supply Chain","Communications","Physical Security","Social Engineering","Hardware"],"ans":"A","com":"Comprometimento via fornecedor/distribuição = domínio <b>Supply Chain<\/b>. Os seis domínios são Software, Hardware, Communications, Supply Chain, Social Engineering e Physical Security."},{"id":"f24","n":24,"src":"fix","topic":"of10","mod":"Ofensiva","prio":"Alta","stem":"Um analista obteve, durante um teste autorizado, o arquivo de hashes de senhas de um servidor Linux e deseja quebrá-los offline usando a GPU da estação de trabalho, com ataque de máscara. A ferramenta mais adequada é o","passage":null,"alts":["hydra","hashcat","masscan","smbmap","arpwatch"],"ans":"B","com":"Quebra <b>offline<\/b> com <b>GPU<\/b> e ataque de máscara (<code>-a 3<\/code>) = <b>hashcat<\/b>. Hydra faz força bruta <b>online<\/b> contra serviços; masscan varre portas; smbmap enumera shares; arpwatch monitora ARP."},{"id":"f25","n":25,"src":"fix","topic":"of10","mod":"Ofensiva","prio":"Alta","stem":"Em um teste de intrusão autorizado, para testar a resistência de um serviço SSH exposto contra ataques de dicionário, tentando pares usuário/senha diretamente no serviço em execução, a ferramenta indicada é o","passage":null,"alts":["john the ripper","ghidra","steghide","hydra","maltego"],"ans":"D","com":"Ataque <b>online<\/b> contra serviço de login = <b>hydra<\/b>. John quebra hashes offline; ghidra é engenharia reversa; steghide é esteganografia; maltego é OSINT."},{"id":"f26","n":26,"src":"fix","topic":"of10","mod":"Ofensiva","prio":"Alta","stem":"Associe as ferramentas à sua finalidade principal.<br>I – theHarvester  II – sqlmap  III – ettercap  IV – ghidra<br>P – engenharia reversa de binários  Q – coleta de e-mails e subdomínios em fontes públicas  R – exploração automatizada de injeção SQL  S – ataques man-in-the-middle em LAN<br>A associação correta é","passage":null,"alts":["I-R, II-Q, III-S, IV-P","I-Q, II-R, III-P, IV-S","I-Q, II-R, III-S, IV-P","I-S, II-R, III-Q, IV-P","I-P, II-Q, III-R, IV-S"],"ans":"C","com":"theHarvester → OSINT (e-mails/subdomínios); sqlmap → SQLi; ettercap → MitM (ARP poisoning); ghidra → engenharia reversa."},{"id":"f27","n":27,"src":"fix","topic":"of10","mod":"Ofensiva","prio":"Alta","stem":"Um analista de SOC deseja ser alertado sempre que o endereço MAC associado a um IP da rede local mudar, como forma de detectar envenenamento de ARP. A ferramenta, entre as listadas, projetada para essa finalidade é o","passage":null,"alts":["arpwatch","ettercap","beef-xss","veil","amass"],"ans":"A","com":"<b>arpwatch<\/b> mantém base de pares IP↔MAC e alerta mudanças. Ettercap <b>realiza<\/b> o ataque; beef explora navegadores; veil gera payloads evasivos; amass enumera subdomínios."},{"id":"f28","n":28,"src":"fix","topic":"of10","mod":"Ofensiva","prio":"Alta","stem":"Durante um pentest, o analista instala uma ferramenta que atua como proxy entre o navegador e a aplicação web, permitindo interceptar, modificar e reenviar requisições HTTP, além de automatizar ataques de força bruta em parâmetros pelo módulo Intruder. Essa ferramenta é o","passage":null,"alts":["Wireshark","Metasploit Framework","Mimikatz","Burp Suite","Netcat"],"ans":"D","com":"Proxy interceptador com Repeater/Intruder = <b>Burp Suite<\/b>. Wireshark só captura/analisa; Metasploit é framework de exploits; mimikatz extrai credenciais; netcat lê/escreve conexões brutas."},{"id":"f29","n":29,"src":"fix","topic":"df1","mod":"Defensiva","prio":"Alta","stem":"Uma empresa quer que seu firewall permita, automaticamente, o tráfego de retorno de conexões iniciadas pela rede interna, bloqueando pacotes externos que não pertençam a nenhuma conexão estabelecida, sem precisar inspecionar o conteúdo das aplicações. O tipo de firewall adequado é o","passage":null,"alts":["filtro de pacotes estático","firewall de estado (stateful inspection)","firewall proxy de aplicação","IDS baseado em anomalia","gateway de circuito sem tabela de conexões"],"ans":"B","com":"Manter <b>tabela de estados<\/b> e liberar retorno de conexões estabelecidas = <b>stateful<\/b>. O filtro estático avalia cada pacote isoladamente; o proxy inspeciona a camada 7 (mais do que o pedido); IDS não é firewall."},{"id":"f30","n":30,"src":"fix","topic":"df1","mod":"Defensiva","prio":"Alta","stem":"Comparando IDS e IPS, é correto afirmar que o","passage":null,"alts":["IDS opera em linha com o tráfego e bloqueia pacotes, enquanto o IPS apenas gera alertas","IDS baseado em assinaturas é o mais indicado para detectar ataques de dia zero","IPS elimina a ocorrência de falsos positivos por operar em linha","IDS baseado em anomalias dispensa a definição de um perfil de comportamento normal","IPS opera em linha com o tráfego e pode descartar pacotes maliciosos, enquanto o IDS, tipicamente alimentado por cópia do tráfego, gera alertas"],"ans":"E","com":"IPS = <b>inline e ativo<\/b>; IDS = <b>out-of-band e passivo<\/b> (alerta). Assinaturas não pegam zero-day; IPS também tem falsos positivos (e eles bloqueiam tráfego legítimo); anomalia exige linha de base do normal."},{"id":"f31","n":31,"src":"fix","topic":"df1","mod":"Defensiva","prio":"Alta","stem":"Em um firewall que atua como proxy de aplicação para HTTP, é correto afirmar que","passage":null,"alts":["o cliente estabelece conexão TCP direta com o servidor, e o proxy apenas consulta os campos de porta de origem e destino","o cliente estabelece conexão com o proxy, que abre uma nova conexão com o servidor de destino, permitindo inspecionar o conteúdo da requisição","a decisão é baseada exclusivamente nos endereços IP de origem e destino da camada 3","o proxy não pode exigir autenticação de usuários, pois opera abaixo da camada de transporte","o proxy dispensa regras específicas por protocolo, pois trata todos os serviços da mesma forma"],"ans":"B","com":"No proxy não há conexão fim a fim: ele <b>termina<\/b> a conexão do cliente e abre outra, inspecionando a <b>camada 7<\/b> e podendo autenticar usuários."},{"id":"f32","n":32,"src":"fix","topic":"df1","mod":"Defensiva","prio":"Alta","stem":"Uma organização precisa interligar, de forma permanente e cifrada, a rede da sede à rede de uma filial por meio da internet, sem instalar software nas estações dos usuários. A solução mais adequada é","passage":null,"alts":["VPN de acesso remoto com cliente IPsec em cada estação","IPsec em modo transporte com AH entre cada par de estações","túnel PPTP iniciado pelos usuários sob demanda","VPN site-to-site com IPsec em modo túnel entre os gateways","DMZ com proxy reverso na filial"],"ans":"D","com":"Ligar <b>redes<\/b> (gateway↔gateway) de forma permanente e transparente = <b>site-to-site<\/b>, tipicamente IPsec <b>modo túnel<\/b>. Acesso remoto exige cliente por usuário; PPTP é inseguro; AH não cifra."},{"id":"f33","n":33,"src":"fix","topic":"df2","mod":"Defensiva","prio":"Alta","stem":"Em uma implementação de IEEE 802.1X em uma rede cabeada, o switch de acesso ao qual a estação está conectada desempenha o papel de","passage":null,"alts":["autenticador, repassando as mensagens EAP entre o suplicante e o servidor RADIUS","suplicante, solicitando credenciais ao servidor de autenticação","servidor de autenticação, validando localmente o certificado do usuário","autoridade certificadora, emitindo certificados para as estações","servidor de accounting, registrando a contabilização via TACACS+"],"ans":"A","com":"Papéis: <b>suplicante<\/b> (estação), <b>autenticador<\/b> (switch/AP), <b>servidor de autenticação<\/b> (RADIUS). O switch só repassa EAP (EAPOL ↔ RADIUS) e libera a porta conforme a decisão do servidor."},{"id":"f34","n":34,"src":"fix","topic":"df2","mod":"Defensiva","prio":"Alta","stem":"Um método EAP que exige certificados digitais tanto no servidor de autenticação quanto em cada cliente, provendo autenticação mútua baseada em certificados, é o","passage":null,"alts":["PEAP com MSCHAPv2","EAP-MD5","EAP-TTLS com PAP","LEAP","EAP-TLS"],"ans":"E","com":"<b>EAP-TLS<\/b> = certificado dos dois lados. PEAP e TTLS exigem certificado só do servidor (cliente usa senha no túnel); EAP-MD5 e LEAP são fracos."},{"id":"f35","n":35,"src":"fix","topic":"df2","mod":"Defensiva","prio":"Alta","stem":"Sobre o protocolo RADIUS, usado em conjunto com o IEEE 802.1X, é correto afirmar que","passage":null,"alts":["utiliza TCP na porta 49 e cifra todo o corpo dos pacotes","separa obrigatoriamente autenticação, autorização e contabilização em servidores distintos","utiliza UDP, com as portas 1812 para autenticação e 1813 para contabilização, e protege apenas o campo de senha do Access-Request","é um método EAP que realiza autenticação mútua com certificados","funciona apenas em redes sem fio, sendo substituído pelo TACACS+ em redes cabeadas"],"ans":"C","com":"RADIUS: <b>UDP 1812/1813<\/b>, oculta apenas a senha. TCP 49 e cifra total = TACACS+. RADIUS não é método EAP — ele transporta EAP."},{"id":"f36","n":36,"src":"fix","topic":"df2","mod":"Defensiva","prio":"Alta","stem":"Em uma aplicação web, um usuário autenticado altera o parâmetro da URL de /fatura?id=1050 para /fatura?id=1051 e passa a visualizar a fatura de outro cliente. No OWASP Top 10 (2021), essa falha enquadra-se em","passage":null,"alts":["A01 – Broken Access Control","A02 – Cryptographic Failures","A03 – Injection","A07 – Identification and Authentication Failures","A10 – Server-Side Request Forgery"],"ans":"A","com":"É um <b>IDOR<\/b> (referência direta insegura a objeto): falta verificação de autorização → <b>Broken Access Control<\/b> (A01 em 2021 e em 2025). O usuário está autenticado; o problema é autorização."},{"id":"f37","n":37,"src":"fix","topic":"df2","mod":"Defensiva","prio":"Alta","stem":"No XSS, o tipo em que o payload malicioso nunca precisa ser processado pelo servidor, sendo inserido na página pelo próprio código JavaScript executado no navegador a partir de dados controláveis (por exemplo, o fragmento da URL), é o XSS","passage":null,"alts":["armazenado","refletido","persistente de segunda ordem","cego (blind) armazenado","baseado em DOM"],"ans":"E","com":"Injeção que acontece <b>no cliente<\/b>, via manipulação do DOM = <b>DOM-based XSS<\/b>. Refletido volta na resposta do servidor; armazenado fica gravado no servidor."},{"id":"f38","n":38,"src":"fix","topic":"df2","mod":"Defensiva","prio":"Alta","stem":"O OWASP SAMM organiza as práticas de segurança de software em cinco funções de negócio. São elas:","passage":null,"alts":["Identify, Protect, Detect, Respond e Recover","Plan, Do, Check, Act e Improve","Governance, Design, Implementation, Verification e Operations","Strategy, Requirements, Build, Test e Deploy","Govern, Map, Measure, Manage e Monitor"],"ans":"C","com":"SAMM v2: <b>Governance, Design, Implementation, Verification, Operations<\/b>. Identify/Protect... é do NIST CSF; PDCA é ciclo de melhoria."},{"id":"f39","n":39,"src":"fix","topic":"df2","mod":"Defensiva","prio":"Alta","stem":"A principal contramedida para evitar injeção SQL em uma aplicação que monta consultas com dados fornecidos pelo usuário é","passage":null,"alts":["cifrar a base de dados com AES-256","habilitar HSTS no servidor web","ocultar as mensagens de erro do banco de dados, mantendo a concatenação de strings","utilizar consultas parametrizadas (prepared statements), separando código SQL de dados","aplicar hash SHA-256 aos parâmetros antes de enviá-los ao banco"],"ans":"D","com":"<b>Prepared statements<\/b> impedem que a entrada seja interpretada como código. Esconder erros só dificulta (SQLi cego continua); cifrar o banco ou usar HSTS não resolvem injeção."},{"id":"f40","n":40,"src":"fix","topic":"df3","mod":"Defensiva","prio":"Média","stem":"Duas partes compartilham uma chave secreta e anexam a cada mensagem um HMAC-SHA256. Esse mecanismo garante","passage":null,"alts":["confidencialidade e integridade, mas não autenticidade","integridade e autenticidade da origem, mas não o não repúdio perante terceiros","integridade, autenticidade e não repúdio","apenas confidencialidade","disponibilidade e não repúdio"],"ans":"B","com":"HMAC prova que alguém com a chave gerou a mensagem e que ela não mudou (<b>integridade + autenticidade<\/b>). Como as duas partes têm a mesma chave, não há <b>não repúdio<\/b>; e HMAC não cifra (sem confidencialidade)."},{"id":"f41","n":41,"src":"fix","topic":"df4","mod":"Defensiva","prio":"Alta","stem":"No esquema RSA, sendo (e, n) a chave pública, (d, n) a chave privada e C o texto cifrado gerado com a chave pública, o texto plano M é obtido por","passage":null,"alts":["M = C<sup>d<\/sup> mod n","M = C<sup>e<\/sup> mod n","M = C<sup>d·e<\/sup> mod φ(n)","M = (C mod n)<sup>e<\/sup>","M = C<sup>n<\/sup> mod d"],"ans":"A","com":"Cifra com a pública: C = M<sup>e<\/sup> mod n; decifra com a privada: <b>M = C<sup>d<\/sup> mod n<\/b>."},{"id":"f42","n":42,"src":"fix","topic":"df4","mod":"Defensiva","prio":"Alta","stem":"No modo de operação de cifra de bloco em que cada bloco de texto claro é combinado por XOR com o bloco cifrado anterior antes da cifragem, sendo o primeiro bloco combinado com um vetor de inicialização, tem-se o modo","passage":null,"alts":["ECB","CTR","OFB","CBC","GCM"],"ans":"D","com":"XOR com o <b>cifrado anterior<\/b> + <b>IV<\/b> no primeiro = <b>CBC<\/b>. ECB não encadeia; CTR cifra contador; OFB realimenta a saída da cifra; GCM = CTR + autenticação."},{"id":"f43","n":43,"src":"fix","topic":"df4","mod":"Defensiva","prio":"Alta","stem":"Para enviar um arquivo grande de forma confidencial a um destinatário cuja chave pública é conhecida, utiliza-se um envelope digital. Nesse mecanismo,","passage":null,"alts":["o arquivo é cifrado com a chave privada do remetente, e o hash é cifrado com a chave pública do destinatário","o arquivo é cifrado com uma chave simétrica de sessão, e essa chave é cifrada com a chave pública do destinatário","o arquivo é cifrado diretamente com a chave pública do destinatário, sem uso de chave simétrica","o hash do arquivo é cifrado com a chave privada do remetente, garantindo confidencialidade","a chave simétrica é cifrada com a chave privada do destinatário"],"ans":"B","com":"Envelope = <b>híbrido<\/b>: dados com chave <b>simétrica<\/b> (rápida) + chave de sessão com a <b>pública do destinatário<\/b>. Cifrar com a privada do remetente é assinatura (não sigilo)."},{"id":"f44","n":44,"src":"fix","topic":"df4","mod":"Defensiva","prio":"Alta","stem":"Um sistema exige, para acesso remoto, senha e um código gerado em aplicativo autenticador instalado no smartphone do usuário. Outro sistema exige senha e a resposta a uma pergunta secreta. Sobre esses sistemas, é correto afirmar que","passage":null,"alts":["ambos implementam autenticação multifator, pois exigem duas informações","apenas o segundo implementa autenticação multifator, pois a pergunta secreta é um fator biométrico","nenhum implementa autenticação multifator, pois não usam biometria","ambos implementam autenticação multifator, desde que a senha tenha ao menos 12 caracteres","apenas o primeiro implementa autenticação multifator, pois combina algo que o usuário sabe com algo que ele possui"],"ans":"E","com":"MFA exige categorias <b>diferentes<\/b>. Senha + pergunta secreta = dois fatores “algo que sabe” (não é MFA). Senha + app TOTP = sabe + <b>possui<\/b>."},{"id":"f45","n":45,"src":"fix","topic":"df4","mod":"Defensiva","prio":"Alta","stem":"Uma empresa faz backup completo aos domingos e backups diários de segunda a sábado. Após falha na sexta-feira à tarde, a restauração exigiu apenas o backup completo de domingo e o backup de quinta-feira. Os backups diários eram do tipo","passage":null,"alts":["diferencial","incremental","espelhamento (RAID 1)","snapshot de paridade","completo sintético"],"ans":"A","com":"Restaurar só com <b>completo + último<\/b> = <b>diferencial<\/b> (cada diferencial acumula tudo desde o último completo). Incremental exigiria completo + segunda + terça + quarta + quinta."},{"id":"f46","n":46,"src":"fix","topic":"df4","mod":"Defensiva","prio":"Alta","stem":"É exemplo de valor produzido pelo algoritmo SHA-256, representado em hexadecimal, uma sequência de","passage":null,"alts":["16 caracteres hexadecimais","32 caracteres hexadecimais","40 caracteres hexadecimais","64 caracteres hexadecimais","128 caracteres hexadecimais"],"ans":"D","com":"SHA-256 = 256 bits = 32 bytes = <b>64 dígitos hex<\/b>. 32 hex = MD5 (128 bits); 40 hex = SHA-1 (160); 128 hex = SHA-512."},{"id":"f47","n":47,"src":"fix","topic":"df5","mod":"Defensiva","prio":"Média","stem":"Na ICP-Brasil, a entidade responsável por identificar presencialmente ou validar os dados do solicitante e encaminhar a solicitação de certificado à autoridade certificadora, sem emitir o certificado, é a","passage":null,"alts":["AC Raiz","Autoridade de Carimbo do Tempo (ACT)","Autoridade de Registro (AR)","Comitê Gestor da ICP-Brasil","Autoridade Certificadora de segundo nível"],"ans":"C","com":"<b>AR<\/b> = identificação/validação e encaminhamento. A AC emite; a AC Raiz (ITI) certifica ACs; a ACT emite carimbos do tempo; o CG define políticas."},{"id":"f48","n":48,"src":"fix","topic":"df5","mod":"Defensiva","prio":"Média","stem":"Sobre a AC Raiz da ICP-Brasil, é correto afirmar que","passage":null,"alts":["é exercida pelo Comitê Gestor e emite certificados para pessoas físicas e jurídicas","é exercida por qualquer AC de primeiro nível credenciada","dispensa o uso de lista de certificados revogados por ser a raiz da cadeia","tem como função principal a emissão de carimbos do tempo","é exercida pelo ITI e não pode emitir certificados para o usuário final"],"ans":"E","com":"AC Raiz = <b>ITI<\/b>; emite certificados apenas para ACs do nível subsequente; é vedada a emissão para usuário final."},{"id":"f49","n":49,"src":"fix","topic":"df6","mod":"Defensiva","prio":"Alta","stem":"No IPsec, o protocolo que oferece integridade, autenticação da origem e proteção contra repetição, cobrindo inclusive campos imutáveis do cabeçalho IP, mas sem oferecer confidencialidade, é o","passage":null,"alts":["ESP em modo túnel","IKEv2","AH","ISAKMP","ESP com NAT-T"],"ans":"C","com":"<b>AH<\/b>: autentica (inclusive parte do cabeçalho IP) mas não cifra. ESP cifra; IKE/ISAKMP negociam SAs."},{"id":"f50","n":50,"src":"fix","topic":"df6","mod":"Defensiva","prio":"Alta","stem":"Uma diferença do TLS 1.3 em relação ao TLS 1.2 é que, no TLS 1.3,","passage":null,"alts":["a troca de chaves com RSA estático foi removida, de modo que os handshakes completos usam (EC)DHE e oferecem sigilo perfeito para a frente","o modo CBC passou a ser obrigatório para todas as suítes de cifra","o servidor deixou de ser autenticado por certificado","o handshake completo passou a exigir três viagens de ida e volta (3-RTT)","a compressão de registros passou a ser obrigatória"],"ans":"A","com":"TLS 1.3 removeu RSA key exchange, CBC, compressão e renegociação; usa (EC)DHE (PFS) e handshake de 1-RTT."},{"id":"f51","n":51,"src":"fix","topic":"df6","mod":"Defensiva","prio":"Alta","stem":"Em uma conexão TLS, quando o servidor recebe um ClientHello e consegue negociar um conjunto aceitável de parâmetros, a mensagem de handshake que ele envia em resposta é a","passage":null,"alts":["ClientKeyExchange","ServerHello","Finished","ChangeCipherSpec","HelloRequest"],"ans":"B","com":"Resposta ao ClientHello = <b>ServerHello<\/b>. ClientKeyExchange é do cliente; Finished encerra o handshake; HelloRequest (TLS 1.2) é o servidor pedindo novo handshake."},{"id":"f52","n":52,"src":"fix","topic":"df7","mod":"Defensiva","prio":"Média","stem":"No Windows Defender Firewall, com a configuração padrão, o comportamento esperado é","passage":null,"alts":["permitir todas as conexões de entrada e bloquear todas as de saída","bloquear todas as conexões de saída, exceto as do navegador","aplicar um único perfil para todas as redes, sem distinção entre domínio, privada e pública","bloquear conexões de entrada que não correspondam a uma regra de permissão e permitir conexões de saída","inspecionar o conteúdo das aplicações na camada 7 como um proxy reverso"],"ans":"D","com":"Padrão: <b>entrada bloqueada<\/b> (salvo regra), <b>saída permitida<\/b>, com perfis Domínio/Privado/Público."},{"id":"f53","n":53,"src":"fix","topic":"df7","mod":"Defensiva","prio":"Média","stem":"Um antimalware detectou um ransomware desconhecido porque o processo começou a abrir e reescrever centenas de arquivos do usuário em poucos segundos com alta entropia. Essa detecção é do tipo","passage":null,"alts":["por assinatura","por lista de hashes conhecidos","comportamental","por reputação de domínio","por verificação de integridade do setor de boot"],"ans":"C","com":"Observou <b>ações em execução<\/b> → detecção <b>comportamental<\/b>. Assinatura/hash exigiriam amostra conhecida."},{"id":"f54","n":54,"src":"fix","topic":"df8","mod":"Defensiva","prio":"Média","stem":"No sistema de arquivos ext3 do Linux, os atributos UID do dono, GID do grupo e as permissões de leitura, escrita e execução de um arquivo ficam armazenados em uma estrutura de dados associada ao arquivo denominada","passage":null,"alts":["inode","superbloco","entrada de diretório (dentry)","tabela de alocação de arquivos (FAT)","journal"],"ans":"A","com":"Metadados do arquivo ficam no <b>inode<\/b> (exceto o nome). Superbloco descreve o sistema de arquivos; a entrada de diretório associa nome→inode; journal registra transações."},{"id":"f55","n":55,"src":"fix","topic":"df8","mod":"Defensiva","prio":"Média","stem":"Um administrador executou <code>chmod 4755 /opt/app/backup<\/code>. Como resultado, o arquivo","passage":null,"alts":["passa a executar com os privilégios do grupo, e as permissões ficam rwxr-sr-x","só pode ser apagado pelo dono, e as permissões ficam rwxr-xr-t","torna-se imutável, mesmo para o usuário root","passa a executar com os privilégios do seu proprietário, e as permissões ficam rwsr-xr-x","fica sem permissão de execução para outros usuários"],"ans":"D","com":"Dígito 4 à esquerda = <b>SUID<\/b>; 755 = rwxr-xr-x → <b>rwsr-xr-x<\/b>. SGID seria 2 (s no grupo); sticky 1 (t)."},{"id":"f56","n":56,"src":"fix","topic":"df8","mod":"Defensiva","prio":"Média","stem":"Os CIS Benchmarks, publicados pelo Center for Internet Security, caracterizam-se por","passage":null,"alts":["serem uma lista priorizada de 18 controles agrupados em Implementation Groups","serem guias de configuração segura desenvolvidos por consenso, com perfis como Level 1 e Level 2","serem uma norma certificável de sistema de gestão de segurança da informação","serem um catálogo de táticas e técnicas adversárias","serem uma base de dados de vulnerabilidades com identificadores CVE"],"ans":"B","com":"Benchmarks = <b>hardening<\/b> por consenso, perfis Level 1/Level 2. Os 18 controles com IGs são os <b>CIS Controls<\/b>; norma certificável é a ISO 27001; táticas/técnicas = ATT&CK."},{"id":"f57","n":57,"src":"fix","topic":"df9","mod":"Defensiva","prio":"Média","stem":"Na série ISA/IEC 62443, a parte que trata da avaliação de riscos de segurança para o projeto do sistema, incluindo a divisão do sistema em zonas e conduítes, é a","passage":null,"alts":["IEC 62443-4-1","IEC 62443-2-4","IEC 62443-4-2","IEC 62443-1-1","IEC 62443-3-2"],"ans":"E","com":"<b>3-2<\/b> = avaliação de risco + zonas e conduítes. 4-1 = ciclo de desenvolvimento seguro do fabricante; 2-4 = prestadores de serviço; 4-2 = requisitos de componentes; 1-1 = conceitos e terminologia."},{"id":"f58","n":58,"src":"fix","topic":"df9","mod":"Defensiva","prio":"Média","stem":"Em ambientes de tecnologia operacional (OT), como os de supervisão de oleodutos, a priorização usual das propriedades de segurança, quando comparada à TI corporativa, é","passage":null,"alts":["confidencialidade em primeiro lugar, seguida de integridade e disponibilidade","disponibilidade e segurança física em primeiro lugar, seguidas de integridade e, por último, confidencialidade","integridade e confidencialidade com o mesmo peso, sendo a disponibilidade secundária","não repúdio em primeiro lugar, por exigência da ISA/IEC 62443","confidencialidade e não repúdio, pois os protocolos industriais já garantem disponibilidade"],"ans":"B","com":"Em OT a parada do processo ou dano físico é o pior cenário: <b>disponibilidade/safety &gt; integridade &gt; confidencialidade<\/b>."},{"id":"f59","n":59,"src":"fix","topic":"df9","mod":"Defensiva","prio":"Média","stem":"Na ISA/IEC 62443, o nível de segurança destinado a proteger contra violação intencional por meios sofisticados, com recursos moderados e conhecimentos específicos de sistemas de automação industrial, é o","passage":null,"alts":["SL 0","SL 1","SL 2","SL 3","SL 4"],"ans":"D","com":"SL1 casual; SL2 intencional simples/poucos recursos; <b>SL3 sofisticado/recursos moderados/conhecimento de ICS<\/b>; SL4 sofisticado com recursos extensos."},{"id":"f60","n":60,"src":"fix","topic":"df10","mod":"Defensiva","prio":"Média","stem":"Em uma resposta a incidente, o perito encontra um servidor ainda ligado e suspeita de malware que reside apenas em memória. Considerando a ordem de volatilidade, o procedimento mais adequado é","passage":null,"alts":["desligar o servidor imediatamente e gerar a imagem bit a bit do disco","reiniciar o servidor em modo de segurança para executar o antimalware","gerar primeiro a imagem dos backups em fita, por serem a fonte mais confiável","capturar a memória RAM e demais dados voláteis antes de gerar a imagem do disco","copiar apenas os arquivos de log do disco, pois a memória não é admitida como evidência"],"ans":"D","com":"Ordem de volatilidade: <b>memória antes do disco<\/b>. Desligar/reiniciar destrói a evidência volátil (malware fileless)."},{"id":"f61","n":61,"src":"fix","topic":"df10","mod":"Defensiva","prio":"Média","stem":"Na análise forense de uma mensagem de correio eletrônico suspeita, para identificar o servidor de origem por onde a mensagem entrou na cadeia de transporte, o perito deve examinar os campos","passage":null,"alts":["Received, a partir do mais inferior do cabeçalho, que corresponde ao primeiro salto","From e Reply-To, que são preenchidos e assinados pelo servidor de destino","Subject e Date, que não podem ser falsificados pelo remetente","Received, a partir do mais superior do cabeçalho, que corresponde ao primeiro salto","Message-ID, que contém obrigatoriamente o endereço IP do remetente"],"ans":"A","com":"Cada servidor <b>acrescenta um Received no topo<\/b>; logo, o <b>mais baixo<\/b> é o primeiro salto. From/Subject/Date são facilmente forjáveis."},{"id":"f62","n":62,"src":"fix","topic":"df10","mod":"Defensiva","prio":"Média","stem":"Para assegurar que a imagem forense de um disco rígido é idêntica ao original e que o original não foi alterado durante a aquisição, o perito deve","passage":null,"alts":["realizar a desfragmentação do disco antes da cópia","copiar apenas os arquivos visíveis com o gerenciador de arquivos do sistema","cifrar o disco original com AES antes da aquisição","formatar a mídia de destino em NTFS e copiar os arquivos com permissões preservadas","usar bloqueador de escrita na aquisição e comparar os hashes calculados do original e da imagem"],"ans":"E","com":"<b>Write blocker<\/b> impede alteração; <b>hash<\/b> igual (original × imagem) prova integridade. Cópia lógica perde espaço não alocado/slack."},{"id":"f63","n":63,"src":"fix","topic":"df10","mod":"Defensiva","prio":"Média","stem":"Um analista utiliza o operador <code>site:empresa.com.br filetype:xlsx<\/code> em um buscador para localizar planilhas expostas publicamente pela organização-alvo de um teste autorizado. Essa atividade é exemplo de","passage":null,"alts":["enumeração ativa de compartilhamentos SMB","varredura de portas com detecção de versão","OSINT por meio de Google dorks, uma forma de coleta passiva no footprinting","ataque de força bruta online contra o portal da empresa","análise forense de dispositivo de armazenamento"],"ans":"C","com":"Operadores avançados de busca (<b>Google dorks<\/b>) = OSINT passivo (não toca o alvo), fase de footprinting."},{"id":"f64","n":64,"src":"fix","topic":"cp1","mod":"Compliance","prio":"Alta","stem":"Na ABNT NBR ISO/IEC 27001:2022, os controles do Anexo A estão organizados em quatro temas. A distribuição correta da quantidade de controles por tema é","passage":null,"alts":["organizacionais: 37; pessoas: 8; físicos: 14; tecnológicos: 34","organizacionais: 34; pessoas: 14; físicos: 8; tecnológicos: 37","organizacionais: 14; pessoas: 8; físicos: 37; tecnológicos: 34","organizacionais: 37; pessoas: 14; físicos: 8; tecnológicos: 34","organizacionais: 35; pessoas: 10; físicos: 14; tecnológicos: 34"],"ans":"A","com":"93 controles = <b>37 + 8 + 14 + 34<\/b>."},{"id":"f65","n":65,"src":"fix","topic":"cp1","mod":"Compliance","prio":"Alta","stem":"Na ISO/IEC 27001:2022, o documento que lista os controles necessários, justifica sua inclusão, indica se estão implementados e justifica a exclusão de controles do Anexo A é a","passage":null,"alts":["Política de Segurança da Informação","Análise de Impacto nos Negócios","Matriz RACI do SGSI","Relatório de auditoria interna","Declaração de Aplicabilidade"],"ans":"E","com":"<b>Declaração de Aplicabilidade (SoA)<\/b>, requisito 6.1.3 d)."},{"id":"f66","n":66,"src":"fix","topic":"cp1","mod":"Compliance","prio":"Alta","stem":"Entre os controles introduzidos na versão 2022 da ABNT NBR ISO/IEC 27002, encontra-se o controle","passage":null,"alts":["segregação de funções","gestão de mudanças","inteligência de ameaças","controle de acesso físico","cópias de segurança das informações"],"ans":"C","com":"<b>5.7 Inteligência de ameaças<\/b> é um dos 11 novos. Os demais já existiam (com outra numeração) na 2013."},{"id":"f67","n":67,"src":"fix","topic":"cp1","mod":"Compliance","prio":"Alta","stem":"Na ABNT NBR ISO/IEC 27002:2022, os atributos associados aos controles incluem o tipo de controle, as propriedades de segurança da informação e os conceitos de segurança cibernética. Os valores do atributo conceitos de seg nejar e preparar","avaliar e decidir","detectar e reportar","responder","aprender lições"],"ans":"B","com":"Triagem e classificação = <b>avaliar e decidir<\/b> (fase 3)."},{"id":"f71","n":71,"src":"fix","topic":"cp3","mod":"Compliance","prio":"Média","stem":"Em um plano de continuidade, definiu-se que, após uma interrupção do sistema de faturamento, a organização aceita perder no máximo 15 minutos de transações registradas. Esse parâmetro corresponde ao","passage":null,"alts":["RTO (tempo objetivo de recuperação)","MTPD (período máximo tolerável de interrupção)","MBCO (objetivo mínimo de continuidade de negócios)","MTBF (tempo médio entre falhas)","RPO (ponto objetivo de recuperação)"],"ans":"E","com":"Perda máxima de <b>dados<\/b> = <b>RPO<\/b>. RTO é o prazo para retomar; MTPD é o limite de interrupção tolerável."},{"id":"f72","n":72,"src":"fix","topic":"cp3","mod":"Compliance","prio":"Média","stem":"Sobre as normas ABNT NBR ISO 22301:2020 e ABNT NBR ISO 22313:2020, é correto afirmar que","passage":null,"alts":["a 22301 especifica requisitos para um sistema de gestão de continuidade de negócios, e a 22313 fornece orientações para aplicá-los","a 22313 especifica requisitos certificáveis, e a 22301 apenas orienta","ambas tratam exclusivamente de recuperação de desastres de TI","a 22301 substituiu a análise de impacto nos negócios pela análise de vulnerabilidades técnicas","a 22313 define os controles do Anexo A da ISO 27001"],"ans":"A","com":"<b>22301 = requisitos<\/b> (certificável); <b>22313 = orientação<\/b>."},{"id":"f73","n":73,"src":"fix","topic":"cp4","mod":"Compliance","prio":"Alta","stem":"A ABNT NBR ISO/IEC 29100:2024 estabelece princípios de privacidade. Um princípio que determina que a coleta de dados pessoais seja limitada ao que é estritamente necessário para os propósitos especificados, e outro que determina minimizar os dados processados e o número de pessoas com acesso a eles, são, respectivamente,","passage":null,"alts":["consentimento e escolha e fix","topic":"cp8","mod":"Compliance","prio":"Média","stem":"Entre os princípios elencados no Regulamento de Segurança Cibernética Aplicada ao Setor de Telecomunicações (Resolução Anatel nº 740/2020), estão","passage":null,"alts":["minimização, finalidade e necessidade","diversidade, interoperabilidade e prioridade","neutralidade, liberdade de expressão e pluralidade","economicidade, eficiência e publicidade","irretratabilidade, anonimização e portabilidade"],"ans":"B","com":"Art. 4º: autenticidade, confidencialidade, disponibilidade, <b>diversidade<\/b>, integridade, <b>interoperabilidade<\/b>, <b>prioridade<\/b>, responsabilidade e transparência."},{"id":"f87","n":87,"src":"fix","topic":"pt3","mod":"Português","prio":"Alta","stem":"No período (3), o conectivo “Embora” estabelece relação de","passage":"p1","alts":["causa, podendo ser substituído por “porque”","conclusão, podendo ser substituído por “portanto”","condição, podendo ser substituído por “caso”, com o verbo no indicativo","concessão, podendo ser substituído por “ainda que” sem alteração do modo verbal","finalidade, podendo ser substituído por “a fim de que”"],"ans":"D","com":"“Embora” = <b>concessão<\/b>; “ainda que” também exige subjuntivo (“tenham evoluído”), logo a troca preserva sentido e correção."},{"id":"f88","n":88,"src":"fix","topic":"pt3","mod":"Português","prio":"Alta","stem":"Considerando o Texto I, no trecho “preferem bater à porta com um e-mail convincente” (período 2), o acento grave","passage":"p1","alts":["é obrigatório, pois “bater a” (expressão “bater à porta”, no sentido de chegar à porta) combina a preposição com o artigo feminino que antecede “porta”","é facultativo, pois antecede substantivo feminino singular","é proibido, pois antecede palavra no singular","é obrigatório, pois antecede verbo","é proibido, pois a expressão é masculina"],"ans":"A","com":"Na expressão consagrada “bater <b>à<\/b> porta” (chegar à porta, pedir entrada), há preposição + artigo → crase. Troque por mascul ntrast between the existence of a flaw and the difficulty of applying the fix","an example of a vendor fix","a conclusion that patching is impossible","a condition for production supervisors to approve downtime","a list of publicly documented flaws"],"ans":"A","com":"‘However’ contrasts the known flaw with the resistance to the maintenance window.","bizu":"BIZU: however / yet / although / whereas = contrast or concession."},{"id":"s2q14","n":14,"src":"s2","area":"EN","mod":"Inglês","stem":"In sentence (6), the word “Yet” is closest in meaning to","passage":"p6","alts":["Therefore","Because","Moreover","Nevertheless","Before"],"ans":"D","com":"Yet = adversative ≈ Nevertheless.","bizu":"BIZU: Yet/Still/Nevertheless ≠ Therefore (conclusion)."},{"id":"s2q15","n":15,"src":"s2","area":"EN","mod":"Inglês","stem":"The phrase “blast radius” (sentence 5) refers to","passage":"p6","alts":["the physical radius of an explosion in a plant","the coverage area of a wireless access point","the extent of damage an exploit could cause if successful","the number of auditors assigned to an inspection","the time window reserved for maintenance"],"ans":"C","com":"Figurative cybersecurity term: how far the impact of a compromise spreads.","bizu":"BIZU: technical metaphors — translate into impact scope."},{"id":"s2q16","n":16,"src":"s2","area":"EN","mod":"Inglês","stem":"In sentence (8), “therefore” signals","passage":"p6","alts":["a concession to production supervisors","a conclusion drawn from the preceding argument","a chronological sequence of patches","a contrast with sentence (9)","a condition that must be met before monitoring"],"ans":"B","com":"Therefore = conclusion connector.","bizu":"BIZU: therefore / thus / consequently / hence = conclusão."},{"id":"s2q17","n":17,"src":"s2","area":"EN","mod":"Inglês","stem":"According to the text, a mature programme treats every accepted risk as","passage":"p6","alts":["permanent once approved by production","irrelevant to auditors and regulator ata-se de","passage":null,"alts":["TearDrop","Land","SYN flood","Fraggle","DNS tunneling"],"ans":"D","com":"Fraggle = UDP (echo/chargen) com broadcast + IP forjado; Smurf = ICMP.","bizu":"BIZU: Smurf = ICMP · Fraggle = UDP. Ambos usam broadcast e spoof."},{"id":"s2q22","n":22,"src":"s2","area":"OF","mod":"Ofensiva","stem":"Durante a fase de footprinting, a técnica que consulta registros WHOIS, páginas de emprego e vazamentos públicos, sem enviar pacotes diretamente ao alvo, classifica-se como","passage":null,"alts":["reconhecimento passivo","varredura SYN","enumeração SMB","exploiting","pivoting"],"ans":"A","com":"Footprinting passivo = OSINT, sem tocar o alvo.","bizu":"BIZU: passivo = escuta/OSINT · ativo = toca o alvo (scan, probe)."},{"id":"s2q23","n":23,"src":"s2","area":"OF","mod":"Ofensiva","stem":"O comando <code>nmap -sU -F 10.0.0.5<\/code> realiza","passage":null,"alts":["varredura TCP SYN de todas as 65.535 portas","detecção de sistema operacional sem tocar em portas","varredura ACK para mapear firewall","execução de todos os scripts NSE default","varredura UDP das portas mais comuns (top ports)"],"ans":"E","com":"-sU = UDP; -F = fast (top ~100 ports), não -p-.","bizu":"BIZU: -sU = UDP · -F = rápido (poucas portas) · -p- = todas."},{"id":"s2q24","n":24,"src":"s2","area":"OF","mod":"Ofensiva","stem":"Em um ataque de DNS cache poisoning, o objetivo do adversário é","passage":null,"alts":["esgotar a tabela CAM do switch até ele se comportar como hub","forçar a renegociação SSL para uma cifra exportável fraca","fazer o resolvedor armazenar um mapeamento nome→IP falso, desviando consultas seguintes","capturar hashes NTLM via LLMNR/NBT-NS","sobrecarregar a fila de conexões semiabertas TCP"],"ans":"C","com":"DNS poisoning = resposta falsa cacheada no resolvedor.","bizu":"BIZU: DNS poisoning → IP falso · mitigação DNSSEC. Não confundir com ARP (camada 2)."},{"id":"s2q25","n":25,"src":"s2","area":"OF","mod":"Ofensiva","stem":"A técnica de engenharia social em que o atacante oferece um “prêmio” ou ajuda espontânea (por exemplo, um pendrive “esquecido” com rótulo atrativo) para induzir a vítima a executar código é chamada de","passage":null,"alts":["vishing","baiting","tailgating","quid pro quo","watering hole"],"ans":"B","com":"Baiting = isca (pendrive, download “grátis”). Quid pro quo = troca de favor (suporte falso).","bizu":"BIZU: baiting = isca · quid pro quo = “eu te ajudo se…”."},{"id":"s2q26","n":26,"src":"s2","area":"OF","mod":"Ofensiva","stem":"Um malware que se disfarça de utilitário legítimo (por exemplo, um instalador de codec) e, ao ser executado pelo usuário, instala um payload malicioso, é classificado como","passage":null,"alts":["trojan horse","worm","virus de boot","ransomware de criptografia","rootkit de kernel"],"ans":"A","com":"Trojan = parece legítimo, exige ação do usuário, não se autodissemina como worm.","bizu":"BIZU: vírus infecta arquivos · worm se propaga sozinho · trojan engana o usuário."},{"id":"s2q27","n":27,"src":"s2","area":"OF","mod":"Ofensiva","stem":"No MITRE ATT&CK, a tática que cobre a ação de um adversário que compacta e cifra dados sensíveis antes de enviá-los para fora da rede é","passage":null,"alts":["Impact","Defense Evasion","Exfiltration","Discovery","Resource Development"],"ans":"C","com":"Preparar e enviar dados para fora = Exfiltration (ex.: T1560 Archive Collected Data).","bizu":"BIZU: sair com os dados = Exfiltration · destruir/cifrar para prejuízo = Impact."},{"id":"s2q28","n":28,"src":"s2","area":"OF","mod":"Ofensiva","stem":"A respeito do CAPEC, é correto afirmar que","passage":null,"alts":["substitui o CVE como identificador oficial de vulnerabilidades específicas","é o framework de táticas e técnicas mantido pela Lockheed Martin","lista apenas ataques a protocolos industriais IEC 61850","é um catálogo exclusivo de regras Snort/Suricata","organiza padrões de ataque e os relaciona a CWEs, com visões por mecanismos e por domínios de ataque"],"ans":"E","com":"CAPEC = padrões de ataque; relaciona-se a CWE; visões Mecanismos (9) e Domínios (6).","bizu":"BIZU: CVE = instância · CWE = tipo de fraqueza · CAPEC = padrão de ataque · ATT&CK = TTPs."},{"id":"s2q29","n":29,"src":"s2","area":"OF","mod":"Ofensiva","stem":"Em um teste autorizado, o analista deseja identificar subdomínios de uma organização a partir de fontes OSINT (certificados, motores de busca, DNS passivo). A ferramenta mais adequada entre as do edital é","passage":null,"alts":["hydra","amass","mimikatz","sqlmap","steghide"],"ans":"B","com":"amass = enumeração de subdomínios/OSINT. hydra = força bruta online; mimikatz = credenciais Windows; sqlmap = SQLi; steghide = esteganografia.","bizu":"BIZU: amass/theHarvester/maltego = OSINT · hydra = online · hashcat/john = offline."},{"id":"s2q30","n":30,"src":"s2","area":"OF","mod":"Ofensiva","stem":"O Wireshark, listado entre as ferramentas do edital, é usado principalmente para","passage":null,"alts":["quebrar hashes NTLM com aceleração por GPU","gerar payloads que evadem antivírus","clonar pontos de acesso Wi-Fi automaticamente","capturar e analisar tráfego de rede em nível de pacote","quebrar senhas WPA com dicionário a partir de handshake"],"ans":"D","com":"Wireshark = analisador de protocolos/sniffer.","bizu":"BIZU: wireshark/tcpdump = captura · ettercap = MitM ativo · aircrack = Wi-Fi."},{"id":"s2q31","n":31,"src":"s2","area":"OF","mod":"Ofensiva","stem":"Um ataque de SSL stripping caracteriza-se por","passage":null,"alts":["explodir a tabela CAM do switch com MACs aleatórios","rebaixar uma conexão que a vítima iniciou como HTTPS para HTTP em claro, permitindo a interceptação","forjar respostas ARP associando o IP do DNS ao MAC do atacante","explorar padding de CBC no SSL 3.0 (POODLE)","injetar regras falsas em um servidor BGP"],"ans":"B","com":"SSL stripping = MitM que impede o upgrade para HTTPS. Mitigação: HSTS.","bizu":"BIZU: stripping = HTTPS→HTTP · POODLE = bug do SSL 3.0 · HSTS mitiga stripping."},{"id":"s2q32","n":32,"src":"s2","area":"OF","mod":"Ofensiva","stem":"Na metodologia de ataque, após obter acesso a uma conta de usuário comum, a etapa em que o adversário busca direitos de administrador local ou de domínio denomina-se","passage":null,"alts":["footprinting","enumeração","encobrimento de rastros","varredura","escalação de privilégios"],"ans":"E","com":"Privilege escalation = elevar privilégios após o acesso inicial.","bizu":"BIZU: ordem: footprint → scan → enum → acesso → escalação → backdoor → cover → DoS."},{"id":"s2q33","n":33,"src":"s2","area":"OF","mod":"Ofensiva","stem":"Um atacante configura um ponto de acesso não autorizado fisicamente ligado à rede corporativa cabeada, sem necessariamente clonar o SSID oficial, para capturar tráfego de clientes que a ele se associem. Essa ameaça é tipicamente chamada de","passage":null,"alts":["rogue AP","evil twin","deauth flood","KARMA attack","bluejacking"],"ans":"A","com":"Rogue AP = AP não autorizado na rede. Evil twin = clone do SSID para enganar.","bizu":"BIZU: rogue = não autorizado · evil twin = clone do SSID."},{"id":"s2q34","n":34,"src":"s2","area":"OF","mod":"Ofensiva","stem":"Durante um pentest, para mapear compartilhamentos SMB acessíveis e listar seu conteúdo com uma ferramenta do edital, a opção mais direta é","passage":null,"alts":["veil","beef-xss","airgeddon","smbmap","ghidra"],"ans":"D","com":"smbmap = enumeração de shares SMB. veil = evasão AV; beef = browser; airgeddon = Wi-Fi; ghidra = RE.","bizu":"BIZU: smbmap = shares · sqlmap = SQLi · hydra = login online."},{"id":"s2q35","n":35,"src":"s2","area":"OF","mod":"Ofensiva","stem":"Um worm difere de um vírus clássico principalmente porque","passage":null,"alts":["sempre cifra os arquivos da vítima e exige resgate em criptomoeda","só se ativa quando o usuário abre um documento infectado","propaga-se automaticamente pela rede explorando serviços, sem precisar de arquivo hospedeiro nem de ação do usuário","reside exclusivamente no MBR e não se comunica em rede","é incapaz de se replicar sem um rootkit de kernel"],"ans":"C","com":"Worm = autopropagação em rede. Vírus = infecta hospedeiro e depende de execução.","bizu":"BIZU: worm sozinho · vírus no arquivo · trojan disfarçado."},{"id":"s2q36","n":36,"src":"s2","area":"DF","mod":"Defensiva","stem":"Em uma arquitetura com dois firewalls em série, criando uma rede intermediária onde ficam servidores web e de e-mail publicados, essa rede intermediária é denominada","passage":null,"alts":["VLAN nativa do trunk","honeynet de produção","rede fora de banda exclusiva de backup","backbone MPLS do provedor","DMZ (screened subnet)"],"ans":"E","com":"Screened subnet / DMZ = zona entre firewall externo e interno.","bizu":"BIZU: DMZ = serviços expostos · não é a LAN interna."},{"id":"s2q37","n":37,"src":"s2","area":"DF","mod":"Defensiva","stem":"Um filtro de pacotes estático, em comparação com um firewall stateful, caracteriza-se por","passage":null,"alts":["encerrar a conexão do cliente e abrir outra com o servidor (proxy)","decidir com base em cabeçalhos isolados (IP/porta/flags), sem manter tabela de conexões","inspecionar payload HTTP em busca de XSS","aprender automaticamente o comportamento normal dos usuários","aprender o perfil de cada usuário por machine learning obrigatório"],"ans":"B","com":"Packet filter = regras por pacote. Stateful = tabela de estados. Proxy = L7 terminando conexão.","bizu":"BIZU: estático = crachá · stateful = caderninho · proxy = recepcionista."},{"id":"s2q38","n":38,"src":"s2","area":"DF","mod":"Defensiva","stem":"Um IPS difere de um IDS clássico em modo promiscuo principalmente porque o IPS","passage":null,"alts":["opera em linha (inline) com o tráfego e pode descartar pacotes maliciosos","nunca gera falsos positivos","só analisa logs de autenticação, nunca pacotes","substitui completamente a necessidade de firewall de perímetro","funciona apenas com assinaturas e nunca com anomalias"],"ans":"A","com":"IDS = detecção (cópia do tráfego). IPS = prevenção inline.","bizu":"BIZU: IDS = alarme · IPS = segurança armada no corredor."},{"id":"s2q39","n":39,"src":"s2","area":"DF","mod":"Defensiva","stem":"Assinatura × anomalia em IDS/IPS: é correto afirmar que","passage":null,"alts":["anomalia nunca gera falso positivo","assinatura é a única capaz de detectar zero-day","ambos dispensam atualização de bases","assinatura detecta ataques conhecidos com poucos falsos positivos; anomalia pode pegar zero-day, com mais falsos positivos","anomalia exige que o ataque já esteja no CVE"],"ans":"D","com":"Trade-off clássico assinatura × comportamento.","bizu":"BIZU: assinatura = conhecido · anomalia = desvio do normal."},{"id":"s2q40","n":40,"src":"s2","area":"DF","mod":"Defensiva","stem":"Em uma VPN IPsec na qual apenas o payload do pacote original é protegido, mantendo-se os endereços IP originais no cabeçalho externo, está em uso o modo","passage":null,"alts":["túnel","transporte com AH obrigatório","transporte","túnel com GRE obrigatório","transport-and-tunnel simultâneo do TLS"],"ans":"C","com":"Transporte = protege payload, IP original visível. Túnel = encapsula o pacote inteiro (gateways).","bizu":"BIZU: túnel = pacote dentro de pacote (site-to-site) · transporte = host-to-host."},{"id":"s2q41","n":41,"src":"s2","area":"DF","mod":"Defensiva","stem":"No IPsec, o protocolo que oferece confidencialidade (cifra) do payload, podendo também autenticar, é o","passage":null,"alts":["AH","ESP","IKE isoladamente sem SA","L2TP sem IPsec","PPTP"],"ans":"B","com":"ESP = Encapsulating Security Payload (cifra ± autenticação). AH = autenticação sem cifra.","bizu":"BIZU: ESP cifra · AH não cifra (autentica inclusive cabeçalho IP)."},{"id":"s2q42","n":42,"src":"s2","area":"DF","mod":"Defensiva","stem":"Uma diferença do TLS 1.3 em relação ao TLS 1.2 é","passage":null,"alts":["reintroduzir SSL 2.0 por compatibilidade","tornar obrigatório o uso exclusivo de RC4","eliminar o handshake e cifrar com chave pré-compartilhada fixa de fábrica","suportar apenas suítes AEAD e exigir (EC)DHE com forward secrecy, eliminando key exchange estático e CBC","proibir certificados X.509"],"ans":"D","com":"TLS 1.3: 1-RTT, só AEAD, só PFS ((EC)DHE), sem key exchange estático/CBC/RC4.","bizu":"BIZU: 1.3 = AEAD + PFS · sem key exchange estático nem CBC."},{"id":"s2q43","n":43,"src":"s2","area":"DF","mod":"Defensiva","stem":"No OWASP Top 10:2021, a categoria A03 – Injection passou a incluir, entre outras falhas,","passage":null,"alts":["falhas de configuração de segurança, que saíram do Top 10","Server-Side Request Forgery como único item da categoria","falhas exclusivas de desserialização de Java","apenas injeção em bancos NoSQL, excluindo SQL","Cross-Site Scripting (XSS), antes listado separadamente"],"ans":"E","com":"Em 2021, XSS foi absorvido por A03 Injection.","bizu":"BIZU: 2021 A03 = Injection (inclui XSS). Prepared statements ≠ XSS (XSS = escape de saída)."},{"id":"s2q44","n":44,"src":"s2","area":"DF","mod":"Defensiva","stem":"No OWASP Top 10:2025, a categoria nova que destaca falhas na cadeia de suprimentos de software é","passage":null,"alts":["Software Supply Chain Failures","Cryptographic Failures","Identification and Authentication Failures","Security Logging and Monitoring Failures","Server-Side Request Forgery"],"ans":"A","com":"OWASP Top 10:2025 introduz Software Supply Chain Failures (A03 na edição 2025).","bizu":"BIZU: 2025 → supply chain entra com força; não confundir com A08 Integrity Failures de 2021."},{"id":"s2q45","n":45,"src":"s2","area":"DF","mod":"Defensiva","stem":"A principal contramedida para XSS refletido em uma aplicação que ecoa entrada do usuário em HTML é","passage":null,"alts":["trocar MD5 por SHA-256 no armazenamento de senhas","habilitar apenas FTP anônimo no servidor","fazer escape/encoding contextual da saída (e CSP como defesa em profundidade)","aumentar o TTL do DNS","desativar TLS no balanceador"],"ans":"C","com":"XSS = output encoding + CSP. Prepared statements são para SQL injection.","bizu":"BIZU: SQLi → prepared statements · XSS → escape de saída + CSP."},{"id":"s2q46","n":46,"src":"s2","area":"DF","mod":"Defensiva","stem":"O OWASP SAMM estrutura-se em cinco funções de negócio. Uma delas é","passage":null,"alts":["Exfiltration","Resource Development","Resource Hijacking","Verification","Lateral Movement"],"ans":"D","com":"SAMM: Governance, Design, Implementation, Verification, Operations.","bizu":"BIZU: SAMM = G-D-I-V-O (não são táticas ATT&CK)."},{"id":"s2q47","n":47,"src":"s2","area":"DF","mod":"Defensiva","stem":"Um certificado digital X.509 vincula","passage":null,"alts":["uma chave pública à identidade de seu titular, autenticada por uma autoridade certificadora","uma senha em texto claro a um número de série de hardware","um endereço MAC a uma VLAN de voz","um hash MD5 a um arquivo de paginação","um ticket Kerberos a um compartilhamento NFS"],"ans":"A","com":"X.509 = identidade ↔ chave pública, assinada pela AC.","bizu":"BIZU: certificado ≠ cifra os dados sozinho; ele autentica a chave pública."},{"id":"s2q48","n":48,"src":"s2","area":"DF","mod":"Defensiva","stem":"Em um envelope digital, o arquivo grande é cifrado com","passage":null,"alts":["a chave privada do destinatário","apenas um HMAC, sem cifra","a chave pública do remetente, permitindo a qualquer um decifrar","um algoritmo de hash SHA-512, que é uma cifra de fluxo","chave simétrica de sessão; essa chave de sessão é cifrada com a chave pública do destinatário"],"ans":"E","com":"Envelope = simétrica nos dados + assimétrica na chave de sessão.","bizu":"BIZU: hash ≠ cifra · envelope = híbrido."},{"id":"s2q49","n":49,"src":"s2","area":"DF","mod":"Defensiva","stem":"Sobre funções de hash criptográficas, é correto afirmar que","passage":null,"alts":["sempre permitem recuperar o texto original a partir do resumo","SHA-256 produz 32 caracteres hexadecimais","produzem resumo de tamanho fixo e devem ser resistentes a colisão e a pré-imagem","substituem assinatura digital para fins de não repúdio jur ds + checklist do dia da prova; separar documento e caneta","topic":null,"rev":[],"kind":""},{"i":37,"date":"2026-12-05","dow":"sáb","task":"Descanso ativo: 1h de BIZUs no máximo; conferir local/rota; dormir cedo","topic":null,"rev":[],"kind":""},{"i":38,"date":"2026-12-06","dow":"dom","task":"PROVA — Manaus (chegar 1 h antes do horário do cartão; horário do edital = Brasília)","topic":null,"rev":[],"kind":"key"},{"i":39,"date":"2026-12-07","dow":"seg","task":"Gabarito preliminar; conferir respostas anotadas no cartão; recursos (07 e 08/12)","topic":null,"rev":[],"kind":"key"},{"i":40,"date":"2026-12-08","dow":"ter","task":"Último dia de recursos","topic":null,"rev":[],"kind":"key"}],"diaProva":[{"id":"d0","html":"Imprimir o <b>Cartão de Confirmação de Inscrição<\/b> (disponível em 01/12) e conferir nome, ênfase, cidade (Manaus) e local","item":"6.1–6.3"},{"id":"d1","html":"Ver o horário no cartão e lembrar: horários do edital são de <b>Brasília<\/b> (item 1.7) → em Manaus, <b>1 hora a menos<\/b>","item":"1.7"},{"id":"d2","html":"Chegar ao local com <b>1 hora de antecedência<\/b>; após o fechamento dos portões não entra","item":"8.3.1 / 8.4.2"},{"id":"d3","html":"<b>Documento oficial original com foto<\/b> (RG/CIN, CNH com foto, passaporte, carteira de conselho, CTPS, reservista; digitais aceitos no app oficial: e-Título, CIN, CNH digital, RG digital). Cópia não vale; CPF/certidão não valem","item":"8.5"},{"id":"d4","html":"<b>Caneta esferográfica de tinta preta, de material transparente<\/b> (leve 2)","item":"8.18"},{"id":"d5","html":"Não levar: lápis, lapiseira, borracha, marca-texto; <b>relógio de qualquer tipo<\/b>; agendas; óculos escuros; boné/chapéu/gorro; protetor auricular","item":"8.21 IV"},{"id":"d6","html":"Água e lanche <b>somente em embalagem transparente<\/b>","item":"8.21 IV a"},{"id":"d7","html":"Celular <b>desligado<\/b> dentro do <b>envelope porta-objetos<\/b>, lacrado, embaixo da carteira","item":"8.24"},{"id":"d8","html":"Se precisar, levar <b>Declaração de Comparecimento<\/b> impressa e pedir assinatura do fiscal antes de entrar","item":"8.4"},{"id":"d9","html":"Aceitar coleta biométrica e detector de metais (recusa elimina)","item":"8.9 / 8.10"},{"id":"d10","html":"Pode <b>anotar as respostas no Cartão de Confirmação<\/b> (e só nele) para conferir o gabarito","item":"8.14 / 8.15"},{"id":"d11","html":"Sair só após <b>2 horas<\/b> do início; o caderno de questões não pode ser levado","item":"8.12"},{"id":"d12","html":"Cartão-resposta: preencher completamente, sem rasura, sem marca de identificação; <b>assinar<\/b> o cartão e a lista de presença","item":"8.19–8.20"},{"id":"d13","html":"Os 3 últimos candidatos da sala saem juntos","item":"8.16"},{"id":"d14","html":"Dia 07/12: gabarito preliminar; recursos <b>07 e 08/12<\/b>, sem se identificar, com fundamentação","item":"Cronograma / 9.1"},{"id":"d15","html":"Véspera: dormir cedo, comer leve, testar rota até o local (sábado no mesmo horário)","item":"—"}],"audios":[{"id":"01","title":"Áudio 1 — BIZUs de Segurança Ofensiva","file":"audios/01_Ofensiva_BIZUs.mp3","script":"Olá, Allan! Aqui é o seu resumo falado dos BIZUs do Módulo 1, Segurança Ofensiva, para a prova da Transpetro, ênfase sete, Segurança Cibernética, banca Cesgranrio. São doze BIZUs, mais as pegadinhas que mais derrubam candidato. Pode ouvir no trânsito, sem olhar para nada. Vamos lá.\n\nPrimeiro BIZU: ataque passivo contra ataque ativo. Grave assim: passivo é para prevenir. Quem só escuta a rede quase não deixa rastro, então é difícil de detectar, e a defesa certa é impedir, por exemplo com criptografia. Já o ataque ativo é para detectar e recuperar, porque é difícil preveni-lo cem por cento. E os ativos têm um mnemônico: D, R, M, N. Disfarce, Repetição, Modificação e Negação de serviço.\nAgora a pegadinha: análise de tráfego funciona mesmo com criptografia. Se a alternativa disser que cifrar resolve a análise de tráfego, é falsa. E o ataque de repetição, o replay, não precisa quebrar a cifra: o atacante simplesmente reenvia o pacote cifrado do jeito que está.\n\nSegundo BIZU: a ordem das etapas do ataque. Decore a frase: \"Fui Ver Eu Ganhar, Escalei, Pus Porta, Escondi e Recusei\". Isso dá: Footprinting, Varredura, Enumeração, Ganho de acesso, Escalação de privilégio, Porta dos fundos, Encobrimento de rastros e Recusa de serviço. E a diferença que a banca cobra: a varredura pergunta \"o que está aberto?\". A enumeração pergunta \"quem, ou quais: contas, compartilhamentos e versões?\". Lembre também: footprinting com fontes abertas é passivo; varredura é ativa, porque toca o alvo.\n\nTerceiro BIZU, o do nmap, que cai muito. Vou falar flag por flag, devagar.\nMenos ésse, ésse maiúsculo: é o SYN scan, o silencioso. Ele manda o SYN e não completa o handshake.\nMenos ésse, tê maiúsculo: é o TCP connect, o tagarela. Esse sim completa o handshake de três vias.\nMenos ésse, vê maiúsculo: versão do serviço.\nMenos ó maiúsculo: sistema operacional.\nMenos ésse ene, tudo minúsculo: sem portas, só descobre quem está vivo.\nMenos pê, menos: todas as portas, de um a sessenta e cinco mil quinhentos e trinta e cinco.\nMenos pê maiúsculo, ene: não pinga, assume que o host está vivo.\nMenos ésse, u maiúsculo: varredura UDP.\nE menos á maiúsculo: o modo agressivo, faz tudo.\nPegadinhas clássicas do nmap: dizer que o menos ésse ésse completa o handshake é falso, quem completa é o menos ésse tê. Dizer que o menos ésse ene varre as portas mais comuns é falso. Dizer que o menos ó descobre a versão do Apache é falso, versão de serviço é o menos ésse vê. E o ACK scan não identifica porta aberta; ele serve para mapear regras de firewall.\n\nQuarto BIZU: ARP spoofing. Três palavras: mesma LAN, camada dois, homem no meio. O atacante anuncia: \"o IP do gateway sou eu\", e entrega o próprio endereço MAC. A defesa é a dupla DAI, Dynamic ARP Inspection, mais DHCP Snooping. O DAI valida as mensagens ARP contra a tabela de vínculos que o DHCP Snooping montou. Não confunda com envenenamento de DNS: o DNS falsifica a tradução de nome para IP, está na camada sete, pode ser remoto, e a defesa é DNSSEC. O ARP falsifica a tradução de IP para MAC, e só funciona na rede local.\nComo a banca descreve o sintoma? Se várias estações passaram a ter o IP do roteador associado a um MAC diferente, é ARP spoofing. Se as estações recebem gateway ou DNS errados ao ligar, é DHCP falso, o rogue DHCP. E se o switch passou a se comportar como hub, é MAC flooding, estouro da tabela CAM.\n\nQuinto BIZU: as portas que mais caem. Vou em blocos. FTP, vinte e vinte e um. SSH, vinte e dois. Telnet, vinte e três. SMTP, vinte e cinco. DNS, cinquenta e três. DHCP, sessenta e sete e sessenta e oito. HTTP, oitenta. Kerberos, oitenta e oito.\nSegundo bloco: POP3, cento e dez. NTP, cento e vinte e três. IMAP, cento e quarenta e três. SNMP, cento e sessenta e um e cento e sessenta e dois. LDAP, trezentos e oitenta e nove. HTTPS, quatrocentos e quarenta e três. SMB, quatrocentos e quarenta e cinco.\nTerceiro bloco: SMTPS, quatrocentos e sessenta e cinco. IKE, quinhentos. Modbus, quinhentos e dois, essa é de automação industrial, importante na Transpetro. Submission de e-mail, quinhentos e oitenta e sete. LDAPS, seiscentos e trinta e seis. IMAPS, novecentos e noventa e três. POP3S, novecentos e noventa e cinco.\nE as altas: RADIUS, mil oitocentos e doze e mil oitocentos e treze. RDP, três três oito nove. E NAT Traversal do IPsec, quatro mil e quinhentos.\n\nSexto BIZU: Wi-Fi em uma linha. Rogue é o intruso plugado na sua rede. Evil Twin é o clone do nome da rede, o SSID. Tracking é te seguir pelas mensagens de probe que o seu celular envia. Jamming é barulho de rádio frequência, ataque físico, não de protocolo. E Deauth é o quadro de desautenticação forjado que derruba o cliente; quem resolve é o PMF, Protected Management Frames, do padrão oitocentos e dois ponto onze dáblio.\nPegadinha: o rogue AP está conectado à rede interna, é ameaça à empresa. O evil twin imita uma rede para enganar os clientes.\n\nSétimo BIZU: sniffing, spoofing e homem no meio. Sniffing é ouvir, é passivo. Spoofing é fingir, é ativo. E o homem no meio é ficar no meio da conversa, e numa rede comutada ele precisa de spoofing para chegar lá. A ferramenta defensiva da lista do edital é o arpwatch, que detecta mudança no par IP e MAC.\n\nOitavo BIZU: o ciclo da engenharia social, P, R, E, U. Pesquisa, Relacionamento, Exploração e Utilização. Pegadinha: pharming não é phishing. No pharming a vítima digita o endereço correto e mesmo assim cai no site falso, porque o DNS ou o arquivo hosts foi adulterado. E whaling é o spear phishing contra a alta direção, os \"peixes grandes\".\n\nNono BIZU: vírus, worm e cavalo de Troia. O vírus precisa de hospedeiro e de execução. O worm anda sozinho pela rede. O cavalo de Troia é o presente de grego: parece útil e não se replica. E ainda: keylogger captura o teclado; screenlogger captura a tela, por isso o teclado virtual não salva você do screenlogger.\nPegadinhas: rootkit não serve, por definição, para obter acesso; serve para esconder e manter o acesso. Formjacking ataca o site de comércio eletrônico, não o computador do cliente. E cryptojacking não cifra arquivos: ele minera criptomoeda escondido. Quem cifra arquivos é o ransomware.\n\nDécimo BIZU: MITRE ATT&CK. Lembre: pegou senha, hash ou ticket, é a tática Credential Access, tê á zero zero zero seis. Despejar a memória do processo LSASS com o mimikatz é a técnica tê mil e três ponto zero zero um. Usar o hash para entrar em outra máquina, o pass the hash, é Lateral Movement, técnica tê mil quinhentos e cinquenta ponto zero zero dois, que também aparece em Defense Evasion. Phishing é Initial Access. Tarefa agendada ou chave Run no registro é Persistence. Cifrar arquivos para pedir resgate é Impact. Apagar logs é Defense Evasion.\nE a ordem das catorze táticas, numa frase: \"Recebi Recursos, Invadi, Executei, Persisti, Privilegiei, Desviei, Credenciei, Descobri, Lateralizei, Coletei, C2, Exfiltrei, Impactei\". Ou seja: Reconhecimento, Desenvolvimento de recursos, Acesso inicial, Execução, Persistência, Escalação de privilégio, Evasão de defesa, Acesso a credenciais, Descoberta, Movimento lateral, Coleta, Comando e controle, Exfiltração e Impacto.\nPegadinhas: o ATT&CK não é sequencial obrigatório como a Cyber Kill Chain. Tática é o objetivo, técnica é o como: Credential Access é tática; OS Credential Dumping é técnica. E uma técnica pode pertencer a mais de uma tática.\n\nDécimo primeiro BIZU: a sopa de letrinhas do MITRE. CVE é a vulnerabilidade específica, aquela falha naquele produto. CWE é a fraqueza, o tipo de erro, de weakness. CAPEC é o padrão de ataque. E o ATT&CK é o comportamento do adversário. No CAPEC, os mecanismos respondem \"como ataca\", e os domínios respondem \"onde ataca\".\n\nDécimo segundo e último BIZU deste módulo: as vinte e quatro ferramentas do edital, agrupadas por fase.\nReconhecimento: amass, theHarvester e Maltego.\nVarredura: nmap e masscan. Masscan é mais rápido, mas não detecta versão e sistema no mesmo nível.\nEnumeração: smbmap.\nSniffing e homem no meio: Wireshark e Ettercap. E o arpwatch para detectar.\nWi-Fi: aircrack-ng e airgeddon.\nSenhas: o hydra ataca o serviço ao vivo, é online. John the Ripper e hashcat quebram hash já obtido, são offline, e o hashcat usa a placa de vídeo.\nExploração: Metasploit, sqlmap, BeEF, que depende de XSS para fisgar o navegador, e Burp.\nPós-exploração e credenciais: mimikatz.\nEvasão de antivírus: Veil.\nEngenharia social: SET, o Social Engineer Toolkit.\nEngenharia reversa: Ghidra, que não é scanner de vulnerabilidades.\nEsconder dados dentro de imagem ou áudio: steghide. Ele não cifra disco.\nE o canivete suíço de rede: netcat.\n\nRecapitulando o módulo em dez segundos: passivo previne, ativo detecta. Menos ésse ésse não completa o handshake. ARP é camada dois e local; DNS é camada sete. Vírus precisa de hospedeiro, worm anda sozinho. E hydra é online, john e hashcat são offline. Fim do áudio de Segurança Ofensiva. Bons estudos!"},{"id":"02","title":"Áudio 2 — BIZUs de Segurança Defensiva","file":"audios/02_Defensiva_BIZUs.mp3","script":"Olá, Allan! Este é o resumo falado dos BIZUs do Módulo 2, Segurança Defensiva. Lembre que, na prova de 2023, a parte defensiva foi a maior fatia, cerca de metade das questões de conhecimentos específicos. São doze BIZUs, com as pegadinhas de cada um. Vamos nessa.\n\nPrimeiro BIZU: os porteiros do perímetro. O filtro de pacotes é o porteiro que só olha o crachá: endereço IP e porta. O firewall stateful é o porteiro com caderno: ele lembra quem entrou e libera a resposta. O proxy é a recepcionista que leva o recado: ele fala por você, na camada sete, e por isso não existe conexão direta entre cliente e servidor. O IDS é o alarme: só avisa. O IPS é o segurança armado: fica no caminho do tráfego, em linha, e bloqueia. E na detecção: assinatura é como vacina, reconhece o que já é conhecido; anomalia é como febre, percebe algo diferente do normal.\nPegadinhas: \"o IDS bloqueia o ataque\" é falso, a não ser que esteja integrado a outro dispositivo. \"O filtro de pacotes analisa o conteúdo HTTP\" é falso. \"IDS por assinatura detecta ataque de dia zero\" é falso, isso é papel da detecção por anomalia. E guarde: falso positivo é alerta sem ataque; falso negativo é ataque sem alerta, que é o mais perigoso.\n\nSegundo BIZU: o padrão oito zero dois ponto um xis. Porta do switch mais login é igual a oito zero dois ponto um xis. O trio é: Suplicante, que é o cliente; Autenticador, que é o switch ou o ponto de acesso; e o servidor RADIUS. Eles conversam usando EAP: no primeiro trecho, entre cliente e switch, vai o EAPOL, o EAP sobre LAN; no segundo trecho, o EAP vai dentro do RADIUS. O switch não decide, só repassa. Quem decide é o RADIUS. E o EAP-TLS usa certificado dos dois lados.\nPegadinhas: o autenticador é o switch, não o servidor. O controle é na camada dois, antes de o cliente ganhar IP. RADIUS usa UDP; TACACS mais usa TCP. O RADIUS não cifra o pacote inteiro. E EAP é um framework de autenticação, não um algoritmo de cifra.\n\nTerceiro BIZU: o OWASP Top 10. Na versão de 2021: A zero um, Broken Access Control, controle de acesso quebrado. A zero dois, Cryptographic Failures, falhas criptográficas. A zero três, Injection, injeção. O mnemônico é A, C, I: Acesso, Cripto, Injeção. Desde 2021, o XSS está dentro de Injection. E o SSRF era o A dez em 2021.\nNa versão de 2025: o A zero um continua Broken Access Control; o A zero dois vira Security Misconfiguration, configuração incorreta; e o A zero três passa a ser cadeia de suprimentos, Supply Chain. Moral: leia o ano no enunciado! Se a questão não citar o ano, procure a resposta que vale para as duas versões. E o IDOR, aquele em que você troca o número da conta na URL e vê os dados de outro usuário, é Broken Access Control, não é injeção.\n\nQuarto BIZU: o OWASP SAMM. Frase: \"GoDe ImVeOp\". Governance, Design, Implementation, Verification e Operations. São cinco funções, cada uma com três práticas, cada prática com dois fluxos, e três níveis de maturidade.\n\nQuinto BIZU: propriedades da segurança. CIDA mais não repúdio: Confidencialidade, Integridade, Disponibilidade, Autenticidade, e o não repúdio. O código MAC de autenticação de mensagem dá integridade e autenticidade, mas não dá não repúdio, porque a chave é compartilhada: qualquer um dos dois lados poderia ter gerado o código. Só a assinatura digital dá não repúdio.\nPegadinha clássica: autenticação não é autorização. Autenticação prova quem você é; autorização define o que você pode fazer. E autenticidade é sobre a origem; integridade é sobre o conteúdo.\n\nSexto BIZU: a criptografia. Simétricos: AES, três DES, ChaCha20, e também DES, RC4 e Blowfish. Assimétricos: RSA, curvas elípticas, Diffie-Hellman e DSA. Hash não é cifra: não tem chave e não tem volta. Agora a regra de ouro: eu assino com a minha chave privada; e cifro para você com a sua chave pública. Tamanhos de hash em hexadecimal: SHA-256 tem sessenta e quatro caracteres; MD5 tem trinta e dois; SHA-1 tem quarenta.\nPegadinhas: Diffie-Hellman não cifra mensagens e não assina, só combina a chave, e sem autenticação é vulnerável ao homem no meio. Assinatura digital não dá sigilo. Dois fatores da mesma categoria, como senha mais PIN, não é autenticação multifator. RAID não é backup. E backup incremental é rápido para fazer e lento para restaurar; o diferencial é o inverso.\n\nSétimo BIZU: ICP-Brasil. O Comitê Gestor é o cérebro, define as políticas. O ITI é a AC Raiz, e só certifica outras autoridades certificadoras. A AC, autoridade certificadora, é o cartório que emite o certificado. A AR, autoridade de registro, é o balcão que confere seus documentos. E a ACT, autoridade de carimbo do tempo, é o relógio oficial. Duas frases para guardar: \"AR não emite\" e \"a Raiz não emite para usuário final\". Pegadinhas: a AC Raiz não é o Comitê Gestor. E o certificado A1 não fica em token; quem fica em token ou cartão é o A3.\n\nOitavo BIZU: IPsec e TLS. No IPsec, o AH autentica, mas não esconde. O ESP esconde, e também autentica. O modo túnel coloca o pacote inteiro dentro de outro, é a VPN entre sites. O IKE negocia, na porta UDP quinhentos. E a SA, associação de segurança, é de mão única: precisa de duas, uma para ida e outra para volta. No TLS um ponto três: o handshake é de uma ida e volta só, usa apenas cifras AEAD e só troca de chaves Diffie-Hellman efêmera.\nPegadinhas: \"no TLS o cliente é sempre autenticado\" é falso. \"AH provê confidencialidade\" é falso. \"TLS um ponto três aceita troca de chaves RSA\" é falso. E \"SSL versão três é seguro se usado com AES\" é falso, o protocolo está descontinuado.\n\nNono BIZU: firewall pessoal contra firewall de rede. O firewall pessoal protege o próprio computador, inclusive contra ameaça que vem de dentro da rede local. O firewall de rede protege o segmento. Defesa em profundidade é usar os dois.\n\nDécimo BIZU: sistema operacional. Perm
