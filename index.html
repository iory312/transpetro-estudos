issões no Linux: quatro, dois, um é igual a leitura, escrita e execução, r, w, x. E no dígito extra, SUID, SGID e sticky bit também valem quatro, dois e um. O inode guarda tudo sobre o arquivo, menos o nome. No Windows: BitLocker cifra o disco; EFS cifra o arquivo.\n\nDécimo primeiro BIZU, muito importante para a Transpetro: automação industrial e a norma IEC sessenta e dois quatro quatro três. As partes: um é geral; dois é política, voltada ao dono do ativo; três é o sistema, voltado ao integrador; quatro é o componente, voltado ao fabricante. A parte três-dois trata de zonas, conduítes e risco. A três-três traz os requisitos do sistema e os níveis de segurança. A quatro-um trata do ciclo de desenvolvimento seguro do fabricante. E os sete requisitos fundamentais, na frase \"Identifica, Usa, Integra, Confidencia, Restringe, Responde, Disponibiliza\": identificação e autenticação, controle de uso, integridade, confidencialidade, fluxo de dados restrito, resposta a eventos em tempo hábil e disponibilidade.\nPegadinhas: em ambiente de operação, \"aplicar patch imediatamente em produção\" e \"priorizar a confidencialidade\" são alternativas erradas típicas; em OT, disponibilidade vem primeiro. E varredura ativa agressiva com nmap pode derrubar um CLP; prefira monitoração passiva.\n\nDécimo segundo BIZU: forense digital. C, E, A, R: Coleta, Exame, Análise e Relatório. Colete do mais volátil para o menos volátil: RAM antes do disco. Calcule o hash antes e depois, para provar integridade. No cabeçalho de e-mail, os campos Received se leem de baixo para cima. E o write blocker garante acesso só de leitura.\nPegadinhas: \"para preservar a evidência, desligue imediatamente o computador\" está, em geral, errado, porque você perde a memória RAM. \"A análise deve ser feita na mídia original\" está errado: trabalhe numa cópia. E hash não recupera dados, só prova integridade.\n\nRecapitulando em dez segundos: IDS avisa, IPS bloqueia. No oito zero dois ponto um xis, quem decide é o RADIUS. OWASP 2021 é A, C, I; leia o ano. Só assinatura dá não repúdio. AH autentica, ESP esconde. AR não emite. E em OT, disponibilidade primeiro. Fim do áudio de Segurança Defensiva. Bora pra cima!"},{"id":"03","title":"Áudio 3 — BIZUs de Compliance de Segurança e Privacidade","file":"audios/03_Compliance_BIZUs.mp3","script":"Olá, Allan! Este é o resumo falado dos BIZUs do Módulo 3, Compliance. São as normas ISO, os frameworks NIST e CIS, o Marco Civil, a LGPD e a Resolução da Anatel. Dez BIZUs, na ordem do edital. Começando.\n\nPrimeiro BIZU: a ISO vinte e sete mil e um, de dois mil e vinte e dois. Noventa e três controles, em quatro temas: Organizacionais, trinta e sete; Pessoas, oito; Físicos, quatorze; Tecnológicos, trinta e quatro. Memorize a sequência: trinta e sete, oito, quatorze, trinta e quatro, numerados como cláusulas cinco, seis, sete e oito. São onze controles novos: inteligência de ameaças, serviços em nuvem, prontidão para continuidade da TIC, monitoramento físico, gerenciamento de configuração, exclusão de informação, mascaramento de dados, prevenção de vazamento, monitoramento de atividades, filtro web e código seguro. E a diferença: a vinte e sete mil e um é o \"deve\", a que certifica; a vinte e sete mil e dois é o \"convém\", a que orienta.\nPegadinhas: a organização pode excluir controles do Anexo A, desde que justifique na Declaração de Aplicabilidade, a SoA. O Anexo A não é lista fechada, dá para adicionar controles. A banca ainda cita a versão de 2013, com quatorze domínios e cento e catorze controles: leia o ano. E quem aprova a política e garante recursos é a alta direção, cláusula cinco.\n\nSegundo BIZU: avaliação de riscos não é análise de riscos. O processo de avaliação, o assessment, é I, A, A: Identificar, Analisar o nível, Avaliar comparando com o critério. E os tratamentos são MERC: Mitigar, Evitar, Reter e Compartilhar.\n\nTerceiro BIZU: a ISO vinte e sete mil e trinta e cinco, resposta a incidentes. Frase: \"Pla, De, Ava, Res, Apre\". Planejar, Detectar, Avaliar, Responder e Aprender. Compare com o NIST SP oitocentos e sessenta e um: Preparação; Detecção e Análise; Contenção, Erradicação e Recuperação; e Atividade pós-incidente.\n\nQuarto BIZU: continuidade de negócios. RPO é a perda de dados aceitável: olha para trás. RTO é o tempo para voltar a operar: olha para frente. A BIA, análise de impacto nos negócios, vem antes das estratégias. A ISO vinte e dois mil e trezentos e um é o \"deve\"; a vinte e dois mil e trezentos e treze é o \"como fazer\".\n\nQuinto BIZU: privacidade. A ISO vinte e nove mil e cem traz os princípios, o \"porquê\". A vinte e nove mil e cento e trinta e quatro é a avaliação de impacto, a PIA ou RIPD. A vinte e sete mil e setecentos e um é o sistema de gestão da privacidade da informação, a extensão da vinte e sete mil e um: o Anexo A é do controlador, o Anexo B é do operador.\nPegadinha: a vinte e sete mil e setecentos e um, na versão de 2019, não é norma autônoma; ela estende a vinte e sete mil e um. E \"minimização\" na ISO se parece com \"necessidade\" na LGPD.\n\nSexto BIZU: o NIST CSF dois ponto zero. A frase é GIP-DRR: Govern, Identify, Protect, Detect, Respond e Recover. Ou seja: Governar, Identificar, Proteger, Detectar, Responder e Recuperar. O Govern é a função nova, e a cadeia de suprimentos, o GV ponto SC, foi para dentro dela. Os Tiers não são níveis de maturidade obrigatórios: a frase é \"PIRA\": Partial, Informed, Repeatable e Adaptive, ou seja, Parcial, Informada, Repetível e Adaptativa.\nPegadinha: CIS Controls é o que priorizar; CIS Benchmarks é como configurar cada sistema. E no CSF dois ponto zero, Identify não contém mais a governança: ela foi para Govern.\n\nSétimo BIZU: os CIS Controls. Os dois primeiros são inventário: primeiro de hardware, depois de software. \"Não dá para proteger o que você não conhece.\" O controle quatorze é treinamento. O dezessete é resposta a incidentes. O dezoito, o último, é o teste de penetração. E a inclusão: o grupo de implementação um está contido no dois, que está contido no três.\n\nOitavo BIZU: Marco Civil da Internet. Guarde \"C1 A6\": registro de conexão, um ano; registro de aplicação, seis meses. O provedor de conexão não pode guardar registro de aplicação. Para conteúdo e registros, precisa de juiz. Para dados cadastrais, basta autoridade administrativa.\nAtenção especial: em junho de 2025, o STF, nos Temas novecentos e oitenta e sete e quinhentos e trinta e três, declarou parcialmente inconstitucional o artigo dezenove. Em regra, provedores de aplicação podem ser responsabilizados após notificação extrajudicial se não removem conteúdo ilícito, mantendo-se a ordem judicial para crimes contra a honra. Em prova, a Cesgranrio costuma cobrar a letra da lei; se o enunciado citar a tese do STF, aplique a tese.\n\nNono BIZU: a LGPD. Controlador decide. Operador executa. Encarregado, o DPO, faz a ponte entre titular, controlador e ANPD. Os dez princípios, numa frase: \"FAN LIQUE TRANSPARENTE SEGURO PREVINE NÃO DISCRIMINA E RESPONDE\". Finalidade, Adequação, Necessidade, Livre acesso, Qualidade, Transparência, Segurança, Prevenção, Não discriminação e Responsabilização. A multa é de dois por cento do faturamento no Brasil do último exercício, limitada a cinquenta milhões de reais por infração.\nPegadinhas: consentimento é só uma das dez bases legais, não é obrigatório sempre. Legítimo interesse não serve para dado sensível. Encarregado não é agente de tratamento. A LGPD vale para dados em meio físico e digital, e para entes públicos e privados.\n\nDécimo BIZU: a Resolução Anatel setecentos e quarenta, de dois mil e vinte. Além da CIDA, os princípios extras são DIPRT: Diversidade, Interoperabilidade, Prioridade, Responsabilidade e Transparência. As obrigações em uma linha: ter política, auditar fornecedor, trocar senha padrão, notificar incidente, avaliar vulnerabilidade e informar a infraestrutura crítica.\n\nRecapitulando em dez segundos: na vinte e sete mil e um, trinta e sete, oito, quatorze, trinta e quatro. Avaliação de riscos é I, A, A; tratamentos são MERC. RPO olha para trás, RTO para frente. CSF dois ponto zero é GIP-DRR. Marco Civil: C1 A6. LGPD: controlador decide, operador executa. Fim do áudio de Compliance. Continue firme!"},{"id":"04","title":"Áudio 4 — BIZUs de Português","file":"audios/04_Portugues_BIZUs.mp3","script":"Olá, Allan! Este é o resumo falado dos BIZUs de Português para a Cesgranrio. São quatro BIZUs principais, mais as pegadinhas de concordância, regência e pontuação que mais caem. As questões de Português vêm misturadas com interpretação e gramática aplicada ao texto. Vamos lá.\n\nPrimeiro BIZU: o que a Cesgranrio mais ama. A pergunta \"o trecho X refere-se a…\", que é coesão referencial, e a pergunta \"a palavra X pode ser substituída, sem alteração de sentido, por…\". A estratégia: volte ao parágrafo e troque a palavra na frase original. Se o sentido mudar ou a frase ficar errada, a alternativa cai.\nAntes de ler o texto, leia o enunciado e marque as palavras de comando: \"de acordo com o texto\", \"infere-se\", \"o autor defende\", \"a expressão X tem sentido de\". Interpretação é o que está no texto; inferência é o que se conclui com segurança a partir dele. Extrapolação, inventar além do texto, é errado. Desconfie de alternativas com \"sempre\", \"nunca\", \"todos\", \"exclusivamente\", e de informação verdadeira no mundo, mas ausente no texto.\n\nSegundo BIZU: concessão contra adversidade. \"Embora\" é concessão e pede subjuntivo. \"Mas\" é adversidade e fica no indicativo. Com a ordem invertida, as duas frases significam a mesma coisa: \"Embora estude, erra\" é igual a \"Estuda, mas erra\". Na reescrita, ao trocar \"mas\" por \"embora\", mude o verbo para o subjuntivo.\nVale lembrar os conectivos principais. Adição: e, nem, não só… mas também, além disso. Adversidade: mas, porém, contudo, todavia, entretanto, no entanto. Concessão: embora, ainda que, mesmo que, apesar de. Conclusão: logo, portanto, por isso, assim, e \"pois\" quando vem depois do verbo. Explicação: porque, e \"pois\" quando vem antes do verbo. Causa: porque, já que, visto que, como no início. Condição: se, caso, desde que, a menos que. Finalidade: para que, a fim de que. Consequência: tão… que, de modo que. Proporção: à medida que. Tempo: quando, enquanto, assim que.\nPegadinha clássica: oração adjetiva restritiva contra explicativa. \"Os analistas que estudaram passaram\" — só alguns passaram. \"Os analistas, que estudaram, passaram\" — todos passaram. Tirar ou colocar as vírgulas muda o sentido.\n\nTerceiro BIZU: a crase. A regra do Allan: troque por masculino. Se a frase virar \"ao\", tem crase. \"Fui à escola\" vira \"fui ao colégio\", então tem. Para cidade: \"vou a, volto da, crase há; vou a, volto de, crase pra quê?\". Nunca use crase antes de verbo, antes de palavra masculina ou antes de pronome pessoal.\nUse crase: termo que pede \"a\" mais palavra feminina que admite artigo; horas determinadas, \"às treze horas\"; locuções femininas como \"à medida que\", \"às vezes\", \"à noite\"; e \"àquele\", \"àquela\", \"àquilo\" quando o regente pede \"a\". Não use: antes de masculino, antes de verbo, antes de pronomes que não aceitam artigo, entre palavras repetidas como \"cara a cara\", e \"vou a Manaus\", porque volta de Manaus.\nRegência dos campeões. Assistir no sentido de ver: assistir a, \"assisti ao jogo\". Visar no sentido de almejar: visar a. Aspirar no sentido de desejar: aspirar a. Obedecer e desobedecer pedem \"a\". Preferir algo a algo, nunca \"mais do que\". Implicar no sentido de acarretar é transitivo direto, sem \"em\". Chegar e ir pedem \"a\", não \"em\". Esquecer algo, ou esquecer-se de algo. Proceder no sentido de realizar: proceder a. Pagar e perdoar: a coisa é transitivo direto; a pessoa pede \"a\".\n\nQuarto BIZU: os parônimos. Ratificar é reafirmar. Retificar é corrigir, deixar reto. Iminente é imediato, vai acontecer. Eminente é elevado, de destaque. Infringir é cometer infração. Infligir é aplicar uma pena. Mau se opõe a bom; mal se opõe a bem. Há com hache é tempo passado, \"há dois anos\"; a sem hache é futuro ou distância, \"daqui a dois anos\". Onde é lugar fixo; aonde é movimento. Senão é \"caso contrário\" ou \"exceto\"; se não é \"caso não\". Afim é semelhante; a fim de é finalidade. Acerca de é sobre; há cerca de é aproximadamente no tempo; a cerca de é aproximadamente na distância.\n\nAgora as pegadinhas de concordância que derrubam. \"Haviam muitos candidatos\" é errado: haver no sentido de existir fica no singular, \"houve\". \"Fazem dois anos\" é errado: fazer de tempo é impessoal, \"faz\". \"Aluga-se salas\" é errado: é \"alugam-se salas\", voz passiva sintética. \"Assisti o filme\" é errado na norma-padrão: \"assisti ao filme\". \"Não esqueça-se\" é errado: com \"não\", a próclise é obrigatória, \"não se esqueça\".\nMais: \"existem falhas\" está certo, porque existir concorda. \"Deve haver erros\" está certo, auxiliar também no singular. \"Surgiram, no relatório, novas evidências\" está certo, sujeito posposto. \"É proibido entrada\" sem artigo fica invariável; \"é proibida a entrada\" com artigo concorda. \"Menos\" e \"alerta\" são invariáveis. \"Meio\" advérbio, no sentido de um pouco, não varia: \"meio cansada\".\nNa colocação pronominal: com palavra negativa, relativo, indefinido, conjunção subordinativa ou advérbio sem vírgula, a próclise é obrigatória. Não se inicia frase com pronome átono na norma-padrão. Mesóclise só no futuro do presente ou do pretérito, sem atrativo. Nunca ênclise com particípio.\n\nSobre pontuação, a regra de ouro: nunca separe sujeito e verbo, nem verbo e complemento, salvo intercalação entre duas vírgulas. Use vírgula para isolar adjunto adverbial deslocado, aposto, vocativo, adjetiva explicativa e expressões como \"isto é\", \"ou seja\", \"por exemplo\". Antes de \"mas\", \"porém\", \"contudo\". \"E\" com sujeitos diferentes pode ter vírgula. Ponto e vírgula separa itens longos. Dois-pontos introduzem enumeração, citação ou esclarecimento.\n\nRecapitulando em dez segundos: volte ao parágrafo e troque a palavra. Embora pede subjuntivo; mas fica no indicativo. Crase: troque por masculino. Ratificar é reafirmar; retificar é corrigir. \"Houve\", \"faz\", \"alugam-se\". Fim do áudio de Português. Você consegue!"},{"id":"05","title":"Áudio 5 — BIZUs de Inglês","file":"audios/05_Ingles_BIZUs.mp3","script":"Olá, Allan! Este é o áudio de Inglês, o seu ponto fraco na prova. São dez questões de interpretação da Cesgranrio, em geral sobre um ou dois textos autênticos. Setenta e quatro por cento das questões de Inglês da banca são de interpretação. Então o jogo é estratégia, conectores, falsos cognatos e o vocabulário técnico de segurança. Vamos treinar a orelha e a cabeça.\n\nPrimeiro: a ordem de ataque. Leia as perguntas. Depois faça um skimming, uma leitura rápida: título e a primeira frase de cada parágrafo, para pegar a ideia geral. Depois faça o scanning: volte só ao parágrafo da pergunta. Elimine alternativas. As perguntas típicas: main purpose, segundo o texto, a palavra X na linha Y refere-se a, can be replaced by, it can be inferred, e a attitude do autor.\n\nSegundo: referência pronominal. It, they, this, these, which, whose. Procure o substantivo anterior que concorda em número e faz sentido na frase. Em geral, o antecedente está na mesma sentença ou na imediatamente anterior.\n\nTerceiro: extremos. Textos de cibersegurança são cautelosos. Desconfie de every, always, never, all, only, completely, guarantee, eliminate. O texto costuma dizer may, can, could, likely, help reduce. Se a alternativa transformar um \"pode\" em \"sempre\" ou \"elimina\", ela está errada.\n\nQuarto: o BIZU do Allan. Quando o texto diz \"X is not a silver bullet\", a tradução é: X não é solução mágica, não resolve sozinho. O gabarito costuma ser algo como \"should be combined with other measures\", deve ser combinado com outras medidas. Grave essa expressão.\n\nQuinto: os conectores. Although, though, even though: concessão, embora. Despite e in spite of pedem substantivo ou verbo no gerúndio. However, nevertheless, yet, still: contraste, porém. Whereas e while: contraste entre dois fatos, enquanto. Therefore, thus, hence, consequently, as a result: conclusão, portanto. Moreover, furthermore, in addition, besides: adição, além disso. Because, since, as, due to: causa. Unless: condição negativa, a menos que. In order to e so that: finalidade. Instead of e rather than: em vez de. Such as, for instance, e.g.: exemplo.\n\nSexto: falsos cognatos. Actually significa \"na verdade\", não \"atualmente\". Currently é \"atualmente\". Eventually significa \"finalmente, por fim\", não \"eventualmente\". Pretend é \"fingir\", não \"pretender\"; pretender é intend. Assume é \"supor\", não \"assumir um cargo\". Sensible é \"sensato\"; sensível é sensitive. Support é \"apoiar\"; \"suportar\" no sentido de aguentar é stand ou bear. Realize é \"perceber\"; \"realizar\" no sentido de executar é carry out. Exquisite é \"requintado\", não \"esquisito\". Data são \"dados\", não a data do calendário. Library é \"biblioteca\"; livraria é bookstore. Attend é \"frequentar\" ou \"comparecer\"; \"atender\" no telefone é answer. Push é \"empurrar\"; \"puxar\" é pull. Policy é \"política\" no sentido de regra; polícia é police. E breach é \"violação\", como em data breach, vazamento de dados; não é a brecha física.\n\nSétimo: os modais, pegadinha clássica. Must: obrigação ou certeza forte. Should: recomendação. May e might: possibilidade. Can: capacidade ou possibilidade. Could: possibilidade menor ou passado. Would: hipótese. Trocar \"may\" por \"must\" muda o sentido e costuma ser a alternativa errada.\n\nOitavo: phrasal verbs que aparecem. Carry out: realizar. Set up: configurar. Shut down: desligar. Roll out: implantar. Phase out: descontinuar gradualmente. Look into: investigar. Rule out: descartar. Break into: invadir. Take over: assumir o controle. Keep up with: acompanhar. Rely on: depender de.\n\nNono: glossário técnico que cai. Attack surface: superfície de ataque. Asset: ativo. Awareness: conscientização. Backdoor: porta dos fundos. Baseline: linha de base. Breach: violação ou vazamento. Brute force: força bruta. Business continuity: continuidade de negócios. Compliance: conformidade. Countermeasure: contramedida. Credential stuffing: reuso de credenciais vazadas. Data at rest e data in transit: dados em repouso e em trânsito. Deploy e deployment: implantar e implantação. Downtime: tempo de inatividade. Eavesdropping: escuta clandestina. Enforce: fazer cumprir. Exploit: código de exploração ou o verbo explorar. Flaw e weakness: falha e fraqueza. Foothold: ponto de apoio no acesso inicial. Forensics: perícia. Gap: lacuna. Hardening: endurecimento de configuração. Harvest: coletar, por exemplo credenciais. Incident response: resposta a incidentes. Insider threat: ameaça interna. Lateral movement: movimento lateral. Leak: vazamento. Likelihood: probabilidade. Mitigate: mitigar. Outage: interrupção. Patch: correção. Payload: carga útil. Phishing lure: isca de phishing. Privilege escalation: escalação de privilégio. Ransom: resgate. Remediation: correção ou saneamento. Rogue: não autorizado ou falso. Safeguard: salvaguarda. Sandbox: ambiente isolado. Shortcoming: deficiência. Silver bullet: solução mágica. Spoof: falsificar. Stakeholder: parte interessada. Supply chain: cadeia de suprimentos. Tamper: adulterar. Threat actor: agente de ameaça. Threat hunting: caça a ameaças. Thwart: frustrar ou impedir. Trade-off: compromisso com custo. Unauthorized: não autorizado. Upgrade: atualizar a versão. Vulnerability disclosure: divulgação de vulnerabilidade. Wipe: apagar completamente. Zero-day: falha sem correção conhecida.\n\nDécimo: treino mental. Imagine a frase: \"Although network segmentation helps, it is not a silver bullet; therefore, operators should combine it with continuous monitoring.\" Traduza: embora a segmentação de rede ajude, ela não é solução mágica; portanto, os operadores devem combiná-la com monitoramento contínuo. O although é concessão. O therefore é conclusão. O should é recomendação, não obrigação absoluta. E \"not a silver bullet\" aponta para a alternativa que fala em combinar medidas.\n\nRecapitulando em dez segundos: leia as perguntas primeiro. Desconfie de every, always, never. Silver bullet não é solução mágica. Although é concessão; therefore é conclusão. Actually é \"na verdade\". May não é must. Fim do áudio de Inglês. Pratique lendo em voz alta. Você melhora a cada dia!"},{"id":"06","title":"Áudio 6 — Top BIZUs (os mais importantes)","file":"audios/06_Top_BIZUs.mp3","script":"Olá, Allan! Este é o \"Top BIZUs\": os pontos que mais resolvem questão na prova da Transpetro, ênfase sete, Cesgranrio. Cerca de dez minutos. Se só puder ouvir um áudio no dia, ouça este.\n\nUm. Conta de sobrevivência. Em específicos, pelo menos vinte e cinco acertos. Em gerais, pelo menos dez, com pelo menos um em Português e um em Inglês. Mas quem decide a habilitação é o bloco de específicos: na ampla concorrência da ênfase sete, são cerca de doze posições. Gerais desempatam a ordem final. Não deixe questão em branco: não há desconto por erro.\n\nDois. O que mais cai. Em 2023, defensiva foi cerca de cinquenta e quatro por cento; ofensiva, vinte e oito; compliance, dezoito. O bloco de cripto mais TLS e IPsec sozinho somou onze questões. LGPD e Marco Civil não caíram naquela prova, mas estão no edital atual: estude o essencial. E há cerca de dez tópicos novos neste edital: Wi-Fi, engenharia social, CAPEC, as vinte e quatro ferramentas, ICP-Brasil, forense e OSINT, CIS Benchmarks, SAMM, NIST CSF dois ponto zero, CIS Controls versão oito ponto um, e as ISO vinte e sete mil e trinta e cinco, vinte e dois mil e trezentos e um, vinte e dois mil e trezentos e treze e vinte e sete mil e setecentos e um.\n\nTrês. Passivo contra ativo. Passivo é para prevenir. Ativo é para detectar e recuperar. Os ativos: Disfarce, Repetição, Modificação e Negação de serviço.\n\nQuatro. Nmap. Menos ésse ésse: SYN, silencioso, não completa o handshake. Menos ésse tê: TCP connect, completa. Menos ésse vê: versão. Menos ó: sistema operacional. Menos ésse ene: só quem está vivo. Menos pê menos: todas as portas. Menos pê maiúsculo ene: não pinga. Menos ésse u: UDP.\n\nCinco. ARP spoofing: mesma LAN, camada dois, homem no meio. Defesa: DAI mais DHCP Snooping. DNS poisoning é outra coisa: camada sete, pode ser remoto, defesa DNSSEC.\n\nSeis. Portas-chave: SSH vinte e dois, DNS cinquenta e três, HTTP oitenta, HTTPS quatrocentos e quarenta e três, SMB quatrocentos e quarenta e cinco, IKE quinhentos, Modbus quinhentos e dois, RADIUS mil oitocentos e doze, RDP três três oito nove, NAT-T quatro mil e quinhentos.\n\nSete. Sniffing é ouvir. Spoofing é fingir. Homem no meio precisa de spoofing numa rede comutada. Arpwatch detecta.\n\nOito. Vírus precisa de hospedeiro. Worm anda sozinho. Trojan não se replica. Keylogger é teclado; screenlogger é tela.\n\nNove. ATT&CK: pegou senha ou hash, Credential Access. Dump do LSASS, técnica tê mil e três ponto zero zero um. Pass the hash, Lateral Movement. Phishing, Initial Access. Cifrar para resgate, Impact. Apagar logs, Defense Evasion. CVE é a falha específica; CWE é a fraqueza; CAPEC é o padrão de ataque; ATT&CK é o comportamento.\n\nDez. Ferramentas: hydra é online; john e hashcat são offline. Arpwatch é defensivo. Steghide esconde dados em mídia. Ghidra é engenharia reversa. BeEF depende de XSS.\n\nOnze. IDS avisa; IPS bloqueia. Filtro de pacotes só olha IP e porta. Stateful lembra a conexão. Proxy fala na camada sete.\n\nDoze. Oito zero dois ponto um xis: Suplicante, Autenticador e RADIUS. O switch não decide; quem decide é o RADIUS. RADIUS usa UDP.\n\nTreze. OWASP: em 2021, A zero um Acesso, A zero dois Cripto, A zero três Injeção. Em 2025, A zero dois vira Misconfiguration e A zero três vira Supply Chain. Leia o ano. IDOR é Broken Access Control.\n\nQuatorze. CIDA mais não repúdio. MAC dá integridade e autenticidade, mas não dá não repúdio. Só a assinatura digital dá. Autenticação não é autorização.\n\nQuinze. Assino com a minha privada; cifro com a sua pública. Hash não é cifra. Diffie-Hellman só combina chave. Dois fatores da mesma categoria não é MFA. RAID não é backup.\n\nDezesseis. IPsec: AH autentica, não esconde; ESP esconde. Túnel é VPN entre sites. IKE na UDP quinhentos. TLS um ponto três: uma ida e volta, só AEAD, só Diffie-Hellman efêmero.\n\nDezessete. ICP-Brasil: Comitê Gestor é o cérebro; ITI é a Raiz; AC emite; AR confere documentos e não emite; ACT é o relógio. A1 não fica em token; A3 fica.\n\nDezoito. Em OT e IEC sessenta e dois quatro quatro três: disponibilidade primeiro. Partes um geral, dois política, três sistema, quatro componente. Não aplique patch agressivo em produção sem planejamento. Não varra CLP com nmap agressivo.\n\nDezenove. Forense: Coleta, Exame, Análise, Relatório. RAM antes do disco. Hash antes e depois. Write blocker. Não desligue o computador só para \"preservar\", você perde a RAM.\n\nVinte. ISO vinte e sete mil e um de 2022: noventa e três controles, trinta e sete, oito, quatorze, trinta e quatro. A vinte e sete mil e um é o deve; a vinte e sete mil e dois é o convém. Avaliação de riscos: Identificar, Analisar, Avaliar. Tratamentos: Mitigar, Evitar, Reter, Compartilhar. Incidentes na vinte e sete mil e trinta e cinco: Planejar, Detectar, Avaliar, Responder, Aprender. RPO olha para trás; RTO olha para frente.\n\nVinte e um. NIST CSF dois ponto zero: Governar, Identificar, Proteger, Detectar, Responder, Recuperar. Govern é a novidade. CIS Controls: inventário primeiro; o dezoito é pentest. CIS Controls não é CIS Benchmarks.\n\nVinte e dois. Marco Civil: conexão um ano, aplicação seis meses. LGPD: controlador decide, operador executa, encarregado faz a ponte. Multa: dois por cento até cinquenta milhões por infração. Consentimento não é a única base. Legítimo interesse não cobre dado sensível.\n\nVinte e três. Português: embora pede subjuntivo; mas fica no indicativo. Crase: troque por masculino. \"Houve\", não \"haviam\". \"Faz dois anos\", não \"fazem\". Ratificar é reafirmar; retificar é corrigir.\n\nVinte e quatro. Inglês: \"not a silver bullet\" significa que precisa combinar com outras medidas. Desconfie de every, always, never. Although é concessão; therefore é conclusão. Actually é \"na verdade\". May não é must. Leia as perguntas antes do texto.\n\nVinte e cinco. Gestão do tempo. Quatro horas e meia. Específicos primeiro, cerca de cento e cinquenta minutos. Depois Inglês, cerca de quarenta. Depois Português, cerca de quarenta. Cartão-resposta com calma, uns vinte minutos. Sobram vinte de folga. Duas passadas: na primeira, o que você sabe; na segunda, elimina alternativas. Nunca deixe em branco.\n\nAs dez pegadinhas mais comuns, rapidinho: autenticação contra autorização; atribuir sigilo à assinatura; AH com confidencialidade; IDS que bloqueia; menos ésse ésse que completa o handshake; versão errada da norma; sempre e nunca nas alternativas; controlador contra operador; prazos do Marco Civil invertidos; e em inglês, may contra must e os falsos cognatos.\n\nÉ isso, Allan. Ouça de novo no caminho. No dia seis de dezembro de dois mil e vinte e seis, você vai lembrar desses BIZUs. Foco, revisões espaçadas, e bora pra cima. Fim do Top BIZUs!"}],"info":[{"id":"como","title":"Como usar este material","html":"\n<p>Material feito para <b>estudo reverso<\/b>: comece pela questão, confira o gabarito comentado e só depois volte ao resumo do tópico para fechar a lacuna. Tudo aqui é focado em <b>ponto de prova<\/b>.<\/p>\n<table class=\"tb \"><thead><tr><th>Elemento<\/th><th>Para que serve<\/th><\/tr><\/thead><tbody><tr><td><span class='tag bizu-t'>BIZU<\/span><\/td><td>Mnemônico ou regra de bolso — revise na véspera<\/td><\/tr><tr><td><span class='tag peg-t'>PEGADINHA<\/span><\/td><td>Armadilha típica de alternativa errada<\/td><\/tr><tr><td><span class='tag atn-t'>ATENÇÃO<\/span><\/td><td>Mudança recente, ponto polêmico ou limitação da fonte<\/td><\/tr><tr><td>Selo de prioridade (Alta/Média/Baixa)<\/td><td>Onde investir tempo — ver o ranking no capítulo “O que mais cai”<\/td><\/tr><tr><td>“ver gabarito →” / “← voltar à questão”<\/td><td>Links de ida e volta entre a questão e o comentário (gabaritos ficam no final, para não “espiar”)<\/td><\/tr><tr><td>“↑ Sumário”<\/td><td>Volta ao sumário a partir de qualquer seção<\/td><\/tr><tr><td>Caixas de seleção e campos<\/td><td>Clicáveis em leitores com suporte a formulário (Adobe Acrobat/Reader, Foxit, Okular, Edge, Chrome). Salve o PDF para manter as marcações<\/td><\/tr><\/tbody><\/table>\n<div class=\"box dica\"><div class=\"boxh\">DICA DE PROVA — Roteiro sugerido por tópico (25–40 min)<\/div><div class=\"boxb\">1) Faça as questões de fixação sem consultar · 2) Corrija pelos links · 3) Leia o resumo só do que errou/chutou · 4) Copie o BIZU para seu caderno de erros · 5) Marque o tópico no checklist de revisão e siga o cronograma de revisões espaçadas (R1, R7, R14).<\/div><\/div>\n<div class=\"box atn\"><div class=\"boxh\">ATENÇÃO — Questões<\/div><div class=\"boxb\"><b>Todas as questões deste material são inéditas, autorais, no estilo Cesgranrio<\/b> — não são questões reais de prova. Dados de provas reais citados na análise vêm de fontes indicadas no capítulo “Fontes”.<\/div><\/div>\n"},{"id":"raiox","title":"Raio-X do edital 2026.4","html":"\n<table class=\"tb \"><thead><tr><th>Item<\/th><th>Edital nº 04 TRANSPETRO/PSP/TERRA/NÍVEL SUPERIOR – 2026.4 (com retificações)<\/th><\/tr><\/thead><tbody><tr><td>Cargo / ênfase<\/td><td>Profissional Transpetro de Nível Superior – Júnior · <b>Ênfase 7: Análise de Sistemas – Segurança Cibernética e da Informação<\/b><\/td><\/tr><tr><td>Banca<\/td><td><b>Fundação Cesgranrio<\/b><\/td><\/tr><tr><td>Vagas (polo Rio de Janeiro)<\/td><td><b>1 vaga<\/b> (AC) + <b>11 de cadastro de reserva<\/b> (AC 5 · PCD 2 · PN 3 · PI 0 · PQ 1) — Anexo I<\/td><\/tr><tr><td>Remuneração (Anexo III)<\/td><td>Salário básico R$ 8.647,34; remuneração mínima garantida R$ 14.973,62<\/td><\/tr><tr><td>Prova<\/td><td><b>70 questões objetivas<\/b>, 5 alternativas (A–E), 1 ponto cada, mesmo caderno, <b>4h30<\/b> (item 8.1)<\/td><\/tr><tr><td>Fase 1 – Conhecimentos Específicos<\/td><td><b>50 questões<\/b> — eliminatória e classificatória<\/td><\/tr><tr><td>Fase 2 – Conhecimentos Gerais<\/td><td><b>20 questões<\/b>: Língua Portuguesa 10 + Língua Inglesa 10 — eliminatória e classificatória<\/td><\/tr><tr><td>Eliminação (7.1.4.3)<\/td><td>Menos de <b>50%<\/b> em Específicos (&lt; 25) <b>ou<\/b> menos de 50% em Gerais (&lt; 10) <b>ou<\/b> <b>zero<\/b> em Português ou em Inglês<\/td><\/tr><tr><td>Ranqueamento (7.1.2 c/d)<\/td><td>Não eliminados são ranqueados <b>pela nota de Específicos<\/b>; seguem habilitados até <b>2 × (vagas + cadastro de reserva)<\/b> por ênfase/polo e modalidade (com equiparação de gênero, 7.1.3)<\/td><\/tr><tr><td>Classificação final (7.1.4)<\/td><td>Para os habilitados: <b>soma algébrica<\/b> Específicos + Gerais. Para quem não foi habilitado, a nota de Gerais é desconsiderada<\/td><\/tr><tr><td>Cidade de prova<\/td><td>Manaus/AM (escolhida na inscrição; Anexo II)<\/td><\/tr><tr><td>Fuso<\/td><td>Todos os horários do edital são de <b>Brasília/DF<\/b> (item 1.7). <b>Manaus = Brasília − 1 h<\/b>. Confira o horário no Cartão de Confirmação<\/td><\/tr><\/tbody><\/table>\n<table class=\"tb \"><thead><tr><th>Data<\/th><th>Evento (cronograma retificado)<\/th><\/tr><\/thead><tbody><tr><td><b>01/12/2026<\/b><\/td><td>Cartão de Confirmação de Inscrição (imprimir!)<\/td><\/tr><tr><td>01 a 04/12/2026<\/td><td>Atendimento a dúvidas sobre locais de prova, vagas reservadas, nome social e adaptações<\/td><\/tr><tr><td><b>06/12/2026<\/b><\/td><td><b>Provas objetivas<\/b> (antes previstas para 29/11/2026 — alteradas por retificação)<\/td><\/tr><tr><td><b>07/12/2026<\/b><\/td><td>Gabaritos preliminares<\/td><\/tr><tr><td><b>07 e 08/12/2026<\/b><\/td><td>Recursos contra questões/gabaritos<\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — Conta de sobrevivência<\/div><div class=\"boxb\"><b>Específicos ≥ 25<\/b> · <b>Gerais ≥ 10<\/b> (PT + EN) · <b>PT ≥ 1 e EN ≥ 1<\/b>. Mas, para ser habilitado, você precisa ficar entre os primeiros em Específicos: na ampla concorrência da ênfase 7, <b>2 × (1 vaga + 5 CR) = 12 posições<\/b> (leitura do item 7.1.2 d com o Anexo I; a equiparação de gênero pode acrescentar habilitadas). Ou seja: <b>Específicos decide quem continua; Gerais desempata a ordem final<\/b>.<\/div><\/div>\n<div class=\"box atn\"><div class=\"boxh\">ATENÇÃO<\/div><div class=\"boxb\">O edital não prevê desconto por resposta errada (cada questão vale 1 ponto) → <b>não deixe nenhuma em branco<\/b>. Questões não assinaladas, com dupla marcação ou rasura não são computadas (8.20.1).<\/div><\/div>\n"},{"id":"compara","title":"Comparação com o edital 2023","html":"\n<p><b>Último concurso de nível superior:<\/b> <b>Edital nº 2 – TRANSPETRO/PSP/TERRA/NÍVEL SUPERIOR/2023.2<\/b>, executado pela <b>Fundação Cesgranrio<\/b> (mesma banca de agora), prova em dezembro de 2023 (cronograma do edital: 10/12/2023; o QConcursos registra a aplicação em 09/12/2023). Houve ênfase equivalente: <b>“Análise de Sistemas – Segurança Cibernética e da Informação”<\/b>, numerada como ênfase 6 no edital original e renumerada para <b>ênfase 5<\/b> pela retificação publicada no DOU de 29/09/2023. Em fevereiro de 2025, a validade desse certame foi prorrogada (não houve novo concurso de nível superior entre 2023 e 2026, conforme as fontes encontradas).<\/p>\n<p><b>Antes disso (2018):<\/b> Edital nº 01 – TRANSPETRO/PSP-RH-2018.1, também <b>Cesgranrio<\/b>. <b>Não havia cargo de segurança<\/b>: os cargos de TI eram Analista de Sistemas Júnior – Infraestrutura, Processos de Negócio e SAP; segurança era só um bloco dentro de Infraestrutura (firewall, VPN, IDS, ICP, criptografia, ISO 27002:2013). Mesma estrutura de 70 questões (20 básicas + 50 específicas).<\/p>\n<h4>Estrutura e regras<\/h4>\n<table class=\"tb \"><thead><tr><th>Aspecto<\/th><th>2023.2 (ênfase 5)<\/th><th>2026.4 (ênfase 7)<\/th><th>Mudança<\/th><\/tr><\/thead><tbody><tr><td>Banca<\/td><td>Cesgranrio<\/td><td>Cesgranrio<\/td><td>= mesma banca<\/td><\/tr><tr><td>Questões / duração<\/td><td>70 (20 básicas + 50 específicas), 4h30<\/td><td>70 (20 gerais + 50 específicas), 4h30<\/td><td>= igual<\/td><\/tr><tr><td>Peso<\/td><td>1 ponto cada<\/td><td>1 ponto cada<\/td><td>=<\/td><\/tr><tr><td>Papel do PT/EN<\/td><td>Eliminatório; classificatório <b>só para desempate<\/b><\/td><td>Eliminatório <b>e classificatório<\/b>: soma na classificação final dos habilitados<\/td><td><b>↑ Gerais passam a contar na nota final<\/b><\/td><\/tr><tr><td>Classificação<\/td><td>Apenas pela nota de Específicos<\/td><td>Ranqueamento por Específicos → habilita 2×(vagas+CR) → soma Específicos + Gerais<\/td><td><b>Novo modelo em 2 passos<\/b><\/td><\/tr><tr><td>Corte<\/td><td>&lt;50% básicos ou específicos, ou zero em matéria básica<\/td><td>Igual<\/td><td>=<\/td><\/tr><tr><td>Vagas (RJ)<\/td><td>2 vagas AC + CR 14 (AC 9, CN 3, PCD 2)<\/td><td>1 vaga AC + CR 11 (AC 5, PCD 2, PN 3, PQ 1)<\/td><td>↓ menos vagas<\/td><\/tr><tr><td>Reservas<\/td><td>AC, PCD, CN<\/td><td>AC, PCD, PN, PI, PQ + equiparação de gênero<\/td><td>Novas modalidades<\/td><\/tr><\/tbody><\/table>\n<h4>Conteúdo programático — o que entrou, o que mudou, o que saiu<\/h4>\n<table class=\"tb \"><thead><tr><th>Item 2026<\/th><th>Em 2023?<\/th><th>Situação<\/th><\/tr><\/thead><tbody><tr><td>1.1–1.3 Conceitos; ataques passivos e ativos<\/td><td>Sim<\/td><td>= Mantido<\/td><\/tr><tr><td>1.4 Etapas do ataque<\/td><td>Sim, sem “Escalação de privilégios” e “Recusas de serviço”<\/td><td><b>Ampliado<\/b><\/td><\/tr><tr><td>1.5 Ataques a protocolos (ARP…SMB)<\/td><td>Sim<\/td><td>= Mantido<\/td><\/tr><tr><td>1.6 Ataques Wi-Fi (Rogue AP, Evil Twin, SSID Tracking, Jamming, Disassociation)<\/td><td>Não<\/td><td><b>NOVO<\/b><\/td><\/tr><tr><td>1.7 MitM (sniffing, spoofing)<\/td><td>Sim (era 1.6)<\/td><td>= Mantido<\/td><\/tr><tr><td>1.8 Engenharia social (ciclo e técnicas)<\/td><td>Não (mas caiu 1 questão de phishing)<\/td><td><b>NOVO<\/b><\/td><\/tr><tr><td>1.9 Código malicioso<\/td><td>Sim (lista menor)<\/td><td><b>Ampliado<\/b>: + Trojan Horse, Backdoor, Screenlogger, Injector, Exploit, Ransomware<\/td><\/tr><tr><td>1.10 MITRE ATT&amp;CK<\/td><td>Sim (sem “procedimentos”)<\/td><td><b>Ampliado<\/b>: + procedimentos<\/td><\/tr><tr><td>1.11 MITRE CAPEC<\/td><td>Não<\/td><td><b>NOVO<\/b><\/td><\/tr><tr><td>1.12 Ferramentas de hacking (24)<\/td><td>Não<\/td><td><b>NOVO<\/b> — grande peso potencial<\/td><\/tr><tr><td>2.1 Perímetro (filtros, firewalls, IDS, IPS, VPN)<\/td><td>Sim<\/td><td>= Mantido<\/td><\/tr><tr><td>2.2 802.1X/EAP/RADIUS; OWASP, CVE, CWE<\/td><td>Sim (“OWASP”)<\/td><td><b>Ampliado<\/b>: “OWASP Top 10” + <b>OWASP SAMM<\/b><\/td><\/tr><tr><td>2.3 Propriedades<\/td><td>Sim<\/td><td>= Mantido<\/td><\/tr><tr><td>2.4 Mecanismos<\/td><td>Sim<\/td><td><b>Ampliado<\/b>: + Carimbo do Tempo<\/td><\/tr><tr><td>2.5 ICP-Brasil (AC, ACT, organização, normas)<\/td><td>Não como item<\/td><td><b>NOVO<\/b><\/td><\/tr><tr><td>2.6 TLS, SSL, IPsec · 2.7 Endpoint<\/td><td>Sim<\/td><td>= Mantido<\/td><\/tr><tr><td>2.8 Segurança em SO<\/td><td>Sim (Linux e Windows)<\/td><td><b>Ampliado<\/b>: + CIS Benchmarks<\/td><\/tr><tr><td>2.9 ICS (ICS Advisory Project, ISA/IEC 62443, NIST SP 800-82)<\/td><td>Sim<\/td><td>= Mantido<\/td><\/tr><tr><td>2.10 Forense digital + OSINT<\/td><td>Não<\/td><td><b>NOVO<\/b><\/td><\/tr><tr><td>3.1 Normas<\/td><td>27001:2013, 27002:2013, 27005:2019, 29100:2020, 29134:2020<\/td><td><b>Atualizadas<\/b> (27001/27002:2022, 27005:2023, 29100/29134:2024) + <b>NOVAS<\/b>: 27035-1:2023, 22301:2020, 22313:2020, 27701:2019<\/td><\/tr><tr><td>3.2 NIST CSF 2.0 e CIS Controls v8.1<\/td><td>Não<\/td><td><b>NOVO<\/b><\/td><\/tr><tr><td>3.3 Marco Civil, LGPD, Res. Anatel 740/2020<\/td><td>Sim<\/td><td>= Mantido (Anatel agora “e suas alterações”)<\/td><\/tr><tr><td>Português e Inglês<\/td><td>Mesmo programa (12 itens PT; 2 itens EN)<\/td><td>= Idêntico<\/td><\/tr><tr><td>O que <b>saiu<\/b><\/td><td>—<\/td><td>Nenhum tópico de 2023 foi retirado: o edital 2026 é um <b>superconjunto<\/b> do de 2023<\/td><\/tr><\/tbody><\/table>\n<div class=\"box bizu\"><div class=\"boxh\">BIZU — Leitura estratégica<\/div><div class=\"boxb\">Mesma banca, mesma estrutura, conteúdo <b>maior<\/b>. A prova de 2023 é o melhor modelo disponível do estilo — mas há ~10 tópicos novos (Wi-Fi, eng. social, CAPEC, 24 ferramentas, ICP-Brasil, forense/OSINT, CIS Benchmarks, SAMM, NIST CSF 2.0, CIS v8.1, 27035/22301/22313/27701) que <b>não têm histórico<\/b> nesta ênfase: estude o essencial de cada um. Com Gerais agora somando na nota final, PT e EN valem mais do que em 2023.<\/div><\/div>\n"},{"id":"maiscai","title":"O que mais cai","html":"\n<h4>1) A prova anterior desta ênfase (Transpetro 2023, Cesgranrio)<\/h4>\n<p>Fonte primária: a relação das <b>50 questões específicas reais<\/b> (nº 21 a 70, com gabarito oficial) publicada pelo Mathesis Concursos e trechos dos enunciados no Magna Concursos (links em “Fontes”). A classificação por tópico abaixo foi feita <b>por mim<\/b>, a partir dos enunciados — é aproximada (algumas questões tocam dois tópicos). Na prova de 2023, as questões 1–10 foram de Português, 11–20 de Inglês e 21–70 de Específicos.<\/p>\n<table class=\"tb small\"><thead><tr><th>Bloco do edital 2026<\/th><th>Questões 2023 (nº na prova)<\/th><th>Qtde<\/th><th>%<\/th><\/tr><\/thead><tbody><tr><td>Criptografia, hash, ICP (2.4/2.5)<\/td><td>22, 23, 24, 25, 26, 28<\/td><td>6<\/td><td>12%<\/td><\/tr><tr><td>Ataques a protocolos, DoS, MitM, HTTP (1.3/1.5/1.7)<\/td><td>31, 33, 39, 45, 48, 50<\/td><td>6<\/td><td>12%<\/td><\/tr><tr><td>Comunicação segura: TLS, SSL, IPsec (2.6)<\/td><td>27, 29, 30, 43, 60<\/td><td>5<\/td><td>10%<\/td><\/tr><tr><td>ISO 27001/27002/27005 (3.1)<\/td><td>51, 52, 53, 54, 56<\/td><td>5<\/td><td>10%<\/td><\/tr><tr><td>SO Linux/Windows e endpoint (2.7/2.8)<\/td><td>64, 66, 68, 69<\/td><td>4<\/td><td>8%<\/td><\/tr><tr><td>Mecanismos e propriedades: serviços, MFA, autenticação, RAID (2.3/2.4)<\/td><td>21, 37, 62, 65<\/td><td>4<\/td><td>8%<\/td><\/tr><tr><td>Privacidade ISO 29100/29134 (3.1)<\/td><td>57, 58, 59<\/td><td>3<\/td><td>6%<\/td><\/tr><tr><td>ICS / automação industrial (2.9)<\/td><td>61, 67, 70<\/td><td>3<\/td><td>6%<\/td><\/tr><tr><td>802.1X (2.2)<\/td><td>34, 63<\/td><td>2<\/td><td>4%<\/td><\/tr><tr><td>OWASP / CWE (2.2)<\/td><td>32, 44<\/td><td>2<\/td><td>4%<\/td><\/tr><tr><td>MITRE ATT&amp;CK (1.10)<\/td><td>42, 47<\/td><td>2<\/td><td>4%<\/td><\/tr><tr><td>Etapas do ataque / varredura de portas (1.4)<\/td><td>36, 41<\/td><td>2<\/td><td>4%<\/td><\/tr><tr><td>Conceitos e ataque passivo (1.1/1.2)<\/td><td>35, 49<\/td><td>2<\/td><td>4%<\/td><\/tr><tr><td>Engenharia social – phishing (1.8)<\/td><td>38<\/td><td>1<\/td><td>2%<\/td><\/tr><tr><td>Código malicioso (1.9)<\/td><td>40<\/td><td>1<\/td><td>2%<\/td><\/tr><tr><td>Defesa em profundidade (2.1)<\/td><td>46<\/td><td>1<\/td><td>2%<\/td><\/tr><tr><td>Resolução Anatel 740 (3.3)<\/td><td>55<\/td><td>1<\/td><td>2%<\/td><\/tr><tr><td>LGPD / Marco Civil (3.3)<\/td><td>—<\/td><td>0<\/td><td>0%<\/td><\/tr><tr><td><b>Total<\/b><\/td><td>Questões 21 a 70<\/td><td><b>50<\/b><\/td><td>100%<\/td><\/tr><\/tbody><\/table>\n<div class=\"box res\"><div class=\"boxh\">RESUMO-RELÂMPAGO — Leitura<\/div><div class=\"boxb\">Em 2023: <b>Defensiva ≈ 54%<\/b> (27 questões), <b>Ofensiva ≈ 28%<\/b> (14), <b>Compliance ≈ 18%<\/b> (9). O bloco técnico de <b>cripto + TLS/IPsec<\/b> sozinho somou 11 questões (22%). <b>LGPD e Marco Civil não caíram<\/b>.<\/div><\/div>\n<h4>2) Agregado de provas Cesgranrio de Segurança da Informação<\/h4>\n<p>O TecConcursos (artigo de 21/03/2024, “Concurso Caixa – priorização de assuntos”) classificou <b>532 questões de TI – Segurança da Informação da Cesgranrio<\/b> (várias provas da banca, sem separação por órgão):<\/p>\n<table class=\"tb small\"><thead><tr><th>Assunto (classificação TecConcursos)<\/th><th>Qtde<\/th><th>%<\/th><\/tr><\/thead><tbody><tr><td>Recursos e ferramentas de segurança (firewall, IDS/IPS, VPN, antimalware, backup…)<\/td><td>145<\/td><td>27%<\/td><\/tr><tr><td>Criptografia<\/td><td>134<\/td><td>25%<\/td><\/tr><tr><td>Gestão da segurança da informação (normas, políticas, riscos, continuidade)<\/td><td>124<\/td><td>23%<\/td><\/tr><tr><td>Ameaças aos sistemas computacionais (malware, ataques)<\/td><td>88<\/td><td>17%<\/td><\/tr><tr><td>Conceitos, princípios e atributos<\/td><td>40<\/td><td>8%<\/td><\/tr><\/tbody><\/table>\n<p>Exemplo de cobrança de norma atualizada: a Cesgranrio cobrou a <b>ABNT NBR ISO/IEC 27002:2022<\/b> na prova da Caixa 2024 (Técnico Bancário Novo, QConcursos Q3048826), pedindo a definição de um termo da norma — ou seja, a banca já usa as versões 2022.<\/p>\n<p><b>Línguas (mesma fonte):<\/b> Português Cesgranrio (4.166 questões): interpretação 33%, morfologia 14%, semântica 9%, ortografia 6%, concordância 6%, regência 6%, pontuação 5%. Inglês Cesgranrio (1.346 questões): <b>interpretação 74%<\/b>, referência/anáfora 9%, reescrita/substituição 9%, significado de palavras 4%.<\/p>\n<div class=\"box atn\"><div class=\"boxh\">ATENÇÃO — Limitação<\/div><div class=\"boxb\">Não encontrei estatística por tópico <b>separada<\/b> para as provas de TI/segurança da Petrobras, Banco do Brasil, Caixa, BNDES, Banco da Amazônia ou IBGE; os números acima são o melhor dado verificável encontrado. Não foi possível baixar o caderno completo de 2023 em PDF (o site exigia verificação humana).<\/div><\/div>\n<h4>3) Ranking de prioridade (estimativa fundamentada)<\/h4>\n<table class=\"tb small\"><thead><tr><th>Tópico do edital<\/th><th>Evidência<\/th><th>Prioridade<\/th><th>Justificativa<\/th><\/tr><\/thead><tbody><tr><td>2.4 Criptografia/mecanismos + 2.5 ICP-Brasil<\/td><td>6 (cripto/ICP) + 3 (MFA, autenticação, RAID) em 2023 · 25% no agregado Cesgranrio<\/td><td><span class='pa'>ALTA<\/span><\/td><td>Maior bloco nas duas fontes; ponto forte do Allan → manter com questões<\/td><\/tr><tr><td>1.3/1.5/1.7 Ataques a protocolos, DoS, MitM (ARP, SYN flood…)<\/td><td>6 em 2023 · “Ameaças” 17%<\/td><td><span class='pa'>ALTA<\/span><\/td><td>Bloco grande e <b>ponto fraco<\/b><\/td><\/tr><tr><td>2.6 TLS/SSL/IPsec<\/td><td>5 em 2023<\/td><td><span class='pa'>ALTA<\/span><\/td><td>Cobrança muito detalhada (mensagens do handshake, AH/ESP, HMAC truncado)<\/td><\/tr><tr><td>3.1 ISO 27001/27002/27005<\/td><td>5 em 2023 · “Gestão” 23%<\/td><td><span class='pa'>ALTA<\/span><\/td><td>Versões 2022/2023 novas no edital; ponto forte → revisar números (93 = 37/8/14/34)<\/td><\/tr><tr><td>2.1 Perímetro + 2.2 802.1X/RADIUS<\/td><td>3 em 2023 · “Recursos e ferramentas” 27%<\/td><td><span class='pa'>ALTA<\/span><\/td><td><b>Ponto fraco<\/b>; maior categoria do agregado<\/td><\/tr><tr><td>2.2 OWASP Top 10/SAMM, CVE, CWE<\/td><td>2 em 2023<\/td><td><span class='pa'>ALTA<\/span><\/td><td><b>Ponto fraco<\/b>; ampliado (SAMM) e OWASP 2025 publicado<\/td><\/tr><tr><td>1.4 Etapas + varredura (nmap) e 1.12 Ferramentas<\/td><td>2 em 2023 · ferramentas são <b>novas<\/b> (24 nomes)<\/td><td><span class='pa'>ALTA<\/span><\/td><td>Lista nominal extensa no edital costuma virar questões de associação; <b>ponto fraco<\/b><\/td><\/tr><tr><td>1.10 ATT&amp;CK<\/td><td>2 em 2023<\/td><td><span class='pa'>ALTA<\/span><\/td><td>Ampliado (procedimentos); <b>ponto fraco<\/b><\/td><\/tr><tr><td>3.2 NIST CSF 2.0 + CIS v8.1<\/td><td>Novo<\/td><td><span class='pa'>ALTA<\/span><\/td><td>Seção inteira nova; conteúdo curto e “decorável”<\/td><\/tr><tr><td>3.1 Privacidade 29100/29134 + 27701<\/td><td>3 em 2023<\/td><td><span class='pm'>MÉDIA<\/span><\/td><td>Caiu bem em 2023; ponto forte<\/td><\/tr><tr><td>2.9 ICS (62443, 800-82)<\/td><td>3 em 2023<\/td><td><span class='pm'>MÉDIA<\/span><\/td><td>Recorrente (empresa de dutos)<\/td><\/tr><tr><td>2.7 Endpoint + 2.8 SO/CIS Benchmarks<\/td><td>4 em 2023<\/td><td><span class='pm'>MÉDIA<\/span><\/td><td>Linux (inode, permissões) e Windows Firewall caíram<\/td><\/tr><tr><td>2.3 Propriedades + 1.1/1.2 conceitos<\/td><td>3 em 2023 (21, 35, 49)<\/td><td><span class='pm'>MÉDIA<\/span><\/td><td>Aparecem dentro de outras questões<\/td><\/tr><tr><td>2.10 Forense + OSINT<\/td><td>Novo<\/td><td><span class='pm'>MÉDIA<\/span><\/td><td>Novo; foco em ordem de volatilidade, cadeia de custódia, cabeçalho de e-mail<\/td><\/tr><tr><td>1.6 Wi-Fi · 1.8 Eng. social · 1.9 Malware · 1.11 CAPEC<\/td><td>Novos/ampliados; 2 em 2023<\/td><td><span class='pm'>MÉDIA<\/span><\/td><td>Definições curtas, fáceis de pontuar<\/td><\/tr><tr><td>3.1 27035-1, 22301, 22313<\/td><td>Novos<\/td><td><span class='pm'>MÉDIA<\/span><\/td><td>Normas novas; cobrança provável de fases e termos (RPO/RTO/BIA)<\/td><\/tr><tr><td>3.3 LGPD<\/td><td>0 em 2023<\/td><td><span class='pm'>MÉDIA<\/span><\/td><td>Não caiu em 2023, mas é tema recorrente da Cesgranrio em outros certames; ponto forte<\/td><\/tr><tr><td>3.3 Anatel 740<\/td><td>1 em 2023<\/td><td><span class='pm'>MÉDIA<\/span><\/td><td>Texto curto, alta chance de 1 questão<\/td><\/tr><tr><td>3.3 Marco Civil<\/td><td>0 em 2023<\/td><td><span class='pb'>BAIXA<\/span><\/td><td>Sem histórico na ênfase; revisar prazos (1 ano / 6 meses) e art. 19<\/td><\/tr><tr><td>Português<\/td><td>10 questões · 33% interpretação<\/td><td><span class='pa'>ALTA<\/span><\/td><td>Agora soma na nota final; ponto forte → manter<\/td><\/tr><tr><td>Inglês<\/td><td>10 questões · 74% interpretação<\/td><td><span class='pa'>ALTA<\/span><\/td><td><b>Ponto fraco<\/b> + risco de zerar = eliminação<\/td><\/tr><\/tbody><\/table>\n"},{"id":"perfil","title":"Perfil da Cesgranrio","html":"\n<p>Observações extraídas dos enunciados reais de 2023 (ver fontes) e do formato do edital:<\/p>\n<ul class=\"\"><li><b>Enunciado contextualizado e longo<\/b> (“Um administrador de rede observou…”, “Um atacante ordenou aos seus bots…”) terminando em frase incompleta que a alternativa completa (“Esse ataque é o”, “Essa estrutura de dados é o”).<\/li><li><b>Detalhe de padrão/RFC<\/b>: mensagem do TLS que responde ao ClientHello; truncamento do HMAC-SHA1 no AH do IPsec; modo de operação descrito pelo funcionamento (XOR com IV = CBC); fórmula do RSA; aparência de um hash SHA-256; estrutura inode do ext3; RAID por espelhamento.<\/li><li><b>Cenário → nome da técnica<\/b>: sintoma de rede (IP do gateway com outro MAC) → ARP spoofing; HTTP sem prefixo → SSL stripping/HSTS; bots abrindo conexões com IP real → DDoS de conexão.<\/li><li><b>Normas pela letra<\/b>: controles da ISO 27002 com seus títulos, princípios da 29100, etapas da PIA (29134), níveis de detalhe da análise de riscos (27005), objetivo da Res. Anatel 740.<\/li><li><b>Distratores plausíveis e “inventados”<\/b>: nomes que parecem reais mas não existem (ex.: uma mensagem “ServerParamsOk” entre as opções de TLS), siglas trocadas e termos em inglês.<\/li><li><b>Ferramentas<\/b> (novidade do edital): espere questões de associação “ferramenta × finalidade” e de opções de linha de comando (nmap).<\/li><li><b>Português<\/b>: texto literário/jornalístico + gramática a serviço do texto (reescrita, conectivos, crase, concordância, pronomes).<\/li><li><b>Inglês<\/b>: texto autêntico de tecnologia/negócios, perguntas e alternativas em inglês; vocabulário em contexto, referência pronominal, conectores e propósito do texto.<\/li><\/ul>\n<div class=\"box peg\"><div class=\"boxh\">PEGADINHA DA CESGRANRIO — As 10 pegadinhas mais comuns<\/div><div class=\"boxb\">1) Trocar <b>autenticação × autorização<\/b>. 2) Atribuir <b>sigilo à assinatura digital<\/b>. 3) <b>AH com confidencialidade<\/b>. 4) <b>IDS que bloqueia<\/b>. 5) <b>-sS completa o handshake<\/b>. 6) Versão errada da norma (2013 × 2022). 7) “<b>Sempre/nunca/todos<\/b>” em alternativas. 8) <b>Controlador × operador<\/b>. 9) Prazos do Marco Civil invertidos (1 ano × 6 meses). 10) Em inglês, <b>may × must<\/b> e falsos cognatos (<i>actually, eventually<\/i>).<\/div><\/div>\n<div class=\"box dica\"><div class=\"boxh\">DICA DE PROVA — Gestão do tempo (4h30 = 270 min)<\/div><div class=\"boxb\">Sugestão: <b>Específicos primeiro<\/b> (~150 min, 3 min/questão) → <b>Inglês<\/b> (~40 min) → <b>Português<\/b> (~40 min) → <b>cartão-resposta<\/b> (20 min, sem pressa) → 20 min de folga para as marcadas. Duas passadas: na 1ª, responda o que sabe e marque o resto; na 2ª, elimine alternativas. Nunca deixe questão em branco.<\/div><\/div>\n"}],"leitura":[{"id":"le1","n":1,"tema":"MFA resistente a phishing","fonte":"CISA — Implementing Phishing-Resistant MFA (fact sheet, Oct 2022)","url":"https://www.cisa.gov/sites/default/files/publications/fact-sheet-implementing-phishing-resistant-mfa-508c.pdf","passage":"p7","nq":3},{"id":"le2","n":2,"tema":"Zero Trust — abstract","fonte":"NIST SP 800-207 — Zero Trust Architecture (Aug 2020), Abstract","url":"https://doi.org/10.6028/NIST.SP.800-207","passage":"p8","nq":3},{"id":"le3","n":3,"tema":"ENISA Threat Landscape — ameaças principais","fonte":"ENISA Threat Landscape 2023 (Oct 2023), §1 Threat Landscape Overview / Prime Threats","url":"https://www.enisa.europa.eu/publications/enisa-threat-landscape-2023","passage":"p9","nq":3},{"id":"le4","n":4,"tema":"Resposta a incidentes (NIST SP 800-61r3)","fonte":"NIST SP 800-61r3 — Incident Response Recommendations (Apr 2025), Executive Summary","url":"https://doi.org/10.6028/NIST.SP.800-61r3","passage":"p10","nq":3},{"id":"le5","n":5,"tema":"NIST CSF 2.0","fonte":"NIST CSWP 29 — The NIST Cybersecurity Framework (CSF) 2.0 (Feb 2024), Preface","url":"https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf","passage":"p11","nq":3},{"id":"le6","n":6,"tema":"OWASP — Broken Access Control","fonte":"OWASP Top 10:2021 — A01 Broken Access Control","url":"https://owasp.org/Top10/A01_2021-Broken_Access_Control/","passage":"p12","nq":3},{"id":"le7","n":7,"tema":"OWASP — Injection","fonte":"OWASP Top 10:2021 — A03 Injection","url":"https://owasp.org/Top10/A03_2021-Injection/","passage":"p13","nq":3},{"id":"le8","n":8,"tema":"Ransomware — visão geral (CISA)","fonte":"CISA / MS-ISAC — Ransomware Guide (Sep 2020), Overview","url":"https://www.cisa.gov/sites/default/files/publications/CISA_MS-ISAC_Ransomware%20Guide_S508C.pdf","passage":"p14","nq":3},{"id":"le9","n":9,"tema":"Ransomware — vetores (RDP, phishing, SMB)","fonte":"CISA / MS-ISAC — Ransomware Guide (Sep 2020), Prevention Best Practices","url":"https://www.cisa.gov/sites/default/files/publications/CISA_MS-ISAC_Ransomware%20Guide_S508C.pdf","passage":"p15","nq":3},{"id":"le10","n":10,"tema":"ICS / OT — práticas CISA","fonte":"CISA — Recommended Cybersecurity Practices for Industrial Control Systems","url":"https://www.cisa.gov/sites/default/files/publications/Cybersecurity_Best_Practices_for_Industrial_Control_Systems.pdf","passage":"p16","nq":3},{"id":"le11","n":11,"tema":"Phishing e engenharia social (CISA)","fonte":"CISA — Avoiding Social Engineering and Phishing Attacks (Feb 2021)","url":"https://www.cisa.gov/news-events/news/avoiding-social-engineering-and-phishing-attacks","passage":"p17","nq":3},{"id":"le12","n":12,"tema":"Gestão de patches / vulnerabilidades (NIST SP 800-40r4)","fonte":"NIST SP 800-40r4 — Guide to Enterprise Patch Management Planning (Apr 2022), Executive Summary","url":"https://doi.org/10.6028/NIST.SP.800-40r4","passage":"p18","nq":3}],"rodadas":[{"id":"r20261029_1","date":"2026-10-29","n":1,"mod":"Ofensiva","topico":"1.4 nmap — flags -sS -p-","topic":"of2","marcada":"B","gabarito":"C","ok":false,"motivo":"Confundi conceitos parecidos","bizu":"nmap -sS = SYN (precisa root); -p- = todas as 65.535. Combinação clássica Cesgranrio."},{"id":"r20261029_2","date":"2026-10-29","n":2,"mod":"Ofensiva","topico":"1.10 ATT&CK — LSASS / Credential Access","topic":"of8","marcada":"A","gabarito":"B","ok":false,"motivo":"Confundi conceitos parecidos","bizu":"Dump do LSASS = Credential Access (TA0006), técnica T1003.001 — não é Lateral Movement ainda."},{"id":"r20261029_3","date":"2026-10-29","n":3,"mod":"Compliance","topico":"3.1 ISO 27001:2022 — temas do Anexo A","topic":"cp1","marcada":"C","gabarito":"C","ok":true,"motivo":"","bizu":"93 controles: 37 organizacionais / 8 pessoas / 14 físicos / 34 tecnológicos."},{"id":"r20261029_4","date":"2026-10-29","n":4,"mod":"Defensiva","topico":"2.2 802.1X / RADIUS","topic":"df2","marcada":"C","gabarito":"B","ok":false,"motivo":"Confundi conceitos parecidos","bizu":"Suplicante → Autenticador (switch/AP) → Servidor (RADIUS). Switch = autenticador."},{"id":"r20261029_5","date":"2026-10-29","n":5,"mod":"Compliance","topico":"3.3 LGPD — controlador","topic":"cp7","marcada":"C","gabarito":"C","ok":true,"motivo":"","bizu":"Controlador decide; operador executa; encarregado faz a ponte."},{"id":"r20261029_6","date":"2026-10-29","n":6,"mod":"Inglês","topico":"Inglês — ransomware / dupla extorsão","topic":"en1","marcada":"C","gabarito":"C","ok":true,"motivo":"","bizu":"Double extortion = cifra + ameaça de vazar. Vocabulário em contexto."},{"id":"r20261029_7","date":"2026-10-29","n":7,"mod":"Ofensiva","topico":"1.7 ARP spoofing / MitM","topic":"of5","marcada":"D","gabarito":"A","ok":false,"motivo":"Confundi conceitos parecidos","bizu":"ARP spoofing = LAN, camada 2. Mitigação: DAI + DHCP Snooping. Não é DNS poisoning."},{"id":"r20261029_8","date":"2026-10-29","n":8,"mod":"Defensiva","topico":"2.2 OWASP Top 10 — A01","topic":"df2","marcada":"A","gabarito":"C","ok":false,"motivo":"Confundi conceitos parecidos","bizu":"OWASP 2021 A01 = Broken Access Control (não Cryptographic Failures = A02)."},{"id":"r20261029_9","date":"2026-10-29","n":9,"mod":"Defensiva","topico":"2.4 Criptografia — RSA assimétrico","topic":"df4","marcada":"D","gabarito":"D","ok":true,"motivo":"","bizu":"RSA = assimétrico. C = M^e mod n; M = C^d mod n."},{"id":"r20261029_10","date":"2026-10-29","n":10,"mod":"Português","topico":"Português — crase 'entregue à diretoria'","topic":"pt3","marcada":"B","gabarito":"B","ok":true,"motivo":"","bizu":"Entregar a + a diretoria → à. Crase = prep. a + art. a."},{"id":"r20261029_11","date":"2026-10-29","n":11,"mod":"Ofensiva","topico":"1.4 nmap — -sS -sV","topic":"of2","marcada":"E","gabarito":"B","ok":false,"motivo":"Confundi conceitos parecidos","bizu":"-sS = SYN half-open; -sV = versão do serviço. Não completa o handshake (-sT sim)."},{"id":"r20261029_12","date":"2026-10-29","n":12,"mod":"Inglês","topico":"Inglês — 'not a silver bullet' / MFA fatigue","topic":"en1","marcada":"D","gabarito":"B","ok":false,"motivo":"Confundi conceitos parecidos","bizu":"Silver bullet = solução mágica. MFA fatigue = bombardeio de push até a vítima aceitar."},{"id":"r20261029_13","date":"2026-10-29","n":13,"mod":"Compliance","topico":"3.2 NIST CSF 2.0 — Govern","topic":"cp5","marcada":"C","gabarito":"C","ok":true,"motivo":"","bizu":"CSF 2.0: GIP-DRR — Govern é a função nova. Tiers: Parcial, Informada, Repetível, Adaptativa."}]}</script>
<script>(function(){
/* ===== Camada de persistência isolada =====
   Todo o app lê/grava SOMENTE por Storage.get/Storage.set.
   Para sincronizar (ex.: Supabase no GitHub Pages) basta registrar um adaptador:
     Storage.useAdapter({ push(key, value){...upsert remoto...}, async pull(){ return {progresso:{...}} } });
   e, ao abrir, chamar Storage.pull() e mesclar com mergeState(). */
const Storage = (() => {
  const P = 'tp7:'; const mem = {}; const subs = []; let ok = true, adapter = null, wired = false;
  function get(k, def){ try { const v = localStorage.getItem(P + k); return v == null ? (k in mem ? mem[k] : def) : JSON.parse(v); } catch(e){ ok = false; return k in mem ? mem[k] : def; } }
  function set(k, v){ mem[k] = v; let w = true; try { localStorage.setItem(P + k, JSON.stringify(v)); } catch(e){ ok = false; w = false; } subs.forEach(f => { try { f(k, v); } catch(e){} }); return w; }
  function remove(k){ delete mem[k]; try { localStorage.removeItem(P + k); } catch(e){} }
  function onChange(f){ subs.push(f); }
  function useAdapter(a){
    adapter = a || null;
    if(!wired){ wired = true; onChange((k, v) => { try { if(adapter && adapter.push) adapter.push(k, v); } catch(e){} }); }
  }
  async function pull(){ try { return adapter && adapter.pull ? await adapter.pull() : null; } catch(e){ return null; } }
  return {get, set, remove, onChange, useAdapter, pull, available:() => ok, prefix:P};
})();

/* União do progresso local com outro aparelho ou com a conta.
   Não descarta respostas. Por item, o registro mais recente vence.
   Tema, filtros de questão e velocidade do áudio ficam no aparelho que está mesclando. */
function blank(){ return {v:1, created:Date.now(), answers:{}, errors:{}, cards:{}, sims:{}, crono:{}, dia:{}, days:{}, tck:{}, settings:{}, audio:{}, rod:{}, qf:{mod:[], topic:'', prio:'', only:'all', src:'fix', order:'seq'}, newToday:{}}; }
function cloneState(v){ return v == null ? v : JSON.parse(JSON.stringify(v)); }
function mergeBoolMap(a, b){
  const o = Object.assign({}, a || {});
  for(const k in b || {}) o[k] = !!(o[k] || b[k]);
  return o;
}
function mergeTck(a, b){
  const o = {}, keys = new Set([].concat(Object.keys(a || {}), Object.keys(b || {})));
  keys.forEach(k => {
    const x = (a && a[k]) || [], y = (b && b[k]) || [], n = Math.max(x.length, y.length), arr = [];
    for(let i = 0; i < n; i++) arr.push(!!(x[i] || y[i]));
    o[k] = arr;
  });
  return o;
}
function mergeAudio(a, b){
  a = a || {}; b = b || {};
  const o = Object.assign({}, b, a);
  new Set([].concat(Object.keys(a), Object.keys(b))).forEach(k => {
    if(k.charAt(0) === 'p' && (typeof a[k] === 'number' || typeof b[k] === 'number')) o[k] = Math.max(typeof a[k] === 'number' ? a[k] : 0, typeof b[k] === 'number' ? b[k] : 0);
  });
  if(a.rate) o.rate = a.rate; else if(b.rate) o.rate = b.rate;
  if(a.last) o.last = a.last; else if(b.last) o.last = b.last;
  return o;
}
function mergeRod(a, b){
  const o = Object.assign({}, a || {});
  for(const id in b || {}){
    const y = b[id], x = o[id];
    if(!x){ o[id] = y; continue; }
    if(y.done && !x.done){ o[id] = y; continue; }
    if(x.done && !y.done) continue;
    const xs = x.stage || 0, ys = y.stage || 0;
    if(ys > xs || (ys === xs && (y.last || '') > (x.last || ''))) o[id] = y;
  }
  return o;
}
function mergeCur(x, y){
  if(!x) return y || null;
  if(!y) return x || null;
  const newer = (x.start || 0) >= (y.start || 0) ? x : y, older = newer === x ? y : x;
  return {start:newer.start, dur:newer.dur || older.dur, i:newer.i || 0, ans:Object.assign({}, older.ans || {}, newer.ans || {}), flags:Object.assign({}, older.flags || {}, newer.flags || {})};
}
function mergeSim(x, y){
  x = x || {cur:null, hist:[]}; y = y || {cur:null, hist:[]};
  const ts = new Set((x.hist || []).map(h => h.start));
  return {cur:mergeCur(x.cur, y.cur), hist:(x.hist || []).concat((y.hist || []).filter(h => h && !ts.has(h.start))).sort((p, q) => (p.start || 0) - (q.start || 0))};
}
function mergeState(a, b){
  a = cloneState(a) || {}; b = cloneState(b) || {};
  const o = Object.assign(blank(), a);
  o.v = Math.max(a.v || 1, b.v || 1);
  o.created = Math.min(a.created || b.created || o.created, b.created || a.created || o.created);
  o.updated = Math.max(a.updated || 0, b.updated || 0) || undefined;
  o.settings = Object.assign({}, a.settings || {});
  o.qf = Object.assign(blank().qf, a.qf || {});
  for(const id in b.answers || {}){
    const seen = new Set((o.answers[id] || []).map(x => x.t + ':' + x.c));
    o.answers[id] = (o.answers[id] || []).concat((b.answers[id] || []).filter(x => x && !seen.has(x.t + ':' + x.c))).sort((x, y) => (x.t || 0) - (y.t || 0));
  }
  for(const id in b.errors || {}){
    const y = b.errors[id], x = o.errors[id];
    if(!y) continue;
    if(!x){ o.errors[id] = y; continue; }
    const newer = (y.last || y.added || '') > (x.last || x.added || '') ? y : x;
    const older = newer === y ? x : y;
    const patch = {wrongs:Math.max(x.wrongs || 0, y.wrongs || 0)};
    const reason = newer.reason || older.reason;
    if(reason) patch.reason = reason;
    o.errors[id] = Object.assign({}, newer, patch);
  }
  for(const id in b.cards || {}){
    const y = b.cards[id], x = o.cards[id];
    if(!x || (y && (y.last || 0) > (x.last || 0))) o.cards[id] = y;
  }
  const simIds = new Set([].concat(Object.keys(o.sims || {}), Object.keys(b.sims || {})));
  simIds.forEach(id => { o.sims[id] = mergeSim(o.sims[id], b.sims[id]); });
  o.crono = mergeBoolMap(a.crono, b.crono);
  o.dia = mergeBoolMap(a.dia, b.dia);
  o.tck = mergeTck(a.tck, b.tck);
  o.audio = mergeAudio(a.audio, b.audio);
  o.rod = mergeRod(a.rod, b.rod);
  for(const d in b.days || {}) o.days[d] = Math.max(o.days[d] || 0, b.days[d] || 0);
  for(const d in b.newToday || {}) o.newToday[d] = Math.max(o.newToday[d] || 0, b.newToday[d] || 0);
  return o;
}

function addError(id){

function schedule(c, g){
  const prev = cs(c.id), st = prev ? Object.assign({}, prev) : {ef:2.5, iv:0, reps:0, lapses:0};
  if(!prev) S.newToday[dk()] = (S.newToday[dk()] || 0) + 1;
  if(g === 0){ st.reps = 0; st.iv = 0; st.lapses++; st.ef = Math.max(1.3, st.ef - 0.2); st.due = Date.now() + 60000; }
  else { st.iv = nextIv(st, g); st.ef = g === 1 ? Math.max(1.3, st.ef - 0.15) : Math.min(3, st.ef + 0.1); st.reps++; st.due = parseDk(addDays(dk(), st.iv)).getTime() + 4 * 3600e3; }
  st.last = Date.now(); S.cards[c.id] = st; activity(); save();
}
function preview(c, g){ if(g === 0) return '1 min'; const iv = nextIv(cs(c.id) || {ef:2.5, iv:0, reps:0}, g); return iv + (iv === 1 ? ' dia' : ' dias'); }

  if(FQ.i >= FQ.ids.length){

    return;
  }

  m.innerHTML = head + `<div class="card fc" id="fcard"><div class="small mut">Cartão ${pad(+c.id.slice(1))}${FQ.free ? ' · treino livre' : !cs(c.id) ? ' · novo' : ''}</div><div style="margin-top:8px;font-weight:700">${esc(c.q)}</div>${FQ.show ? `<div class="a">${esc(c.a)}</div>` : '<div class="small mut" style="margin-top:14px">Pense na resposta e toque para virar</div>'}</div>

   : '<button class="btn p w" id="show">Mostrar resposta</button>'}
   <p class="small mut c">Errei = volta em 1 min · Difícil = intervalo curto · Fácil = intervalo cresce (SM-2 leve).</p>`;

const hl = (html, q) => { if(!q) return html; const d = document.createElement('div'); d.innerHTML = html; const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  const walk = n => { [...n.childNodes].forEach(c => { if(c.nodeType === 3){ if(re.test(c.data)){ const s = document.createElement('span'); s.innerHTML = esc(c.data).replace(re, '<mark>$1</mark>'); c.replaceWith(s); } re.lastIndex = 0; } else walk(c); }); }; walk(d); return d.innerHTML; };

    window.addEventListener('offline', () => { setSyncStatus('offline'); if((location.hash || '').indexOf('sincronizar') >= 0) render(); });
    window.addEventListener('focus', () => { onWake(); });
    document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') onWake(); if(document.visibilityState === 'hidden' && dirty) flushSync(); });
    window.addEventListener('pagehide', () => { if(dirty) flushSync(); });
    const resume = authCallbackPending() || (function(){ try { return !!localStorage.getItem('tp7-supabase-auth'); } catch(e){ return false; } })();
    if(resume){
      ensureClient().then(async client => {
        if(!authCallbackPending()) return;
        try { await client.auth.getSession(); }
        catch(e){ Sync.lastErr = humanSync(e); setSyncStatus('erro'); }
        history.replaceState(null, '', location.pathname + '#/sincronizar');
        render();
      }).catch(e => { Sync.lastErr = humanSync(e); setSyncStatus('erro'); paintSync(); });
    } else setSyncStatus(navigator.onLine ? 'local' : 'offline');
    const v = (location.hash.replace(/^#\/?/, '') || 'home').split('/')[0];
    if(v === 'sincronizar') render();
  } catch(e){ Sync.lastErr = humanSync(e); setSyncStatus('erro'); }
}
bootSync();

})();</script>
